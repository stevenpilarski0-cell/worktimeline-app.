<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline | Support Hub</title>
    <style>
        /* Modern Apple-style minimalist layout matching the core app */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 2rem 1.5rem; 
            background: #f5f5f7; 
            color: #1d1d1f; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .box { 
            max-width: 440px; 
            width: 100%;
            background: #ffffff; 
            padding: 2.5rem; 
            border-radius: 18px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
            text-align: center;
        }
        .badge { 
            display: inline-block;
            background: #e6f2f2; 
            color: #008080; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
            margin-bottom: 1.5rem;
            letter-spacing: 0.3px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #1d1d1f;
        }
        .subtitle {
            font-size: 14px;
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .info-card {
            background: #fbfbfd;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            margin-bottom: 2rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .info-row:first-child {
            padding-top: 0;
        }
        .label { font-weight: 500; color: #86868b; }
        .value { font-weight: 600; color: #1d1d1f; }
        .btn { 
            display: block; 
            background: #008080; 
            color: white; 
            text-align: center; 
            padding: 14px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 15px;
            font-weight: 500; 
            transition: background-color 0.2s;
        }
        .btn:hover { 
            background: #006666; 
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="badge">● Secure Infrastructure: Operational</div>
        <h1>WorkTimeline Support</h1>
        <div class="subtitle">Integrity Desk for Contemporaneous Industrial & Legal Evidence Logs.</div>
        
        <div class="info-card">
            <div class="info-row">
                <span class="label">Data Residency</span>
                <span class="value">Canada (Quebec Manor Vault)</span>
            </div>
            <div class="info-row">
                <span class="label">Pipeline Protocol</span>
                <span class="value">Clio Grow Handshake v4</span>
            </div>
            <div class="info-row">
                <span class="label">Encryption Status</span>
                <span class="value">Active (Teal Mode Secure)</span>
            </div>
        </div>

        <a href="mailto:support@worktimeline-app.vercel.app" class="btn">Contact Integrity Officer</a>
    </div>
</body>
</html>
