<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline - Portal</title>
    <style>
        /* Sleek, Mac-style minimalist design */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        p {
            color: #86868b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn-connect {
            background-color: #008080; /* Teal accent */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-connect:hover {
            background-color: #006666;
        }
        .btn-connect:active {
            transform: scale(0.98);
        }
        .status-message {
            margin-top: 1.5rem;
            font-size: 14px;
            font-weight: 500;
        }
        .status-success { color: #008080; }
        .status-error { color: #ff3b30; }
    </style>
</head>
<body>

<div class="container">
    <h1>Connect to the Firm</h1>
    <p>Securely link WorkTimeline with your Clio account to seamlessly route contemporaneous evidence and verified chronologies into your case files.</p>
    
    <button id="connectBtn" class="btn-connect">Connect to Clio</button>
    
    <div id="statusOutput" class="status-message"></div>
</div>

<script>
    // 1. Point the button to initiate the handshake
    document.getElementById('connectBtn').addEventListener('click', () => {
        // Change this client ID to match your Clio Developer Credentials
        const CLIENT_ID = 'YOUR_CLIO_CLIENT_ID'; 
        
        // This targets your Vercel URL/api/callback setup dynamically
        const REDIRECT_URI = encodeURIComponent(window.location.origin + '/api/callback');
        
        // Routing explicitly via Clio's NA interface, which passes control safely
        const authUrl = `https://app.clio.com/oauth/authorize?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}`;
        
        // Hand off the user to the secure login screen
        window.location.href = authUrl;
    });

    // 2. Check if the user just returned from a failed handshake attempt
    const urlParams = new URLSearchParams(window.location.search);
    const statusOutput = document.getElementById('statusOutput');
    
    if (urlParams.has('error')) {
        statusOutput.className = 'status-message status-error';
        statusOutput.textContent = 'Connection failed: ' + urlParams.get('error');
    }
</script>

</body>
</html>
