<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; --clio-green: #2ecc71; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95); --dark-silver: #7f8c8d; }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(25px); opacity: 0.3; pointer-events: none; }
        #legalOverlay, #syncOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(10px); z-index: 200000; display: none; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .modal-card { background: white; padding: 35px; border-radius: 32px; text-align: center; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); border-bottom: 8px solid var(--teal); width: 100%; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 18px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 25px; width: 100%; font-size: 16px; }
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); margin-bottom: 40px; opacity: 0; transition: 0.8s; }
        #skipBtn { padding: 18px 50px; border: 3.5px solid var(--teal); border-radius: 99px; background: white; color: var(--teal); font-weight: 900; font-size: 16px; cursor: pointer; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 2px solid var(--platinum); z-index: 3000; background: white; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .switch-group { display: flex; gap: 15px; align-items: center; }
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
        .draggable-btn { position: absolute; z-index: 5000; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none; width: 75px; height: 75px; border-radius: 24px; color: white; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); cursor: grab; text-align: center; line-height: 1.1; }
        #addBtn { right: 20px; top: 180px; background: var(--teal); font-size: 44px; font-weight: 900; }
        #syncBtn { right: 20px; top: 270px; background: var(--clio-blue); font-size: 10px; font-weight: 900; padding: 10px; }
        #utilityDrawer { width: 100%; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 2px solid var(--platinum); z-index: 2500; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        #managementDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 3.5px solid var(--teal); z-index: 6000; transition: 0.5s transform cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(calc(100% - 40px)); box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .drawer-content { padding: 15px 20px; }
        .drag-handle-zone { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: var(--platinum); border-radius: 10px; }
        .template-chip { background: white; border: 2.5px solid var(--teal); padding: 8px 14px; border-radius: 15px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }
        #statusBox { width: 100%; height: 100px; padding: 14px; border-radius: 18px; border: 2.5px solid var(--platinum); resize: none; font-family: inherit; font-weight: 700; background: #f8fafc; box-sizing: border-box; outline: none; margin-top: 10px; }
        .media-btn { flex: 1; position: relative; background: white; border: 2.5px solid var(--platinum); padding: 12px 5px; border-radius: 16px; text-align: center; font-size: 10px; font-weight: 900; cursor: pointer; }
        .media-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 15px 100px; position: relative; background: #fdfdfd; }
        .entry { position: relative; background: white; border: 2.5px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; border-left: 12px solid var(--platinum); width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.4s; }
        .pulse-serious { animation: pulse-red-teal 2s infinite; border-left-color: var(--teal-dark) !important; background: var(--blue-trans); }
        @keyframes pulse-red-teal { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }
        .pulse-dot { width: 10px; height: 10px; background-color: var(--clio-green); border-radius: 50%; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { transform: scale(0.9); } }
    </style>
</head>
<body id="appBody">
<div id="legalOverlay" style="display:flex;"><div class="modal-card"><h2>Friendly Reminder</h2><p>WorkTimeline™ is an evidence-tracking tool. <b>We do not provide legal advice.</b></p><button class="modal-btn" onclick="dismissLegal()">I UNDERSTAND</button></div></div>
<div id="syncOverlay"><div class="modal-card"><h2 style="color:var(--clio-blue);">Evidence Summary</h2><p id="aiSummaryText" style="text-align:left; font-size:14px; max-height:300px; overflow-y:auto; font-weight:700;"></p><button class="modal-btn" style="background:var(--clio-blue);" onclick="finalSync()">OK & SEND</button><button class="modal-btn" style="background:var(--dark-silver); margin-top:10px;" onclick="closeSync()">CANCEL</button></div></div>
<div id="splashScreen"><h1 id="storyText" class="story-text">Welcome.</h1><button id="skipBtn" onclick="endSplash()">Skip Intro</button></div>
<div class="app-container">
    <header class="header">
        <div class="logo-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M16 7V5C16 3.89543 15.1046 3 14 3H10C8.89543 3 8 3.89543 8 5V7H4C2.89543 7 2 7.89543 2 9V18C2 19.1046 2.89543 20 4 20H20C21.1046 20 22 19.1046 22 18V9C22 7.89543 21.1046 7 20 7H16ZM10 5H14V7H10V5ZM20 18H4V9H20V18Z" fill="var(--dark-silver)"/><rect x="5" y="12.5" width="14" height="2" rx="1" fill="var(--teal)"/><circle cx="7" cy="13.5" r="1.5" fill="white"/><circle cx="12" cy="13.5" r="1.5" fill="white"/><circle cx="17" cy="13.5" r="1.5" fill="white"/></svg>
            <div style="font-weight:900; color:var(--teal); font-size:16px;">WorkTimeline™</div>
        </div>
        <div class="switch-group"><div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">GHOST</div></div><div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">NOTES</div></div></div>
    </header>
    <div id="addBtn" class="draggable-btn" onclick="submitEntry()">+</div>
    <div id="syncBtn" class="draggable-btn" onclick="triggerLockSync()">LOCK & SYNC</div>
    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <div style="display:flex; gap:10px; overflow-x:auto;"><div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div><div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div><div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div><div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div></div>
            <textarea id="statusBox" placeholder="Start your fresh record..."></textarea>
            <div style="display:flex; gap:10px; margin-top:15px;"><div class="media-btn"><span>CAMERA</span><input type="file" accept="image/*" capture="camera" onchange="addMedia('📷 PHOTO')"></div><div class="media-btn"><span>AUDIO</span><input type="file" accept="audio/*" capture="microphone" onchange="addMedia('🎤 AUDIO')"></div><div class="media-btn"><span>DOCS</span><input type="file" onchange="addMedia('📄 FILE')"></div></div>
        </div>
        <div class="drag-handle-zone" onclick="toggleDrawer()"><div class="handle-pill"></div></div>
    </div>
    <div id="timelineContainer"><div style="position:absolute; right:20px; top:10px; display:flex; align-items:center; gap:6px; z-index:10;"><div class="pulse-dot"></div><span style="font-size:8px; font-weight:900; color:var(--clio-green);">CLIO READY</span></div><div id="displayList"></div></div>
    <div id="managementDrawer">
        <div class="drag-handle-zone" onclick="toggleMgmtDrawer()"><div class="handle-pill"></div></div>
        <div style="padding:0 25px 35px; display:flex; flex-direction:column; gap:12px;">
            <button class="modal-btn" style="margin-top:0; background:var(--dark-silver);" onclick="confirmReset()">DELETE & START FRESH</button>
            <button class="modal-btn" style="margin-top:0; background: linear-gradient(90deg, var(--dark-silver) 0%, var(--teal) 100%);" onclick="alert('Email Client Opened.')">EMAIL EVIDENCE</button>
            <button class="modal-btn" style="margin-top:0; background:var(--teal);" onclick="alert('Report Generated.')">SAVE & EXPORT</button>
        </div>
    </div>
</div>
<script>
    const story = ["The Fresh Record.", "Canadian Justice.", "Case Law Integrated.", "Truth Secured."];
    let isDrawerOpen = true; let isMgmtOpen = false; let activeVault = "TIMELINE"; 
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || []; 
    const notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    window.onload = () => { refreshDisplay(); };
    function dismissLegal() { document.getElementById('legalOverlay').style.display='none'; runStory(); }
    function runStory() { const el = document.getElementById('storyText'); let i = 0; const next = () => { if(i < story.length) { el.style.opacity = 0; setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2000); }, 600); } else endSplash(); }; next(); }
    function endSplash() { const s = document.getElementById('splashScreen'); if(s) { s.style.opacity='0'; setTimeout(() => s.remove(), 800); } }
    function toggleDrawer() { const d = document.getElementById('utilityDrawer'); const c = document.getElementById('drawerContent'); if(isDrawerOpen) { d.style.transform = `translateY(-${c.offsetHeight}px)`; isDrawerOpen = false; } else { d.style.transform = `translateY(0)`; isDrawerOpen = true; } }
    function toggleMgmtDrawer() { const d = document.getElementById('managementDrawer'); if(!isMgmtOpen) { d.style.transform = 'translateY(0)'; isMgmtOpen = true; } else { d.style.transform = 'translateY(calc(100% - 40px))'; isMgmtOpen = false; } }
    function triggerLockSync() {
        if (timelineVault.length === 0) return alert("No entries to sync.");
        let summary = "AI SUMMARY OF TIMELINE:\n\n";
        timelineVault.forEach((e, i) => { summary += `${i+1}. [${e.stamp}] ${e.grit.substring(0, 60)}...\n\n`; });
        document.getElementById('aiSummaryText').innerText = summary;
        document.getElementById('syncOverlay').style.display = 'flex';
    }
    function finalSync() { alert("Locked and Synced to Clio."); document.getElementById('syncOverlay').style.display = 'none'; }
    function closeSync() { document.getElementById('syncOverlay').style.display = 'none'; }
    function confirmReset() { if(confirm("Wipe vault?")) { localStorage.clear(); location.reload(); } }
    function useTemplate(type) { const t = { 'WITNESS': 'WITNESS: \nSTATEMENT: ', 'INCIDENT': 'ACTION: \nVIOLATION: ', 'LOCATION': 'SITE: \nHAZARDS: ', 'INJURY': 'NATURE OF INJURY: \nBODY PART: \nFIRST AID RENDERED: \nOFA ATTENDANT: ' }; document.getElementById('statusBox').value = t[type]; }
    function makeMovable(el) { let p1 = 0, p2 = 0, p3 = 0, p4 = 0; el.ontouchstart = (e) => { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; document.ontouchend = () => { document.ontouchend = null; document.ontouchmove = null; }; document.ontouchmove = (e) => { p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY; p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; el.style.right = "auto"; }; }; }
    makeMovable(document.getElementById('addBtn')); makeMovable(document.getElementById('syncBtn'));
    function submitEntry() { const b = document.getElementById('statusBox'); if(!b.value.trim()) return; saveEntry(b.value); b.value = ''; }
    function saveEntry(text) {
        navigator.geolocation.getCurrentPosition(pos => {
            const low = text.toLowerCase();
            let score = 0;
            if(low.includes("fire") || low.includes("quit") || low.includes("toxic") || low.includes("lawyer")) score += 2;
            if(low.includes("overtime") || low.includes("pay") || low.includes("harass") || low.includes("photo") || low.includes("injury")) score += 1;
            const entry = { id: Date.now(), grit: text, stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`, level: score };
            if(activeVault === "TIMELINE") { timelineVault.push(entry); localStorage.setItem('wt_timeline', JSON.stringify(timelineVault)); } 
            else { notesVault.push(entry); localStorage.setItem('wt_notes', JSON.stringify(notesVault)); }
            refreshDisplay();
        });
    }
    function toggleGhost(cb) { document.getElementById('appBody').classList.toggle('ghost-active', cb.checked); }
    function toggleVault(cb) { activeVault = cb.checked ? "NOTES" : "TIMELINE"; refreshDisplay(); }
    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = ''; const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div'); 
            div.className = `entry ${item.level >= 2 ? 'pulse-serious' : ''}`;
            if(item.level === 1) div.style.borderLeftColor = 'var(--teal)';
            div.innerHTML = `<span style="font-size:10px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span><p style="margin:12px 0 0; font-size:15px; font-weight:800; white-space:pre-wrap; color:var(--gray-dark); line-height:1.4;">${item.grit}</p>`;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
