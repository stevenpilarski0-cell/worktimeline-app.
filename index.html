<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Your Signature Branding Palette */
            --teal: #008080;
            --silver-text: #64748b;
            --silver-ui: #e2e8f0;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --slate: #1e293b;
            /* Mac-Style Frosted Glass Effect */
            --glass: rgba(255, 255, 255, 0.94);
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #f1f5f9;
            margin: 0; padding: 0; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PERFECTLY FLUSH MAC HEADER (75px) --- */
        header { 
            background: var(--glass); 
            backdrop-filter: blur(25px); 
            padding: 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 0 0 40px 40px; 
            border-bottom: 1px solid var(--silver-ui); 
            z-index: 1000; 
            position: fixed; top: 0; width: 100%; height: 75px;
            box-sizing: border-box;
            box-shadow: 0 5px 25px rgba(0,0,0,0.03);
        }

        .logo-group { 
            display: flex; 
            align-items: center; /* Locks logo and text to the horizontal center line */
            gap: 6px; /* High proximity as requested */
            height: 100%;
        }

        .brand-text { 
            font-size: 21px; 
            font-weight: 900; 
            letter-spacing: -0.8px; 
            display: flex;
            align-items: center;
        }
        .text-work { color: var(--silver-text); }
        .text-timeline { color: var(--teal); }

        /* --- CLIO PULSE DOT --- */
        .status-dot { width: 7px; height: 7px; background: var(--clio-green); border-radius: 50%; box-shadow: 0 0 8px var(--clio-green); animation: statusPulse 2s infinite; margin-left: 8px; }
        @keyframes statusPulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }

        /* --- CLIO LOCK BUTTON --- */
        .clio-lock-btn { 
            background: var(--clio-blue); 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 16px; 
            font-size: 10px; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,118,206,0.2);
        }

        /* --- INTAKE & MAIN CARD --- */
        .intake-area { margin-top: 95px; padding: 20px; }
        .main-card { 
            background: white; 
            border-radius: 40px; 
            padding: 25px; 
            border: 1px solid var(--silver-ui); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
            transition: 0.3s;
        }
        textarea { 
            width: 100%; height: 110px; 
            border-radius: 30px; /* Heavy rounds */
            border: 2px solid var(--silver-ui); 
            padding: 20px; 
            font-family: inherit; font-size: 16px; 
            outline: none; box-sizing: border-box; 
            background: #fafafa; transition: 0.2s; 
        }
        textarea:focus { border-color: var(--teal); background: #fff; }

        /* --- NATIVE MEDIA DOCK (TEAL ON SILVER) --- */
        .dock { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
        .native-btn { 
            width: 56px; height: 56px; 
            background: var(--silver-ui); 
            border: none; border-radius: 24px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;
        }
        .native-btn:active { transform: scale(0.92); background: #cbd5e1; }
        .native-btn svg { width: 26px; height: 26px; fill: var(--teal); }
        
        /* HIDDEN NATIVE INPUTS FOR HARDWARE TRIGGER */
        .native-btn input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .record-btn { 
            flex-grow: 1; background: var(--teal); color: white; border: none; 
            height: 56px; border-radius: 24px; font-weight: 900; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,128,128,0.2);
        }

        /* --- TIMELINE CARDS --- */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 10px 20px 120px; display: flex; flex-direction: column; gap: 20px; }
        .card { 
            background: white; 
            border-radius: 38px; /* High rounds */
            padding: 25px; 
            border: 1px solid var(--silver-ui); 
            border-left: 10px solid var(--teal); /* Privacy accent */
            transition: 0.4s;
        }
        
        @keyframes p-crit { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 50% { box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .critical { animation: p-crit 1s infinite; border-left-color: var(--risk) !important; }

        /* THE SETTINGS GEAR (BOTTOM-RIGHT) */
        #gear { 
            position: fixed; bottom: 35px; right: 35px; 
            width: 65px; height: 65px; 
            background: var(--slate); 
            border-radius: 24px; 
            border: none; z-index: 999; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }

        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 45px; height: 45px; border: 5px solid var(--silver-ui); border-top-color: var(--teal); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body id="app">

    <div id="loader"><div class="spinner"></div><p style="font-weight:900;margin-top:20px;color:var(--teal)">SYNCHRONIZING PATTERNS...</p></div>

    <header>
        <div class="logo-group">
            <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M25 45H20V75C20 80.5 24.5 85 30 85H70C75.5 85 80 80.5 80 75V45H75M25 45V40C25 34.5 29.5 30 35 30H65C70.5 30 75 34.5 75 40V45M25 45H75" stroke="#008080" stroke-width="5" stroke-linejoin="round"/>
                <line x1="25" y1="65" x2="75" y2="65" stroke="#008080" stroke-width="3" stroke-dasharray="4 4"/>
                <circle cx="35" cy="65" r="4" fill="#008080"/><circle cx="50" cy="65" r="4" fill="#008080"/><circle cx="65" cy="65" r="4" fill="#008080"/>
            </svg>
            <div class="brand-text"><span class="text-work">Work</span><span class="text-timeline">Timeline</span></div>
            <div class="status-dot"></div>
        </div>

        <button class="clio-lock-btn" onclick="syncClio()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
            LOCK & SEND
        </button>
    </header>

    <div class="intake-area">
        <div class="main-card">
            <textarea id="msg" placeholder="What pattern occurs?"></textarea>
            <div class="dock">
                <div class="native-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                    <input type="file" accept="image/*" capture="environment">
                </div>
                <div class="native-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    <input type="file" accept="audio/*" capture="microphone">
                </div>
                <div class="native-btn">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    <input type="file" accept=".pdf,.doc,.docx,.txt">
                </div>
                <button class="rec-btn" onclick="process()">RECORD & AUDIT</button>
            </div>
        </div>
    </div>

    <div id="timeline"></div>

    <button id="gear" onclick="let k=prompt('Cohere AI Key:'); if(k) localStorage.setItem('WT_K', k);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>

    <script>
        let db = JSON.parse(localStorage.getItem('WT_MASTER_FINAL')) || [];
        function syncClio() { alert("Synchronizing with ClioManage securely..."); }
        
        async function process() {
            let val = document.getElementById('msg').value.trim();
            if(!val) return;
            let key = localStorage.getItem('WT_K');
            document.getElementById('loader').style.display = 'flex';
            let res = { msg: "Audit complete.", sev: 0 };

            if(key) {
                try {
                    const r = await fetch('https://api.cohere.ai/v1/generate', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: 'command', 
                            prompt: `BC LEGAL AUDITOR: Pattern recognize for WCB Prohibited Action (BC Sec 47), PTSD/Anxiety symptoms, BCHRT violations. Explain Latin terms (Prima Facie, Res Ipsa Loquitur). RETURN JSON: {"sev":0 or 3, "msg":"Legal Diagnostic", "caseName":"...", "caseStudy":"..."} INCIDENT: ${val}`,
                            temperature: 0.1 
                        })
                    });
                    const d = await r.json();
                    res = JSON.parse(d.generations[0].text.replace(/```json|```/g, "").trim());
                } catch(e) { console.error(e); }
            } else { res.msg = "Please add an API key for legal auditing."; }

            db.push({ id: Date.now(), txt: val, time: new Date().toLocaleString(), ...res });
            localStorage.setItem('WT_MASTER_FINAL', JSON.stringify(db));
            document.getElementById('msg').value = '';
            document.getElementById('loader').style.display = 'none';
            render();
        }

        function render() {
            let cont = document.getElementById('timeline'); cont.innerHTML = "";
            [...db].reverse().forEach(i => {
                let card = document.createElement('div');
                card.className = `card ${i.sev === 3 ? 'critical' : ''}`;
                card.innerHTML = `
                    <small style="color:var(--silver-text); font-weight:900; font-size:10px;">${i.time}</small>
                    <div style="font-weight:700; margin-top:10px; color:var(--slate); line-height:1.4;">${i.txt}</div>
                    <div class="audit-box" style="background:#f0fdfa; border-radius:20px; padding:15px; margin-top:15px; font-size:13px; border:1px solid #ccfbf1;">
                        <strong style="color:var(--teal); font-size:11px;">DIAGNOSTIC:</strong> ${i.msg}
                    </div>`;
                cont.appendChild(card);
            });
        }
        render();
    </script>
</body>
</html>
