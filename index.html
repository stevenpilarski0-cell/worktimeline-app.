<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin' Intake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --platinum: #e2e8f0; --gray-dark: #2c3e50; --clio-blue: #0076CE; --clio-green: #2ecc71; --mac-bg: #f1f5f9; }
        
        body { font-family: 'Nunito', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* --- HEADER & BRANDING --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1.5px solid var(--platinum); background: white; z-index: 10000; position: relative; }
        .brand-group { display: flex; align-items: center; gap: 4px; }
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        .sub-title { font-weight: 900; color: var(--teal); font-size: 11px; letter-spacing: -1.1px; margin: 0; }

        /* --- OVERLAYS --- */
        #syncOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 900000; display: none; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .modal-card { background: white; padding: 30px; border-radius: 32px; max-width: 400px; width: 100%; border-bottom: 8px solid var(--clio-blue); }

        /* --- BUTTONS --- */
        .draggable-btn { position: absolute; z-index: 9000; width: 85px; height: 85px; border-radius: 24px; color: white; font-weight: 900; font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        #addBtn { background: var(--teal); right: 20px; top: 160px; font-size: 35px; }
        #syncBtn { background: var(--clio-blue); right: 20px; top: 260px; line-height: 1.2; }

        /* --- THE FIXED MANAGEMENT TAB & DRAWER --- */
        #mgmtTab { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); background: var(--teal); color: white; padding: 12px 30px; border-radius: 20px 20px 0 0; font-weight: 900; font-size: 12px; z-index: 100000; cursor: pointer; border: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        
        #managementDrawer { position: fixed; bottom: -100%; left: 0; width: 100%; background: white; border-top: 5px solid var(--teal); z-index: 100001; transition: bottom 0.4s ease; border-radius: 30px 30px 0 0; padding-bottom: 40px; }
        #managementDrawer.active { bottom: 0; }

        /* --- INTERFACE --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 150px; background: #fafbfc; height: calc(100dvh - 150px); }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--platinum); }
        .pulse-critical { border-left: 14px solid var(--teal-dark) !important; animation: heavy-pulse 1.5s infinite; }
        @keyframes heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0); } }

        .handle-pill { width: 45px; height: 6px; background: #cbd5e1; border-radius: 10px; margin: 15px auto; cursor: pointer; }
        #statusBox { width: 100%; height: 110px; padding: 15px; border-radius: 20px; border: 2px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="syncOverlay">
    <div class="modal-card">
        <h2 style="color:var(--clio-blue);">Evidence Summary</h2>
        <p id="aiSummaryText" style="font-size:14px; font-weight:700; color:var(--gray-dark); margin-bottom:20px;"></p>
        <p style="font-size:11px; color:var(--dark-silver);">Clicking OK will lock this timeline and send the artifact to Clio Grow.</p>
        <button class="modal-btn" style="background:var(--clio-blue); color:white; padding:15px; border-radius:50px; border:none; width:100%; font-weight:900;" onclick="finalSync()">OK & SEND TO CLIO</button>
        <button class="modal-btn" style="background:none; color:var(--dark-silver); border:none; width:100%; margin-top:10px; font-weight:800;" onclick="closeSync()">CANCEL</button>
    </div>
</div>

<header class="header">
    <div class="brand-group">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <span class="sub-title">TAKIN'INTAKE</span>
        </div>
    </div>
    <div style="background:var(--clio-green); width:8px; height:8px; border-radius:50%; box-shadow:0 0 8px var(--clio-green);"></div>
</header>

<div style="display:flex; flex-direction:column; height:100dvh;">
    <button id="addBtn" class="draggable-btn" onclick="submitEntry()">+</button>
    <button id="syncBtn" class="draggable-btn" onclick="triggerClioSync()">LOCK & SYNC<br>TO CLIO</button>

    <div id="utilityDrawer" style="background:white; padding:15px; border-bottom:2.5px solid var(--platinum); z-index:8000;">
        <textarea id="statusBox" placeholder="Start new journal..."></textarea>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="mgmtTab" onclick="toggleMgmt()">MANAGEMENT</button>

    <div id="managementDrawer">
        <div class="handle-pill" onclick="toggleMgmt()"></div>
        <div style="padding:0 30px 40px;">
            <button onclick="confirmReset()" style="background:var(--dark-silver); color:white; border:none; padding:18px; border-radius:50px; width:100%; font-weight:900; margin-bottom:12px;">DELETE & START FRESH</button>
            <button onclick="alert('Exporting CSV...')" style="background:var(--teal); color:white; border:none; padding:18px; border-radius:50px; width:100%; font-weight:900;">EXPORT EVIDENCE</button>
        </div>
    </div>
</div>

<script>
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];

    window.onload = () => { refreshDisplay(); };

    function toggleMgmt() {
        const drawer = document.getElementById('managementDrawer');
        drawer.classList.toggle('active');
    }

    function triggerClioSync() {
        if (timelineVault.length === 0) return alert("Nothing to sync.");
        let summary = "AI ANALYSIS: " + timelineVault.length + " entries found. Critical patterns detected in job risk and safety. Generating legal artifact...";
        document.getElementById('aiSummaryText').innerText = summary;
        document.getElementById('syncOverlay').style.display = 'flex';
    }

    function finalSync() {
        alert("TIMELINE LOCKED. Artifact transmitted to Clio Grow.");
        document.getElementById('syncOverlay').style.display = 'none';
    }

    function closeSync() { document.getElementById('syncOverlay').style.display = 'none'; }

    function submitEntry() {
        const b = document.getElementById('statusBox'); if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = {
                id: Date.now(),
                grit: b.value,
                stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`,
                pulse: /fired|risk|unsafe|dismiss/i.test(b.value)
            };
            timelineVault.push(entry);
            localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
            b.value = '';
            refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry ' + (item.pulse ? 'pulse-critical' : '');
            div.innerHTML = `<div style="font-size:10px; font-weight:900; color:var(--teal);">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin:5px 0 0;">${item.grit}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { if(confirm("Wipe journal?")) { localStorage.clear(); location.reload(); } }

    function makeMovable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.ontouchstart = (e) => {
            p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
            document.ontouchmove = (e) => {
                p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY;
                p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
            document.ontouchend = () => { document.ontouchmove = null; };
        };
    }
    makeMovable(document.getElementById('addBtn')); makeMovable(document.getElementById('syncBtn'));
</script>
</body>
</html>
