<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | v9.0 Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --teal-dark: #004d4d; --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; --clio-blue: #0076CE; --notes-gold: #f1c40f;
            --slate: #64748b; --mac-bg: #f1f5f9;
        }

        body { font-family: 'Nunito', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* GHOST & NOTES MODES */
        .ghost-active #timelineContainer { filter: blur(20px) grayscale(1); opacity: 0.3; pointer-events: none; }
        .notes-mode { background: #fffdf2 !important; }

        /* --- HEADER --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1.5px solid var(--platinum); background: white; z-index: 10000; }
        .logo-group { display: flex; align-items: center; gap: 6px; }
        .title-text { font-weight: 900; color: var(--teal); font-size: 18px; line-height: 1; }
        .sub-text { font-weight: 900; color: var(--teal); font-size: 9px; letter-spacing: -0.5px; }
        .clio-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; display: inline-block; margin-left: 4px; }
        .v-badge { background: var(--teal); color: white; font-size: 8px; padding: 2px 6px; border-radius: 10px; font-weight: 900; margin-left: 5px; }

        /* TOGGLES */
        .toggles { display: flex; gap: 10px; align-items: center; text-align: center; }
        .switch { position: relative; width: 30px; height: 16px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(14px); }
        .toggle-label { font-size: 7px; font-weight: 900; margin-top: 2px; }

        /* --- INTAKE AREA & TEMPLATES --- */
        .intake-section { padding: 15px; background: white; border-bottom: 1.5px solid var(--platinum); z-index: 5000; position: relative; }
        .template-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .template-chip { background: white; border: 2px solid var(--teal); padding: 6px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }
        #statusBox { width: 100%; height: 90px; padding: 15px; border-radius: 20px; border: 2.5px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }

        /* --- MAC MEDIA BAR & CLIO BUTTON --- */
        .mac-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
        .mac-media-bar { display: flex; gap: 10px; background: var(--mac-bg); padding: 8px; border-radius: 20px; }
        .media-icon { background: white; width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 18px; cursor: pointer; }
        
        .clio-square-btn { flex-grow: 1; background: var(--clio-blue); color: white; border: none; border-radius: 20px; height: 56px; font-weight: 900; font-size: 11px; box-shadow: 0 4px 15px rgba(0, 118, 206, 0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; }

        /* --- ADD BUTTON --- */
        #addBtn { position: absolute; z-index: 9000; width: 65px; height: 65px; border-radius: 20px; background: var(--teal); color: white; font-weight: 900; font-size: 30px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); right: 20px; top: 215px; }

        /* --- TIMELINE --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 140px; }
        .entry { background: white; border-radius: 24px; padding: 15px 20px; border: 1.5px solid var(--platinum); margin-bottom: 15px; border-left: 8px solid var(--teal); }

        /* --- PULL UP DRAWER --- */
        #mgmtDrawer { position: fixed; bottom: -280px; left: 0; width: 100%; background: white; border-top: 5px solid var(--teal); z-index: 999999; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -15px 50px rgba(0,0,0,0.2); padding-bottom: 40px; }
        #mgmtDrawer.active { bottom: 0 !important; }
        .pull-handle { width: 100%; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: -60px; cursor: pointer; }
        .handle-pill { width: 60px; height: 7px; background: var(--teal); border-radius: 10px; margin-bottom: 5px; }
        .handle-text { font-size: 10px; font-weight: 900; color: var(--teal); letter-spacing: 2px; }

        .drawer-btn { border: none; padding: 18px; border-radius: 20px; font-weight: 900; width: 85%; font-size: 14px; margin: 0 auto 12px; display: block; cursor: pointer; color: white; }
        .btn-teal { background: var(--teal); }
        .btn-gray { background: var(--slate); }
    </style>
</head>
<body id="appBody">

<header class="header">
    <div class="logo-group">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
            <path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="13.5" x2="18" y2="13.5" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="2 2"/>
            <circle cx="8" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="12" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="16" cy="13.5" r="1.5" fill="var(--teal)"/>
        </svg>
        <div>
            <div class="title-text">WorkTimeline™ <span class="v-badge">v9.0</span></div>
            <div class="sub-text">TAKIN'INTAKE <div class="clio-dot"></div></div>
        </div>
    </div>
    <div class="toggles">
        <div><label class="switch"><input type="checkbox" onchange="document.getElementById('appBody').classList.toggle('ghost-active')"><span class="slider"></span></label><div class="toggle-label">GHOST</div></div>
        <div><label class="switch"><input type="checkbox" onchange="document.body.classList.toggle('notes-mode')"><span class="slider"></span></label><div class="toggle-label">NOTES</div></div>
    </div>
</header>

<div class="intake-section">
    <div class="template-scroll">
        <div class="template-chip" onclick="applyTemplate('WCB')">WorkSafeBC</div>
        <div class="template-chip" onclick="applyTemplate('WITNESS')">Witnesses</div>
        <div class="template-chip" onclick="applyTemplate('EVIDENCE')">Evidence</div>
        <div class="template-chip" onclick="applyTemplate('SETTING')">Setting</div>
    </div>

    <textarea id="statusBox" placeholder="Start your fresh intake record..."></textarea>
    
    <div class="mac-controls">
        <div class="mac-media-bar">
            <div class="media-icon">📷</div>
            <div class="media-icon">🎤</div>
            <div class="media-icon">📄</div>
        </div>
        <button class="clio-square-btn" onclick="alert('Locking Timeline & Sending to Clio Grow...')">LOCK & SEND<br>TO CLIO</button>
    </div>
</div>

<button id="addBtn" onclick="submitEntry()">+</button>

<div id="timelineContainer"><div id="displayList"></div></div>

<div id="mgmtDrawer">
    <div class="pull-handle" onclick="document.getElementById('mgmtDrawer').classList.toggle('active')">
        <div class="handle-pill"></div>
        <div class="handle-text">MANAGEMENT</div>
    </div>
    <div style="padding-top:30px;">
        <button class="drawer-btn btn-teal" onclick="alert('Timeline Saved!')">SAVE TIMELINE</button>
        <button class="drawer-btn btn-gray" onclick="confirmReset()">START NEW TIMELINE</button>
    </div>
</div>

<script>
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    window.onload = () => { refreshDisplay(); };

    function applyTemplate(type) {
        const t = { 'WCB': '--- WorkSafeBC REPORT ---\n', 'WITNESS': '--- WITNESS STATEMENT ---\n', 'EVIDENCE': '--- EVIDENCE LOG ---\n', 'SETTING': '--- INCIDENT SETTING ---\n' };
        document.getElementById('statusBox').value = t[type];
    }

    function submitEntry() {
        const b = document.getElementById('statusBox'); if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = { id: Date.now(), content: b.value, stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}` };
            timelineVault.push(entry); 
            localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
            b.value = ''; refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div'); div.className = 'entry';
            const text = item.content || item.grit || "No data";
            div.innerHTML = `<div style="font-size:9px; font-weight:900; color:var(--slate);">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin-top:5px; white-space:pre-wrap;">${text}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { if(confirm("Start new timeline?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
