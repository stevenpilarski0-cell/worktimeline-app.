<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline™ | Live Action Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 1. BRANDING: Platinum to Teal & Mac-Style SF Pro Font */
        :root {
            --platinum: #E5E4E2;
            --teal: #008080;
            --clio-blue: #0070D2;
            --slate: #2D3E50;
        }

        body {
            font-family: "SF Pro Display", "Inter", system-ui, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(180deg, var(--platinum) 0%, var(--teal) 100%);
            background-attachment: fixed;
            display: flex; justify-content: center; min-height: 100vh;
        }

        /* 2. THE WINDOW: Rounded Bubbly Aesthetics */
        .app-window {
            width: 100%; max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            margin: 20px; border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 3. FUNCTIONAL NAV: Hardware Triggers */
        .nav-bar {
            display: flex; justify-content: space-around;
            padding: 20px; background: white;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-btn {
            border: none; background: none; cursor: pointer;
            color: var(--teal); font-size: 10px; font-weight: 800;
        }

        .nav-icon { display: block; font-size: 24px; margin-bottom: 4px; }

        /* 4. MARKETPLACE: Horizontal Scroll Triage */
        .triage-scroll {
            display: flex; gap: 15px; padding: 10px 0;
            overflow-x: auto; scroll-snap-type: x mandatory;
        }

        .triage-card {
            background: white; min-width: 260px; padding: 20px;
            border-radius: 25px; scroll-snap-align: center;
            border: 2px solid #eee; transition: 0.3s; cursor: pointer;
        }

        .triage-card:hover { border-color: #00ffff; }

        /* 5. UI COMPONENTS */
        .content { padding: 25px; flex: 1; overflow-y: auto; }
        .hidden { display: none; }
        
        .btn-pill {
            background: var(--teal); color: white; border: none;
            padding: 18px; border-radius: 22px; width: 100%;
            font-weight: 800; cursor: pointer; margin-top: 10px;
        }

        textarea {
            width: 100%; padding: 15px; border-radius: 20px;
            border: 1px solid #ddd; font-family: inherit; margin: 10px 0;
        }

        .chat-bubble {
            padding: 15px; border-radius: 20px; margin-bottom: 10px;
            max-width: 80%; font-size: 14px;
        }
        .lawyer-msg { background: #f0f3f3; color: var(--slate); align-self: flex-start; }
        .client-msg { background: var(--teal); color: white; align-self: flex-end; margin-left: auto; }
    </style>
</head>
<body>

<div class="app-window">
    <!-- UI STAGE: HARDWARE NAV -->
    <div id="navArea" class="nav-bar hidden">
        <button class="nav-btn" onclick="useHardware('camera')"><span class="nav-icon">📸</span>CAMERA</button>
        <button class="nav-btn" onclick="useHardware('mic')"><span class="nav-icon">🎙️</span>AUDIO</button>
        <button class="nav-btn" onclick="useHardware('stealth')"><span class="nav-icon">👻</span>STEALTH</button>
        <button class="nav-btn" onclick="useHardware('notes')"><span class="nav-icon">🗒️</span>NOTES</button>
    </div>

    <div class="content">
        <!-- VIEW 1: AUTHENTICATION -->
        <div id="authView">
            <h2 style="color: var(--teal); text-align: center;">WorkTimeline™</h2>
            <button class="btn-pill" style="background:var(--clio-blue);" onclick="login('client')">Client Sign in with Clio</button>
            <button class="btn-pill" style="background:var(--slate);" onclick="login('firm')">Firm Sign in with Clio</button>
            <div style="text-align:center; margin: 20px 0; color:#999;">OR</div>
            <input type="email" id="regEmail" placeholder="Email" style="width:100%; padding:12px; border-radius:15px; border:1px solid #ddd; margin-bottom:10px;">
            <button class="btn-pill" style="background:white; color:var(--teal); border:2px solid var(--teal);" onclick="manualRegister()">Create Account</button>
        </div>

        <!-- VIEW 2: CLIENT WORKSPACE & PERSONAL STATEMENT -->
        <div id="clientView" class="hidden">
            <h3>My Workspace</h3>
            <div id="timelineList"></div>
            <p style="font-size:12px; color:#666;">Leave a statement for the lawyers:</p>
            <textarea id="clientStatement" placeholder="What matters most to you in this case?"></textarea>
            <button class="btn-pill" onclick="lockAndSubmit()">LOCK & SUBMIT TO MARKETPLACE</button>
        </div>

        <!-- VIEW 3: FIRM MARKETPLACE Discovery -->
        <div id="firmView" class="hidden">
            <h3>Triage Marketplace</h3>
            <div class="triage-scroll" id="leadsList">
                <!-- Triage Cards injected here -->
            </div>
        </div>

        <!-- VIEW 4: COMMUNICATION BRIDGE -->
        <div id="commsView" class="hidden">
            <h3 id="commsHeader">Matter Discussion</h3>
            <div id="chatBox" style="display:flex; flex-direction:column; height: 300px; overflow-y: auto;">
                <div class="chat-bubble lawyer-msg">Welcome to the firm. We've received your statement and evidence.</div>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <input type="text" id="chatInput" placeholder="Message your lawyer..." style="flex:1; border-radius:20px; padding:10px; border:1px solid #ddd;">
                <button onclick="sendMsg()" style="background:var(--teal); color:white; border:none; padding:10px 20px; border-radius:20px; font-weight:bold;">SEND</button>
            </div>
        </div>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://sghmgiaaqcuymqnfbleh.supabase.co', 'Sb_publishable_VL3kSjtNHGvLcmZYi1YXnA_Xlo8zpXy');

    // 1. HARDWARE TRIGGERS
    async function useHardware(type) {
        if(type === 'camera' || type === 'mic') {
            try { await navigator.mediaDevices.getUserMedia({ video: type === 'camera', audio: type === 'mic' }); alert(`${type} active.`); }
            catch(e) { alert(`${type} access denied.`); }
        } else { alert(`${type} mode engaged.`); }
    }

    // 2. AUTHENTICATION & ONBOARDING
    function login(role) { 
        alert(`Starting Clio OAuth for ${role}...`); 
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('clientView').classList.remove('hidden');
        document.getElementById('navArea').classList.remove('hidden');
    }

    // 3. LOCK & SUBMIT (Personal Statement)
    function lockAndSubmit() {
        const stmt = document.getElementById('clientStatement').value;
        if(!stmt) return alert("Please provide your personal statement.");
        localStorage.setItem('lead_statement', stmt);
        alert("Integrity Lock Activated. Case moved to Marketplace.");
        document.getElementById('clientView').classList.add('hidden');
        document.getElementById('firmView').classList.remove('hidden');
        renderMarketplace();
    }

    // 4. FIRM MARKETPLACE Discovery
    function renderMarketplace() {
        const list = document.getElementById('leadsList');
        const stmt = localStorage.getItem('lead_statement') || "No statement left.";
        list.innerHTML = `
            <div class="triage-card" onclick="openComms('Lead 110')">
                <div style="border:3px solid var(--teal); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-weight:bold;">94%</div>
                <strong>Lead 110</strong>
                <p style="font-size:11px; color:#666;">"${stmt.substring(0, 40)}..."</p>
                <small style="color:var(--teal);">Click to Open Communication</small>
            </div>
        `;
    }

    // 5. COMMUNICATION BRIDGE (Clio Sync)
    function openComms(id) {
        document.getElementById('firmView').classList.add('hidden');
        document.getElementById('commsView').classList.remove('hidden');
        document.getElementById('commsHeader').innerText = id + " Discussion";
    }

    function sendMsg() {
        const input = document.getElementById('chatInput');
        if(!input.value) return;
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble client-msg';
        bubble.innerText = input.value;
        document.getElementById('chatBox').appendChild(bubble);
        input.value = "";
        console.log("Syncing message to Clio Manage as Note...");
    }
</script>
</body>
</html>
