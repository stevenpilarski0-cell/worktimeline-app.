<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline - Control Panel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            max-width: 500px;
            width: 100%;
        }
        h2 { font-size: 24px; font-weight: 600; margin: 0 0 6px; text-align: center; }
        .subtitle { font-size: 13px; color: #86868b; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 12px; font-weight: 600; color: #86868b; margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; }
        select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fbfbfd;
            font-family: inherit;
            color: #1d1d1f;
        }
        textarea { height: 160px; resize: none; }
        select:focus, textarea:focus { outline: none; border-color: #008080; background-color: #ffffff; }
        .btn {
            background-color: #008080;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #006666; }
        .banner { margin-top: 1.2rem; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; display: none; text-align: center; }
        .success { background-color: #e6f2f2; color: #008080; border: 1px solid #008080; }
        .error { background-color: #ffebe9; color: #ff3b30; border: 1px solid #ff3b30; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>WorkTimeline</h2>
    <div class="subtitle">Secure Evidence Logging Portal</div>
    
    <div class="form-group">
        <label>Active Workspace Target</label>
        <select id="firmSelect">
            <option value="01KPZB4ZCXHE3Z92S1KM3AT96V" selected>Stephen Pilarski — Primary Workspace</option>
        </select>
    </div>

    <div class="form-group">
        <label for="logText">Contemporaneous Statement</label>
        <textarea id="logText" placeholder="Enter chronological logs here...">[03:15 PM] Direct transmission pipeline fully unlocked. Ready to sync.</textarea>
    </div>

    <button id="syncBtn" class="btn">Transmit to Clio Infrastructure</button>
    <div id="banner" class="banner"></div>
</div>

<script>
    document.getElementById('syncBtn').addEventListener('click', async () => {
        const firmSelect = document.getElementById('firmSelect');
        const firmId = firmSelect.value; // Explicitly pull the 01KPZB4... ID from the menu
        const firmName = firmSelect.options[firmSelect.selectedIndex].text;
        const logText = document.getElementById('logText').value.trim();
        const banner = document.getElementById('banner');

        if (!logText) {
            showBanner('Please enter log text before syncing.', 'error');
            return;
        }

        showBanner('Transmitting directly to your firm portal...', 'success');

        try {
            const response = await fetch('/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    firmId: firmId, 
                    firmName: firmName, 
                    logText: logText 
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showBanner('Transmission Success! Logged securely inside your Clio account.', 'success');
            } else {
                throw new Error(result.error || 'Server rejected the transmission.');
            }
        } catch (err) {
            showBanner(`Sync Failed: ${err.message}`, 'error');
        }
    });

    function showBanner(message, type) {
        banner.textContent = message;
        banner.className = `banner ${type}`;
        banner.style.display = 'block';
    }
</script>

</body>
</html>
