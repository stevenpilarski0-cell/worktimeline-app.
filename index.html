<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Apple Code Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --slate-silver: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            --glass: rgba(0, 128, 128, 0.05); --platinum: #d8e2ea; --gray-dark: #2c3e50; --teal-soft: #e0f2f1;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); }
        
        /* ORIGINAL CINEMATIC INTRO */
        #splashScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 40px; 
            box-sizing: border-box; transition: opacity 1s ease; 
        }
        .story-text { font-size: 24px; font-weight: 800; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 340px; }
        .skip-btn { position: absolute; bottom: 80px; background: rgba(0,0,0,0.05); border: 1.5px solid var(--gray-dark); padding: 12px 24px; border-radius: 50px; font-weight: 900; font-size: 13px; cursor: pointer; color: var(--gray-dark); }

        /* THE APPLE CODE PROTOTYPE */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 50px; height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; }
        .tagline { font-size: 11px; font-weight: 800; color: var(--clio-blue); font-style: italic; margin-top: -2px; }

        /* INPUT & TEMPLATES */
        .input-area { padding: 15px; background: #fff; border-bottom: 2px solid var(--platinum); flex-shrink: 0; }
        #statusBox { width: 100%; height: 85px; padding: 15px; border-radius: 30px; border: 2px solid var(--platinum); box-sizing: border-box; font-family: inherit; margin-bottom: 12px; font-size: 16px; outline: none; background: #fbfdff; }
        .template-chip { background: var(--teal-soft); color: var(--teal); border: none; padding: 8px 16px; border-radius: 50px; font-size: 10px; font-weight: 900; cursor: pointer; margin-right: 5px; }

        /* TIMELINE DISPLAY WITH STATS & QUOTES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; position: relative; background: #fdfdfd; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 8px; background: #cccccc; border-radius: 15px; z-index: 1; }
        
        #legacyQuote { 
            position: relative; margin-left: 55px; background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 128, 128, 0.15); border-left: 6px solid var(--teal);
            padding: 20px; border-radius: 30px; margin-bottom: 25px; z-index: 2; 
        }

        .entry { position: relative; margin-left: 55px; background: white; border: 1.5px solid var(--platinum); padding: 18px; border-radius: 30px; margin-bottom: 25px; z-index: 2; border-left: 6px solid var(--teal); }
        .ai-badge { font-size: 8px; font-weight: 900; color: #334155; background: var(--slate-silver); padding: 4px 12px; border-radius: 12px; margin-bottom: 8px; display: inline-block; text-transform: uppercase; }
        .timestamp-full { font-size: 9px; font-weight: 900; color: var(--teal); display: block; margin-bottom: 5px; text-transform: uppercase; }

        /* PRIVACY SWITCH (GHOST MODE) */
        body.ghost-mode .app-container { filter: blur(25px); pointer-events: none; }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 20px; border-radius: 30px; width: 90%; align-self: center; font-weight: 900; cursor: pointer; margin: 15px 0; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text">Welcome.</h1>
    <button class="skip-btn" onclick="endSplash()">SKIP INTRO ➔</button>
</div>

<div class="app-container">
    <header class="header">
        <div>
            <h1 style="color: var(--teal); margin:0; font-size: 18px; font-weight: 900;">WorkTimeline™</h1>
            <span class="tagline">Taking an Intake...</span>
        </div>
        <div style="display:flex; gap:10px; align-items: center; text-align: center;">
            <div><label class="switch"><input type="checkbox" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">GHOST</div></div>
        </div>
    </header>

    <div id="mainContent" style="display: flex; flex-direction: column; height: 100%;">
        <div class="input-area">
            <div style="margin-bottom:10px;">
                <button class="template-chip" onclick="addText('📍 [LOCATION]: ')">LOCATION</button>
                <button class="template-chip" onclick="addText('👤 [WITNESS]: ')">WITNESS</button>
            </div>
            <textarea id="statusBox" placeholder="Start your intake entry..."></textarea>
            <button onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:20px; width:100%; font-weight:900; cursor:pointer;">Add Entry & Secure</button>
        </div>

        <div id="timelineContainer">
            <div class="timeline-spine"></div>
            <div id="displayList">
                <div id="legacyQuote">
                    <span style="font-size: 8px; font-weight: 900; color: var(--teal); text-transform: uppercase;">Intake Analytics</span>
                    <p style="margin: 10px 0; font-size: 14px; font-weight: 700;">Current Case Load: High<br>Sync Status: Ready</p>
                    <hr style="border: 0; border-top: 1px solid var(--platinum); margin: 10px 0;">
                    <p id="quoteText" style="font-style: italic; font-size: 13px;"></p>
                </div>
            </div>
        </div>

        <button class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
    </div>
</div>

<script>
    const story = [
        "The system is built on two prisons.",
        "One made of grey walls.",
        "The other made of grey bureaucracy.",
        "The 'Invisible Group' is trapped in the grey.",
        "Told they don't matter. Told to wait.",
        "But Jack Newton saw a different path.",
        "Your truth is the Great Wall.",
        "And we are the Jackal.",
        "WorkTimeline™: Document your freedom."
    ];
    
    const quotes = [
        {q:'"Injustice anywhere is a threat to justice everywhere."',a:"MLK Jr."},
        {q:'"The law is a shield for the weak."',a:"Hamilton"}
    ];

    window.onload = () => { 
        const rand = quotes[Math.floor(Math.random()*quotes.length)];
        document.getElementById('quoteText').innerText = rand.q + " — " + rand.a;
        runStory(); 
    };

    function runStory() {
        const el = document.getElementById('storyText');
        let i = 0;
        const next = () => {
            if(i < story.length) {
                el.style.opacity = 0;
                setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2800); }, 600);
            } else endSplash();
        };
        next();
    }

    function endSplash() {
        const s = document.getElementById('splashScreen');
        if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 1000); }
    }

    function addText(t) { const b = document.getElementById('statusBox'); b.value += t; b.focus(); }
    function togglePrivacy() { document.body.classList.toggle('ghost-mode'); }

    function submitEntry() {
        const box = document.getElementById('statusBox');
        if(!box.value.trim()) return;
        
        const now = new Date();
        const stamp = now.toLocaleDateString() + ' @ ' + now.toLocaleTimeString();
        
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<div class="ai-badge">INTAKE</div><span class="timestamp-full">${stamp}</span><p style="margin:0; font-size:14px; font-weight:600;">${box.value}</p>`;
        
        document.getElementById('displayList').prepend(div);
        box.value = '';
    }

    function syncToClio() {
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write`;
    }
</script>
</body>
</html>
