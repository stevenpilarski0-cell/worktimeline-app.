<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Elite 8.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --teal-dark: #004d4d; --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; --notes-gold: #f1c40f; --slate: #64748b;
            --mac-bg: #f1f5f9;
        }

        body { 
            font-family: 'Nunito', sans-serif; background: #f8fafc; 
            margin: 0; padding: 0; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- HEADER & BRANDING --- */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; border-bottom: 1.5px solid var(--platinum); 
            background: white; z-index: 10000; position: relative;
        }
        .brand-group { display: flex; align-items: center; gap: 8px; }
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        .sub-title { font-weight: 900; color: var(--teal); font-size: 11px; letter-spacing: -1.1px; margin: 0; }
        .clio-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; margin-left: 5px; }

        /* --- MAC-STYLE MEDIA BAR --- */
        .mac-media-bar { 
            display: flex; justify-content: space-around; 
            background: var(--mac-bg); padding: 12px; 
            border-radius: 24px; margin-top: 10px;
        }
        .media-icon { 
            background: white; width: 45px; height: 45px; 
            border-radius: 14px; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            cursor: pointer; font-size: 20px;
        }

        /* --- MANAGEMENT DRAWER --- */
        #mgmtDrawer { 
            position: fixed; bottom: -300px; left: 0; width: 100%; 
            background: white; border-top: 5px solid var(--teal); 
            z-index: 999999; border-radius: 35px 35px 0 0; 
            transition: bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -15px 50px rgba(0,0,0,0.2); padding-bottom: 40px;
        }
        #mgmtDrawer.active { bottom: 0 !important; }
        
        .pull-handle { 
            width: 100%; height: 60px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer;
            position: absolute; top: -60px; background: transparent;
        }
        .handle-pill { width: 55px; height: 7px; background: var(--teal); border-radius: 10px; margin-bottom: 5px; }
        .handle-text { font-size: 9px; font-weight: 900; color: var(--teal); letter-spacing: 1.5px; }

        /* --- BUTTONS --- */
        .drawer-btn { border: none; padding: 18px; border-radius: 50px; font-weight: 900; width: 85%; font-size: 14px; margin: 0 auto 12px; display: block; cursor: pointer; color: white; }
        .btn-save { background: var(--teal); }
        .btn-new { background: var(--slate); }

        #addBtn { position: absolute; z-index: 9000; width: 75px; height: 75px; border-radius: 22px; background: var(--teal); color: white; font-weight: 900; font-size: 35px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); right: 20px; top: 180px; }

        /* --- CONTENT --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 140px; background: #fafbfc; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--teal); }
        #statusBox { width: 100%; height: 100px; padding: 15px; border-radius: 20px; border: 2.5px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }
        
        /* Toggles */
        .switch { position: relative; width: 34px; height: 18px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<header class="header">
    <div class="brand-group">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
            <path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="8" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="12" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="16" cy="13.5" r="1.5" fill="var(--teal)"/>
        </svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <div style="display:flex; align-items:center;">
                <span class="sub-title">TAKIN'INTAKE</span>
                <div class="clio-dot"></div>
            </div>
        </div>
    </div>
    <div style="text-align:center;">
        <label class="switch"><input type="checkbox" onchange="document.body.classList.toggle('notes-mode')"><span class="slider"></span></label>
        <div style="font-size:7px; font-weight:900;">NOTES</div>
    </div>
</header>

<div style="padding:15px; background:white; border-bottom:1px solid var(--platinum);">
    <textarea id="statusBox" placeholder="Start your fresh intake record..."></textarea>
    
    <div class="mac-media-bar">
        <div class="media-icon" onclick="alert('Camera active')">📷</div>
        <div class="media-icon" onclick="alert('Document upload')">📄</div>
        <div class="media-icon" onclick="alert('Voice recording')">🎤</div>
    </div>
</div>

<button id="addBtn" onclick="submitEntry()">+</button>

<div id="timelineContainer"><div id="displayList"></div></div>

<div id="mgmtDrawer">
    <div class="pull-handle" onclick="document.getElementById('mgmtDrawer').classList.toggle('active')">
        <div class="handle-pill"></div>
        <div class="handle-text">MANAGEMENT</div>
    </div>
    <div style="padding-top:40px;">
        <button class="drawer-btn btn-save" onclick="alert('Timeline Saved & Exported')">SAVE JOURNAL</button>
        <button class="drawer-btn btn-new" onclick="confirmReset()">START NEW JOURNAL</button>
    </div>
</div>

<script>
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];

    window.onload = () => { refreshDisplay(); };

    function submitEntry() {
        const b = document.getElementById('statusBox'); if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = { 
                id: Date.now(), 
                content: b.value, 
                stamp: new Date().toLocaleString(), 
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}` 
            };
            timelineVault.push(entry); 
            localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
            b.value = ''; refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry';
            div.innerHTML = `<div style="font-size:9px; font-weight:900; color:var(--slate);">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin-top:5px;">${item.content}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { 
        if(confirm("Wipe all entries and start new?")) { 
            localStorage.clear(); 
            location.reload(); 
        } 
    }
</script>
</body>
</html>
