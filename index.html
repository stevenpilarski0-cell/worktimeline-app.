<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Locked & Certified</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 36px; --round-inner: 24px; --round-pill: 999px;
            --mac-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); }
        
        /* CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 96vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); }

        /* BRANDING */
        .header { padding: 15px; border-bottom: 1px solid var(--platinum); background: white; text-align: center; }
        .briefcase { position: relative; width: 45px; height: 30px; border: 3px solid var(--gray-dark); border-radius: 8px; margin: 0 auto; }
        .briefcase-handle { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 16px; height: 6px; border: 3px solid var(--gray-dark); border-bottom: none; border-radius: 4px; }
        .teal-spine { position: absolute; top: 55%; left: -12px; right: -12px; height: 4px; background: var(--teal); border-radius: 2px; }

        /* MAC SOLID ICONS */
        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 15px 20px; background: var(--gray-light); }
        .media-btn { background: var(--teal); border: none; height: 75px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 15px rgba(0, 128, 128, 0.2); }
        .media-btn svg { width: 22px; height: 22px; fill: white; margin-bottom: 5px; }
        .media-btn span { font-size: 8px; font-weight: 800; color: white; text-transform: uppercase; }

        /* TIMELINE ENTRIES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px; background: white; }
        .entry-card { border: 1px solid var(--platinum); padding: 15px; border-radius: 20px; margin-bottom: 12px; border-left: 6px solid var(--teal); background: #fff; }
        .meta { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 5px; }

        /* THE LOCK & SEND (CLIO) */
        .lock-footer { padding: 20px; background: var(--gray-light); border-top: 1px solid var(--platinum); text-align: center; }
        .lock-btn { background: var(--gray-dark); color: white; border: none; padding: 15px; width: 90px; height: 90px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: 0.3s; }
        .lock-btn:active { transform: scale(0.9); background: var(--clio-blue); }
        .lock-btn svg { width: 28px; height: 28px; fill: white; margin-bottom: 5px; }
        .lock-btn span { font-size: 11px; font-weight: 900; letter-spacing: 1px; }

        #summaryModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: none
