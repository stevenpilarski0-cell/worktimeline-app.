<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        
        /* GHOST BLUR LOGIC */
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(25px); opacity: 0.1; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 2.5px solid var(--teal); box-sizing: border-box; text-align: center; }
        
        /* CENTERED HEADER */
        .header { padding: 15px; border-bottom: 2px solid var(--teal); background: white; z-index: 3000; }
        .header-top { display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; }
        .brand-text { text-align: center; }
        .brand-sub { font-size: 9px; font-weight: 900; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* CLIO GREEN LIGHT */
        .clio-pulse { width: 8px; height: 8px; background-color: var(--clio-green); border-radius: 50%; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* GHOST & NOTES BUTTONS (SAME SPOT) */
        .header-controls { position: absolute; right: 0; display: flex; flex-direction: column; gap: 5px; }
        .control-btn { background: var(--teal); color: white; border: none; border-radius: 6px; font-size: 8px; font-weight: 900; padding: 4px 8px; cursor: pointer; }

        /* DRAGGABLE BUTTONS (SQUARES) */
        .draggable { position: absolute; z-index: 9999; cursor: move; touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; color: white; border-radius: 18px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: none; }
        #addBtn { width: 80px; height: 80px; background: var(--teal); font-size: 40px; top: 150px; right: 20px; }
        #syncBtn { width: 80px; height: 80px; background: var(--clio-blue); font-size: 10px; padding: 5px; top: 250px; right: 20px; }

        /* UPPER TABS (CENTERED) */
        .tab-row { display: flex; gap: 8px; justify-content: center; padding: 10px; border-bottom: 1px solid #eee; overflow-x: auto; }
        .template-chip { border: 2.5px solid var(--teal); padding: 8px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; color: var(--teal); background: white; cursor: pointer; white-space: nowrap; }

        /* HARDWARE TOOLS (SHRUNKEN, NO EMOJI) */
        .media-row { display: flex; gap: 8px; padding: 10px 15px; justify-content: center; }
        .media-btn { background: #f1f5f9; border: 1.5px solid #cbd5e1; padding: 8px; border-radius: 8px; font-size: 10px; flex: 1; font-weight: 900; color: #475569; cursor: pointer; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 15px 15px 120px; }
        .entry { background: white; border: 2.5px solid var(--teal); border-left-width: 10px; padding: 18px; border-radius: 18px; margin-bottom: 25px; text-align: left; }
        .tier-serious { animation: pulse-ser 2s infinite; border-left-color: var(--teal-dark); background: var(--blue-trans); }
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        /* OVERLAYS */
        #disclaimerOverlay, #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 30px; border-radius: 28px; border-bottom: 6px solid var(--teal); width: 100%; max-width: 350px; }
        .modal-btn { border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: 900; margin-top: 10px; cursor: pointer; }

        /* MANAGEMENT DRAWER */
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 3px solid var(--teal); z-index: 6000; transition: 0.4s transform ease; transform: translateY(calc(100% - 40px)); }
        .drag-handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: var(--teal); border-radius: 10px; opacity: 0.2; }
    </style>
</head>
<body id="appBody">

<div id="disclaimerOverlay"><div class="modal-card"><h2>INTAKE GUARD</h2><p style="font-weight:700;">Work Journal: Documenting the truth. Not legal advice.</p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="this.parentElement.parentElement.remove()">I UNDERSTAND</button></div></div>
<div id="warningOverlay" style="display:none;"><div class="modal-card"><h2>EA ANALYSIS</h2><p id="warningMsg" style="font-weight:700;"></p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="applyStack(true)">STACK ON TOP</button><button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="applyStack(false)">STACK UNDER</button></div></div>

<div class="app-container">
    <header class="header">
        <div class="header-top">
            <svg width="40" height="30" viewBox="0 0 40 30" fill="none"><path d="M3 12C3 10.3431 4.34315 9 6 9H13.5C13.5 7 15.5 3 20 3C24.5 3 26.5 7 26.5 9H34C35.6569 9 37 10.3431 37 12V25C37 26.6569 35.6569 28 34 28H6C4.34315 28 3 26.6569 3 25V12Z" stroke="#008080" stroke-width="3" stroke-linejoin="round"/><line x1="0" y1="18.5" x2="40" y2="18.5" stroke="#008080" stroke-width="3"/><circle cx="9" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="20" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="31" cy="18.5" r="3" fill="#008080" stroke="white"/></svg>
            <div class="brand-text">
                <div class="brand-sub">Takin'Intake</div>
                <div class="main-title">WorkTimeline™ <div class="clio-pulse"></div></div>
            </div>
            <div class="header-controls">
                <button class="control-btn" onclick="document.getElementById('appBody').classList.toggle('ghost-active')">GHOST</button>
                <button class="control-btn" id="vaultBtn" onclick="toggleVault()">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div class="tab-row">
            <div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div>
            <div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div>
            <div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div>
            <div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div>
        </div>
        <div class="media-row">
            <label class="media-btn">CAMERA <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="alert('Photo Ready')"></label>
            <label class="media-btn">AUDIO <input type="file" accept="audio/*" capture="microphone" style="display:none;" onchange="alert('Audio Ready')"></label>
            <label class="media-btn">DOCUMENT <input type="file" style="display:none;" onchange="alert('File Ready')"></label>
        </div>
        <div style="padding:0 15px;"><textarea id="statusBox" style="width:100%; height:80px; border:2.5px solid var(--teal); border-radius:15px; padding:12px; font-weight:700; outline:none; font-size:14px;" placeholder="Journal the truth..."></textarea></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable">LOCK & SYNC TO CLIO</button>

    <div id="mgmtDrawer">
        <div class="drag-handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 20px 30px;">
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="alert('Exporting Report...')">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="confirm('Wipe record?') && (localStorage.clear() || location.reload())">DELETE & START FRESH</button>
        </div>
    </div>
</div>

<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    let activeVault = "TIMELINE"; let pending = null; let mgmtOpen = false;

    // DRAGGABLE LOGIC
    function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.onmousedown = dragMouseDown; el.ontouchstart = dragMouseDown;
        function dragMouseDown(e) {
            e = e || window.event; if(e.type !== 'touchstart') e.preventDefault();
            pos3 = e.clientX || e.touches[0].clientX; pos4 = e.clientY || e.touches[0].clientY;
            document.onmouseup = closeDragElement; document.ontouchend = closeDragElement;
            document.onmousemove = elementDrag; document.ontouchmove = elementDrag;
        }
        function elementDrag(e) {
            e = e || window.event;
            let clientX = e.clientX || e.touches[0].clientX; let clientY = e.clientY || e.touches[0].clientY;
            pos1 = pos3 - clientX; pos2 = pos4 - clientY; pos3 = clientX; pos4 = clientY;
            el.style.top = (el.offsetTop - pos2) + "px"; el.style.left = (el.offsetLeft - pos1) + "px";
        }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
    }

    makeDraggable(document.getElementById("addBtn"));
    makeDraggable(document.getElementById("syncBtn"));

    // Ensure the add button still functions as a button
    document.getElementById("addBtn").onclick = function(e) { if(Math.abs(pos1) < 5 && Math.abs(pos2) < 5) submitEntry(); };

    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 40px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }
    function toggleVault() { activeVault = activeVault === "TIMELINE" ? "NOTES" : "TIMELINE"; document.getElementById('vaultBtn').innerText = activeVault === "TIMELINE" ? "NOTES" : "TIMELINE"; refresh(); }
    
    function useTemplate(t) { 
        const ts = { 'INCIDENT': 'ACTION:\nVIOLATION:', 'INJURY': 'OFA RECORD:\nINJURY:', 'LOCATION': 'SITE:\nHAZARDS:', 'WITNESS': 'NAME:\nCONTACT:' };
        document.getElementById('statusBox').value = ts[t];
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const low = text.toLowerCase();
        let analysis = (low.includes("fire") || low.includes("toxic") || low.includes("threat") || low.includes("quit")) ? "EA PATTERN: Serious marker detected." : "";
        pending = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: analysis ? 'serious' : 'minor', agree: false };
        if(analysis && activeVault === "TIMELINE") { document.getElementById('warningMsg').innerText = analysis; document.getElementById('warningOverlay').style.display = 'flex'; }
        else saveFinal();
        document.getElementById('statusBox').value = '';
    }

    function applyStack(agree) { pending.agree = agree; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    function saveFinal() { 
        if(activeVault === "TIMELINE") timelineVault.push(pending); else notesVault.push(pending);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault)); localStorage.setItem('wt_notes', JSON.stringify(notesVault));
        refresh(); 
    }

    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const card = `<div class="entry tier-${item.tier}"><b>📍 LANGLEY, BC | ${item.stamp}</b><p style="margin-top:10px; font-weight:800; line-height:1.4;">${item.grit}</p></div>`;
            const ea = item.analysis ? `<div class="entry" style="margin-bottom:-15px; border-left-color:#7f8c8d; font-size:12px;"><b>EA:</b> ${item.analysis}</div>` : "";
            list.innerHTML += item.agree ? ea + card : card + ea;
        });
    }
    
    // Manual click override for draggable plus
    let startX, startY;
    document.getElementById("addBtn").addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
    document.getElementById("addBtn").addEventListener('touchend', e => {
        let diffX = Math.abs(e.changedTouches[0].clientX - startX);
        let diffY = Math.abs(e.changedTouches[0].clientY - startY);
        if(diffX < 10 && diffY < 10) submitEntry();
    });

    refresh();
</script>
</body>
</html>
