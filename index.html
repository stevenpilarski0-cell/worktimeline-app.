<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timeline™ Master | Platinum Elite v22</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 15px 35px rgba(0,0,0,0.12); 
            --radius-xl: 35px;
            --radius-lg: 25px;
            --radius-md: 18px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #f1f5f9; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1px solid var(--gray-border); box-sizing: border-box; overflow: hidden; transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1); }

        .birds-eye-active { transform: scale(0.6) translateY(-50px); border-radius: 45px; box-shadow: 0 50px 100px rgba(0,0,0,0.3); }

        /* SIDEBAR / MENU */
        #sideBar { position: absolute; left: -280px; top: 0; width: 280px; height: 100%; background: #f8fafc; z-index: 10000; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); border-right: 1px solid var(--gray-border); box-shadow: 20px 0 50px rgba(0,0,0,0.1); padding: 35px 20px; box-sizing: border-box; overflow-y: auto; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 14px 15px; margin-bottom: 12px; border-radius: 14px; background: white; font-weight: 800; font-size: 11px; color: var(--teal); display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid #e2e8f0; text-transform: uppercase; }

        /* NAV TABS */
        .domain-nav { display: flex; background: #f8fafc; border-bottom: 1px solid var(--gray-border); padding: 10px; gap: 8px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 12px 0; border-radius: 15px; font-size: 9px; font-weight: 900; color: #64748b; background: transparent; cursor: pointer; text-transform: uppercase; }

        /* HEADER */
        .header { padding: 15px 20px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; }
        .main-title { font-weight: 900; font-size: 18px; color: var(--active-brand); letter-spacing: -1px; display: flex; align-items: center; }
        .clio-pulse { width: 8px; height: 8px; background-color: var(--clio-green); border-radius: 50%; margin-left: 10px; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* DRAWER */
        #utilityDrawer { position: absolute; top: 135px; width: 100%; background: white; border-bottom: 2.2px solid var(--gray-border); z-index: 3500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 50px)); border-radius: 0 0 var(--radius-xl) var(--radius-xl); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .handle { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 40px; height: 5px; background: #cbd5e0; border-radius: 10px; }

        /* TEMPLATE BAR */
        #templateBar { display: flex; gap: 10px; overflow-x: auto; padding: 5px 20px 20px; scrollbar-width: none; }
        .template-chip { border: 1.5px solid var(--gray-border); padding: 10px 18px; border-radius: 50px; font-size: 10px; font-weight: 900; color: #4a5568; background: white; white-space: nowrap; cursor: pointer; }

        /* TIMELINE TRACK */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 40px 20px 220px 65px; display: flex; flex-direction: column; gap: 45px; scrollbar-width: none; position: relative; z-index: 5; }
        #linearTrack { position: absolute; left: 24px; top: 180px; bottom: 120px; width: 5px; background: rgba(0, 128, 128, 0.1); border-radius: 20px; z-index: 1; }
        
        .track-node { position: absolute; left: -12px; width: 28px; height: 28px; background: white; border: 3px solid var(--active-brand); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
        .can-delete { cursor: pointer; color: var(--rose); border-color: var(--rose); }

        /* DOCKS */
        .action-dock-right { position: absolute; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 20px; z-index: 6000; }
        .action-dock-left { position: absolute; bottom: 35px; left: 25px; z-index: 6000; }
        
        #addBtn { width: 75px; height: 75px; background: var(--active-brand); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); color: white; font-size: 38px; font-weight: 900; }
        #syncBtn { width: 90px; height: 90px; background: var(--clio-blue); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 10px; }
        #eyeBtn { width: 70px; height: 70px; background: white; border: 1.5px solid var(--gray-border); border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; align-items: center; justify-content: center; }

        .bubble { padding: 25px; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); background: white; border: 1.2px solid #efefef; font-weight: 600; font-size: 15px; line-height: 1.5; }
        textarea { width: 100%; height: 110px; border: 2.2px solid var(--gray-border); border-radius: var(--radius-lg); padding: 18px; font-size: 16px; outline: none; background: #fafafa; box-sizing: border-box; font-family: inherit; }
        
        .app-locked { filter: blur(50px); pointer-events: none; }
    </style>
</head>
<body>

<div id="sideBar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h2 style="font-weight: 900; color: var(--teal); font-size: 18px; margin: 0; letter-spacing: -1px;">MENU</h2>
        <div onclick="toggleSidebar()" style="cursor: pointer; opacity: 0.5;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="sidebar-item" onclick="emailTimeline()">✉️ DRAFT EMAIL (@)</div>
    <div class="sidebar-item" onclick="exportData()">💾 SAVE & EXPORT</div>
    <div class="sidebar-item" onclick="openSettings()">⚙️ SYSTEM SETTINGS</div>
    
    <div style="margin: 25px 0 10px; font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Case Law Study</div>
    <div id="caseLawVault" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 11px; color: #64748b; font-style: italic; padding: 10px; border: 1px dashed #cbd5e0; border-radius: 12px;">Empty...</div>
    </div>

    <div class="sidebar-item" onclick="resetTimeline()" style="color: var(--rose); margin-top: 40px; border-color: var(--rose);">🗑️ RESET PLATFORM</div>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(40px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:30px;">
    <div class="modal-card" style="background:white; padding:50px; border-radius:var(--radius-xl); text-align:center; max-width:360px;">
        <h2 style="font-weight:900;">INTAKE GUARD</h2>
        <p>We document the truth. We do not offer legal advice.</p>
        <button onclick="unlockApp()" style="border:none; padding:20px; border-radius:20px; width:100%; background:var(--teal); color:white; font-weight:900; cursor:pointer;">SECURE MY JOURNAL</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab" data-id="WORK" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" data-id="FAM" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" data-id="INJURY" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" data-id="PROPERTY" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer;"><svg width="26" height="20" fill="none" stroke="var(--active-brand)" stroke-width="3.2"><line x1="0" y1="2" x2="26" y2="2"/><line x1="0" y1="10" x2="26" y2="10"/><line x1="0" y1="18" x2="26" y2="18"/></svg></div>
            <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            <div style="display:flex; gap:6px;">
                <button style="background:#f1f5f9; border:none; border-radius: 50px; font-size:8px; font-weight:900; padding:8px 12px;" onclick="togglePrivacy()">GHOST</button>
                <button id="modeToggle" style="background:#f1f5f9; border:none; border-radius: 50px; font-size:8px; font-weight:900; padding:8px 12px;" onclick="toggleMode()">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 25px;">
            <div id="templateBar"></div>
            <textarea id="statusBox" placeholder="Capturing chronological truth..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock-left">
        <button id="eyeBtn" onclick="toggleBirdsEye()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <div class="action-dock-right">
        <button id="addBtn" onclick="submitEntry()">+</button>
        <button id="syncBtn" onclick="clioHandshake()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>SYNC</button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v22')) || [];
    let studies = JSON.parse(localStorage.getItem('studies_v22')) || [];
    let sessionIds = []; // IDs added in THIS current session
    let currentDomain = 'WORK';
    let currentMode = 'TIMELINE';
    let utilOpen = false;

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: { 'LOCATION': 'LOC:\n', 'INCIDENT': 'EVENT:\n', 'WITNESS': 'WIT:\n' } },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: { 'VENUE': 'VENUE:\n', 'CUSTODY': 'TRANS:\n' } },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: { 'LOC': 'LOC:\n', 'CLAIM': 'CLAIM:\n', 'HARM': 'HARM:\n' } },
        'PROPERTY': { color: '#1e293b', name: 'PropTimeline™', templates: { 'ADDR': 'ADDR:\n', 'FIX': 'FIX:\n' } }
    };

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); updateStudyRepo(); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 50px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function togglePrivacy() { document.getElementById('mainApp').classList.toggle('privacy-active'); }
    function toggleBirdsEye() { document.getElementById('mainApp').classList.toggle('birds-eye-active'); }
    function openSettings() { alert("System Handshake Config..."); }

    function switchDomain(domain) {
        currentDomain = domain;
        const config = domainConfig[domain];
        document.documentElement.style.setProperty('--active-brand', config.color);
        document.getElementById('brandTitle').innerHTML = `${config.name} <div class="clio-pulse"></div>`;
        document.querySelectorAll('.domain-tab').forEach(t => { 
            t.style.color = (t.dataset.id === domain) ? config.color : '#64748b';
            t.style.background = (t.dataset.id === domain) ? 'white' : 'transparent';
        });
        const bar = document.getElementById('templateBar'); bar.innerHTML = '';
        Object.keys(config.templates).forEach(k => {
            const b = document.createElement('button'); b.className = 'template-chip'; b.innerText = k;
            b.onclick = () => { document.getElementById('statusBox').value += config.templates[k]; document.getElementById('statusBox').focus(); };
            bar.appendChild(b);
        });
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const id = Date.now();
        const stamp = `📍 LANGLEY, BC | ${new Date().toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
        vault.push({ id, grit: text, domain: currentDomain, stamp, mode: currentMode });
        sessionIds.push(id); // Mark as deletable for this session only
        localStorage.setItem('platinum_v22', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain && i.mode === currentMode);
        filtered.reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 145 + 25) + 'px';
            const isDeletable = sessionIds.includes(item.id);
            if(isDeletable) {
                node.innerHTML = '✕'; node.classList.add('can-delete');
                node.onclick = () => { if(confirm("Correction?")) { vault = vault.filter(v => v.id !== item.id); localStorage.setItem('platinum_v22', JSON.stringify(vault)); refresh(); } };
            }
            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:12px;">${item.stamp}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function updateStudyRepo() {
        const container = document.getElementById('caseLawVault');
        if(studies.length === 0) return;
        container.innerHTML = studies.map(s => `<div style="background: white; border: 1px solid var(--gray-border); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; color: var(--teal);">${s}</div>`).join('');
    }

    function resetTimeline() { if(confirm("Hard Reset?")) { localStorage.clear(); location.reload(); } }
    function clioHandshake() { if(currentDomain === 'WORK') alert("Vaulting data to Clio Canada Sandbox..."); }

    switchDomain('WORK');
</script>
</body>
</html>
