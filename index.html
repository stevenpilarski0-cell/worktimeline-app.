<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite | v14.8 Dual-Artifact</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;700&display=swap');
        :root { --teal: #008080; --slate: #475569; --gray-bg: #f1f5f9; --mac-border: #cbd5e0; --white: #ffffff; --clio-blue: #0076CE; --risk-red: #e53e3e; --notes-gold: #f59e0b; }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* MAC SLIDERS */
        .toggle-group { display: flex; gap: 15px; align-items: center; }
        .mac-switch-wrapper { display: flex; flex-direction: column; align-items: center; }
        .mac-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .mac-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .mac-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d5db; transition: .3s; border-radius: 34px; }
        .mac-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .mac-slider { background-color: var(--teal); }
        input:checked + .mac-slider.gold-variant { background-color: var(--notes-gold); }
        input:checked + .mac-slider:before { transform: translateX(18px); }
        .switch-label { font-size: 8px; font-weight: 900; color: var(--slate); margin-top: 4px; text-transform: uppercase; }

        /* DRAWERS */
        #topDrawer { position: fixed; top: 0; width: 100%; background: var(--white); border-bottom: 5px solid var(--teal); border-radius: 0 0 35px 35px; transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 10000; transform: translateY(calc(-100% + 60px)); box-shadow: 0 5px 25px rgba(0,0,0,0.08); }
        #topDrawer.open { transform: translateY(0); }
        .top-handle { height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; bottom: 0; width: 100%; background: var(--white); border-radius: 0 0 35px 35px; }
        .top-pill { width: 55px; height: 6px; background: var(--mac-border); border-radius: 10px; position: absolute; bottom: 10px; }

        #statusBox { width: 100%; height: 120px; padding: 15px; border-radius: 20px; border: 2px solid var(--mac-border); outline: none; font-size: 16px; background: #fafafa; box-sizing: border-box; resize: none; font-family: 'Nunito Sans', sans-serif; }
        .media-dock { display: flex; gap: 12px; background: #e2e8f0; padding: 8px; border-radius: 18px; flex-grow: 1; margin-right: 15px; justify-content: space-around; }
        .icon-btn { background: var(--white); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--slate); border: none; cursor: pointer; }

        /* TIMELINE - ROCK SOLID */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 80px 20px 140px; display: flex; flex-direction: column; gap: 15px; }
        .entry-card { background: var(--white); padding: 20px; border-radius: 22px; border: 2px solid var(--mac-border); border-left: 8px solid var(--teal); box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: none; }
        .note-card { border-left-color: var(--notes-gold) !important; }
        .stamp { font-size: 10px; font-weight: 800; color: var(--slate); opacity: 0.5; margin-bottom: 5px; }
        .dual-badge { background: #e0f2f1; color: var(--teal); font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 900; margin-top: 10px; display: inline-block; }

        /* CHOICE MODAL */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: var(--white); padding: 30px; border-radius: 35px; width: 100%; max-width: 360px; text-align: center; border: 4px solid var(--teal); }
        .btn { padding: 18px; border-radius: 15px; border: none; font-weight: 900; width: 100%; margin-top: 15px; cursor: pointer; }
        
        #vaultBtn { position: fixed; right: 20px; bottom: 85px; width: 60px; height: 60px; background: var(--clio-blue); border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white; border: none; z-index: 9999; }
    </style>
</head>
<body>

<input type="file" id="cameraIn" accept="image/*" capture="environment" style="display:none;" onchange="mediaLog('Photo')">
<input type="file" id="micIn" accept="audio/*" capture="microphone" style="display:none;" onchange="mediaLog('Voice')">

<button id="vaultBtn" onclick="alert('VAULT: Raw text & AI Case Law bundled for Clio.')">
    <svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
</button>

<div id="topDrawer">
    <div style="padding: 20px;">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div style="font-weight:900; color:var(--teal); font-size:20px;">WorkTimeline™</div>
            <div class="toggle-group">
                <div class="mac-switch-wrapper"><label class="mac-switch"><input type="checkbox" id="noteToggle" onchange="render()"><span class="mac-slider gold-variant"></span></label><span class="switch-label">NOTES</span></div>
            </div>
        </header>
        <textarea id="statusBox" placeholder="Describe the incident..."></textarea>
        <div style="display:flex; align-items:center; margin-top:15px;">
            <div class="media-dock">
                <button class="icon-btn" onclick="document.getElementById('cameraIn').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9z"/></svg></button>
                <button class="icon-btn" onclick="document.getElementById('micIn').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></button>
            </div>
            <button onclick="analyzePattern()" style="width:60px; height:60px; border-radius:15px; background:var(--teal); color:white; font-size:32px; font-weight:900; border:none;">+</button>
        </div>
    </div>
    <div class="top-handle" onclick="document.getElementById('topDrawer').classList.toggle('open')"><div class="top-pill"></div></div>
</div>

<div id="timeline"></div>

<div id="choiceModal" class="overlay">
    <div class="modal">
        <h2 style="color:var(--teal); margin:0;">DUAL ARTIFACT</h2>
        <p id="patternDesc" style="margin: 20px 0; line-height:1.4; color:var(--slate); font-size: 14px;"></p>
        <button class="btn" style="background:var(--teal); color:white;" onclick="finish(true)">USE AI CASE LAW VERSION</button>
        <button class="btn" style="background:var(--slate); color:white;" onclick="finish(false)">KEEP MY RAW TEXT</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('WT_DUAL_148')) || [];
    let pending = null;

    const cases = {
        RETAL: { title: "WorkSafeBC Prohibited Action (S.47)", body: "AI REVISION: Potential retaliation detected following First Aid report. This constitutes a 'Prohibited Action' under BC Workers Compensation Act Section 47." },
        CONS: { title: "Potter v. NB Constructive Dismissal", body: "AI REVISION: Unilateral removal of tools/access constitutes a 'Fundamental Breach' as per Potter v. New Brunswick [2015] SCC 10." }
    };

    function analyzePattern() {
        const val = document.getElementById('statusBox').value.trim();
        if(!val) return;
        const isNote = document.getElementById('noteToggle').checked;
        if(isNote) { save(val, null, false, true); return; }

        const t = val.toLowerCase();
        let p = null;
        const hasFA = db.some(e => e.txt.toLowerCase().includes("first aid"));

        if(hasFA && (t.includes("harass") || t.includes("pressure") || t.includes("yell"))) p = cases.RETAL;
        else if(t.includes("access") && t.includes("locked")) p = cases.CONS;

        if(p) {
            pending = { raw: val, ai: p.body, title: p.title };
            document.getElementById('patternDesc').innerHTML = `Pattern: <strong>${p.title}</strong><br><br>AI version will link the case law. Which version should lead the timeline?`;
            document.getElementById('choiceModal').style.display='flex';
        } else {
            save(val, null, false, false);
        }
    }

    function finish(useAI) {
        save(pending.raw, pending.ai, useAI, false);
        document.getElementById('choiceModal').style.display='none';
    }

    function save(raw, ai, useAI, isNote) {
        db.push({
            id: Date.now(),
            txt: useAI ? ai : raw,
            mirror: ai ? (useAI ? raw : ai) : null,
            isNote: isNote,
            time: new Date().toLocaleString()
        });
        localStorage.setItem('WT_DUAL_148', JSON.stringify(db));
        document.getElementById('statusBox').value = '';
        document.getElementById('topDrawer').classList.remove('open');
        render();
    }

    function mediaLog(type) { save(`[${type.toUpperCase()} ARTIFACT ATTACHED]`, null, false, false); }

    function render() {
        const container = document.getElementById('timeline'); container.innerHTML = '';
        const showNotes = document.getElementById('noteToggle').checked;
        [...db].reverse().forEach(item => {
            if(item.isNote !== showNotes) return;
            const card = document.createElement('div');
            card.className = `entry-card ${item.isNote ? 'note-card' : ''}`;
            card.innerHTML = `<div class="stamp">${item.time}</div>
                <div style="font-weight:700; line-height:1.4;">${item.txt}</div>
                ${item.mirror ? '<div class="dual-badge">DUAL ARTIFACT SECURED</div>' : ''}`;
            container.appendChild(card);
        });
    }
    window.onload = render;
</script>
</body>
</html>
