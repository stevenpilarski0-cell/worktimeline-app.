<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 36px; --round-inner: 22px; --round-pill: 999px;
            --mac-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); }
        
        /* THE APP CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); }

        /* HEADER & LOGO (Briefcase with Handle + Spine + 3 Dots) */
        .header { padding: 20px; border-bottom: 1px solid var(--platinum); background: white; text-align: center; flex-shrink: 0; }
        .briefcase-logo { position: relative; width: 50px; height: 34px; border: 3.5px solid var(--gray-dark); border-radius: 8px; margin: 0 auto; }
        .briefcase-handle { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 18px; height: 7px; border: 3.5px solid var(--gray-dark); border-bottom: none; border-radius: 4px 4px 0 0; }
        .teal-spine { position: absolute; top: 55%; left: -12px; right: -12px; height: 3.5px; background: var(--teal); border-radius: 2px; }
        .teal-dots { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 3px; }
        .dot { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; border: 1px solid white; }
