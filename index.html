<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline - Secure Log</title>
    <style>
        /* Mac-like Minimalist Base */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Clean Gray Container with Rounded Corners */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
            color: #1d1d1f;
        }

        p {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 24px;
        }

        /* Text Input Area */
        textarea {
            width: 100%;
            height: 120px;
            padding: 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #008080;
            background-color: #ffffff;
        }

        /* Teal Primary Button */
        button {
            width: 100%;
            background-color: #008080;
            color: white;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            margin-top: 24px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #006666;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Status Text */
        #statusMsg {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WorkTimeline Engine</h2>
    <p>Enter incident details to log a verified timeline entry.</p>

    <!-- Subtly updated placeholder to reflect the internal validation system -->
    <textarea id="logInput" placeholder="Incident notes, witness statements, or timeline details for Chromatic Validation..."></textarea>
    
    <button onclick="transmitLog()" id="transmitBtn">Transmit to Clio Secure Core</button>
    
    <div id="statusMsg"></div>
</div>

<script>
    // 1. PAGE LOAD LOGIC: Restore data and auto-transmit
    document.addEventListener('DOMContentLoaded', () => {
        const savedLog = localStorage.getItem('pendingWorkTimelineLog');
        
        if (savedLog) {
            // Restore the text the user typed
            document.getElementById('logInput').value = savedLog;
            
            // Clean up the browser's storage
            localStorage.removeItem('pendingWorkTimelineLog'); 
            
            // AUTOMATION: Immediately trigger the transmission process again
            // Now that they are authenticated, this will successfully hit the backend
            transmitLog(); 
        }
    });

    // 2. TRANSMIT LOGIC: Handle the API call and save data if needed
    async function transmitLog() {
        const logInput = document.getElementById('logInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const transmitBtn = document.getElementById('transmitBtn');

        // Validation check before attempting network request
        if (!logInput) {
            statusMsg.textContent = "Please enter log details before transmitting.";
            statusMsg.style.color = "#e30000";
            return;
        }

        // Lock button and show processing status to prevent double-clicks
        transmitBtn.disabled = true;
        transmitBtn.style.opacity = '0.7';
        statusMsg.textContent = "Negotiating Secure Handshake...";
        statusMsg.style.color = "#86868b";

        try {
            // Target the Vercel serverless function
            const response = await fetch('/api/sync', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ logText: logInput })
            });

            const data = await response.json();

            // Intercept 401: Save text and reroute to Clio Gateway
            if (response.status === 401 && data.error === 'AUTH_REQUIRED') {
                statusMsg.textContent = "Clearance required. Rerouting to authorization gate...";
                statusMsg.style.color = "#008080";
                
                // Save the typed text to the browser's memory
                localStorage.setItem('pendingWorkTimelineLog', logInput);
                
                // Drop the user into the CORRECT Clio authorization screen
                window.location.href = data.url; 
            } 
            // Handle successful backend transmission
            else if (response.ok) {
                statusMsg.textContent = "Transmission Successful. Log secured in Clio.";
                statusMsg.style.color = "#008080";
                document.getElementById('logInput').value = ''; // Clear text area on success
            } 
            // Catch expected backend errors
            else {
                statusMsg.textContent = "Server Error: " + (data.error || "Payload rejected.");
                statusMsg.style.color = "#e30000";
            }
        } catch (error) {
            // Catch unexpected network failures
            statusMsg.textContent = "Network Error: Could not connect to gateway.";
            statusMsg.style.color = "#e30000";
            console.error("Fetch error details:", error);
        } finally {
            // Unlock button regardless of success or failure
            transmitBtn.disabled = false;
            transmitBtn.style.opacity = '1';
        }
    }
</script>

</body>
</html>
