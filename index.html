<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline - Chronology Control</title>
    <style>
        /* Modern Apple-style slate & teal design */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-top: 0;
            color: #1d1d1f;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #86868b;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fbfbfd;
            font-family: inherit;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #008080; /* Teal focus */
            background-color: #ffffff;
        }
        .btn-sync {
            background-color: #008080;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-sync:hover {
            background-color: #006666;
        }
        .status-banner {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .success { background-color: #e6f2f2; color: #008080; border: 1px solid #008080; }
        .error { background-color: #ffebe9; color: #ff3b30; border: 1px solid #ff3b30; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Transmit to Firm Infrastructure</h2>
    
    <div class="form-group">
        <label for="matterId">Clio Matter ID</label>
        <input type="text" id="matterId" placeholder="e.g., 123456789">
    </div>

    <div class="form-group">
        <label for="logText">Contemporaneous Log Content</label>
        <textarea id="logText" placeholder="Enter the verified, structured chronology statements here..."></textarea>
    </div>

    <button id="syncBtn" class="btn-sync">Sync to Firm File</button>

    <div id="banner" class="status-banner"></div>
</div>

<script>
    document.getElementById('syncBtn').addEventListener('click', async () => {
        const matterId = document.getElementById('matterId').value;
        const logText = document.getElementById('logText').value;
        const banner = document.getElementById('banner');

        if (!matterId || !logText) {
            showBanner('Please fill out both the Matter ID and the Log Content.', 'error');
            return;
        }

        // For testing, mock an active session token. 
        // In full production, your backend session will handle this silently.
        const mockToken = 'YOUR_ACTIVE_CLIO_ACCESS_TOKEN';

        showBanner('Packaging and validating payload...', 'success');

        try {
            // Pointing directly to your native Vercel serverless endpoint
            const response = await fetch('/api/sync', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    matterId: matterId,
                    logText: logText,
                    timestamp: new Date().toISOString(),
                    referenceId: 'WT-' + Math.floor(1000 + Math.random() * 9000),
                    accessToken: mockToken
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showBanner(`Success! Transmitted beautifully. Clio Note ID: ${result.clio_note_id}`, 'success');
            } else {
                throw new Error(result.error || 'Transmission failure');
            }

        } catch (err) {
            showBanner(`Sync Failed: ${err.message}`, 'error');
        }
    });

    function showBanner(message, type) {
        banner.textContent = message;
        banner.className = `status-banner ${type}`;
        banner.style.display = 'block';
    }
</script>

</body>
</html>
