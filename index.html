<style>
    /* New Reset Button Style */
    .reset-btn {
        background: none;
        border: 1.5px solid var(--gray-light);
        color: #94a3b8;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
        align-self: center;
        margin-bottom: 20px;
        transition: 0.3s;
    }
    .reset-btn:hover {
        background: #fff5f5;
        color: #e74c3c;
        border-color: #e74c3c;
    }
</style>

<button class="reset-btn" onclick="safeReset()">RESET SESSION</button>

<script>
    function safeReset() {
        const confirmClear = confirm("⚠️ WARNING: This will clear your current timeline. This cannot be undone. Are you sure?");
        if (confirmClear) {
            document.getElementById('timelineList').innerHTML = '';
            entryCount = 0;
            document.getElementById('progressFill').style.height = '0%';
            // Optional: Reload the page to bring back the Legacy Quote
            location.reload(); 
        }
    }
</script>
