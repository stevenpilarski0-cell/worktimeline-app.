<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin' Intake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; 
            --teal-dark: #004d4d; 
            --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; 
            --clio-green: #2ecc71; 
            --mac-bg: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.98);
            --dark-silver: #7f8c8d;
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: #f8fafc; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            color: var(--gray-dark); 
            -webkit-font-smoothing: antialiased; 
        }

        /* --- HEADER & BRANDING --- */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 20px; 
            border-bottom: 1.5px solid var(--platinum); 
            background: white;
            z-index: 100;
        }

        .brand-group { display: flex; align-items: center; gap: 4px; } /* Tight gap to briefcase */
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        
        .sub-title { 
            font-weight: 900; color: var(--teal); font-size: 11px; 
            letter-spacing: -1.1px; /* Zero-space effect */
            margin: 0; padding: 0; display: inline-block;
        }

        .clio-status { display: flex; align-items: center; gap: 4px; margin-left: 6px; }
        .pulse-dot { width: 7px; height: 7px; background: var(--clio-green); border-radius: 50%; box-shadow: 0 0 8px var(--clio-green); }

        /* --- OVERLAYS --- */
        #consentOverlay, #syncOverlay, #legalOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(10px); 
            z-index: 200000; display: none; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; 
        }

        .modal-card { background: white; padding: 30px; border-radius: 32px; text-align: left; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); border-bottom: 8px solid var(--teal); width: 100%; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 16px; border-radius: 99px; font-weight: 900; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }

        /* --- SCALE POLICY BOX --- */
        .policy-box { background: var(--mac-bg); border-radius: 18px; padding: 15px; margin: 15px 0; font-size: 11px; border-left: 5px solid var(--teal); line-height: 1.4; }
        .scale-item { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 800; }
        .scale-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* --- BUTTONS & DRAWERS --- */
        .draggable-btn { 
            position: absolute; z-index: 5000; touch-action: none; 
            width: 75px; height: 75px; border-radius: 22px; 
            color: white; font-weight: 900; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        #addBtn { background: var(--teal); right: 20px; top: 160px; font-size: 32px; }
        #syncBtn { background: #0076CE; right: 20px; top: 250px; }

        #utilityDrawer { background: var(--glass); border-bottom: 2px solid var(--platinum); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .drawer-content { padding: 15px 20px; }
        .template-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .template-chip { background: white; border: 2px solid var(--teal); padding: 6px 14px; border-radius: 12px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }

        #statusBox { width: 100%; height: 110px; padding: 15px; border-radius: 20px; border: 2px solid var(--platinum); background: #fdfdfd; font-family: inherit; font-weight: 700; resize: none; outline: none; box-sizing: border-box; }

        /* Mac Style Media Bar */
        .mac-media-bar { display: flex; justify-content: space-around; margin-top: 15px; background: var(--mac-bg); padding: 12px; border-radius: 24px; }
        .media-icon { background: white; width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.04); cursor: pointer; }

        /* --- TIMELINE ENTRIES & PULSE SCALE --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px; background: #fafbfc; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 6px solid var(--platinum); transition: 0.3s; }
        
        .pulse-critical { border-left: 14px solid var(--teal-dark) !important; background: rgba(0, 77, 77, 0.05) !important; animation: heavy-pulse 1.5s infinite; }
        .pulse-warning { border-left: 10px solid var(--teal) !important; animation: light-pulse 2.5s infinite; }

        @keyframes heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0.6); } 70% { box-shadow: 0 0 0 20px rgba(0, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0); } }
        @keyframes light-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.3); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        .ghost-active #timelineContainer { filter: blur(20px); opacity: 0.2; pointer-events: none; }
        .drag-handle-zone { width: 100%; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 40px; height: 5px; background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body id="appBody">

<div id="consentOverlay">
    <div class="modal-card">
        <h2 style="color:var(--teal); margin-top:0;">AI Insight Detected</h2>
        <p id="consentMessage" style="font-size:14px; font-weight:700; line-height:1.4;"></p>
        <div class="policy-box">
            <strong>INTAKE POLICY & SCALE:</strong> Patterns are cross-referenced with BC Labor Statutes (ESA/WCB).
            <div class="scale-item"><div class="scale-dot" style="background:var(--teal-dark);"></div> Tier 3: Immediate Job Loss Risk</div>
            <div class="scale-item"><div class="scale-dot" style="background:var(--teal);"></div> Tier 2: Employment Warning/Hazard</div>
            <div class="scale-item"><div class="scale-dot" style="background:var(--platinum);"></div> Tier 1: General Record Entry</div>
        </div>
        <button class="modal-btn" onclick="confirmEntry(true)">YES, USE ON TIMELINE</button>
        <button class="modal-btn" style="background:var(--dark-silver); margin-top:10px;" onclick="confirmEntry(false)">NO, DISCARD</button>
    </div>
</div>

<header class="header">
    <div class="brand-group">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="13.5" r="1.2" fill="var(--teal)"/>
            <circle cx="12" cy="13.5" r="1.2" fill="var(--teal)"/>
            <circle cx="16" cy="13.5" r="1.2" fill="var(--teal)"/>
            <path d="M6 13.5H18" stroke="var(--teal)" stroke-width="0.8" stroke-dasharray="2 2"/>
        </svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <div style="display:flex; align-items:center;">
                <span class="sub-title">TAKIN'INTAKE</span>
                <div class="clio-status">
                    <div class="pulse-dot"></div>
                    <span style="font-size: 7px; font-weight: 900; color: var(--clio-green);">CLIO READY</span>
                </div>
            </div>
        </div>
    </div>
    <div style="text-align:right;">
        <label style="position:relative; width:34px; height:18px; display:inline-block;"><input type="checkbox" onchange="toggleGhost(this)" style="opacity:0; width:0; height:0;"><span style="position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#e2e8f0; transition:.4s; border-radius:30px;"></span></label>
        <div style="font-size:7px; font-weight:900; color:var(--teal);">GHOST</div>
    </div>
</header>

<div class="app-container" style="display:flex; flex-direction:column; height:100dvh;">
    
    <button id="addBtn" class="draggable-btn" onclick="submitEntry()">+</button>
    <button id="syncBtn" class="draggable-btn" onclick="alert('Sending to Cohere Bridge...')">DIAGNOSTIC<br>REPORT</button>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <div class="template-row">
                <div class="template-chip" onclick="applyTemplate('WCB')">WCB INJURY</div>
                <div class="template-chip" onclick="applyTemplate('WITNESS')">WITNESS STATEMENT</div>
                <div class="template-chip" onclick="applyTemplate('EVIDENCE')">EVIDENCE LOG</div>
                <div class="template-chip" onclick="applyTemplate('SETTING')">SETTING</div>
            </div>
            <textarea id="statusBox" placeholder="Start your fresh intake record..."></textarea>
            <div class="mac-media-bar">
                <div class="media-icon"><svg width="24" height="24" fill="var(--teal)" viewBox="0 0 24 24"><path d="M12 9a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z"/><path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 6.001c0-.414.336-.75.75-.75h16.5a.75.75 0 01.75.75v12a.75.75 0 01-.75.75H3.75a.75.75 0 01-.75-.75v-12z" clip-rule="evenodd"/></svg></div>
                <div class="media-icon"><svg width="24" height="24" fill="var(--teal)" viewBox="0 0 24 24"><path d="M8.25 4.5a3.75 3.75 0 117.5 0v8.25a3.75 3.75 0 11-7.5 0V4.5z"/><path d="M6 10.5a.75.75 0 01.75.75 5.25 5.25 0 1010.5 0 .75.75 0 011.5 0 6.75 6.75 0 11-13.5 0 .75.75 0 01.75-.75z"/></svg></div>
                <div class="media-icon"><svg width="24" height="24" fill="var(--teal)" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0016.5 9h-1.875a1.875 1.875 0 01-1.875-1.875V5.25A3.75 3.75 0 009 1.5H5.625z" clip-rule="evenodd"/></svg></div>
            </div>
        </div>
        <div class="drag-handle-zone" onclick="toggleDrawer()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>
</div>

<script>
    let isDrawerOpen = true;
    let pendingEntry = null;
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];

    const SEVERITY_SCALE = {
        CRITICAL: { regex: /fired|dismissal|terminated|layoff|quit|constructive/i, score: 3, class: 'pulse-critical', tag: 'EMPLOYMENT AT RISK' },
        WARNING: { regex: /warning|discipline|harass|unsafe|hazard|threat/i, score: 2, class: 'pulse-warning', tag: 'INTAKE AT RISK' },
        GENERAL: { regex: /pay|hours|overtime|meeting|witness/i, score: 1, class: '', tag: 'GENERAL RECORD' }
    };

    window.onload = () => { refreshDisplay(); };

    function toggleDrawer() {
        const d = document.getElementById('utilityDrawer');
        const c = document.getElementById('drawerContent');
        d.style.transform = isDrawerOpen ? `translateY(-${c.offsetHeight}px)` : `translateY(0)`;
        isDrawerOpen = !isDrawerOpen;
    }

    function applyTemplate(type) {
        const t = {
            'WCB': '--- WCB INJURY REPORT ---\nDATE:\nINJURY:\nOFA ATTENDANT:',
            'WITNESS': '--- WITNESS STATEMENT ---\nNAME:\nCONTACT:\nOBSERVATION:',
            'EVIDENCE': '--- EVIDENCE LOG ---\nITEM:\nLOCATION:\nRELEVANCE:',
            'SETTING': '--- SETTING ---\nLOCATION:\nATMOSPHERE:\nHAZARDS:'
        };
        document.getElementById('statusBox').value = t[type];
        document.getElementById('statusBox').focus();
    }

    function getSeverity(text) {
        if (SEVERITY_SCALE.CRITICAL.regex.test(text)) return SEVERITY_SCALE.CRITICAL;
        if (SEVERITY_SCALE.WARNING.regex.test(text)) return SEVERITY_SCALE.WARNING;
        if (SEVERITY_SCALE.GENERAL.regex.test(text)) return SEVERITY_SCALE.GENERAL;
        return { score: 0, class: '', tag: 'INTAKE RECORD' };
    }

    function submitEntry() {
        const b = document.getElementById('statusBox');
        if(!b.value.trim()) return;
        
        navigator.geolocation.getCurrentPosition(pos => {
            const severity = getSeverity(b.value);
            pendingEntry = {
                id: Date.now(), grit: b.value, stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`,
                pulseClass: severity.class, tag: severity.tag, score: severity.score
            };

            if (severity.score >= 2) {
                document.getElementById('consentMessage').innerText = `AI detected an "${severity.tag}" pattern. Do you want to use this statutory insight on your timeline?`;
                document.getElementById('consentOverlay').style.display = 'flex';
            } else {
                finalizeEntry();
            }
        });
    }

    function confirmEntry(choice) {
        if (choice) finalizeEntry();
        else { pendingEntry = null; document.getElementById('statusBox').value = ''; }
        document.getElementById('consentOverlay').style.display = 'none';
    }

    function finalizeEntry() {
        timelineVault.push(pendingEntry);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
        document.getElementById('statusBox').value = '';
        pendingEntry = null;
        refreshDisplay();
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList');
        list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry ' + item.pulseClass;
            div.innerHTML = `
                <div style="font-size:9px; font-weight:900; color:var(--teal); margin-bottom:4px;">📍 ${item.gps} | ${item.stamp}</div>
                <div style="font-size:8px; font-weight:900; color:var(--teal-dark); margin-bottom:8px; text-transform:uppercase;">${item.tag}</div>
                <p style="font-size:14px; font-weight:700; margin:0; line-height:1.5; white-space:pre-wrap;">${item.grit}</p>
            `;
            list.appendChild(div);
        });
    }

    function toggleGhost(cb) { document.getElementById('appBody').classList.toggle('ghost-active', cb.checked); }

    function makeMovable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.ontouchstart = (e) => {
            p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
            document.ontouchmove = (e) => {
                p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY;
                p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; el.style.right = "auto";
            };
            document.ontouchend = () => { document.ontouchmove = null; };
        };
    }
    makeMovable(document.getElementById('addBtn')); makeMovable(document.getElementById('syncBtn'));
</script>
</body>
</html>
