<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Final Master Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        :root { --teal: #008080; --teal-soft: #e0f2f1; --danger: #e74c3c; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 10px; transition: filter 0.3s ease; }
        
        /* GHOST MODE (PRIVACY) */
        body.ghost-mode #mainContent { filter: blur(25px); pointer-events: none; }
        
        /* CHRON NOTES VIEW (LAWYER MODE) */
        body.chron-view .entry { border-left: 2px solid #ccc; border-radius: 0; margin-bottom: 0; padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; box-shadow: none; }
        body.chron-view .tamper-seal { opacity: 0.6; font-size: 7px; }
        body.chron-view .hazard-flag { border: 1px solid #000; color: #000; font-size: 8px; background: none; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 35px; min-height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* SPLASH & SKIP */
        .splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--platinum); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; box-sizing: border-box; transition: opacity 0.8s ease; }
        .skip-btn { position: absolute; bottom: 40px; background: rgba(0,0,0,0.2); border: 1.5px solid var(--gray-dark); padding: 12px 24px; border-radius: 50px; font-weight: 900; font-size: 13px; cursor: pointer; color: var(--gray-dark); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2px solid var(--platinum); }
        .toggle-group { display: flex; gap: 15px; }
        
        /* SWITCHES */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        #statusBox { width: 100%; height: 100px; padding: 15px; border-radius: 15px; border: 2px solid var(--platinum); box-sizing: border-box; font-family: inherit; margin-bottom: 10px; font-size: 16px; outline: none; }
        .entry { background: white; border: 1.5px solid var(--platinum); padding: 15px; border-radius: 20px; margin-bottom: 10px; border-left: 5px solid var(--teal); position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .hazard-flag { color: var(--danger); font-weight: 900; font-size: 10px; border: 1px solid var(--danger); padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; display: inline-block; background: #fff5f5; }
        .sync-btn { background: var(--gray-dark); color: white; border: none; padding: 20px; border-radius: 25px; width: 100%; font-weight: 900; cursor: pointer; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="splashScreen" class="splash-screen">
        <h1 id="story-text" style="font-size: 20px; font-weight: 800; color: var(--gray-dark); line-height: 1.4;">Initiating Freedom...</h1>
        <button class="skip-btn" onclick="skipIntro()">SKIP INTRO ➔</button>
    </div>

    <header class="header">
        <div><h1 style="color: var(--teal); margin:0; font-size: 16px; font-weight: 900;">WorkTimeline™</h1></div>
        <div class="toggle-group">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleChron()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900; margin-top:2px;">CHRON</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900; margin-top:2px;">GHOST</div></div>
        </div>
    </header>

    <div id="mainContent" style="padding: 20px; flex-grow: 1; display: flex; flex-direction: column;">
        <textarea id="statusBox" placeholder="Describe the event... (e.g. 'Hazard on site')"></textarea>
        <button onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:15px; font-weight:900; cursor: pointer;">Add Entry & Secure</button>
        
        <div id="timeline" style="margin-top: 20px; overflow-y: auto; flex-grow: 1;"></div>
        
        <button id="lockBtn" class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
    </div>
</div>

<script>
    const introTexts = [
        "Feel invisible?", "The system is grey.", "Trapped in the cycle?", 
        "But the sky is Teal.", "WorkTimeline™ gives you a voice.",
        "Verifiable Justice.", "Secure. Private. Yours."
    ];

    function skipIntro() {
        const splash = document.getElementById('splashScreen');
        splash.style.opacity = 0;
        setTimeout(() => splash.style.display = 'none', 800);
    }

    function togglePrivacy() { document.body.classList.toggle('ghost-mode'); }
    function toggleChron() { document.body.classList.toggle('chron-view'); }

    function submitEntry() {
        const box = document.getElementById('statusBox');
        const text = box.value.trim();
        if(!text) return;

        // HAZARD RECOGNITION
        const hazardKeywords = ['hazard', 'danger', 'injury', 'hospital', 'hurt', 'accident'];
        let flag = hazardKeywords.some(w => text.toLowerCase().includes(w)) ? '<span class="hazard-flag">⚠️ HAZARD DETECTED</span>' : '';
        
        // TAMPER SEAL GENERATION
        const id = "WT-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-SECURED";

        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
            ${flag}
            <p style="margin:0; font-size:14px; font-weight:600; line-height: 1.4;">${text}</p>
            <span class="tamper-seal" style="font-size:8px; color:#aaa; display: block; margin-top: 8px;">🔒 SEAL: ${id} | ${new Date().toLocaleTimeString()}</span>
        `;
        document.getElementById('timeline').prepend(div);
        box.value = '';
    }

    function syncToClio() {
        document.getElementById('lockBtn').innerText = "Opening Clio Grow Canada...";
        // CLIO GROW CANADA HANDSHAKE
        const clioClientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
        const redirectUri = "https://worktimeline-app.vercel.app/index.html";
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=${clioClientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=leads_write%20contacts_write`;
    }

    window.onload = () => {
        const textEl = document.getElementById('story-text');
        let i = 0;
        const runIntro = () => {
            if(i < introTexts.length) {
                textEl.style.opacity = 0;
                setTimeout(() => { 
                    textEl.innerText = introTexts[i++]; 
                    textEl.style.opacity = 1; 
                    setTimeout(runIntro, 2400); 
                }, 500);
            } else { skipIntro(); }
        };
        runIntro();
    };
</script>
</body>
</html>
