<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline™ | Client Dashboard</title>
    <style>
        /* Base Styles & Platinum-to-Teal Gradient */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #E5E4E2 0%, #008080 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 414px; /* iPhone size */
            background: #f8f9f9;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Header Styles from 1000026040.jpg */
        header {
            padding: 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .logo { color: #008080; font-weight: bold; font-size: 20px; }
        
        .toggles { display: flex; gap: 15px; font-size: 12px; font-weight: bold; color: #666; }
        .toggle-item { display: flex; align-items: center; gap: 5px; }

        /* Intake Card Section */
        .content { padding: 20px; flex: 1; }

        .intake-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .intake-card h3 { margin: 0 0 15px 0; font-size: 18px; color: #333; }

        .tags { display: flex; gap: 8px; margin-bottom: 20px; }
        .tag { background: #e0e6e6; color: #008080; padding: 4px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: linear-gradient(135deg, #bdc3c7, #95a5a6);
            padding: 15px;
            border-radius: 15px;
        }

        .action-btn {
            background: #fdfdfd;
            border: none;
            border-radius: 12px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: bold;
            color: #2D3E50;
            cursor: pointer;
        }

        /* Timeline Feed */
        .timeline { position: relative; padding-left: 20px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ddd;
        }

        .pulse-card {
            background: #ff7675; /* Red Pulse color from 1000026040.jpg */
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .pulse-card.blue { background: #74b9ff; }

        .pulse-card::after {
            content: '';
            position: absolute;
            left: -20px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: inherit;
            border-radius: 50%;
            border: 2px solid white;
        }

        .pulse-card h4 { margin: 0; font-size: 14px; }
        .pulse-card p { margin: 5px 0; font-size: 12px; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">WorkTimeline</div>
            <div class="toggles">
                <div class="toggle-item">Stealth ◯</div>
                <div class="toggle-item">Notes ◯</div>
            </div>
        </header>

        <div class="content">
            <!-- Intake Card -->
            <div class="intake-card">
                <h3>Intake card</h3>
                <div class="tags">
                    <span class="tag">first aid</span>
                    <span class="tag">honest</span>
                </div>
                
                <div class="action-grid">
                    <button class="action-btn"><span>📷</span>Camera</button>
                    <button class="action-btn"><span>🎤</span>Mic</button>
                    <button class="action-btn"><span>📄</span>Document</button>
                </div>
            </div>

            <!-- Timeline Feed -->
            <div class="timeline">
                <div class="pulse-card">
                    <h4>Pulses: 1926 + ago</h4>
                    <p><strong>Prohibited Action:</strong> (interuitment processes)</p>
                    <div class="tags">
                        <span class="tag" style="background:rgba(255,255,255,0.3); color:white;">First Aid</span>
                    </div>
                </div>

                <div class="pulse-card blue">
                    <h4>Sample 2020 + ago</h4>
                    <p>BCHRT patterns patterns. Immoveable prodirent cotification.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
