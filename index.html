<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Vault Logic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --platinum: #e2e8f0; --clio-blue: #0076CE; --clio-green: #2ecc71; --danger: #e74c3c; --notes-gold: #f1c40f; }
        
        body { font-family: 'Nunito', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s; }
        .notes-active { background: #fef9e7 !important; }

        /* --- HEADER & VAULT SWITCH --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1.5px solid var(--platinum); background: white; z-index: 1000; }
        .vault-toggle-container { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--teal); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--notes-gold); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- UI ELEMENTS --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 100px; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--teal); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .entry.note-item { border-left-color: var(--notes-gold); }
        
        .bottom-dock { background: white; border-top: 2px solid var(--platinum); padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; z-index: 10000; }
        .dock-btn { border: none; border-radius: 16px; padding: 12px 5px; font-weight: 900; font-size: 10px; color: white; cursor: pointer; text-align: center; text-transform: uppercase; }
        .btn-fresh { background: var(--danger); }
        .btn-export { background: var(--teal); }
        .btn-clio { background: var(--clio-blue); }

        #addBtn { position: absolute; z-index: 9000; width: 75px; height: 75px; border-radius: 22px; background: var(--teal); color: white; font-weight: 900; font-size: 35px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); right: 20px; top: 140px; }
        .notes-btn-active { background: var(--notes-gold) !important; }

        #statusBox { width: 100%; height: 100px; padding: 15px; border-radius: 20px; border: 2px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }
    </style>
</head>
<body id="appBody">

<header class="header">
    <div style="display:flex; align-items:center; gap:8px;">
        <svg width="35" height="35" viewBox="0 0 24 24" fill="none"><path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2"/></svg>
        <div>
            <div style="font-weight:900; color:var(--teal); font-size:18px;">WorkTimeline™</div>
            <div id="vaultLabel" style="font-size:9px; font-weight:900; color:var(--teal);">TIMELINE ACTIVE</div>
        </div>
    </div>
    <div class="vault-toggle-container">
        <label class="switch">
            <input type="checkbox" onchange="toggleVault(this)">
            <span class="slider"></span>
        </label>
        <span style="font-size:7px; font-weight:900;">SWITCH TO NOTES</span>
    </div>
</header>

<div style="padding:15px; background:white; border-bottom:1.5px solid var(--platinum);">
    <textarea id="statusBox" placeholder="Start new intake record..."></textarea>
</div>

<button id="addBtn" onclick="submitEntry()">+</button>

<div id="timelineContainer">
    <div id="displayList"></div>
</div>

<footer class="bottom-dock">
    <button class="dock-btn btn-fresh" onclick="confirmReset()">WIPE ALL</button>
    <button class="dock-btn btn-export" onclick="alert('Exporting Vault...')">EXPORT</button>
    <button class="dock-btn btn-clio" onclick="alert('Syncing...')">SYNC CLIO</button>
</footer>

<script>
    let activeVault = "TIMELINE"; // Default vault
    const timelineData = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    const notesData = JSON.parse(localStorage.getItem('wt_notes')) || [];

    window.onload = () => { refreshDisplay(); };

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('notes-active', cb.checked);
        document.getElementById('addBtn').classList.toggle('notes-btn-active', cb.checked);
        document.getElementById('vaultLabel').innerText = `${activeVault} ACTIVE`;
        document.getElementById('vaultLabel').style.color = cb.checked ? 'var(--notes-gold)' : 'var(--teal)';
        refreshDisplay();
    }

    function submitEntry() {
        const b = document.getElementById('statusBox'); 
        if(!b.value.trim()) return;
        
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = {
                id: Date.now(),
                content: b.value,
                stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`
            };

            if(activeVault === "TIMELINE") {
                timelineData.push(entry);
                localStorage.setItem('wt_timeline', JSON.stringify(timelineData));
            } else {
                notesData.push(entry);
                localStorage.setItem('wt_notes', JSON.stringify(notesData));
            }

            b.value = '';
            refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); 
        list.innerHTML = '';
        const dataToShow = activeVault === "TIMELINE" ? timelineData : notesData;

        [...dataToShow].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry' + (activeVault === "NOTES" ? ' note-item' : '');
            div.innerHTML = `
                <div style="font-size:9px; font-weight:900; color:var(--dark-silver);">📍 ${item.gps} | ${item.stamp}</div>
                <p style="font-size:14px; font-weight:700; margin:5px 0 0; white-space:pre-wrap;">${item.content}</p>
            `;
            list.appendChild(div);
        });
    }

    function confirmReset() {
        if(confirm(`Wipe the entire ${activeVault} vault?`)) {
            if(activeVault === "TIMELINE") { timelineData.length = 0; localStorage.removeItem('wt_timeline'); }
            else { notesData.length = 0; localStorage.removeItem('wt_notes'); }
            location.reload();
        }
    }
</script>

</body>
</html>
