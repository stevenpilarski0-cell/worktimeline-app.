<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timeline™ Master | Signature v23</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --amber: #f59e0b;
            --slate: #1e293b;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            --radius-xl: 40px;
            --radius-lg: 28px;
            --radius-md: 20px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #f1f5f9; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1px solid var(--gray-border); box-sizing: border-box; overflow: hidden; transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1); }

        /* BIRD'S EYE VIEW */
        .birds-eye-active { transform: scale(0.5) translateY(-80px); border-radius: 50px; box-shadow: 0 80px 150px rgba(0,0,0,0.4); }

        /* MENU (SIDEBAR) */
        #sideBar { position: absolute; left: -300px; top: 0; width: 300px; height: 100%; background: #f8fafc; z-index: 10000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); border-right: 1px solid var(--gray-border); box-shadow: 25px 0 60px rgba(0,0,0,0.12); padding: 40px 25px; box-sizing: border-box; overflow-y: auto; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 18px 20px; margin-bottom: 12px; border-radius: var(--radius-md); background: white; font-weight: 800; font-size: 12px; color: var(--teal); display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1.5px solid #edf2f7; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .sidebar-item:active { transform: scale(0.97); background: #f1f5f9; }

        /* NAVIGATION */
        .domain-nav { display: flex; background: #f8fafc; border-bottom: 1.5px solid var(--gray-border); padding: 12px; gap: 10px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 14px 0; border-radius: 18px; font-size: 10px; font-weight: 900; color: #64748b; background: transparent; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; transition: 0.4s; }

        /* HEADER */
        .header { padding: 20px 25px; border-bottom: 1.5px solid var(--gray-border); background: white; z-index: 4000; }
        .main-title { font-weight: 900; font-size: 19px; color: var(--active-brand); letter-spacing: -1.2px; display: flex; align-items: center; }
        .clio-pulse { width: 9px; height: 9px; background-color: var(--clio-green); border-radius: 50%; margin-left: 10px; animation: pulse-green 2.5s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.8); } 70% { box-shadow: 0 0 0 12px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* UTILITY DRAWER */
        #utilityDrawer { position: absolute; top: 145px; width: 100%; background: white; border-bottom: 3px solid var(--gray-border); z-index: 3500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 55px)); border-radius: 0 0 var(--radius-xl) var(--radius-xl); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .handle { width: 100%; height: 55px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 50px; height: 6px; background: #cbd5e0; border-radius: 20px; }

        /* TEMPLATE BAR */
        #templateBar { display: flex; gap: 12px; overflow-x: auto; padding: 5px 25px 25px; scrollbar-width: none; }
        .template-chip { border: 2px solid var(--gray-border); padding: 12px 22px; border-radius: 50px; font-size: 10px; font-weight: 900; color: #4a5568; background: white; white-space: nowrap; cursor: pointer; transition: 0.2s; }

        /* TIMELINE TRACK */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 45px 25px 250px 70px; display: flex; flex-direction: column; gap: 50px; scrollbar-width: none; position: relative; z-index: 5; }
        #linearTrack { position: absolute; left: 28px; top: 180px; bottom: 150px; width: 6px; background: rgba(0, 128, 128, 0.1); border-radius: 20px; z-index: 1; }
        .track-node { position: absolute; left: -14px; width: 34px; height: 34px; background: white; border: 4px solid var(--active-brand); border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; transition: 0.3s; }

        /* DOCKS */
        .action-dock-right { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 25px; z-index: 6000; }
        .action-dock-left { position: absolute; bottom: 40px; left: 30px; z-index: 6000; }
        
        #addBtn { width: 80px; height: 80px; background: linear-gradient(135deg, var(--active-brand), #004d4d); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); color: white; font-size: 42px; font-weight: 900; cursor: pointer; }
        #syncBtn { width: 100px; height: 100px; background: linear-gradient(135deg, var(--clio-blue), #004a80); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 11px; cursor: pointer; letter-spacing: 1px; }
        #eyeBtn { width: 75px; height: 75px; background: white; border: 2px solid var(--gray-border); border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #eyeBtn svg { width: 34px; height: 34px; stroke: #4a5568; fill: none; stroke-width: 2; }

        .bubble { padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); background: white; border: 1.5px solid #f1f5f9; font-weight: 600; font-size: 17px; line-height: 1.6; }
        textarea { width: 100%; height: 130px; border: 3px solid var(--gray-border); border-radius: var(--radius-lg); padding: 22px; font-size: 18px; outline: none; background: #fafafa; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        textarea:focus { border-color: var(--active-brand); background: white; }
    </style>
</head>
<body>

<div id="sideBar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;">
        <h2 style="font-weight: 900; color: var(--teal); font-size: 20px; margin: 0; letter-spacing: -1px;">MENU</h2>
        <div onclick="toggleSidebar()" style="cursor: pointer; opacity: 0.5;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="sidebar-item" onclick="emailTimeline()">✉️ DRAFT EMAIL (@)</div>
    <div class="sidebar-item" onclick="exportData()">💾 SAVE & EXPORT</div>
    
    <div style="margin: 30px 0 10px; font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px;">Case Law Repository</div>
    <div id="caseLawVault" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 12px; color: #64748b; font-style: italic; padding: 15px; border: 1.5px dashed #cbd5e0; border-radius: 15px;">Empty...</div>
    </div>

    <div class="sidebar-item" onclick="resetTimeline()" style="color: var(--rose); margin-top: 50px; border-color: var(--rose);">🗑️ RESET PLATFORM</div>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(50px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:30px;">
    <div class="modal-card" style="background:white; padding:60px 40px; border-radius:var(--radius-xl); text-align:center; max-width:380px; box-shadow: var(--mac-shadow); border: 1px solid var(--gray-border);">
        <div id="greetingDisplay" style="font-weight:900; font-size: 28px; color: var(--teal); letter-spacing: -1.5px; margin-bottom: 10px;">HELLO.</div>
        <p id="geoDisplay" style="font-weight:800; font-size: 13px; color: #94a3b8; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;">Detecting Location...</p>
        <p style="font-weight:600; color:#64748b; line-height:1.6; margin-bottom: 40px;">Your secure chronological truth engine. <br><b>No legal advice offered.</b></p>
        <button onclick="unlockApp()" style="border:none; padding:24px; border-radius:var(--radius-lg); width:100%; background:var(--teal); color:white; font-weight:900; text-transform:uppercase; cursor:pointer; font-size: 16px; letter-spacing: 1px;">Secure My Journal</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab" data-id="WORK" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" data-id="FAM" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" data-id="INJURY" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" data-id="PROPERTY" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer; padding: 5px;"><svg width="28" height="22" fill="none" stroke="var(--active-brand)" stroke-width="3.5"><line x1="0" y1="2" x2="28" y2="2"/><line x1="0" y1="11" x2="28" y2="11"/><line x1="0" y1="20" x2="28" y2="20"/></svg></div>
            <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            <button id="modeToggle" style="background:#f1f5f9; border:none; border-radius: 50px; font-size:9px; font-weight:900; padding:10px 16px; cursor:pointer;" onclick="toggleMode()">NOTES</button>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 25px;">
            <div id="templateBar"></div>
            <textarea id="statusBox" placeholder="Capturing the truth..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock-left">
        <button id="eyeBtn" onclick="toggleBirdsEye()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <div class="action-dock-right">
        <button id="addBtn" onclick="submitEntry()">+</button>
        <button id="syncBtn" onclick="clioHandshake()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>SYNC</button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v23')) || [];
    let sessionIds = [];
    let currentDomain = 'WORK';
    let currentMode = 'TIMELINE';
    let utilOpen = false;

    // PERSONALIZATION ENGINE
    function setGreeting() {
        const hour = new Date().getHours();
        let greet = "GOOD EVENING,";
        if (hour < 12) greet = "GOOD MORNING,";
        else if (hour < 18) greet = "GOOD AFTERNOON,";
        document.getElementById('greetingDisplay').innerText = greet;
        document.getElementById('geoDisplay').innerText = "LANGLEY TOWNSHIP, BC"; // Hardcoded for demo precision
    }

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: { 'LOCATION': 'LOC:\n', 'INCIDENT': 'EVENT:\n', 'WITNESS': 'WIT:\n' } },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: { 'VENUE': 'VENUE:\n', 'CUSTODY': 'TRANS:\n' } },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: { 'LOC': 'LOC:\n', 'WITNESS': 'WIT:\n', 'CLAIM': 'CLAIM:\n', 'HARM': 'HARM:\n' } },
        'PROPERTY': { color: '#1e293b', name: 'PropTimeline™', templates: { 'ADDR': 'ADDR:\n', 'FIX': 'FIX:\n' } }
    };

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 55px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleBirdsEye() { document.getElementById('mainApp').classList.toggle('birds-eye-active'); }
    function toggleMode() { currentMode = (currentMode === 'TIMELINE') ? 'NOTES' : 'TIMELINE'; document.getElementById('modeToggle').innerText = (currentMode === 'TIMELINE') ? 'NOTES' : 'TIMELINE'; refresh(); }

    function switchDomain(domain) {
        currentDomain = domain;
        const config = domainConfig[domain];
        document.documentElement.style.setProperty('--active-brand', config.color);
        document.getElementById('brandTitle').innerHTML = `${config.name} <div class="clio-pulse"></div>`;
        document.querySelectorAll('.domain-tab').forEach(t => { 
            t.style.color = (t.dataset.id === domain) ? config.color : '#64748b';
            t.style.background = (t.dataset.id === domain) ? 'white' : 'transparent';
        });
        const bar = document.getElementById('templateBar'); bar.innerHTML = '';
        Object.keys(config.templates).forEach(k => {
            const b = document.createElement('button'); b.className = 'template-chip'; b.innerText = k;
            b.onclick = () => { document.getElementById('statusBox').value += config.templates[k]; document.getElementById('statusBox').focus(); };
            bar.appendChild(b);
        });
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const id = Date.now();
        const stamp = `📍 LANGLEY, BC | ${new Date().toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true })}`;
        vault.push({ id, grit: text, domain: currentDomain, stamp, mode: currentMode });
        sessionIds.push(id);
        localStorage.setItem('platinum_v23', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain && i.mode === currentMode);
        filtered.reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 160 + 30) + 'px';
            if(sessionIds.includes(item.id)) {
                node.innerHTML = '✕'; node.style.borderColor = 'var(--rose)'; node.style.color = 'var(--rose)';
                node.onclick = () => { if(confirm("Correct record?")) { vault = vault.filter(v => v.id !== item.id); refresh(); } };
            } else {
                node.innerHTML = '✓';
            }
            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:12px;">${item.stamp}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function resetTimeline() { if(confirm("Complete Reset?")) { localStorage.clear(); location.reload(); } }
    function clioHandshake() { if(currentDomain === 'WORK') alert("Vaulting data to Clio Canada (ca.api.clio.com)..."); }
    function emailTimeline() { window.location.href = "mailto:?subject=Legal Record Export"; }
    function exportData() { alert("Secured Backup Exported."); }

    setGreeting();
    switchDomain('WORK');
</script>
</body>
</html>
