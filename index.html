<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timeline™ | Master Suite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; /* Dynamic Teal */
            --teal: #008080; 
            --rose: #e11d48;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            --silver-gray: #95a5a6; 
            --gray-bg: #e2e8f0; 
            --clio-green: #2ecc71; 
            --clio-blue: #0076CE;
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12); 
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; }

        /* DOMAIN NAV */
        .domain-nav { display: flex; background: #f8fafc; border-bottom: 1px solid var(--gray-border); padding: 5px; gap: 5px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 8px 0; border-radius: 12px; font-size: 8px; font-weight: 900; color: #64748b; background: transparent; transition: 0.3s; cursor: pointer; }
        .domain-tab.active { background: white; color: var(--active-brand); box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid var(--gray-border); }

        /* HEADER TRANSITION */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; position: relative; }
        .brand-text { display: flex; flex-direction: column; align-items: flex-start; }
        .main-title { font-weight: 900; font-size: 17px; display: flex; align-items: center; letter-spacing: -0.5px; transition: 0.5s; color: var(--active-brand); }
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; margin-left: 8px; animation: clio-throb 2s infinite; }
        
        /* THE STACK PULSE (DYNAMIC COLOR) */
        @keyframes stack-pulse { 
            0% { box-shadow: 0 0 0 0 var(--active-brand); opacity: 0.5; } 
            70% { box-shadow: 0 0 0 15px transparent; opacity: 0; } 
            100% { box-shadow: 0 0 0 0 transparent; opacity: 0; } 
        }

        /* DYNAMIC ELEMENTS */
        #addBtn { background: var(--active-brand); transition: 0.5s; }
        .bubble-back { background: var(--active-brand); transition: 0.5s; }
        .stack-inner.has-ai::after { animation: stack-pulse 2.5s infinite ease-in-out; background: var(--active-brand); }

        /* ALL OTHER EXISTING STYLES REMAIN SAME */
        .app-locked { filter: blur(35px); pointer-events: none; }
        #utilityDrawer { position: absolute; top: 100px; width: 100%; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 3500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; }
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: flex; flex-direction: column; gap: 25px; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stack-inner { position: relative; width: 85%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 15px; border-radius: 22px; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; }
        .bubble-front { background: #f1f1f1; border: 1px solid #e5e5e5; color: #1a202c; position: relative; z-index: 2; }
        .bubble-back { color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .draggable { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; border: none; box-shadow: var(--mac-shadow); touch-action: none; }
        #addBtn { width: 70px; height: 70px; font-size: 30px; top: 200px; right: 20px; }
        #syncBtn { width: 70px; height: 70px; background: var(--clio-blue); font-size: 8px; padding: 6px; top: 290px; right: 20px; text-align: center; }
        #overlaySystem { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 28px; box-shadow: var(--mac-shadow); width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 12px; cursor: pointer; font-size: 13px; }
        textarea { width: 100%; height: 85px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-size: 15px; outline: none; background: #fafafa; }
        .handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 35px; height: 4px; background: #cbd5e0; border-radius: 10px; }
        .template-chip { border: 1px solid var(--gray-border); padding: 8px 16px; border-radius: 50px; font-size: 10px; font-weight: 900; color: #4a5568; background: #f8fafc; cursor: pointer; }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card" id="modalContent">
        <h2 style="color: #1a202c; font-weight: 900; margin: 0; font-size: 18px; letter-spacing: -0.5px;">TIMELINE™ SECURE</h2>
        <div style="font-size: 13px; line-height: 1.5; color: #4a5568; margin: 15px 0; font-weight: 600;">Welcome to your multi-domain truth journal. <br><br><b>WorkTimeline™</b> is live and connected. Family, Injury, and Property are in offline prototype mode.</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">OPEN VAULT</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab active" onclick="switchDomain('WORK')">WORK</button>
        <button class="domain-tab" onclick="switchDomain('FAM')">FAMILY</button>
        <button class="domain-tab" onclick="switchDomain('INJURY')">INJURY</button>
        <button class="domain-tab" onclick="switchDomain('CIVIL')">CIVIL</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div class="brand-text">
                <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            </div>
            <div style="position:absolute; right:15px; display:flex; gap:4px;">
                <button onclick="refresh()" style="background:#f1f5f9; color:#475569; border:none; border-radius:20px; font-size:7px; font-weight:900; padding:6px 12px;">RELOAD</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px 15px 45px;">
            <div id="templateBar" style="display:flex; gap:6px; justify-content:center; margin-bottom: 15px;"></div>
            <textarea id="statusBox" placeholder="Documenting the grit..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>

    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable">SYNC TO CLIO</button>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline_master')) || [];
    let currentDomain = 'WORK';
    let utilOpen = false;

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: ['INCIDENT', 'INJURY', 'WITNESS'] },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: ['CUSTODY', 'VISIT', 'EXPENSE'] },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: ['PAIN', 'TREATMENT', 'WITNESS'] },
        'CIVIL': { color: '#8b5cf6', name: 'CivilTimeline™', templates: ['CONTRACT', 'BREACH', 'NOTICE'] }
    };

    function switchDomain(domain) {
        currentDomain = domain;
        const config = domainConfig[domain];
        
        // Update Theme
        document.documentElement.style.setProperty('--active-brand', config.color);
        document.getElementById('brandTitle').innerHTML = `${config.name} <div class="clio-pulse"></div>`;
        
        // Update Tabs
        document.querySelectorAll('.domain-tab').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === domain);
        });

        // Update Templates
        const bar = document.getElementById('templateBar');
        bar.innerHTML = config.templates.map(t => `<button onclick="useTemplate('${t}')" class="template-chip">${t}</button>`).join('');
        
        // Update Sync Button
        const syncBtn = document.getElementById('syncBtn');
        if(domain === 'WORK') {
            syncBtn.style.opacity = '1';
            syncBtn.onclick = clioHandshake;
            syncBtn.innerText = "SYNC TO CLIO";
        } else {
            syncBtn.style.opacity = '0.4';
            syncBtn.onclick = () => alert(`${config.name} is in Offline Prototype Mode. Clio Handshake coming soon.`);
            syncBtn.innerText = "OFFLINE";
        }
        
        refresh();
    }

    function unlockApp() { document.getElementById('overlaySystem').style.display = 'none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }

    // THE CLIO HANDSHAKE (CANADIAN SANDBOX)
    async function clioHandshake() {
        if(vault.filter(i => i.domain === 'WORK').length === 0) return alert("No Work entries to sync.");
        
        // 1. OAUTH HANDSHAKE PLACEHOLDER
        console.log("Connecting to ca.api.clio.com/api/v4...");
        
        document.getElementById('modalContent').innerHTML = `
            <h3 style="color:var(--clio-blue);">CLIO SYNC LIVE</h3>
            <div style="font-size:12px; font-weight:600;">Vaulting WorkTimeline™ data to Clio Grow Sandbox...</div>
            <button class="modal-btn" style="background:var(--clio-blue); color:white;" onclick="executeVault()">CONFIRM VAULT</button>
        `;
        document.getElementById('overlaySystem').style.display = 'flex';
    }

    function executeVault() {
        // Here we would use the Client ID / Secret you received
        alert("Success: 201 Created. Data vaulted in Clio Cloud. Local memory purged.");
        vault = vault.filter(i => i.domain !== 'WORK'); // The Purge
        localStorage.setItem('wt_timeline_master', JSON.stringify(vault));
        unlockApp();
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const entry = { 
            grit: text, 
            domain: currentDomain, 
            stamp: new Date().toLocaleString(),
            analysis: text.includes("retaliation") ? "EA: Retaliation Signal" : "" 
        };
        vault.push(entry);
        localStorage.setItem('wt_timeline_master', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain);
        [...filtered].reverse().forEach((item) => {
            const hasAI = item.analysis !== "";
            list.innerHTML += `
                <div class="stack-wrapper">
                    <div class="stamp-label">📍 LANGLEY | ${item.stamp}</div>
                    <div class="stack-inner ${hasAI ? 'has-ai' : ''}" onclick="this.classList.toggle('flipped')">
                        <div class="bubble bubble-front"><p style="font-weight:600; font-size:14px; margin:0;">${item.grit}</p></div>
                        ${hasAI ? `<div class="bubble bubble-back"><p style="font-weight:600; font-size:13px; margin:0;">${item.analysis}</p></div>` : ''}
                    </div>
                </div>`;
        });
    }

    function makeDraggable(el) {
        let p1=0,p2=0,p3=0,p4=0;
        el.onmousedown = dStart; el.ontouchstart = dStart;
        function dStart(e) { p3=e.clientX||e.touches[0].clientX; p4=e.clientY||e.touches[0].clientY; document.onmouseup=dEnd; document.ontouchend=dEnd; document.onmousemove=dMove; document.ontouchmove=dMove; }
        function dMove(e) { let cx=e.clientX||e.touches[0].clientX; let cy=e.clientY||e.touches[0].clientY; p1=p3-cx; p2=p4-cy; p3=cx; p4=cy; el.style.top=(el.offsetTop-p2)+"px"; el.style.left=(el.offsetLeft-p1)+"px"; }
        function dEnd() { document.onmouseup=null; document.onmousemove=null; document.ontouchend=null; document.ontouchmove=null; }
    }

    makeDraggable(document.getElementById("addBtn"));
    makeDraggable(document.getElementById("syncBtn"));
    
    document.getElementById("addBtn").onclick = submitEntry;
    
    function useTemplate(t) { document.getElementById('statusBox').value = `${t}:\n`; }

    // Initialize WORK domain
    switchDomain('WORK');
</script>
</body>
</html>
