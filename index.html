<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Private Lawyer Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --mac-glass: rgba(255, 255, 255, 0.75);
            --lawyer-msg: #f7fafc;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); overflow: hidden; }
        
        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: var(--mac-glass); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: flex; flex-direction: column; gap: 20px; }
        
        .bubble { padding: 15px; border-radius: 22px; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); background: #f1f1f1; border: 1px solid #e5e5e5; position: relative; }
        
        /* COMMENT STYLES */
        .comment-thread { margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--clio-blue); }
        .lawyer-bubble { background: var(--lawyer-msg); border: 1px solid var(--clio-blue); border-radius: 12px; padding: 10px; margin-top: 5px; font-size: 11px; }
        .comment-input { width: 100%; border: none; background: #edf2f7; padding: 8px; border-radius: 8px; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div style="font-weight: 900; font-size: 13px; color: var(--teal);">WorkTimeline™ Private Portal</div>
        <div id="connStatus" style="font-size: 8px; color: var(--silver-gray);">SECURE CONNECTION</div>
    </header>

    <div class="view-section">
        <div id="timelineContainer"></div>
    </div>
</div>

<script>
    // Configuration from your Healthy project
    const SUPABASE_URL = 'https://sghmgiaaqcuymqnfbleh.supabase.co';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. REALTIME PRIVATE CHANNEL HANDSHAKE
    function initRealtime() {
        _supabase
            .channel('private-messages')
            .on('postgres_changes', 
                { event: 'INSERT', schema: 'public', table: 'comments' }, 
                () => { fetchTimeline(); }
            )
            .subscribe();
    }

    async function fetchTimeline() {
        // Fetch timeline and join with private comments
        const { data: timelines } = await _supabase.from('timelines')
            .select('*, comments(*)').order('created_at', { ascending: false });
        renderTimeline(timelines || []);
    }

    async function addComment(timelineId) {
        const input = document.getElementById(`input-${timelineId}`);
        const text = input.value;
        if (!text.trim()) return;

        // Insert private comment
        await _supabase.from('comments').insert([{
            timeline_id: timelineId,
            content: text,
            author_role: 'CLIENT' // Hardcoded for this view
        }]);

        input.value = '';
    }

    function renderTimeline(data) {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = data.map(item => `
            <div style="margin-top:20px;">
                <div class="bubble">
                    <div style="font-size:9px; font-weight:900; color:var(--silver-gray);">${new Date(item.created_at).toLocaleString()}</div>
                    <p style="margin:5px 0; font-size:12px;">${item.content}</p>
                    
                    <div class="comment-thread">
                        ${(item.comments || []).map(c => `
                            <div class="lawyer-bubble">
                                <strong>${c.author_role}:</strong> ${c.content}
                            </div>
                        `).join('')}
                        <input type="text" id="input-${item.id}" class="comment-input" placeholder="Message your lawyer..." 
                               onkeydown="if(event.key==='Enter') addComment('${item.id}')">
                    </div>
                </div>
            </div>
        `).join('');
    }

    initRealtime();
    fetchTimeline();
</script>
</body>
</html>
