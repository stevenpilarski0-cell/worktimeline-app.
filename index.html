<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin'Intake Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(25px); opacity: 0.3; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2.5px solid var(--teal); box-sizing: border-box; }
        
        /* THE CLEAN TEAL BRIEFCASE LOGO */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2.5px solid var(--teal); background: white; z-index: 3000; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        
        .briefcase-classic { 
            width: 30px; height: 22px; 
            border: 2.5px solid var(--teal); border-radius: 5px; 
            position: relative; display: flex; align-items: center; justify-content: center; 
        }
        .briefcase-classic::before { 
            content: ''; position: absolute; top: -6px; 
            width: 10px; height: 4px; 
            border: 2.5px solid var(--teal); border-bottom: none; border-radius: 3px 3px 0 0; 
        }
        .timeline-center { 
            width: 130%; height: 2.5px; background: var(--teal); 
            position: absolute; display: flex; justify-content: space-between; align-items: center; padding: 0 2px; box-sizing: border-box; z-index: 5;
        }
        .dot { width: 5px; height: 5px; background: var(--teal); border-radius: 50%; border: 1px solid white; }

        .brand-stack { display: flex; flex-direction: column; align-items: flex-start; }
        .intake-label { font-size: 9px; font-weight: 900; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; margin-bottom: -3px; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 17px; letter-spacing: -0.5px; }

        /* INTERFACE ELEMENTS */
        .switch-group { display: flex; gap: 12px; }
        .switch-container { text-align: center; display: flex; flex-direction: column; align-items: center; font-size: 7px; font-weight: 900; }
        .switch { position: relative; width: 34px; height: 18px; margin-bottom: 2px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        #addBtn { position: absolute; right: 20px; top: 180px; z-index: 5000; width: 85px; height: 85px; background: var(--teal); border-radius: 24px; color: white; border: none; font-size: 40px; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #syncBtn { position: absolute; right: 20px; top: 285px; z-index: 5000; width: 85px; height: 85px; background: var(--clio-blue); border-radius: 24px; color: white; border: none; font-size: 10px; font-weight: 900; padding: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        #disclaimerOverlay, #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 30px; border-radius: 28px; text-align: center; border-bottom: 6px solid var(--teal); width: 100%; max-width: 350px; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: 900; margin-top: 15px; }

        #utilityDrawer { width: 100%; background: white; border-bottom: 2.5px solid var(--teal); z-index: 2000; transition: 0.4s ease; }
        .template-chip { border: 2.5px solid var(--teal); padding: 6px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; color: var(--teal); cursor: pointer; white-space: nowrap; }
        #statusBox { width: 100%; height: 95px; padding: 12px; border: 2.5px solid var(--teal); border-radius: 15px; margin-top: 10px; font-family: inherit; font-weight: 700; outline: none; box-sizing: border-box; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 15px; padding-bottom: 120px; }
        .entry { background: white; border: 2.5px solid var(--teal); border-left-width: 10px; padding: 18px; border-radius: 18px; margin-bottom: 30px; }
        .tier-serious { animation: pulse-ser 2s infinite; border-left-color: var(--teal-dark); background: var(--blue-trans); }
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }
    </style>
</head>
<body>

<div id="disclaimerOverlay"><div class="modal-card"><h2>INTAKE GUARD</h2><p style="font-size: 14px; font-weight: 700;">Friendly reminder: This is a <b>Work Journal</b> to document the truth. We are not providing legal advice.</p><button class="modal-btn" onclick="this.parentElement.parentElement.remove()">I UNDERSTAND</button></div></div>

<div id="warningOverlay" style="display:none;"><div class="modal-card"><h2>EA ANALYSIS</h2><p id="warningMsg" style="font-size: 13px; font-weight: 700;"></p><button class="modal-btn" onclick="applyStack(true)">STACK ON TOP</button><button class="modal-btn" style="background:#7f8c8d;" onclick="applyStack(false)">STACK UNDER</button></div></div>

<div class="app-container">
    <header class="header">
        <div class="logo-area">
            <div class="briefcase-classic">
                <div class="timeline-center"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <div class="brand-stack">
                <div class="intake-label">Takin'Intake</div>
                <div class="main-title">WorkTimeline™</div>
            </div>
        </div>
        <div class="switch-group">
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="document.body.classList.toggle('ghost-active')"><span class="slider"></span></label>GHOST</div>
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="activeVault = this.checked ? 'NOTES' : 'TIMELINE'; refreshDisplay();"><span class="slider"></span></label>NOTES</div>
        </div>
    </header>

    <button id="addBtn" onclick="submitEntry()">+</button>
    <button id="syncBtn" onclick="alert('Journal locked and synced to Clio Secure Cloud.')">LOCK & SYNC TO CLIO</button>

    <div id="utilityDrawer">
        <div style="padding: 15px;">
            <div style="display:flex; gap:8px; overflow-x: auto; padding-bottom: 5px;">
                <div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div>
                <div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div>
                <div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div>
                <div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div>
            </div>
            <textarea id="statusBox" placeholder="Journal the truth..."></textarea>
        </div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>
</div>

<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    let activeVault = "TIMELINE"; let pendingEntry = null;

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        const text = box.value; const low = text.toLowerCase();
        let analysis = ""; let severity = "minor";
        
        if (low.includes("fire") || low.includes("quit") || low.includes("toxic") || low.includes("retaliate")) { 
            analysis = "HIGH PRIORITY: Constructive Dismissal pattern detected."; severity = "serious"; 
        }
        else if (low.includes("pay") || low.includes("injury") || low.includes("break")) { 
            analysis = "MODERATE: Statutory compliance marker."; severity = "moderate"; 
        }

        pendingEntry = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: severity, agree: false };
        if (analysis && activeVault === "TIMELINE") {
            document.getElementById('warningMsg').innerHTML = analysis;
            document.getElementById('warningOverlay').style.display = 'flex';
        } else { saveFinal(); }
        box.value = '';
    }

    function applyStack(agree) { pendingEntry.agree = agree; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    function saveFinal() { 
        if(activeVault === "TIMELINE") timelineVault.push(pendingEntry); else notesVault.push(pendingEntry);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
        localStorage.setItem('wt_notes', JSON.stringify(notesVault));
        refreshDisplay();
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const gritCard = `<div class="entry tier-${item.tier}"><span style="font-size:10px; color:var(--teal); font-weight:900;">📍 LANGLEY, BC | ${item.stamp}</span><p style="margin-top:10px; font-weight:800;">${item.grit}</p></div>`;
            const analysisCard = item.analysis ? `<div class="entry" style="margin-bottom:-15px; border-left-color:#7f8c8d;"><b>EA ANALYSIS:</b><br><span style="font-size:12px; font-weight:900;">${item.analysis}</span></div>` : "";
            list.innerHTML += item.agree ? analysisCard + gritCard : gritCard + analysisCard;
        });
    }

    function useTemplate(t) { 
        const templates = { 
            'INCIDENT': 'ACTION:\nVIOLATION:', 
            'INJURY': 'OFA 2 RECORD:\nINJURY:\nFIRST AID RENDERED:', 
            'LOCATION': 'SITE:\nHAZARDS:', 
            'WITNESS': 'NAME:\nSTATEMENT:' 
        };
        document.getElementById('statusBox').value = templates[t];
    }
    refreshDisplay();
</script>
</body>
</html>
