<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Taking an Intake...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 40px; --round-inner: 24px; --round-pill: 999px;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100dvh; overflow: hidden; color: var(--gray-dark); }
        
        /* GHOST OVERLAY */
        #ghostBox { position: absolute; top: 85px; left: 0; right: 0; bottom: 0; z-index: 999; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: 0.4s; background: rgba(255,255,255,0); }
        body.ghost-on #ghostBox { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(238, 241, 245, 0.7); pointer-events: all; }

        /* INTRO */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; transition: 0.5s; }
        .story { font-size: 20px; font-weight: 700; opacity: 0; transition: 0.8s; max-width: 400px; }
        #skip { margin-top: 40px; padding: 12px 24px; background: white; border: 2px solid var(--clio-blue); border-radius: var(--round-pill); color: var(--clio-blue); font-weight: 800; cursor: pointer; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: calc(100dvh - 20px); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--platinum); flex-shrink: 0; background: white; }
        .wt-icon { width: 30px; height: 30px; stroke: var(--teal); stroke-width: 2; fill: none; }

        .input-area { padding: 15px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); flex-shrink: 0; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .chip { background: white; color: var(--teal); font-size: 11px; font-weight: 700; padding: 8px 14px; border-radius: var(--round-pill); border: 1px solid var(--platinum); white-space: nowrap; }

        #statusBox { width: 100%; height: 80px; padding: 12px; border-radius: var(--round-inner); border: 1px solid var(--platinum); font-family: inherit; font-size: 15px; resize: none; margin-bottom: 10px; }
        
        .media-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
        .m-btn { background: white; border: 1px solid var(--platinum); padding: 10px 2px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .m-btn svg { width: 20px; height: 20px; stroke: var(--teal); stroke-width: 2.2; fill: none; margin-bottom: 4px; }
        .m-btn span { font-size: 8px; font-weight: 800; text-transform: uppercase; }

        #addBtn { background: var(--teal); color: white; border: none; padding: 16px; border-radius: var(--round-pill); width: 100%; font-weight: 700; font-size: 15px; box-shadow: 0 4px 12px rgba(0, 128, 128, 0.2); }

        #timeline { flex-grow: 1; overflow-y: auto; padding: 20px; position: relative; background: #fff; }
        .spine { position: absolute; left: 30px; top: 0; bottom: 0; width: 3px; background: var(--platinum); }
        .entry { position: relative; margin-left: 45px; background: white; border: 1px solid var(--platinum); padding: 15px; border-radius: 20px; margin-bottom: 15px; border-left: 4px solid var(--teal); }
        .ts { font-size: 9px; font-weight: 800; color: var(--teal); display: block; margin-bottom: 5px; text-transform: uppercase; }

        .footer { padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); background: white; border-top: 1px solid var(--platinum); }
        #lockBtn { background: white; color: var(--clio-blue); border: 2px solid var(--clio-blue); padding: 14px; border-radius: var(--round-inner); width: 100%; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        #lockBtn svg { width: 24px; height: 24px; stroke: var(--clio-blue); stroke-width: 2.5; fill: none; }

        .switch { position: relative; display: inline-block; width: 38px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #cbd5e1; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div id="splash">
    <h1 id="st" class="story"></h1>
    <button id="skip" onclick="go()">Skip Intro</button>
</div>

<div class="app-container">
    <div id="ghostBox"></div>
    <header class="header">
        <div style="display:flex; align-items:center; gap:10px;">

            <div>
                <h1 style="margin:0; font-size:18px; font-weight:800; color:var(--teal);">WorkTimeline™</h1>
                <div style="font-size:10px; font-weight:700; color:var(--clio-blue); font-style:italic;">Taking an intake...</div>
            </div>
        </div>
        <div style="display:flex; gap:12px;">
            <label
