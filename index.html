<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Multi-Domain Prototype</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --mac-glass: rgba(255, 255, 255, 0.75);
            --damage-red: #e53e3e;
            --privacy-purple: #805ad5;
            --injury-orange: #dd6b20;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-locked { filter: blur(35px); pointer-events: none; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; }
        
        /* DOMAIN TABS */
        .domain-tabs { display: flex; background: #edf2f7; padding: 10px; gap: 10px; border-bottom: 1px solid var(--gray-border); }
        .domain-btn { flex: 1; font-size: 9px; font-weight: 900; padding: 8px; border-radius: 10px; border: 1px solid var(--gray-border); background: white; cursor: pointer; transition: all 0.2s; }
        .domain-btn.active { color: white; border-color: transparent; }
        
        .domain-employment.active { background: var(--teal); }
        .domain-privacy.active { background: var(--privacy-purple); }
        .domain-injury.active { background: var(--injury-orange); }

        /* HEADER & NAV */
        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: var(--mac-glass); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .mac-nav { display: flex; background: rgba(0,0,0,0.06); padding: 2px; border-radius: 14px; position: relative; width: 160px; }
        .nav-item { flex: 1; font-size: 8px; font-weight: 900; padding: 7px 0; border: none; background: transparent; color: #718096; cursor: pointer; z-index: 1; }

        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: none; flex-direction: column; gap: 20px; }
        .view-section.active { display: flex; }

        /* CARDS */
        .auction-card { background: #f8fafc; border: 1.5px solid var(--gray-border); border-radius: 24px; padding: 18px; box-shadow: var(--mac-shadow); border-left: 8px solid var(--silver-gray); }
        .bubble { padding: 15px; border-radius: 22px; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); background: #f1f1f1; border: 1px solid #e5e5e5; }
        
        #addBtn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; width: 70px; height: 70px; background: var(--teal); font-size: 30px; bottom: 30px; right: 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="overlaySystem">
    <div style="background: white; padding: 30px; border-radius: 28px; text-align: center; max-width: 300px;">
        <h2 style="font-weight: 900; margin: 0; font-size: 16px;">WORK-DEMO</h2>
        <p style="font-size: 12px; color: #4a5568;">Multi-Domain Legal Tech Simulation.</p>
        <button onclick="unlockApp()" style="background:var(--teal); color:white; border:none; padding:15px; width:100%; border-radius:18px; font-weight:800; cursor:pointer;">START DEMO</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <div class="domain-tabs">
        <button class="domain-btn domain-employment active" onclick="setDomain('EMPLOYMENT', this)">EMPLOYMENT</button>
        <button class="domain-btn domain-privacy" onclick="setDomain('PRIVACY', this)">PRIVACY</button>
        <button class="domain-btn domain-injury" onclick="setDomain('INJURY', this)">INJURY</button>
    </div>

    <header class="header">
        <div id="domainTitle" style="font-weight: 900; font-size: 13px; color: var(--teal);">Employment Timeline™</div>
        <div class="mac-nav">
            <button class="nav-item" onclick="switchView('journal')">JOURNAL</button>
            <button class="nav-item" onclick="switchView('market')">LAWYER</button>
        </div>
    </header>

    <div id="journalView" class="view-section active">
        <div id="domainAdvisory" style="background:#ebf8ff; border:1px solid var(--clio-blue); padding:10px; border-radius:15px; font-size:10px; display:none;"></div>
        <textarea id="statusBox" style="width:100%; height:80px; border-radius:20px; border:1px solid var(--gray-border); padding:15px; font-family:inherit; box-sizing: border-box;" placeholder="Add to your timeline..."></textarea>
        <div id="timelineContainer"></div>
    </div>

    <div id="marketView" class="view-section">
        <div id="marketContainer"></div>
    </div>

    <button id="addBtn" onclick="submitEntry()">+</button>
</div>

<script>
    // 1. DOMAIN CONFIGURATION
    const DOMAINS = {
        EMPLOYMENT: { title: "Employment Timeline™", theme: "--teal", keywords: ["fire", "boss", "pay"], market: "Employment Law Firms" },
        PRIVACY: { title: "Privacy Leak Log™", theme: "--privacy-purple", keywords: ["breach", "password", "data"], market: "Privacy & Tech Practices" },
        INJURY: { title: "Personal Injury Tracker™", theme: "--injury-orange", keywords: ["fall", "pain", "doctor"], market: "Personal Injury Specialists" }
    };

    let currentDomain = 'EMPLOYMENT';
    let vault = JSON.parse(localStorage.getItem('wt_timeline_multi')) || [];

    function setDomain(key, btn) {
        currentDomain = key;
        const config = DOMAINS[key];
        
        // Update UI Theme
        document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('domainTitle').innerText = config.title;
        document.getElementById('domainTitle').style.color = `var(${config.theme})`;
        document.getElementById('addBtn').style.background = `var(${config.theme})`;
        
        refresh();
        renderMarket();
    }

    function unlockApp() {
        document.getElementById('overlaySystem').style.display = 'none';
        document.getElementById('mainApp').classList.remove('app-locked');
        refresh();
        renderMarket();
    }

    function switchView(view) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById(`${view}View`).classList.add('active');
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value;
        if(!text.trim()) return;

        vault.push({ 
            grit: text, 
            domain: currentDomain,
            stamp: new Date().toLocaleString(),
            markers: DOMAINS[currentDomain].keywords.filter(k => text.toLowerCase().includes(k))
        });

        localStorage.setItem('wt_timeline_multi', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        refresh();
        renderMarket();
    }

    function refresh() {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = '';
        // Filter by current domain tab
        vault.filter(v => v.domain === currentDomain).reverse().forEach(item => {
            container.innerHTML += `
                <div class="stack-wrapper" style="margin-bottom:15px;">
                    <div style="font-size:9px; font-weight:900; color:var(--silver-gray);">${item.stamp}</div>
                    <div class="bubble">
                        <p style="margin:0; font-size:12px;">${item.grit}</p>
                        ${item.markers.length > 0 ? `<div style="font-size:9px; font-weight:900; color:var(${DOMAINS[item.domain].theme}); margin-top:5px;">Detected: ${item.markers.join(", ")}</div>` : ''}
                    </div>
                </div>`;
        });
    }

    function renderMarket() {
        const container = document.getElementById('marketContainer');
        const domainVault = vault.filter(v => v.domain === currentDomain);
        
        if(domainVault.length === 0) {
            container.innerHTML = '<p style="text-align:center; font-size:11px; color:gray;">Add entries to populate this specific marketplace.</p>';
            return;
        }

        container.innerHTML = `
            <div class="auction-card" style="border-left-color: var(${DOMAINS[currentDomain].theme})">
                <div style="font-size:10px; font-weight:900; color:var(--silver-gray);">TARGETED MARKET: ${DOMAINS[currentDomain].market}</div>
                <div style="font-size:20px; font-weight:900; margin:10px 0;">Case Strength Analysis</div>
                <div style="font-size:11px; line-height:1.5;">This timeline is currently being marketed to firms specializing in <strong>${DOMAINS[currentDomain].title}</strong>.</div>
                <button style="width:100%; margin-top:15px; padding:12px; border-radius:14px; background:var(--clio-blue); color:white; border:none; font-weight:900;">ACQUIRE VIA CLIO</button>
            </div>`;
    }
</script>
</body>
</html>
