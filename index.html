<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">WorkTimeline Engine</h1>
        <p class="text-sm text-slate-500 mb-6">Enter incident details to log a verified timeline entry.</p>

        <div class="space-y-4">
            <textarea 
                id="logInput" 
                rows="4" 
                class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-none transition text-slate-700"
                placeholder="Type incident details here..."
            ></textarea>

            <button 
                id="transmitBtn"
                onclick="transmitLog()"
                class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-3 rounded-xl transition shadow-md hover:shadow-lg flex items-center justify-center"
            >
                Transmit to Clio Secure Core
            </button>

            <p id="statusMessage" class="text-sm text-center font-medium hidden"></p>
        </div>
    </div>

    <script>
        // Automatically check if we just returned from a successful Clio authentication handshake loop
        window.addEventListener('load', () => {
            const status = localStorage.getItem('sync_status');
            const cachedText = localStorage.getItem('cached_log_text');
            const statusEl = document.getElementById('statusMessage');

            if (status === 'authenticated' && cachedText) {
                statusEl.innerText = "Re-transmitting cached payload...";
                statusEl.className = "text-sm text-center font-medium text-amber-600";
                statusEl.classList.remove('hidden');
                
                // Fire the payload again now that the token table is full
                document.getElementById('logInput').value = cachedText;
                localStorage.removeItem('sync_status');
                transmitLog();
            }
        });

        async function transmitLog() {
            const logText = document.getElementById('logInput').value.trim();
            const btn = document.getElementById('transmitBtn');
            const statusEl = document.getElementById('statusMessage');

            if (!logText) {
                statusEl.innerText = "Please write a message before transmitting.";
                statusEl.className = "text-sm text-center font-medium text-red-600";
                statusEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing Telemetry...";
            statusEl.classList.add('hidden');

            try {
                // Hardwired directly to your verified personal production API link
                const response = await fetch('https://worktimeline-app-stevenpilarski0-4988s-projects.vercel.app/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ logText })
                });

                const result = await response.json();

                // ROUTE A: Catch 401 Unauthorized -> Forward user to Clio Login Screen
                if (response.status === 401 && result.url) {
                    statusEl.innerText = "Authorization required. Re-routing to Clio Core...";
                    statusEl.className = "text-sm text-center font-medium text-teal-600";
                    statusEl.classList.remove('hidden');
                    
                    // Cache user log details locally so they don't type it twice
                    localStorage.setItem('cached_log_text', logText);
                    localStorage.setItem('sync_status', 'authenticated');
                    
                    // Jump to Clio's blue access login screen
                    window.location.href = result.url;
                    return;
                }

                if (!response.ok) throw new Error(result.error || 'Transmission rejected.');

                // SUCCESS: Data verified and stored in Clio Grow
                statusEl.innerText = "Success: Entry committed to Clio Secure Core!";
                statusEl.className = "text-sm text-center font-medium text-green-600";
                statusEl.classList.remove('hidden');
                document.getElementById('logInput').value = "";
                localStorage.removeItem('cached_log_text');

            } catch (error) {
                console.error("Network Error Stack:", error);
                statusEl.innerText = "Network Error: Could not connect to gateway.";
                statusEl.className = "text-sm text-center font-medium text-red-600";
                statusEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Transmit to Clio Secure Core";
            }
        }
    </script>
</body>
</html>
