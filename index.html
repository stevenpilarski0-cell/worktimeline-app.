<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin'Intake Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95); }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* GHOST MODE BLUR */
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(25px); opacity: 0.3; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2.5px solid var(--teal); box-sizing: border-box; }
        
        /* HEADER - MIRRORED BRANDING */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2.5px solid var(--teal); z-index: 3000; background: white; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        
        /* MAC-STYLE ROUNDED BRIEFCASE LOGO */
        .briefcase-mac { 
            width: 32px; 
            height: 24px; 
            border: 2.5px solid var(--teal); 
            border-radius: 8px; /* Rounder Mac-style corners */
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        /* Handle bone - integrated without a separator line */
        .briefcase-mac::before { 
            content: '';
            position: absolute; 
            top: -7px; 
            width: 12px; 
            height: 5px; 
            border: 2.5px solid var(--teal); 
            border-bottom: none; 
            border-radius: 5px 5px 0 0; 
        }
        /* The ONLY horizontal line: Timeline + 3 Dots */
        .timeline-line { 
            width: 125%; 
            height: 2.5px; 
            background: var(--teal); 
            position: absolute; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 1px; 
            box-sizing: border-box; 
            z-index: 5;
        }
        .dot { width: 5px; height: 5px; background: var(--teal); border-radius: 50%; border: 1px solid white; }
        
        .brand-stack { display: flex; flex-direction: column; align-items: flex-start; }
        .intake-label { font-size: 9px; font-weight: 900; color: var(--teal); letter-spacing: 1px; margin-bottom: -3px; text-transform: uppercase; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 17px; letter-spacing: -0.5px; }

        /* SWITCHES */
        .switch-group { display: flex; gap: 12px; }
        .switch-container { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* FLOATING ACTION BUTTONS */
        .draggable-btn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; border: none; width: 85px; height: 85px; border-radius: 24px; color: white; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); font-weight: 900; text-align: center; font-size: 10px; padding: 5px; }
        #addBtn { right: 20px; top: 180px; background: var(--teal); font-size: 44px; }
        #syncBtn { right: 20px; top: 280px; background: var(--clio-blue); }

        /* OVERLAYS */
        #warningOverlay, #syncOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(15px); z-index: 300000; display: none; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .modal-card { background: white; padding: 35px; border-radius: 32px; text-align: center; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); border-bottom: 8px solid var(--teal); width: 100%; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 18px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 15px; width: 100%; font-size: 14px; }

        /* DRAWERS */
        #utilityDrawer { width: 100%; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 2.5px solid var(--teal); z-index: 2500; transition: 0.5s transform cubic-bezier(0.16, 1, 0.3, 1); }
        #managementDrawer { position: fixed; bottom: 0; width: 100%; max-width: 495px; background: white; border-top: 3.5px solid var(--teal); z-index: 6000; transition: 0.5s transform cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(calc(100% - 40px)); box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .drag-handle-zone { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: var(--teal); border-radius: 10px; opacity: 0.3; }

        /* TEMPLATE CHIPS */
        .template-chip { background: white; border: 2.5px solid var(--teal); padding: 8px 14px; border-radius: 15px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }
        #statusBox { width: 100%; height: 100px; padding: 14px; border-radius: 18px; border: 2.5px solid var(--teal); resize: none; font-family: inherit; font-weight: 700; background: #f8fafc; box-sizing: border-box; outline: none; margin-top: 10px; }

        /* TIMELINE ENTRIES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 15px 120px; background: #fdfdfd; }
        .stack-group { margin-bottom: 35px; display: flex; flex-direction: column; }
        .entry { background: white; border: 2.5px solid var(--teal); padding: 20px; border-radius: var(--round-inner); border-left: 12px solid var(--teal); width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* PULSE TIERS */
        .tier-minor { border-color: var(--platinum); border-left-color: var(--platinum); }
        .tier-moderate { border-color: var(--teal); border-left-color: var(--teal); }
        .tier-serious { border-color: var(--teal-dark); border-left-color: var(--teal-dark); background: var(--blue-trans); animation: pulse-serious 2s infinite; }
        
        .analysis-card { z-index: 10; margin-bottom: -15px; }

        @keyframes pulse-serious { 
            0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 
            70% { box-shadow: 0 0 0 15px rgba(0, 128, 128, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } 
        }
    </style>
</head>
<body id="appBody">

<div id="warningOverlay"><div class="modal-card"><h2>AI CROSS-REFERENCE</h2><p id="warningMsg" style="text-align:left; font-size:13px; font-weight:700;"></p><button class="modal-btn" onclick="applyStack(true)">USE ANALYSIS (STACK ON TOP)</button><button class="modal-btn" style="background:var(--dark-silver);" onclick="applyStack(false)">KEEP ORIGINAL (STACK UNDER)</button></div></div>

<div id="syncOverlay"><div class="modal-card"><h2>Sync Summary</h2><p id="aiSummaryText" style="text-align:left; font-size:14px; max-height:300px; overflow-y:auto; font-weight:700;"></p><button class="modal-btn" style="background:var(--clio-blue);" onclick="finalSync()">OK & SEND TO CLIO</button><button class="modal-btn" style="background:var(--dark-silver); margin-top:10px;" onclick="closeSync()">CANCEL</button></div></div>

<div class="app-container">
    <header class="header">
        <div class="logo-area">
            <div class="briefcase-mac">
                <div class="timeline-line"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <div class="brand-stack">
                <div class="intake-label">Takin'Intake</div>
                <div class="main-title">WorkTimeline™</div>
            </div>
        </div>
        <div class="switch-group">
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider"></span></label><span style="font-size:7px; font-weight:900;">GHOST</span></div>
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><span style="font-size:7px; font-weight:900;">NOTES</span></div>
        </div>
    </header>

    <div id="addBtn" class="draggable-btn" onclick="submitEntry()">+</div>
    <div id="syncBtn" class="draggable-btn" onclick="triggerSync()">LOCK & SYNC TO CLIO</div>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <div style="display:flex; gap:10px; overflow-x:auto; padding-bottom: 5px;"><div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div><div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div><div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div><div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div></div>
            <textarea id="statusBox" placeholder="Log the grit..."></textarea>
        </div>
        <div class="drag-handle-zone" onclick="toggleDrawer()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <div id="managementDrawer">
        <div class="drag-handle-zone" onclick="toggleMgmtDrawer()"><div class="handle-pill"></div></div>
        <div style="padding:0 25px 35px; display:flex; flex-direction:column; gap:12px;">
            <button class="modal-btn" style="margin-top:0; background:var(--dark-silver);" onclick="confirmReset()">DELETE & START FRESH</button>
            <button class="modal-btn" style="margin-top:0; background:var(--teal);" onclick="alert('Exporting Report...')">SAVE & EXPORT</button>
        </div>
    </div>
</div>

<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    let pendingEntry = null; let isDrawerOpen = true; let isMgmtOpen = false; let activeVault = "TIMELINE";
    
    window.onload = () => { refreshDisplay(); };

    function toggleDrawer() { const d = document.getElementById('utilityDrawer'); const c = document.getElementById('drawerContent'); if(isDrawerOpen) { d.style.transform = `translateY(-${c.offsetHeight}px)`; isDrawerOpen = false; } else { d.style.transform = `translateY(0)`; isDrawerOpen = true; } }
    function toggleMgmtDrawer() { const d = document.getElementById('managementDrawer'); if(!isMgmtOpen) { d.style.transform = 'translateY(0)'; isMgmtOpen = true; } else { d.style.transform = 'translateY(calc(100% - 40px))'; isMgmtOpen = false; } }
    function toggleGhost(cb) { document.getElementById('appBody').classList.toggle('ghost-active', cb.checked); }
    function toggleVault(cb) { activeVault = cb.checked ? "NOTES" : "TIMELINE"; refreshDisplay(); }

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        const text = box.value; const low = text.toLowerCase();
        let analysis = ""; let severity = "minor";
        if (low.includes("fire") || low.includes("quit") || low.includes("toxic") || low.includes("retaliate")) { analysis = "HIGH PRIORITY: Cross-referenced with Constructive Dismissal case law."; severity = "serious"; }
        else if (low.includes("pay") || low.includes("injury") || low.includes("safety")) { analysis = "MODERATE PRIORITY: Cross-referenced with BC ESA & WorkSafeBC."; severity = "moderate"; }
        else if (low.includes("clutter") || low.includes("wet")) { analysis = "GENERAL ALERT: Minor cross-reference to Duty of Care."; severity = "minor"; }

        pendingEntry = { id: Date.now(), grit: text, analysis: analysis, stamp: new Date().toLocaleString(), agree: false, tier: severity };
        if (analysis && activeVault === "TIMELINE") {
            document.getElementById('warningMsg').innerHTML = `<b>AI Cross-Reference Found:</b><br><br>${analysis}<br><br><i>Stack analysis on top?</i>`;
            document.getElementById('warningOverlay').style.display = 'flex';
        } else { saveFinal(); }
        box.value = '';
    }

    function applyStack(agree) { pendingEntry.agree = agree; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    function saveFinal() { 
        if(activeVault === "TIMELINE") { timelineVault.push(pendingEntry); localStorage.setItem('wt_timeline', JSON.stringify(timelineVault)); }
        else { notesVault.push(pendingEntry); localStorage.setItem('wt_notes', JSON.stringify(notesVault)); }
        refreshDisplay(); 
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const group = document.createElement('div'); group.className = 'stack-group';
            const gritCard = `<div class="entry tier-${item.tier}"><span style="font-size:10px; color:var(--teal); font-weight:900;">📍 LANGLEY, BC | ${item.stamp}</span><p style="margin:10px 0 0; font-weight:800; line-height:1.4;">${item.grit}</p></div>`;
            const analysisCard = (item.analysis && activeVault === "TIMELINE") ? `<div class="entry analysis-card tier-${item.tier}"><b>LEGAL CROSS-REF:</b><br><span style="font-size:12px; font-weight:900;">${item.analysis}</span></div>` : "";
            group.innerHTML = item.agree ? analysisCard + gritCard : gritCard + analysisCard;
            list.appendChild(group);
        });
    }

    function useTemplate(t) { 
        const templates = {
            'INCIDENT': 'ACTION:\nVIOLATION:\nWITNESS:', 
            'INJURY': 'NATURE OF INJURY:\nBODY PART:\nFIRST AID RENDERED:\nOFA ATTENDANT:', 
            'LOCATION': 'SITE:\nHAZARDS:',
            'WITNESS': 'NAME:\nCONTACT:\nSTATEMENT:'
        }; 
        document.getElementById('statusBox').value = templates[t]; 
    }
    function triggerSync() { if (timelineVault.length === 0) return alert("Nothing to sync."); document.getElementById('syncOverlay').style.display = 'flex'; }
    function finalSync() { alert("Synced to Clio."); document.getElementById('syncOverlay').style.display = 'none'; }
    function closeSync() { document.getElementById('syncOverlay').style.display = 'none'; }
    function confirmReset() { if(confirm("Wipe active vault?")) { if(activeVault === "TIMELINE") { timelineVault = []; localStorage.setItem('wt_timeline', '[]'); } else { notesVault = []; localStorage.setItem('wt_notes', '[]'); } location.reload(); } }
</script>
</body>
</html>
