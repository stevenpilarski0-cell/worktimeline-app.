<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; --clio-green: #2ecc71; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95); --dark-silver: #7f8c8d; }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(15px); z-index: 300000; display: none; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .modal-card { background: white; padding: 35px; border-radius: 32px; text-align: center; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); border-bottom: 8px solid var(--teal); width: 100%; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 18px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 15px; width: 100%; font-size: 14px; }
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 2px solid var(--platinum); z-index: 3000; background: white; }
        .draggable-btn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; border: none; width: 85px; height: 85px; border-radius: 24px; color: white; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); font-weight: 900; text-align: center; font-size: 10px; padding: 5px; }
        #addBtn { right: 20px; top: 180px; background: var(--teal); font-size: 44px; }
        #syncBtn { right: 20px; top: 280px; background: var(--clio-blue); }
        .template-chip { background: white; border: 2.5px solid var(--teal); padding: 8px 14px; border-radius: 15px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }
        #statusBox { width: 100%; height: 100px; padding: 14px; border-radius: 18px; border: 2.5px solid var(--platinum); resize: none; font-family: inherit; font-weight: 700; background: #f8fafc; box-sizing: border-box; outline: none; margin-top: 10px; }
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 15px 100px; background: #fdfdfd; }
        .stack-group { margin-bottom: 30px; display: flex; flex-direction: column; }
        .entry { background: white; border: 2.5px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); border-left: 12px solid var(--platinum); width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        /* Tiers of Severity */
        .tier-minor { border-left-color: var(--platinum); }
        .tier-moderate { border-left-color: var(--teal); }
        .tier-serious { border-left-color: var(--teal-dark); background: var(--blue-trans); animation: pulse-serious 2s infinite; }
        @keyframes pulse-serious { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }
    </style>
</head>
<body>
<div id="warningOverlay"><div class="modal-card"><h2>AI CROSS-REFERENCE</h2><p id="warningMsg" style="text-align:left; font-size:13px; font-weight:700; color:var(--gray-dark);"></p><button class="modal-btn" onclick="applyStack(true)">USE LEGAL ANALYSIS</button><button class="modal-btn" style="background:var(--dark-silver);" onclick="applyStack(false)">KEEP ORIGINAL ONLY</button></div></div>
<div class="app-container">
    <header class="header"><div style="font-weight:900; color:var(--teal); font-size:18px;">WorkTimeline™</div></header>
    <div id="addBtn" class="draggable-btn" onclick="submitEntry()">+</div>
    <div id="syncBtn" class="draggable-btn" onclick="triggerSync()">LOCK & SYNC TO CLIO</div>
    <div id="utilityDrawer" style="padding:15px 20px;"><div style="display:flex; gap:10px; overflow-x:auto;"><div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div><div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div><div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div></div><textarea id="statusBox" placeholder="Log evidence..."></textarea></div>
    <div id="timelineContainer"><div id="displayList"></div></div>
</div>
<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let pendingEntry = null;
    window.onload = () => { refreshDisplay(); };

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        const text = box.value; const low = text.toLowerCase();
        let analysis = ""; let severity = "minor";
        
        // Tier 3: Serious (Pulse)
        if (low.includes("fire") || low.includes("quit") || low.includes("toxic") || low.includes("retaliate") || low.includes("age")) {
            analysis = "HIGH PRIORITY: Cross-referenced with Constructive Dismissal case law & BC Human Rights Code. Major evidentiary marker.";
            severity = "serious";
        } 
        // Tier 2: Moderate (Teal)
        else if (low.includes("pay") || low.includes("break") || low.includes("safety") || low.includes("injury") || low.includes("dock")) {
            analysis = "MODERATE PRIORITY: Cross-referenced with BC ESA & Workers Compensation Act. Statutory compliance marker detected.";
            severity = "moderate";
        }
        // Tier 1: Minor (Cross-reference alert)
        else if (low.includes("wet") || low.includes("clutter") || low.includes("late") || low.includes("tired")) {
            analysis = "GENERAL ALERT: Minor cross-reference to Duty of Care. Patterns of negligence often begin with these environmental factors.";
            severity = "minor";
        }

        pendingEntry = { id: Date.now(), grit: text, analysis: analysis, stamp: new Date().toLocaleString(), agree: false, tier: severity };
        if (analysis) {
            document.getElementById('warningMsg').innerHTML = `<b>AI Cross-Reference Found:</b><br><br>${analysis}<br><br><i>Include legal analysis in the stack?</i>`;
            document.getElementById('warningOverlay').style.display = 'flex';
        } else { saveFinal(); }
        box.value = '';
    }

    function applyStack(agree) {
        pendingEntry.agree = agree;
        document.getElementById('warningOverlay').style.display = 'none';
        saveFinal();
    }

    function saveFinal() {
        timelineVault.push(pendingEntry);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
        refreshDisplay();
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const group = document.createElement('div'); group.className = 'stack-group';
            const gritCard = `<div class="entry tier-${item.tier}"><span style="font-size:10px; color:var(--teal); font-weight:900;">📍 Langley, BC | ${item.stamp}</span><p style="margin:10px 0 0; font-weight:800;">${item.grit}</p></div>`;
            const analysisCard = item.analysis ? `<div class="entry analysis-card tier-${item.tier}"><b>LEGAL CROSS-REF:</b><br><span style="font-size:12px; font-weight:900;">${item.analysis}</span></div>` : "";
            group.innerHTML = item.agree ? analysisCard + gritCard : gritCard + analysisCard;
            list.appendChild(group);
        });
    }
    function useTemplate(t) { const templates = {'INCIDENT': 'ACTION:\nVIOLATION:\nWITNESS:', 'INJURY': 'NATURE OF INJURY:\nFIRST AID:', 'LOCATION': 'SITE:\nHAZARDS:'}; document.getElementById('statusBox').value = templates[t]; }
    function triggerSync() { alert("Locked & Synced to Clio Secure Cloud."); }
</script>
</body>
</html>
