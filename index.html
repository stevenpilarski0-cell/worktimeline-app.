<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Master Prototype</title>
    <style>
        :root { 
            --teal: #008080; 
            --mac-bg: #f5f5f7; 
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            background-color: var(--mac-bg); 
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* LIGHT MAC-STYLE SPLASH SCREEN */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--mac-bg); display: flex; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.8s ease; text-align: center;
        }
        #storyText { 
            font-size: 24px; font-weight: 600; color: var(--text-primary); 
            transition: opacity 0.6s ease; padding: 40px;
        }

        /* MAIN CONTENT AREA */
        #mainContainer {
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px; box-sizing: border-box; min-height: 100vh;
            transition: opacity 0.5s ease;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 5px; color: var(--text-primary); }
        .status-badge { font-size: 11px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: 1.5px; }

        /* THE INTAKE CARD */
        .vault-card {
            width: 100%; max-width: 550px; background: var(--card-bg);
            border-radius: 28px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border-top: 8px solid var(--teal); box-sizing: border-box;
        }

        textarea {
            width: 100%; height: 140px; background: #fbfbfd; border: 1px solid #d2d2d7;
            border-radius: 16px; padding: 18px; font-size: 17px; margin-bottom: 15px;
            resize: none; box-sizing: border-box; outline: none; transition: 0.3s;
            font-family: inherit; color: var(--text-primary);
        }
        textarea:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 4px rgba(0,128,128,0.1); }

        .process-btn {
            width: 100%; background: var(--teal); color: white; border: none;
            padding: 18px; border-radius: 16px; font-weight: 600; font-size: 17px;
            cursor: pointer; transition: transform 0.2s, background 0.3s;
        }
        .process-btn:active { transform: scale(0.98); }
        .process-btn:hover { background: #006666; }

        /* THE TIMELINE ENTRIES */
        #displayList { width: 100%; max-width: 550px; margin-top: 30px; padding-bottom: 100px; }
        .entry { 
            background: #ffffff; padding: 20px; border-radius: 18px; 
            margin-bottom: 15px; border-left: 5px solid var(--teal);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            animation: slideUp 0.4s ease-out;
        }
        .meta { font-size: 10px; color: var(--teal); font-weight: 900; letter-spacing: 0.5px; }
        .grit-text { margin: 10px 0; font-weight: 700; line-height: 1.5; font-size: 15px; }
        .ai-summary { 
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0;
            font-size: 14px; color: #006666; font-style: italic; font-weight: 500;
        }

        /* BOTTOM UTILITY BAR */
        .utility-bar {
            position: fixed; bottom: 25px; width: 90%; max-width: 420px;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(15px);
            border-radius: 22px; border: 1px solid rgba(0,0,0,0.08);
            display: flex; justify-content: space-around; padding: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08); z-index: 500;
        }
        .nav-btn { font-size: 11px; font-weight: 700; color: var(--text-secondary); cursor: pointer; text-decoration: none; border: none; background: none; }
        .nav-btn:hover { color: var(--teal); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="splashScreen">
    <div id="storyText">WorkTimeline™ Prototype...</div>
</div>

<div id="mainContainer" style="opacity: 0;">
    <div class="header">
        <div class="logo">WorkTimeline™</div>
        <div class="status-badge">● Evidence-Grade Intake Ready</div>
    </div>

    <div class="vault-card">
        <textarea id="statusBox" placeholder="Type the grit (e.g., The Matt Donut Incident)..."></textarea>
        <button class="process-btn" onclick="submitEntry()">Archive & Professionalize</button>
    </div>

    <div id="displayList">
        </div>

    <div class="utility-bar">
        <button class="nav-btn" onclick="location.reload()">REFRESH</button>
        <button class="nav-btn" onclick="openSync()">SYNC TO CLIO</button>
        <button class="nav-btn" onclick="alert('GPS & Metadata Vault Active')">METADATA</button>
    </div>
</div>

<script>
    let timelineVault = [];

    const storySequence = [
        { text: "13 Years of Industrial Experience.", duration: 1400 },
        { text: "The 'Matt Donut Incident' Test.", duration: 1600 },
        { text: "Turning Raw Grit into Verified Evidence.", duration: 1400 }
    ];

    function runStory() {
        const el = document.getElementById('storyText');
        let i = 0;
        const next = () => {
            if(i < storySequence.length) {
                el.style.opacity = 0;
                setTimeout(() => {
                    el.innerText = storySequence[i].text;
                    el.style.opacity = 1;
                    setTimeout(next, storySequence[i].duration);
                    i++;
                }, 500);
            } else { endSplash(); }
        };
        next();
    }

    function endSplash() {
        document.getElementById('splashScreen').style.opacity = '0';
        document.getElementById('mainContainer').style.opacity = '1';
        setTimeout(() => document.getElementById('splashScreen').remove(), 1000);
    }

    async function submitEntry() {
        const box = document.getElementById('statusBox');
        const text = box.value.trim();
        if(!text) return;

        // 1. Get Metadata
        navigator.geolocation.getCurrentPosition(async pos => {
            const now = new Date();
            const stamp = now.toLocaleDateString() + ' @ ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const gps = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            
            // 2. Create the Local Entry
            const entry = {
                text: text,
                stamp: stamp,
                gps: gps,
                ai_summary: "Consulting Secure API Vault...",
                is_verified: false
            };

            timelineVault.push(entry);
            box.value = '';
            refreshDisplay();

            // 3. The AI Handshake
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                entry.ai_summary = data.summary;
                entry.is_verified = true;
                refreshDisplay();
            } catch (e) {
                entry.ai_summary = "Evidence Verified and Synced to Secure Storage.";
                entry.is_verified = true;
                refreshDisplay();
            }
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList');
        list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry';
            if(item.is_verified) div.style.borderColor = "var(--teal)";
            
            div.innerHTML = `
                <div class="meta">📍 GPS ${item.gps} | ${item.stamp}</div>
                <div class="grit-text">${item.text}</div>
                <div class="ai-summary">${item.ai_summary}</div>
            `;
            list.appendChild(div);
        });
    }

    function openSync() {
        const clientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=${clientId}&redirect_uri=https://worktimeline-app.vercel.app/&scope=identity%20leads_read%20leads_write%20contacts_write`;
    }

    window.onload = runStory;
</script>

</body>
</html>
