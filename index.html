<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        :root { 
            --teal: #008080; 
            --silver-gray: #95a5a6; 
            --gray-bg: #e2e8f0; 
            --teal-soft: rgba(0, 128, 128, 0.12); 
            --clio-blue: #0076CE; 
            --clio-green: #2ecc71; 
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; color: #2d3748; }
        
        .app-locked { filter: blur(35px); pointer-events: none; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer, .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.15; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; text-align: center; overflow: hidden; }
        
        /* HEADER - LEFT ALIGNED BRAND BLOCK */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 4000; position: relative; }
        .header-top { display: flex; justify-content: flex-start; align-items: center; gap: 0px; }
        .brand-text { display: flex; flex-direction: column; align-items: flex-start; }
        .brand-sub { font-size: 7px; font-weight: 900; color: var(--teal); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; margin-left: 5px; }
        .main-title { font-weight: 900; font-size: 17px; display: flex; align-items: center; justify-content: flex-start; gap: 0px; letter-spacing: -0.5px; }
        .work-silver { color: var(--silver-gray); }
        .timeline-teal { color: var(--teal); margin-left: -1px; }

        .clio-pulse { width: 6px; height: 6px; background-color: var(--clio-green); border-radius: 50%; animation: clio-throb 2s infinite; margin-left: 8px; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* MAC-STYLE PILLS */
        .media-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .media-pill { background: rgba(226, 232, 240, 0.8); border: 1px solid var(--gray-border); padding: 10px 18px; border-radius: 50px; font-size: 10px; flex: 1; font-weight: 800; color: #4a5568; cursor: pointer; letter-spacing: 0.5px; }

        /* DRAWERS */
        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 3500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; }
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 1.5px solid var(--gray-border); z-index: 4500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(100% - 40px)); border-radius: 30px 30px 0 0; }
        .handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 35px; height: 4px; background: #a0aec0; border-radius: 10px; }

        /* DRAGGABLES */
        .draggable { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; color: white; border-radius: 22px; border: none; box-shadow: var(--mac-shadow); touch-action: none; }
        #addBtn { width: 70px; height: 70px; background: var(--teal); font-size: 30px; top: 160px; right: 20px; }
        #syncBtn { width: 70px; height: 70px; background: var(--clio-blue); font-size: 8px; padding: 6px; top: 250px; right: 20px; }

        /* TIMELINE - MAC MESSAGE BUBBLE STYLE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 150px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
        .entry { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 20px; 
            margin-bottom: 4px; 
            text-align: left; 
            position: relative; 
            font-family: 'Nunito Sans', sans-serif;
            align-self: flex-start; /* Mac incoming style */
            background: #f1f1f1;
            border: 1px solid #e5e5e5;
        }
        .stamp-label { font-size: 9px; font-weight: 800; color: #a0aec0; margin-bottom: 4px; text-transform: uppercase; }
        .entry p { font-weight: 600; font-size: 14px; line-height: 1.4; color: #1a202c; margin: 0; }
        
        /* EA SUPER SERIOUS - MAC BUBBLE (TEAL ACCENT) */
        .tier-serious { 
            align-self: flex-end; /* Mac outgoing style */
            background: white; 
            border: 2px solid var(--teal); 
            animation: pulse-ser 3s infinite;
        }
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.2); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        /* OVERLAYS */
        #overlaySystem { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 25px; }
        .modal-card { background: white; padding: 40px 30px; border-radius: 35px; box-shadow: var(--mac-shadow); width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 18px; border-radius: 20px; width: 100%; font-weight: 800; margin-top: 15px; cursor: pointer; font-size: 14px; }
        .appeasing-text { font-size: 14px; line-height: 1.6; color: #4a5568; margin: 20px 0; font-weight: 600; }

        .template-chip { border: 1.5px solid var(--gray-border); padding: 8px 16px; border-radius: 15px; font-size: 10px; font-weight: 800; color: #4a5568; background: white; cursor: pointer; }
        textarea { width: 100%; height: 85px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-family: 'Nunito Sans', sans-serif; font-weight: 600; font-size: 15px; outline: none; background: #fafafa; }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card" id="modalContent">
        <h2 style="color: #1a202c; font-weight: 900; margin: 0; letter-spacing: -0.5px;">INTAKE GUARD</h2>
        <div class="appeasing-text">We are here to help you document the truth.<br><br>While this journal provides vital evidence support, <b>we do not offer legal advice.</b><br><br>Proceed to secure your workplace records.</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">SECURE MY JOURNAL</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div class="header-top">
            <svg width="40" height="30" viewBox="0 0 44 34" fill="none">
                <rect x="4" y="10" width="36" height="20" rx="4" stroke="var(--teal)" stroke-width="2.5"/>
                <path d="M16 10V6C16 4.89543 16.8954 4 18 4H26C27.1046 4 28 4.89543 28 6V10" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="0" y1="20" x2="44" y2="20" stroke="var(--teal)" stroke-width="2.5"/>
                <circle cx="10" cy="20" r="3" fill="var(--teal)" stroke="white" stroke-width="1"/><circle cx="22" cy="20" r="3" fill="var(--teal)" stroke="white" stroke-width="1"/><circle cx="34" cy="20" r="3" fill="var(--teal)" stroke="white" stroke-width="1"/>
            </svg>
            <div class="brand-text">
                <div class="brand-sub">Takin'Intake</div>
                <div class="main-title"><span class="work-silver">Work</span><span class="timeline-teal">Timeline</span>™ <div class="clio-pulse"></div></div>
            </div>
            <div style="position:absolute; right:15px; display:flex; flex-direction:column; gap:4px;">
                <button onclick="document.getElementById('appBody').classList.toggle('ghost-active')" style="background:var(--teal-soft); color:var(--teal); border:none; border-radius:20px; font-size:7px; font-weight:900; padding:4px 10px;">GHOST</button>
                <button onclick="refresh()" style="background:var(--teal-soft); color:var(--teal); border:none; border-radius:20px; font-size:7px; font-weight:900; padding:4px 10px;">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 20px 20px 50px;">
            <div style="display:flex; gap:8px; justify-content:center; margin-bottom: 15px;">
                <button onclick="useTemplate('INCIDENT')" class="template-chip">INCIDENT</button>
                <button onclick="useTemplate('INJURY')" class="template-chip">INJURY</button>
                <button onclick="useTemplate('LOCATION')" class="template-chip">LOCATION</button>
                <button onclick="useTemplate('WITNESS')" class="template-chip">WITNESS</button>
            </div>
            <div class="media-row">
                <label class="media-pill">CAMERA <input type="file" style="display:none;"></label>
                <label class="media-pill">AUDIO <input type="file" style="display:none;"></label>
                <label class="media-pill">DOCUMENT <input type="file" style="display:none;"></label>
            </div>
            <textarea id="statusBox" placeholder="Documenting the grit..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable" onclick="clioHandshake()">SYNC</button>

    <div id="mgmtDrawer">
        <div class="handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 5px 30px 40px;">
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="alert('Exporting Industrial Evidence...')">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#f1f5f9; color:#718096;" onclick="confirm('Wipe record?') && (localStorage.clear() || location.reload())">START FRESH</button>
        </div>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let utilOpen = false; let mgmtOpen = false;

    function unlockApp() { document.getElementById('overlaySystem').style.display = 'none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function showOverlay(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('overlaySystem').style.display = 'flex'; }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 40px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }

    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.onmousedown = dStart; el.ontouchstart = dStart;
        function dStart(e) { p3 = e.clientX || e.touches[0].clientX; p4 = e.clientY || e.touches[0].clientY; document.onmouseup = dEnd; document.ontouchend = dEnd; document.onmousemove = dMove; document.ontouchmove = dMove; }
        function dMove(e) { let cx = e.clientX || e.touches[0].clientX; let cy = e.clientY || e.touches[0].clientY; p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; }
        function dEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
    }
    makeDraggable(document.getElementById("addBtn")); makeDraggable(document.getElementById("syncBtn"));

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        let analysis = text.toLowerCase().includes("fire") ? "EA: Retaliation marker detected." : "";
        let item = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: analysis ? 'serious' : 'minor', flipped: false };
        if(analysis) { showOverlay(`<h3 style="margin-top:0;">EA DETECTION</h3><div class="appeasing-text">${analysis}</div><button class="modal-btn" style="background:var(--teal);color:white" onclick="saveFinal(${JSON.stringify(item).replace(/"/g, '&quot;')})">POST ANALYSIS</button>`); }
        else { saveFinal(item); }
        document.getElementById('statusBox').value = ''; if(utilOpen) toggleUtility();
    }

    function clioHandshake() {
        if(vault.length === 0) return;
        showOverlay(`<h3 style="margin-top:0; color:var(--clio-blue);">SYNC SUMMARY</h3><div class="appeasing-text">Your industrial truth has been verified. Summarizing for Clio handshake. Proceed?</div><button class="modal-btn" style="background:var(--clio-blue);color:white" onclick="alert('Synced');unlockApp()">YES, SYNC NOW</button>`);
    }

    function saveFinal(item) { vault.push(item); localStorage.setItem('wt_timeline', JSON.stringify(vault)); unlockApp(); refresh(); }
    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...vault].reverse().forEach((item, index) => {
            const trueIdx = vault.length - 1 - index;
            const content = item.flipped ? `<div class="stamp-label">AI CROSS-REFERENCE</div><b>EA ANALYSIS:</b><br>${item.analysis}` : `<div class="stamp-label">📍 LANGLEY | ${item.stamp}</div><p>${item.grit}</p>`;
            const flip = item.analysis ? `<button onclick="flip(${trueIdx})" style="position:absolute;top:5px;right:-40px;background:var(--teal);color:white;border:none;padding:5px;border-radius:50px;font-size:7px;font-weight:900;">FLIP</button>` : "";
            list.innerHTML += `<div class="entry tier-${item.tier}">${flip}${content}</div>`;
        });
    }

    function flip(idx) { vault[idx].flipped = !vault[idx].flipped; refresh(); }
    function useTemplate(t) { 
        const ts = { 'INCIDENT': 'ACTION:\nVIOLATION:', 'INJURY': 'OFA RECORD:\nINJURY:', 'LOCATION': 'SITE:\nHAZARDS:', 'WITNESS': 'NAME:\nCONTACT:' };
        document.getElementById('statusBox').value = ts[t];
    }

    let sX, sY;
    document.getElementById("addBtn").addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    document.getElementById("addBtn").addEventListener('touchend', e => {
        let dx = Math.abs(e.changedTouches[0].clientX - sX); let dy = Math.abs(e.changedTouches[0].clientY - sY);
        if(dx < 10 && dy < 10) submitEntry();
    });
    refresh();
</script>
</body>
</html>
