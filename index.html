<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7); 
            --round-main: 36px; --round-inner: 22px; --round-pill: 999px;
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #eef1f5; margin: 0; padding: 12px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* 45-SECOND THEATRIC INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1.2s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 480px; letter-spacing: -0.5px; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); border: 1px solid rgba(255,255,255,0.6); }
        
        /* PRIVACY/GHOST BOX */
        #privacyBlur { position: absolute; top: 85px; left: 0; right: 0; bottom: 0; z-index: 98; background: rgba(255, 255, 255, 0); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.5s ease; }
        body.privacy-active #privacyBlur { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(238, 241, 245, 0.7); pointer-events: all; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--platinum); z-index: 100; background: white; }

        /* MODAL (Summary Notification) */
        #summaryModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(10px); }
        .modal-card { background: white; border-radius: var(--round-main); padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        /* MODERN INPUT AREA */
        .input-area { padding: 15px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); }
        #statusBox { width: 100%; height: 90px; padding: 16px; border-radius: var(--round-inner); border: 1px solid var(--platinum); font-family: inherit; font-size: 15px; outline: none; resize: none; background: white; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); transition: border-color 0.3s; }
        #statusBox:focus { border-color: var(--teal); }
        
        /* CHRON TEMPLATE CHIPS */
        .chron-chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 15px; background: white; border-bottom: 1px solid var(--platinum); }
        .chron-chips::-webkit-scrollbar { display: none; }
        .chip { background: var(--gray-light); color: var(--teal); border: 1px solid var(--platinum); padding: 8px 18px; border-radius: var(--round-pill); font-size: 11px; font-weight: 800; white-space: nowrap; transition: 0.2s; cursor: pointer; }
        .chip:active { background: var(--teal); color: white; border-color: var(--teal); }

        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 15px 20px; background: var(--gray-light); }
        .media-btn { background: white; border: 1px solid var(--platinum); padding: 12px 2px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .media-btn svg { width: 20px; height: 20px; fill: var(--teal); margin-bottom: 6px; }
        .media-btn span { font-size: 9px; font-weight: 800; color: var(--gray-dark); text-transform: uppercase; letter-spacing: 0.5px; }

        /* TIMELINE DISPLAY */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; background: white; }
        .entry { position: relative; padding: 20px; background: white; border: 1px solid var(--platinum); border-radius: var(--round-inner); margin-bottom: 15px; border-left: 6px solid var(--teal); box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
        .time-label { font-size: 11px; font-weight: 800; color: #94a3b8; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .gps-coords { font-size: 10px; font-weight: 700; color: var(--clio-blue); display: block; margin-bottom: 8px; font-style: italic; }

        /* LOCK & SYNC BUTTON (PADLOCK FIT) */
        .footer-action { padding: 20px; background: var(--gray-light); border-top: 1px solid var(--platinum); }
        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 18px; border-radius: var(--round-pill); width: 100%; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 10px 20px rgba(0, 118, 206, 0.2); }
        
        /* TOGGLES */
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: var(--round-pill); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <label style="position:fixed; top:20px; right:20px; font-size:10px; color:#94a3b8; font-weight:700; display:flex; align-items:center; gap:8px;">
        SKIP <input type="checkbox" onchange="endSplash()">
    </label>
</div>

<div id="summaryModal">
    <div class="modal-card">
        <div style="background: var(--clio-blue); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
            <svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
        </div>
        <h2 style="color:var(--gray-dark); margin-bottom: 10px;">Lock and Send Timeline</h2>
        <p id="modalSummary" style="font-size: 14px; color: #64748b; margin-bottom: 25px; line-height: 1.5;"></p>
        <button onclick="finalSyncToClio()" style="background: var(--clio-blue); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer;">Sealing: Send to Attorney</button>
        <button onclick="closeModal()" style="background: transparent; color: #94a3b8; border: none; margin-top: 15px; font-weight: 700; cursor: pointer;">Go Back</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <div id="privacyBlur"></div>
    <header class="header">
        <div><h1 id="folderLabel" style="color: var(--teal); margin:0; font-size: 18px; font-weight: 800; letter-spacing: -0.5px;">WorkTimeline™</h1><div style="font-size: 12px; font-weight: 600; color: var(--clio-blue);">The Truth Handshake</div></div>
        <div style="display:flex; gap:12px; align-items: center;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 700; margin-top: 4px;">NOTES</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" id="pSwitch" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 700; margin-top: 4px;">PRIVACY</div></div>
        </div>
    </header>

    <div class="chron-chips">
        <span class="chip" onclick="useT('WITNESS LOCATION:\n- Name:\n- GPS Address:')">+ Witness</span>
        <span class="chip" onclick="useT('INCIDENT SITE:\n- Road/Setting:\n- Lighting:')">+ Location</span>
        <span class="chip" onclick="useT('EVIDENCE:\n- Type:\n- storage:')">+ Evidence</span>
    </div>

    <div class="input-area">
        <textarea id="statusBox" placeholder="Tap a chip above or tell your truth..."></textarea>
        <div class="media-toolbar">
            <button class="media-btn"><input type="file" accept="image/*" capture="camera" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;" onchange="logEntry('📷 Media: Photo evidense secured.')"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>Camera</span></button>
            <button class="media-btn"><input type="file" accept="audio/*" capture="microphone" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;" onchange="logEntry('🎤 Media: Audio evidense secured.')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg><span>Audio</span></button>
            <button class="media-btn" onclick="window.location.href='sms:?body=WorkTimeline Update:'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg><span>Text</span></button>
            <button class="media-btn"><input type="file" style="position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;" onchange="logEntry('📄 Media: Document evidenced.')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>Docs</span></button>
        </div>
        <button onclick="submitE()" style="background:var(--teal); color:white; border:none; padding:15px; border-radius:12px; width:100%; font-weight:800; cursor:pointer;">Secure & Build Timeline</button>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <div class="footer-action">
        <button class="sync-btn" onclick="openSyncSummary()">
            <svg width="22" height="22" fill="white" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            Sealing the Truth
        </button>
    </div>
</div>

<script>
    const story = ["We see you.", "Trapped in the grey area.", "Lawyers lose 40% of their time to unorganized intake.", "WorkTimeline tears down the prison walls.", "Justice is effortless now, if telling the truth takes no effort."];
    let activeV = "TIMELINE"; const timelineV = []; const notesV = [];
    let sIdx = 0; let sTimer;

    window.onload = () => runS();

    function runS() {
        const el = document.getElementById('storyText');
        const next = () => {
            if(sIdx < story.length) {
                el.style.opacity = 0;
                sTimer = setTimeout(() => { el.innerText = story[sIdx++]; el.style.opacity = 1; sTimer = setTimeout(next, 3000); }, 800);
            } else endSplash();
        };
        next();
    }
    function endSplash() { clearTimeout(sTimer); const s = document.getElementById('splashScreen'); if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 1200); } }

    function toggleVault(cb) {
        activeV = cb.checked ? "NOTES" : "TIMELINE";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refreshD();
    }
    function togglePrivacy() {
        const ov = document.getElementById('privacyBlur'); const sw = document.getElementById('pSwitch');
        ov.style.backdropFilter = sw.checked ? "blur(40px) grayscale(1)" : "blur(0px)";
        ov.style.pointerEvents = sw.checked ? "all" : "none";
    }
    function useT(t) { document.getElementById('statusBox').value = t; document.getElementById('statusBox').focus(); }
    function submitE() { const b = document.getElementById('statusBox'); if(!b.value.trim()) return; logEntry(b.value); b.value = ''; }
    
    function logEntry(txt) {
        // GPS ENGINE
        navigator.geolocation.getCurrentPosition((pos) => {
            const gps = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            
            // TIME ENGINE (A.M./P.M.)
            const now = new Date();
            const timeStr = now.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            const stamp = (now.getMonth()+1) + '/' + now.getDate() + ' @ ' + timeStr;
            
            const entry = { txt: txt, stamp: stamp, gps: gps };
            if(activeV === "TIMELINE") timelineV.push(entry); else notesV.push(entry);
            refreshD();
        }, () => alert("GPS Permission Denied. Geocoding required for legal verification."));
    }

    function refreshD() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = (activeV === "TIMELINE") ? timelineV : notesV;
        [...data].reverse().forEach(i => {
            list.innerHTML += `<div class="entry" style="border-left-color:${activeV === "NOTES" ? "var(--clio-blue)" : "var(--teal)"}"><span class="time-label">${i.stamp}</span><span class="gps-coords">📍 ${i.gps}</span><p style="white-space:pre-wrap; margin:0; font-size:14px; font-weight:500; line-height: 1.5;">${i.txt}</p></div>`;
        });
    }

    function openSyncSummary() {
        const total = timelineV.length + notesV.length;
        if(total === 0) return alert("Nothing to seal.");
        document.getElementById('modalSummary').innerText = `Closing Handshake: You are preparing to lock ${timelineV.length} timeline entries and ${notesV.length} private notes. Once sealed, this structured evidence will be securely transmitted to your law firm via Clio.`;
        document.getElementById('summaryModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('summaryModal').style.display = 'none'; }
    function finalSyncToClio() { alert("Sealing Complete. Syncing data to Clio dashboard."); window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write`; }
</script>
</body>
</html>
