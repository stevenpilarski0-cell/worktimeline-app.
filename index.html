<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Elite 7.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --teal-dark: #004d4d; --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; --notes-gold: #f1c40f; --slate: #64748b;
        }

        body { 
            font-family: 'Nunito', sans-serif; background: #f8fafc; 
            margin: 0; padding: 0; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* GHOST MODE BLUR */
        .ghost-active #timelineContainer { filter: blur(25px) grayscale(1); opacity: 0.2; pointer-events: none; }
        .notes-mode { background: #fffdf2 !important; }

        /* --- HEADER --- */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; border-bottom: 1.5px solid var(--platinum); 
            background: white; z-index: 10000; 
        }
        .brand-group { display: flex; align-items: center; gap: 8px; }
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        .sub-title { font-weight: 900; color: var(--teal); font-size: 11px; letter-spacing: -1.1px; margin: 0; }

        /* --- TOGGLES --- */
        .toggle-group { display: flex; gap: 12px; align-items: center; }
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider.teal { background-color: var(--teal); }
        input:checked + .slider.gold { background-color: var(--notes-gold); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- HIGH VISIBILITY PULL-UP DRAWER --- */
        #mgmtDrawer { 
            position: fixed; 
            bottom: -320px; /* Hidden deep */
            left: 0; width: 100%; 
            background: white; 
            border-top: 6px solid var(--teal); 
            z-index: 999999; /* TOP LEVEL */
            border-radius: 35px 35px 0 0; 
            transition: bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -15px 50px rgba(0,0,0,0.3);
            padding-bottom: 50px;
        }
        #mgmtDrawer.active { bottom: 0 !important; }
        
        /* THE VISIBLE HANDLE PILL */
        .pull-handle { 
            width: 100%; 
            height: 70px; /* Taller handle zone */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            cursor: pointer;
            padding-top: 15px;
            position: absolute;
            top: -70px; /* Forces it to stay visible even when drawer is closed */
            background: transparent;
        }
        .handle-pill { 
            width: 60px; height: 8px; 
            background: var(--teal); 
            border-radius: 10px; 
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(0, 128, 128, 0.4);
            animation: handle-bounce 2s infinite;
        }
        .handle-text { font-size: 10px; font-weight: 900; color: var(--teal); letter-spacing: 2px; }

        @keyframes handle-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- BUTTONS --- */
        .drawer-btn { border: none; padding: 18px; border-radius: 50px; font-weight: 900; width: 85%; font-size: 14px; margin: 0 auto 15px; display: block; cursor: pointer; color: white; }
        .btn-save-sync { background: var(--teal); }
        .btn-new-journal { background: var(--slate); }

        #addBtn { position: absolute; z-index: 9000; width: 75px; height: 75px; border-radius: 22px; background: var(--teal); color: white; font-weight: 900; font-size: 35px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); right: 20px; top: 160px; }

        /* --- CONTENT --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 150px; background: #fafbfc; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--teal); }
        #statusBox { width: 100%; height: 110px; padding: 15px; border-radius: 22px; border: 2.5px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }
    </style>
</head>
<body id="appBody">

<header class="header">
    <div class="brand-group">
        <svg width="45" height="45" viewBox="0 0 24 24" fill="none">
            <path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="6" y1="13.5" x2="18" y2="13.5" stroke="var(--teal)" stroke-width="1" stroke-dasharray="2 2"/>
            <circle cx="8" cy="13.5" r="1.5" fill="var(--teal)"/>
            <circle cx="12" cy="13.5" r="1.5" fill="var(--teal)"/>
            <circle cx="16" cy="13.5" r="1.5" fill="var(--teal)"/>
        </svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <span class="sub-title">TAKIN'INTAKE</span>
        </div>
    </div>
    <div class="toggle-group">
        <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider teal"></span></label><div style="font-size:7px; font-weight:900;">GHOST</div></div>
        <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider gold"></span></label><div style="font-size:7px; font-weight:900;">NOTES</div></div>
    </div>
</header>

<div style="padding:15px; background:white; border-bottom:1.5px solid var(--platinum);"><textarea id="statusBox" placeholder="Start new intake record..."></textarea></div>

<button id="addBtn" onclick="submitEntry()">+</button>

<div id="timelineContainer"><div id="displayList"></div></div>

<div id="mgmtDrawer">
    <div class="pull-handle" onclick="toggleDrawer()">
        <div class="handle-pill"></div>
        <div class="handle-text">MANAGEMENT</div>
    </div>
    <div style="padding-top:40px;">
        <button class="drawer-btn btn-save-sync" onclick="alert('Artifact Syncing to Clio Grow...')">SAVE & SYNC CLIO</button>
        <button class="drawer-btn btn-new-journal" onclick="confirmReset()">START NEW TIMELINE</button>
    </div>
</div>

<script>
    let activeVault = "TIMELINE";
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    const notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];

    window.onload = () => { refreshDisplay(); };

    function toggleDrawer() { document.getElementById('mgmtDrawer').classList.toggle('active'); }
    function toggleGhost(cb) { document.getElementById('appBody').classList.toggle('ghost-active', cb.checked); }

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('notes-mode', cb.checked);
        document.getElementById('addBtn').style.background = cb.checked ? 'var(--notes-gold)' : 'var(--teal)';
        refreshDisplay();
    }

    function submitEntry() {
        const b = document.getElementById('statusBox'); if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = { id: Date.now(), content: b.value, stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}` };
            if(activeVault === "TIMELINE") { timelineVault.push(entry); localStorage.setItem('wt_timeline', JSON.stringify(timelineVault)); }
            else { notesVault.push(entry); localStorage.setItem('wt_notes', JSON.stringify(notesVault)); }
            b.value = ''; refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `entry ${activeVault === 'NOTES' ? 'note-item' : ''}`;
            const bodyText = item.content || item.grit || "No data";
            div.innerHTML = `<div style="font-size:9px; font-weight:900; color:var(--dark-silver);">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin:5px 0 0; white-space:pre-wrap; line-height:1.4;">${bodyText}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { if(confirm("Start new timeline?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
