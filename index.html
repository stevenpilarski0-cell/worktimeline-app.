<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline™ | Secure Portal</title>
    
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* 1. Background Gradient: Platinum to Teal */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Platinum (#E5E4E2) to Teal (#008080) */
            background: linear-gradient(180deg, #E5E4E2 0%, #008080 100%);
            background-attachment: fixed;
        }

        /* 2. Container Design from 1000026174.jpg */
        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #008080; /* Teal Accent */
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* 3. Button Styles */
        .btn {
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 15px;
            transition: transform 0.1s ease, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active { transform: scale(0.98); }

        .btn-clio-client { background-color: #0070D2; color: white; }
        .btn-clio-firm { background-color: #2D3E50; color: white; }
        .btn-create { background-color: #ffffff; color: #008080; border: 2px solid #008080; }

        /* 4. Input Styles */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #d1d9d9;
            border-radius: 10px;
            background: #fdfdfd;
            box-sizing: border-box;
        }

        .divider {
            margin: 25px 0;
            border-top: 1px solid #eee;
            position: relative;
        }

        .divider::after {
            content: "OR";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 12px;
            font-size: 12px;
            color: #999;
            font-weight: bold;
        }

        #lockMessage {
            color: #c0392b;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>WorkTimeline™</h2>
        
        <!-- Clio Options based on 1000026174.jpg -->
        <button id="clioClientBtn" class="btn btn-clio-client">Client Sign in with Clio</button>
        <button id="clioFirmBtn" class="btn btn-clio-firm">Firm Sign in with Clio</button>
        
        <div class="divider"></div>
        
        <!-- Manual Account Creation -->
        <h3>Create Account</h3>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button id="signupBtn" class="btn btn-create">Create Account with WorkTimeline</button>
        
        <div id="lockMessage">LOCK ACTIVATED: Timeline is verified and read-only.</div>
        <div id="status"></div>
    </div>

    <script>
        // Initialize Supabase
        const _supabaseUrl = 'https://sghmgiaaqcuymqnfbleh.supabase.co'; 
        const _supabaseKey = 'Sb_publishable_VL3kSjtNHGvLcmZYi1YXnA_Xlo8zpXy';
        const _supabase = supabase.createClient(_supabaseUrl, _supabaseKey);

        // 1. Clio Login Handlers
        async function clioLogin(role) {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'clio',
                options: { 
                    redirectTo: 'https://worktimeline-app.vercel.app/',
                    queryParams: { role: role }
                }
            });
            if (error) console.error(error.message);
        }

        document.getElementById('clioClientBtn').onclick = () => clioLogin('client');
        document.getElementById('clioFirmBtn').onclick = () => clioLogin('firm');

        // 2. Manual Sign Up Logic
        document.getElementById('signupBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { role: 'client' } }
            });

            if (error) alert("Error: " + error.message);
            else alert("Success! Check your email to confirm your account.");
        };

        // 3. Lock Feature Implementation
        async function checkIntegrityLock(userId) {
            const { data } = await _supabase
                .from('profiles')
                .select('timeline_status')
                .eq('id', userId)
                .single();

            if (data && data.timeline_status === 'locked') {
                document.getElementById('signupBtn').disabled = true;
                document.getElementById('lockMessage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
