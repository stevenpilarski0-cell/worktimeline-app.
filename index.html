<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; 
            --clio-green: #2ecc71; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95);
            --teal-alpha: rgba(0, 128, 128, 0.15);
        }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* WARNING MODAL */
        #legalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.9); backdrop-filter: blur(8px); z-index: 200000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 30px; border-radius: 28px; text-align: center; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 15px 40px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 20px; }

        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(18px); opacity: 0.6; pointer-events: none; }

        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1.2s ease; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 420px; }
        #skipBtn { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); padding: 14px 28px; border: 3px solid var(--teal); border-radius: 99px; background: white; color: var(--teal); font-weight: 900; font-size: 13px; cursor: pointer; z-index: 100001; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.12); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 25px 12px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; z-index: 3000; background: white; }
        .briefcase-logo { position: relative; width: 38px; height: 26px; border: 3.5px solid var(--gray-dark); border-radius: 8px; }
        .briefcase-handle { position: absolute; top: -8.5px; left: 50%; transform: translateX(-50%); width: 14px; height: 5px; border: 3.5px solid var(--gray-dark); border-bottom: none; border-radius: 4px 4px 0 0; }
        .teal-spine { position: absolute; top: 50%; left: -8px; right: -8px; height: 3.5px; background: var(--teal); border-radius: 2px; transform: translateY(-50%); }
        .teal-dots { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 3px; }
        .dot { width: 4px; height: 4px; background: var(--teal); border-radius: 50%; border: 1px solid white; }

        .switch-group { display: flex; gap: 12px; align-items: center; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        .draggable-btn { position: absolute; z-index: 5000; touch-action: none; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none; width: 65px; height: 65px; border-radius: 20px; color: white; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); }
        #addBtn { right: 20px; top: 160px; background: var(--teal); font-size: 40px; }
        #syncBtn { right: 20px; top: 240px; background: var(--clio-blue); }

        #utilityDrawer { width: 100%; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 2px solid var(--platinum); z-index: 2500; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        .drawer-content { padding: 15px 20px; }
        #statusBox { width: 100%; height: 85px; padding: 14px; border-radius: 18px; border: 2.5px solid var(--platinum); resize: none; font-family: inherit; font-weight: 600; background: #f8fafc; box-sizing: border-box; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px 15px; position: relative; background: #fdfdfd; z-index: 100; }
        .entry { position: relative; margin-left: 45px; background: white; border: 2px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; z-index: 2; border-left: 8px solid var(--teal); width: calc(100% - 60px); box-sizing: border-box; transition: 0.3s; }
        
        .entry.teal-standard { background: var(--teal-alpha); }
        .entry.is-stacked { box-shadow: 0 8px 0px var(--platinum), 0 15px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body id="appBody">

<div id="legalOverlay">
    <div class="modal-card">
        <h2 style="color:var(--teal); font-weight:900;">Friendly Reminder</h2>
        <p style="font-weight:600; font-size:14px;">WorkTimeline™ is a documentation tool. Our AI verification system does not provide legal advice.</p>
        <button class="modal-btn" onclick="dismissLegal()">I UNDERSTAND</button>
    </div>
</div>

<div id="splashScreen"><h1 id="storyText" class="story-text">Welcome.</h1><button id="skipBtn" onclick="endSplash()">Skip Intro</button></div>

<div class="app-container">
    <header class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="briefcase-logo">
                <div class="briefcase-handle"></div><div class="teal-spine"></div>
                <div class="teal-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <h1 style="color:var(--teal); margin:0; font-size:18px; font-weight:900;">WorkTimeline™</h1>
        </div>
        <div class="switch-group">
            <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">GHOST</div></div>
        </div>
    </header>

    <button id="addBtn" class="draggable-btn" onclick="submitEntry()">+</button>

    <div id="utilityDrawer">
        <div class="drawer-content">
            <textarea id="statusBox" placeholder="Start your entry..."></textarea>
        </div>
    </div>

    <div id="timelineContainer">
        <div id="displayList"></div>
    </div>
</div>

<script>
    const story = ["The Invisible 60%...", "Document the Truth.", "WorkTimeline bridges the gap.", "Justice should feel effortless."];
    const timelineVault = [];

    function dismissLegal() { 
        document.getElementById('legalOverlay').style.opacity = '0'; 
        setTimeout(() => { document.getElementById('legalOverlay').remove(); runStory(); }, 500); 
    }
    
    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => { if(i < story.length) { el.style.opacity = 0; setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2500); }, 800); } else endSplash(); };
        next();
    }
    
    function endSplash() { 
        document.getElementById('splashScreen').style.opacity = '0'; 
        setTimeout(() => { document.getElementById('splashScreen').remove(); }, 1000); 
    }
    
    function toggleGhost(cb) { if(cb.checked) document.getElementById('appBody').classList.add('ghost-active'); else document.getElementById('appBody').classList.remove('ghost-active'); }

    async function submitEntry() { 
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return; 
        const text = box.value; box.value = '';
        
        navigator.geolocation.getCurrentPosition(async pos => {
            const entry = {
                id: Date.now(), grit: text, teal: "Analyzing...", 
                stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`,
                isStacked: false, currentView: 'grit'
            };
            timelineVault.push(entry); refreshDisplay();

            try {
                const response = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text }) });
                const data = await response.json();
                entry.teal = data.summary;
                refreshDisplay();
            } catch (e) { entry.teal = "Verified Teal Standard Archived."; refreshDisplay(); }
        });
    }

    function acceptTeal(id) { const entry = timelineVault.find(e => e.id === id); entry.isStacked = true; entry.currentView = 'teal'; refreshDisplay(); }
    function toggleView(id, view) { const entry = timelineVault.find(e => e.id === id); entry.currentView = view; refreshDisplay(); }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `entry ${item.currentView === 'teal' ? 'teal-standard' : ''} ${item.isStacked ? 'is-stacked' : ''}`;
            
            let content = item.currentView === 'teal' ? item.teal : item.grit;
            let actionHtml = !item.isStacked ? 
                `<button onclick="acceptTeal(${item.id})" style="margin-top:10px; width:100%; padding:8px; background:var(--teal); color:white; border:none; border-radius:8px; font-size:10px; font-weight:900;">ACCEPT TEAL STANDARD</button>` :
                `<div style="display:flex; gap:5px; margin-top:10px;">
                    <button onclick="toggleView(${item.id}, 'grit')" style="flex:1; padding:5px; font-size:8px; font-weight:900; background:${item.currentView === 'grit' ? 'var(--gray-dark)' : 'white'}; color:${item.currentView === 'grit' ? 'white' : 'var(--gray-dark)'}; border:1px solid var(--platinum); border-radius:5px;">WHITE</button>
                    <button onclick="toggleView(${item.id}, 'teal')" style="flex:1; padding:5px; font-size:8px; font-weight:900; background:${item.currentView === 'teal' ? 'var(--teal)' : 'white'}; color:${item.currentView === 'teal' ? 'white' : 'var(--teal)'}; border:1px solid var(--teal); border-radius:5px;">TEAL</button>
                </div>`;

            div.innerHTML = `<span style="font-size:9px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span><p style="margin:8px 0 0; font-size:14px; font-weight:700;">${content}</p>${actionHtml}`;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
