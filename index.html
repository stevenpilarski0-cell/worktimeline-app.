<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Ghost Mode Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; 
            --glass: rgba(0, 128, 128, 0.08); --round-inner: 24px;
        }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* PRIVACY BLUR (GHOST MODE) */
        .ghost-active #timelineContainer, .ghost-active .drawer-content { 
            filter: blur(12px); 
            pointer-events: none; /* Prevents accidental clicks while blurred */
            user-select: none;
        }

        /* CINEMATIC INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1.2s ease; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 420px; letter-spacing: -0.5px; }
        #skipBtn { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); padding: 14px 28px; border: 3px solid var(--teal); border-radius: 99px; background: white; color: var(--teal); font-weight: 900; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 8px 20px rgba(0, 128, 128, 0.15); }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.12); box-sizing: border-box; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 25px 12px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; z-index: 1000; background: white; }
        .briefcase-logo { position: relative; width: 38px; height: 26px; border: 3.5px solid var(--gray-dark); border-radius: 8px; flex-shrink: 0; }
        .briefcase-handle { position: absolute; top: -8.5px; left: 50%; transform: translateX(-50%); width: 14px; height: 5px; border: 3.5px solid var(--gray-dark); border-bottom: none; border-radius: 4px 4px 0 0; }
        .teal-spine { position: absolute; top: 50%; left: -8px; right: -8px; height: 3.5px; background: var(--teal); border-radius: 2px; transform: translateY(-50%); }
        .teal-dots { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 3px; }
        .dot { width: 4px; height: 4px; background: var(--teal); border-radius: 50%; border: 1px solid white; }
        .clio-certified { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 900; color: #16a34a; text-transform: uppercase; }
        .pulse-dot { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; animation: pulseGreen 2s infinite; }
        @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }

        /* PRIVACY SWITCHES */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* DRAGGABLE UTILITY DRAWER */
        #utilityDrawer { width: 100%; background: white; border-bottom: 2px solid var(--platinum); z-index: 500; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); position: relative; flex-shrink: 0; }
        .drawer-content { padding: 15px 20px; transition: filter 0.3s; }
        .drag-handle-zone { width: 100%; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #fff; border-top: 1px solid #f0f0f0; }
        .handle-pill { width: 40px; height: 6px; background: var(--platinum); border-radius: 10px; }

        /* INPUTS */
        .firm-dropdown { width: 100%; padding: 14px 20px; border-radius: var(--round-inner); border: 2.5px solid var(--platinum); font-family: inherit; font-size: 15px; font-weight: 800; color: var(--gray-dark); background-color: #f8fafc; margin-bottom: 12px; appearance: none; }
        #statusBox { width: 100%; height: 80px; padding: 15px; border-radius: var(--round-inner); border: 2.5px solid var(--platinum); box-sizing: border-box; font-family: inherit; font-size: 16px; font-weight: 600; outline: none; background: #f8fafc; resize: none; margin-bottom: 12px; }

        /* FLOATING ACTION COLUMN */
        .floating-actions { position: absolute; right: 20px; top: 125px; display: flex; flex-direction: column; gap: 15px; z-index: 800; transition: top 0.4s ease; }
        .add-sq { width: 65px; height: 65px; background: var(--teal); border: none; border-radius: 20px; color: white; font-size: 40px; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 128, 128, 0.3); }
        .sync-sq { width: 65px; height: 65px; background: var(--clio-blue); border: none; border-radius: 20px; color: white; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 118, 206, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px 20px; position: relative; background: #fdfdfd; transition: filter 0.3s; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 6px; background: var(--platinum); z-index: 1; }
        .entry { position: relative; margin-left: 55px; background: white; border: 2px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; z-index: 2; border-left: 6px solid var(--teal); }

        /* MODAL */
        #summaryModal { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.6); z-index: 200000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-card { background: white; border-radius: 30px; padding: 30px; width: 85%; text-align: center; }
    </style>
</head>
<body id="appBody">

<div id="splashScreen"><h1 id="storyText" class="story-text">Welcome.</h1><button id="skipBtn" onclick="endSplash()">Skip Intro</button></div>

<div id="summaryModal">
    <div class="modal-card">
        <h2 style="margin-bottom:10px;">Lock & Sync</h2>
        <p id="modalSummary" style="font-weight:700; color:#64748b; margin-bottom:20px;"></p>
        <button onclick="executeClioSync()" style="background:var(--clio-blue); color:white; border:none; padding:18px; width:100%; border-radius:20px; font-weight:900;">Confirm & Connect</button>
        <button onclick="closeModal()" style="background:transparent; border:none; margin-top:15px; color:#94a3b8; font-weight:800; cursor:pointer;">Cancel</button>
    </div>
</div>

<div class="app-container">
    <header class="header">
        <div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:2px;">
                <div class="briefcase-logo"><div class="briefcase-handle"></div><div class="teal-spine"></div><div class="teal-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
                <div style="font-size:13px; font-weight:800; color:var(--teal); font-style:italic;">Take-in-Take</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <h1 style="color:var(--teal); margin:0; font-size:22px; font-weight:900;">WorkTimeline™</h1>
                <div class="clio-certified"><div class="pulse-dot"></div> CLIO OK</div>
            </div>
        </div>
        <div style="text-align: center;">
            <label class="switch">
                <input type="checkbox" onchange="toggleGhostMode(this)">
                <span class="slider"></span>
            </label>
            <div style="font-size: 8px; font-weight: 900; margin-top: 2px;">GHOST</div>
        </div>
    </header>

    <div class="floating-actions" id="floatingActions">
        <button class="add-sq" onclick="submitEntry()">+</button>
        <button class="sync-sq" onclick="openSyncSummary()">
            <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="white" stroke-width="2.5" fill="none"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="white" stroke-width="2.5" fill="none"/></svg>
            <span style="font-size: 8px; font-weight: 900; color: white;">CLIO</span>
        </button>
    </div>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <select id="firmSelect" class="firm-dropdown">
                <option value="" disabled selected>Select Your Law Firm...</option>
                <option>Newton & Co. Law</option>
                <option>Pilarski Legal Group</option>
            </select>
            <textarea id="statusBox" placeholder="Start your intake entry..."></textarea>
            <div style="display:flex; gap:10px;">
               <div style="flex:1; border:2px solid var(--platinum); border-radius:15px; padding:10px; text-align:center; font-size:8px; font-weight:900;">CAMERA</div>
               <div style="flex:1; border:2px solid var(--platinum); border-radius:15px; padding:10px; text-align:center; font-size:8px; font-weight:900;">AUDIO</div>
               <div style="flex:1; border:2px solid var(--platinum); border-radius:15px; padding:10px; text-align:center; font-size:8px; font-weight:900;">DOCS</div>
            </div>
        </div>
        <div class="drag-handle-zone" id="dragZone">
            <div class="handle-pill"></div>
        </div>
    </div>

    <div id="timelineContainer">
        <div class="timeline-spine"></div>
        <div id="displayList">
            <div class="entry" id="initialBio">
                <p style="font-weight:700;">Privacy First: Use GHOST mode to document evidence safely in public.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const story = [
        "In that grey area, people know you're there but don't know how to help.",
        "They are too cautious and don't believe they can get help.",
        "WorkTimeline guides you through that grey area...",
        "Justice should feel effortless. - Jack Newton"
    ];

    let isDrawerOpen = true;
    function toggleGhostMode(cb) {
        if(cb.checked) document.getElementById('appBody').classList.add('ghost-active');
        else document.getElementById('appBody').classList.remove('ghost-active');
    }

    const drawer = document.getElementById('utilityDrawer');
    const dragZone = document.getElementById('dragZone');
    const floatActions = document.getElementById('floatingActions');

    dragZone.onclick = () => {
        const content = document.getElementById('drawerContent');
        if(isDrawerOpen) {
            drawer.style.transform = `translateY(-${content.offsetHeight}px)`;
            floatActions.style.top = "85px";
            isDrawerOpen = false;
        } else {
            drawer.style.transform = `translateY(0)`;
            floatActions.style.top = "125px";
            isDrawerOpen = true;
        }
    };

    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => {
            if(i < story.length) { 
                el.style.opacity = 0; 
                setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 3000); }, 800); 
            } else endSplash();
        };
        next();
    }
    window.onload = runStory;
    function endSplash() { document.getElementById('splashScreen').style.opacity = '0'; setTimeout(() => document.getElementById('splashScreen').remove(), 1000); }

    const timelineVault = [];
    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = { text: box.value, stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}` };
            timelineVault.push(entry);
            refreshTimeline();
            box.value = '';
            document.getElementById('initialBio')?.remove();
        });
    }

    function refreshTimeline() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div'); div.className = 'entry';
            div.innerHTML = `<span style="font-size:10px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span><p style="margin:5px 0 0; font-weight:700;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    function openSyncSummary() { 
        const firm = document.getElementById('firmSelect').value;
        if(!firm) return alert("Select firm.");
        document.getElementById('modalSummary').innerText = `Syncing to ${firm}`;
        document.getElementById('summaryModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('summaryModal').style.display = 'none'; }
    function executeClioSync() { 
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_read%20leads_write%20contacts_write`; 
    }
</script>
</body>
</html>
