<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Analysis-First Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        /* GHOST BLUR */
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer, .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.1; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 2px solid var(--teal); box-sizing: border-box; text-align: center; overflow: hidden; }
        
        /* HEADER */
        .header { padding: 10px 15px; border-bottom: 2px solid var(--teal); background: white; z-index: 4000; position: relative; }
        .header-top { display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* CLIO PULSE */
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* DRAWERS */
        #utilityDrawer { position: absolute; top: 58px; width: 100%; background: white; border-bottom: 3px solid var(--teal); z-index: 3500; transition: 0.4s transform ease; transform: translateY(calc(-100% + 40px)); }
        .upper-handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; bottom: 0; }
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 3px solid var(--teal); z-index: 4500; transition: 0.4s transform ease; transform: translateY(calc(100% - 40px)); }
        .handle-pill { width: 40px; height: 5px; background: var(--teal); border-radius: 10px; opacity: 0.2; }

        /* DRAGGABLE SQUARES */
        .draggable { position: absolute; z-index: 5000; cursor: move; touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; color: white; border-radius: 15px; border: none; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        #addBtn { width: 75px; height: 75px; background: var(--teal); font-size: 36px; top: 150px; right: 15px; }
        #syncBtn { width: 75px; height: 75px; background: var(--clio-blue); font-size: 8px; padding: 4px; top: 240px; right: 15px; }

        /* TIMELINE & ENTRIES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 50px 15px 150px; }
        .entry { background: white; border: 2px solid var(--teal); border-left-width: 8px; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: left; position: relative; }
        .tier-serious { animation: pulse-ser 2s infinite; border-left-color: var(--teal-dark); background: var(--blue-trans); }
        .flip-btn { position: absolute; top: 10px; right: 10px; background: var(--teal); color: white; border: none; font-size: 8px; font-weight: 900; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
        
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        /* ANALYSIS OVERLAY (IN-DEPTH DESCRIPTION FIRST) */
        #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 24px; border-bottom: 5px solid var(--teal); width: 100%; max-width: 400px; text-align: left; }
        .modal-btn { border: none; padding: 14px; border-radius: 40px; width: 100%; font-weight: 900; margin-top: 10px; cursor: pointer; }
        .analysis-text { font-size: 13px; line-height: 1.5; color: var(--gray-dark); margin-bottom: 15px; }
    </style>
</head>
<body id="appBody">

<div id="warningOverlay" style="display:none;">
    <div class="modal-card">
        <h2 style="color: var(--teal); margin-top: 0;">EA DETECTION IN-DEPTH</h2>
        <div id="warningMsg" class="analysis-text"></div>
        <div style="border-top: 1px solid #eee; padding-top: 10px;">
            <p style="font-size: 11px; font-weight: 800;">POSTING OPTIONS:</p>
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="applyStack(true)">STACK ANALYSIS ON TOP</button>
            <button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="applyStack(false)">STACK RAW GRIT ON TOP</button>
        </div>
    </div>
</div>

<div class="app-container">
    <header class="header">
        <div class="header-top">
            <svg width="34" height="26" viewBox="0 0 40 30" fill="none"><path d="M3 12C3 10.3431 4.34315 9 6 9H13.5C13.5 7 15.5 3 20 3C24.5 3 26.5 7 26.5 9H34C35.6569 9 37 10.3431 37 12V25C37 26.6569 35.6569 28 34 28H6C4.34315 28 3 26.6569 3 25V12Z" stroke="#008080" stroke-width="3" stroke-linejoin="round"/><line x1="0" y1="18.5" x2="40" y2="18.5" stroke="#008080" stroke-width="3"/><circle cx="9" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="20" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="31" cy="18.5" r="3" fill="#008080" stroke="white"/></svg>
            <div class="main-title">WorkTimeline™ <div class="clio-pulse"></div></div>
            <div style="position:absolute; right:0; display:flex; flex-direction:column; gap:4px;">
                <button onclick="document.getElementById('appBody').classList.toggle('ghost-active')" style="background:var(--teal); color:white; border:none; border-radius:5px; font-size:7px; font-weight:900; padding:3px 6px;">GHOST</button>
                <button id="vaultBtn" onclick="toggleVault()" style="background:var(--teal); color:white; border:none; border-radius:5px; font-size:7px; font-weight:900; padding:3px 6px;">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px 15px 50px;">
            <div style="display:flex; gap:6px; justify-content:center; margin-bottom: 12px; overflow-x:auto;">
                <button onclick="useTemplate('INCIDENT')" class="template-chip">INCIDENT</button>
                <button onclick="useTemplate('INJURY')" class="template-chip">INJURY</button>
                <button onclick="useTemplate('LOCATION')" class="template-chip">LOCATION</button>
                <button onclick="useTemplate('WITNESS')" class="template-chip">WITNESS</button>
            </div>
            <textarea id="statusBox" style="width:100%; height:75px; border:2.5px solid var(--teal); border-radius:12px; padding:10px; font-weight:700; font-size:14px; outline:none;" placeholder="Journal the truth..."></textarea>
        </div>
        <div class="upper-handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable">LOCK & SYNC TO CLIO</button>

    <div id="mgmtDrawer">
        <div class="lower-handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 20px 30px;">
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="alert('Exporting Report...')">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="confirm('Start Fresh?') && (localStorage.clear() || location.reload())">DELETE & START FRESH</button>
        </div>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let activeVault = "TIMELINE"; let pending = null;
    let utilOpen = false; let mgmtOpen = false;

    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 40px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }

    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.onmousedown = dStart; el.ontouchstart = dStart;
        function dStart(e) { p3 = e.clientX || e.touches[0].clientX; p4 = e.clientY || e.touches[0].clientY; document.onmouseup = dEnd; document.ontouchend = dEnd; document.onmousemove = dMove; document.ontouchmove = dMove; }
        function dMove(e) { let cx = e.clientX || e.touches[0].clientX; let cy = e.clientY || e.touches[0].clientY; p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; }
        function dEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
    }
    makeDraggable(document.getElementById("addBtn")); makeDraggable(document.getElementById("syncBtn"));

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const low = text.toLowerCase();
        let analysis = "";
        
        if (low.includes("fire") || low.includes("quit") || low.includes("threat") || low.includes("toxic")) {
            analysis = "<b>PATTERN:</b> Constructive Dismissal / Retaliation.<br><b>LATIN:</b> <i>Lex Talionis</i> (Retaliation).<br><b>CROSS-REF:</b> This entry signals a hostile environment aimed at forcing resignation. This is <i>Prima Facie</i> evidence for legal counsel.";
        }

        pending = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: analysis ? 'serious' : 'minor', flipped: false };
        
        if(analysis && activeVault === "TIMELINE") {
            document.getElementById('warningMsg').innerHTML = analysis;
            document.getElementById('warningOverlay').style.display = 'flex';
        } else { saveFinal(); }
        document.getElementById('statusBox').value = '';
    }

    function applyStack(top) { pending.flipped = !top; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    function saveFinal() { vault.push(pending); localStorage.setItem('wt_timeline', JSON.stringify(vault)); refresh(); }
    
    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...vault].reverse().forEach((item, index) => {
            const trueIndex = vault.length - 1 - index;
            const content = item.flipped ? `<b>EA ANALYSIS:</b><br>${item.analysis}` : `<b>📍 LANGLEY, BC | ${item.stamp}</b><br><br>${item.grit}`;
            const flipBtn = item.analysis ? `<button class="flip-btn" onclick="flipItem(${trueIndex})">FLIP VIEW</button>` : "";
            list.innerHTML += `<div class="entry tier-${item.tier}">${flipBtn}${content}</div>`;
        });
    }

    function flipItem(idx) { vault[idx].flipped = !vault[idx].flipped; refresh(); }
    function useTemplate(t) { 
        const ts = { 'INCIDENT': 'ACTION:\nVIOLATION:', 'INJURY': 'OFA RECORD:\nINJURY:', 'LOCATION': 'SITE:\nHAZARDS:', 'WITNESS': 'NAME:\nCONTACT:' };
        document.getElementById('statusBox').value = ts[t];
    }

    let sX, sY;
    document.getElementById("addBtn").addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    document.getElementById("addBtn").addEventListener('touchend', e => {
        let dx = Math.abs(e.changedTouches[0].clientX - sX); let dy = Math.abs(e.changedTouches[0].clientY - sY);
        if(dx < 10 && dy < 10) submitEntry();
    });

    refresh();
</script>
</body>
</html>
