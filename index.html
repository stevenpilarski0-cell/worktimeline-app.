<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Dynamic Notifications</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --clio-green: #2ecc71;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); overflow: hidden; }
        
        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: flex; flex-direction: column; gap: 20px; }
        
        .bubble { padding: 15px; border-radius: 22px; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); background: #f1f1f1; border: 1px solid #e5e5e5; }
        .lawyer-config { background: #f7fafc; padding: 10px; border-radius: 12px; font-size: 10px; margin-bottom: 10px; border: 1px solid var(--gray-border); }
        .config-input { width: 100%; border: 1px solid var(--gray-border); padding: 5px; border-radius: 6px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div style="font-weight: 900; font-size: 13px; color: var(--teal);">WorkTimeline™ Private Portal</div>
    </header>

    <div class="view-section">
        <!-- 1. DYNAMIC CONFIGURATION UI -->
        <div class="lawyer-config">
            <strong>Lawyer Assignment</strong>
            <input type="email" id="targetLawyerEmail" class="config-input" placeholder="Enter lawyer's email for notifications...">
        </div>

        <div id="timelineContainer"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://sghmgiaaqcuymqnfbleh.supabase.co'; //
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchTimeline() {
        const { data } = await _supabase.from('timelines')
            .select('*, comments(*)').order('created_at', { ascending: false });
        renderTimeline(data || []);
    }

    async function addComment(timelineId) {
        const input = document.getElementById(`input-${timelineId}`);
        const lawyerEmail = document.getElementById('targetLawyerEmail').value;
        const text = input.value;
        
        if (!text.trim()) return;

        // 2. PASSING THE EMAIL DYNAMICALLY
        const { error } = await _supabase.from('comments').insert([{
            timeline_id: timelineId,
            content: text,
            author_role: 'CLIENT',
            notify_email: lawyerEmail // This triggers the logic in the cloud
        }]);

        if (!error) {
            input.value = '';
            fetchTimeline();
        }
    }

    function renderTimeline(data) {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = data.map(item => `
            <div style="margin-top:20px;">
                <div class="bubble">
                    <div style="font-size:9px; color:var(--silver-gray);">${new Date(item.created_at).toLocaleString()}</div>
                    <p style="margin:5px 0; font-size:12px;">${item.content}</p>
                    <div style="margin-top:10px; padding-left:10px; border-left:2px solid var(--clio-blue);">
                        ${(item.comments || []).map(c => `<div style="font-size:11px;"><strong>${c.author_role}:</strong> ${c.content}</div>`).join('')}
                        <input type="text" id="input-${item.id}" style="width:100%; margin-top:10px; font-size:10px;" placeholder="Message lawyer..." onkeydown="if(event.key==='Enter') addComment('${item.id}')">
                    </div>
                </div>
            </div>
        `).join('');
    }

    fetchTimeline();
</script>
</body>
</html>
