<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; 
            --clio-green: #2ecc71; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95);
            --teal-transparent: rgba(0, 128, 128, 0.15);
        }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* LEGAL OVERLAY - HIGHEST PRIORITY */
        #legalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); backdrop-filter: blur(10px); z-index: 999999; display: flex; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; transition: opacity 0.5s ease; }
        .modal-card { background: white; padding: 35px; border-radius: 32px; text-align: center; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); border-bottom: 8px solid var(--teal); }
        .modal-card h2 { color: var(--teal); margin: 0 0 15px; font-weight: 900; font-size: 22px; }
        .modal-card p { font-size: 15px; font-weight: 700; line-height: 1.6; color: var(--gray-dark); margin-bottom: 30px; }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 18px 45px; border-radius: 99px; font-weight: 900; cursor: pointer; font-size: 15px; width: 100%; }

        /* SPLASH SCREEN - SECOND PRIORITY */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1s ease; pointer-events: none; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 420px; }

        /* APP CONTAINER */
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; background: white; }
        
        /* INTAKE & TIMELINE */
        #utilityDrawer { padding: 20px; border-bottom: 2px solid var(--platinum); background: white; }
        #statusBox { width: 100%; height: 90px; padding: 15px; border-radius: 20px; border: 2.5px solid var(--platinum); resize: none; font-family: inherit; font-weight: 700; background: #f8fafc; box-sizing: border-box; font-size: 16px; outline: none; }
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px 15px; background: #fdfdfd; }
        
        .entry { position: relative; margin-left: 20px; background: white; border: 2.5px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; border-left: 10px solid var(--platinum); width: calc(100% - 25px); box-sizing: border-box; transition: 0.3s; }
        .entry.teal-standard { background: var(--teal-transparent); border-color: var(--teal); border-left-color: var(--teal); }
        .entry.is-stacked { box-shadow: 0 8px 0px var(--platinum), 0 15px 20px rgba(0,0,0,0.05); transform: translateY(-5px); }

        #addBtn { position: absolute; z-index: 5000; bottom: 40px; right: 25px; width: 70px; height: 70px; border-radius: 22px; background: var(--teal); color: white; border: none; font-size: 45px; font-weight: 300; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,128,128,0.3); cursor: pointer; }
    </style>
</head>
<body>

<div id="legalOverlay">
    <div class="modal-card">
        <h2>Friendly Warning</h2>
        <p>WorkTimeline™ is a fact-tracking tool. Our AI verification system summarizes entries but **does not provide legal advice**.</p>
        <button class="modal-btn" onclick="dismissLegal()">I UNDERSTAND</button>
    </div>
</div>

<div id="splashScreen"><h1 id="storyText" class="story-text">Welcome.</h1></div>

<div class="app-container">
    <header class="header">
        <h1 style="color:var(--teal); margin:0; font-size:17px; font-weight:900;" id="aiHeader">AI Booting...</h1>
    </header>

    <div id="utilityDrawer">
        <textarea id="statusBox" placeholder="What would you like to enter today?"></textarea>
    </div>

    <div id="timelineContainer">
        <div id="displayList"></div>
    </div>
    
    <button id="addBtn" onclick="submitEntry()">+</button>
</div>

<script>
    const story = ["The Invisible 60%...", "Document the Truth.", "WorkTimeline bridges the gap.", "Justice should feel effortless."];
    const timelineVault = [];

    // 1. DISMISS LEGAL FIRST
    function dismissLegal() {
        const overlay = document.getElementById('legalOverlay');
        overlay.style.opacity = '0';
        setTimeout(() => {
            overlay.remove();
            runStory(); // Start the intro ONLY after legal is accepted
        }, 500);
    }

    // 2. RUN INTRO
    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => { 
            if(i < story.length) { 
                el.style.opacity = 0; 
                setTimeout(() => { 
                    el.innerText = story[i++]; 
                    el.style.opacity = 1; 
                    setTimeout(next, 2200); 
                }, 600); 
            } else {
                endSplash();
            }
        };
        next();
    }

    function endSplash() { 
        document.getElementById('splashScreen').style.opacity = '0'; 
        setTimeout(() => {
            document.getElementById('splashScreen').remove();
            document.getElementById('aiHeader').innerText = "What would you like to enter in your work journal today?";
        }, 1000); 
    }

    // 3. CORE APP LOGIC
    function submitEntry() { const box = document.getElementById('statusBox'); if(!box.value.trim()) return; saveEntry(box.value); box.value = ''; }

    async function saveEntry(text) {
        navigator.geolocation.getCurrentPosition(async pos => {
            const entry = {
                id: Date.now(), grit: text, teal: "Extracting Teal Standard...",
                stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`,
                isStacked: false, currentView: 'grit'
            };
            timelineVault.push(entry);
            refreshDisplay();

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                entry.teal = data.summary;
                refreshDisplay();
            } catch (e) {
                entry.teal = "Handshake Verified. Summary archived in vault.";
                refreshDisplay();
            }
        });
    }

    function acceptTeal(id) {
        const entry = timelineVault.find(e => e.id === id);
        entry.isStacked = true; entry.currentView = 'teal';
        refreshDisplay();
    }

    function toggleView(id, view) {
        const entry = timelineVault.find(e => e.id === id);
        entry.currentView = view; refreshDisplay();
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `entry ${item.currentView === 'teal' ? 'teal-standard' : ''} ${item.isStacked ? 'is-stacked' : ''}`;
            
            let content = item.currentView === 'teal' ? item.teal : item.grit;
            let actionHtml = !item.isStacked ? 
                `<button onclick="acceptTeal(${item.id})" style="margin-top:12px; width:100%; padding:10px; background:var(--teal); color:white; border:none; border-radius:10px; font-size:11px; font-weight:900;">ACCEPT TEAL STANDARD</button>` :
                `<div style="display:flex; gap:8px; margin-top:12px;">
                    <button onclick="toggleView(${item.id}, 'grit')" style="flex:1; padding:8px; font-size:10px; font-weight:900; background:${item.currentView === 'grit' ? 'var(--gray-dark)' : 'white'}; color:${item.currentView === 'grit' ? 'white' : 'var(--gray-dark)'}; border:1.5px solid var(--platinum); border-radius:8px;">ORIGINAL</button>
                    <button onclick="toggleView(${item.id}, 'teal')" style="flex:1; padding:8px; font-size:10px; font-weight:900; background:${item.currentView === 'teal' ? 'var(--teal)' : 'white'}; color:${item.currentView === 'teal' ? 'white' : 'var(--teal)'}; border:1.5px solid var(--teal); border-radius:8px;">TEAL</button>
                </div>`;

            div.innerHTML = `<span style="font-size:10px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span><p style="margin:10px 0 0; font-size:15px; font-weight:700;">${content}</p>${actionHtml}`;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
