<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #008080;
            --silver-text: #64748b;
            --silver-ui: #e2e8f0;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --slate: #1e293b;
            --risk: #ef4444;
            --glass: rgba(255, 255, 255, 0.94);
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #f1f5f9;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- FLUSH MAC HEADER (75px) --- */
        header {
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--silver-ui);
            z-index: 1000; position: fixed; top: 0; width: 100%; height: 75px;
            box-sizing: border-box;
            box-shadow: 0 5px 25px rgba(0,0,0,0.03);
        }

        .logo-group { display: flex; align-items: center; gap: 6px; height: 100%; }
        .brand-text { font-size: 21px; font-weight: 900; letter-spacing: -0.8px; display: flex; align-items: center; }
        .text-work { color: var(--silver-text); }
        .text-timeline { color: var(--teal); }

        .status-dot { width: 7px; height: 7px; background: var(--clio-green); border-radius: 50%; margin-left: 8px; animation: statusPulse 2s infinite; }
        @keyframes statusPulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }

        /* --- CLIO LOCK BUTTON --- */
        .clio-lock-btn {
            background: var(--clio-blue); color: white; border: none;
            padding: 10px 14px; border-radius: 16px; font-size: 10px; font-weight: 900;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,118,206,0.2);
        }

        /* --- INTAKE & MAIN CARD --- */
        .intake-area { margin-top: 95px; padding: 20px; flex-shrink: 0; }
        .main-card {
            background: white; border-radius: 40px; padding: 25px;
            border: 1px solid var(--silver-ui); box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        textarea {
            width: 100%; height: 110px; border-radius: 30px; border: 2px solid var(--silver-ui);
            padding: 20px; font-family: inherit; font-size: 16px; box-sizing: border-box;
            outline: none; background: #fafafa; transition: 0.2s; resize: none;
        }
        textarea:focus { border-color: var(--teal); background: #fff; }

        /* --- NATIVE MEDIA DOCK (TEAL ON SILVER) --- */
        .dock { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
        .native-btn {
            width: 56px; height: 56px; background: var(--silver-ui); border: none;
            border-radius: 24px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
        }
        .native-btn:active { transform: scale(0.92); background: #cbd5e1; }
        .native-btn svg { width: 26px; height: 26px; fill: var(--teal); }

        .record-btn {
            flex-grow: 1; background: var(--teal); color: white; border: none;
            height: 56px; border-radius: 24px; font-weight: 900; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,128,128,0.2); cursor: pointer;
        }

        /* --- TIMELINE CARDS --- */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 10px 20px 120px; display: flex; flex-direction: column; gap: 20px; }
        .card {
            background: white; border-radius: 38px; padding: 25px;
            border: 1px solid var(--silver-ui); border-left: 10px solid var(--teal);
            transition: 0.4s; animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card.critical { border-left-color: var(--risk); box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); }

        /* --- SETTINGS GEAR --- */
        #gear {
            position: fixed; bottom: 35px; right: 35px; width: 65px; height: 65px;
            background: var(--slate); border-radius: 24px; border: none; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer;
        }

        #loader {
            position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 10000;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .spinner { width: 45px; height: 45px; border: 5px solid var(--silver-ui); border-top-color: var(--teal); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="font-weight:900; margin-top:20px; color:var(--teal)">AUDITING LEGAL PATTERNS...</p>
</div>

<header>
    <div class="logo-group">
        <svg width="42" height="42" viewBox="0 0 100 100" fill="none">
            <path d="M25 45V75C25 80.5 24.5 85 30 85H70C75.5 85 80 80.5 80 75V45" stroke="#008080" stroke-width="5"/>
            <circle cx="50" cy="65" r="4" fill="#008080"/>
        </svg>
        <div class="brand-text"><span class="text-work">Work</span><span class="text-timeline">Timeline</span><div class="status-dot"></div></div>
    </div>
    <button class="clio-lock-btn" onclick="syncClio()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
        LOCK & SEND
    </button>
</header>

<div class="intake-area">
    <div class="main-card">
        <textarea id="msg" placeholder="Describe the incident or hazard..."></textarea>
        <div class="dock">
            <div class="native-btn" onclick="document.getElementById('imgIn').click()">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <input type="file" id="imgIn" hidden accept="image/*" capture="environment">
            </div>
            <div class="native-btn" onclick="document.getElementById('audIn').click()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.34-1.34-3-3-3S9 3.66 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
                <input type="file" id="audIn" hidden accept="audio/*" capture="microphone">
            </div>
            <button class="record-btn" onclick="process()">RECORD & AUDIT</button>
        </div>
    </div>
</div>

<div id="timeline"></div>

<button id="gear" onclick="let cur=localStorage.getItem('WT_K'); let k=prompt('Cohere AI Key:', cur||''); if(k) localStorage.setItem('WT_K', k);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<script>
    let db = JSON.parse(localStorage.getItem('WT_LOGS') || '[]');

    function syncClio() { alert("Initiating Golden Exchange with Clio..."); }

    async function process() {
        const val = document.getElementById('msg').value.trim();
        const key = localStorage.getItem('WT_K');
        if (!val) return;
        if (!key) { alert("Please tap the Gear and add your Cohere API Key."); return; }

        document.getElementById('loader').style.display = 'flex';
        
        try {
            const r = await fetch('https://api.cohere.ai/v1/generate', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'command',
                    prompt: `Audit this text for BC Workers Compensation Act violations. Specifically look for Section 47 Prohibited Action (retaliation for safety reporting) or mental health injury claim suppression. 
                    RETURN JSON ONLY: {"sev": 0-3, "msg": "Lawyer-ready summary of violation", "law": "BC Sec 47 / WCB"}. 
                    TEXT: ${val}`,
                    temperature: 0.1
                })
            });
            const data = await r.json();
            const res = JSON.parse(data.generations[0].text.replace(/```json|```/g, ""));
            
            db.push({ id: Date.now(), txt: val, time: new Date().toLocaleString(), ...res });
            localStorage.setItem('WT_LOGS', JSON.stringify(db));
            document.getElementById('msg').value = '';
            render();
        } catch (e) { alert("AI Audit failed. Check your API key."); }
        document.getElementById('loader').style.display = 'none';
    }

    function render() {
        const cont = document.getElementById('timeline');
        cont.innerHTML = '';
        [...db].reverse().forEach(i => {
            const card = document.createElement('div');
            card.className = `card ${i.sev >= 2 ? 'critical' : ''}`;
            card.innerHTML = `
                <small style="color:var(--silver-text); font-weight:800;">${i.time}</small>
                <div style="font-weight:700; margin:10px 0; color:var(--slate);">${i.txt}</div>
                <div style="background:#f8fafc; border-radius:15px; padding:12px; border:1px solid #e2e8f0;">
                    <strong style="color:var(--teal); font-size:11px;">DIAGNOSTIC:</strong>
                    <span style="font-size:13px; color:var(--slate);">${i.msg}</span>
                    <div style="font-size:10px; color:var(--silver-text); margin-top:5px;">Statute: ${i.law}</div>
                </div>`;
            cont.appendChild(card);
        });
    }
    render();
</script>

</body>
</html>
