<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Elite v38</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --obsidian: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --metal-shine: linear-gradient(160deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.15) 100%);
            --mac-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.2);
            --radius-liq: 50px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: #ffffff; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

        /* CLIO STATUS LED */
        .clio-status-led { position: absolute; top: 25px; right: 25px; width: 10px; height: 12px; background-color: var(--clio-green); border-radius: 50%; z-index: 10000; animation: breathe 2.5s infinite; box-shadow: 0 0 8px var(--clio-green); }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } }

        /* GHOST MODE */
        .privacy-active #timelineContainer, .privacy-active #linearTrack { filter: blur(50px); pointer-events: none; opacity: 0.1; }
        .birds-eye-active { transform: scale(0.5) translateY(-80px); border-radius: var(--radius-liq); box-shadow: 0 100px 150px rgba(0,0,0,0.3); }

        /* SIDEBAR (SVG ONLY) */
        #sideBar { position: absolute; left: -320px; top: 0; width: 300px; height: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(30px); z-index: 10000; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-right: 1px solid #e2e8f0; padding: 50px 30px; box-sizing: border-box; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 18px; margin-bottom: 15px; border-radius: 25px; background: white; font-weight: 800; font-size: 11px; color: var(--teal); display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1.5px solid #f1f5f9; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; }

        /* DOMAIN TABS */
        .domain-nav { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 15px 45px 15px 15px; gap: 10px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 12px 0; border-radius: 20px; font-size: 10px; font-weight: 900; color: #94a3b8; background: transparent; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .domain-tab.active { background: white; color: var(--active-brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* HEADER */
        .header { padding: 25px; border-bottom: 1px solid #e2e8f0; background: white; z-index: 4000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 20px; color: var(--active-brand); letter-spacing: -1.2px; }

        /* UTILITY DRAWER */
        #utilityDrawer { position: absolute; top: 140px; width: 100%; background: white; border-bottom: 3px solid #e2e8f0; z-index: 3500; transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1) transform; transform: translateY(calc(-100% + 50px)); border-radius: 0 0 var(--radius-liq) var(--radius-liq); box-shadow: 0 25px 50px rgba(0,0,0,0.08); }
        .handle { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: #cbd5e0; border-radius: 10px; opacity: 0.6; }

        /* SPREAD OUT TEMPLATES */
        #templateBar { display: flex; justify-content: space-between; padding: 5px 30px 20px; gap: 12px; }
        .template-chip { flex: 1; border: 2.5px solid #f1f5f9; padding: 14px 0; border-radius: 50px; font-size: 10px; font-weight: 900; color: #1e293b; background: white; cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.2s; }

        /* HARDWARE FUNCTIONAL */
        .hardware-row { display: flex; justify-content: space-evenly; align-items: center; padding: 10px 40px 25px; }
        .hw-item { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 15px; border: 1px solid #e2e8f0; }
        .hw-item svg { width: 26px; height: 26px; stroke: #4a5568; fill: none; stroke-width: 2.5; }
        .hw-item input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:10; }

        /* TIMELINE TRACK & SQUIRCLES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 50px 25px 220px 80px; display: flex; flex-direction: column; gap: 55px; scrollbar-width: none; position: relative; z-index: 5; }
        #linearTrack { position: absolute; left: 32px; top: 180px; bottom: 150px; width: 8px; background: rgba(0, 0, 0, 0.04); border-radius: 20px; z-index: 1; }
        
        .track-node { position: absolute; left: -16px; width: 40px; height: 40px; background: var(--active-brand); border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); z-index: 10; cursor: pointer; overflow: hidden; position: relative; transition: transform 0.2s; }
        .track-node::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.5; }

        /* DOCK BUTTONS (SCALED DOWN & BRANDED) */
        .action-dock-right { position: absolute; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 6000; }
        .action-dock-left { position: absolute; bottom: 35px; left: 25px; z-index: 6000; }
        
        #addBtn { width: 70px; height: 70px; background: var(--obsidian); border: none; border-radius: 25px; box-shadow: var(--mac-shadow); color: white; font-size: 36px; font-weight: 900; cursor: pointer; position: relative; overflow: hidden; }
        #syncBtn { width: 85px; height: 85px; background: linear-gradient(135deg, var(--clio-blue) 0%, #003d73 100%); border: none; border-radius: 28px; box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 9px; cursor: pointer; letter-spacing: 0.5px; position: relative; overflow: hidden; }
        #eyeBtn { width: 65px; height: 65px; background: white; border: 2.5px solid var(--gray-border); border-radius: 25px; box-shadow: var(--mac-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .bubble { padding: 30px; border-radius: 35px; box-shadow: var(--mac-shadow); background: white; border: 1px solid #f1f5f9; font-weight: 600; font-size: 16px; line-height: 1.5; color: #1e293b; }
        textarea { width: 100%; height: 110px; border: 3px solid #e2e8f0; border-radius: 30px; padding: 20px; font-size: 17px; outline: none; background: #f8fafc; box-sizing: border-box; font-family: inherit; transition: 0.4s; }
    </style>
</head>
<body onload="setGreeting()">

<div class="clio-status-led" title="Clio Connection Active"></div>

<div id="sideBar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;">
        <h2 style="font-weight: 900; color: var(--teal); font-size: 20px; margin: 0; letter-spacing: -1.5px;">MENU</h2>
        <div onclick="toggleSidebar()" style="cursor: pointer; opacity: 0.4;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="sidebar-item" onclick="emailTimeline()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>EMAIL (@)</div>
    <div class="sidebar-item" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>SAVE & EXPORT</div>
    <div class="sidebar-item" onclick="alert('Analysis Review Enabled')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 7v14"/><path d="M9 21h6"/><path d="M8 7a4 4 0 0 1 8 0"/><path d="M3 21h18"/></svg>CASE LAW STUDY</div>
    <div class="sidebar-item" onclick="resetTimeline()" style="color: #94a3b8; margin-top: 50px;"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>RESET PLATFORM</div>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(50px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:40px;">
    <div class="modal-card" style="background:white; padding:60px 45px; border-radius:60px; text-align:center; box-shadow: var(--mac-shadow); max-width:440px; border: 1px solid #e2e8f0;">
        <h2 id="greetingText" style="font-weight:900; font-size: 32px; color: var(--teal); letter-spacing: -2.5px; margin: 0;">HELLO</h2>
        <p style="font-weight:800; font-size: 13px; color: #94a3b8; margin-top: 15px; text-transform: uppercase;">Langley Township, BC</p>
        <p style="font-weight:600; color:#64748b; line-height:1.8; margin: 40px 0;">WorkTimeline™ acts as your personal secure journal. <br><br>While this supports your evidence, <b>we do not offer legal advice.</b></p>
        <button onclick="unlockApp()" style="border:none; padding:24px; border-radius:40px; width:100%; background:var(--obsidian); color:white; font-weight:900; text-transform:uppercase; cursor:pointer;">Secure My Journal</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab" data-id="WORK" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" data-id="FAM" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" data-id="INJURY" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" data-id="PROPERTY" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer; padding: 5px;"><svg width="30" height="22" fill="none" stroke="var(--active-brand)" stroke-width="4.5"><line x1="0" y1="2" x2="30" y2="2"/><line x1="0" y1="11" x2="30" y2="11"/><line x1="0" y1="20" x2="30" y2="20"/></svg></div>
            <div class="main-title" id="brandTitle">WorkTimeline™</div>
            <button style="background:#f1f5f9; border:none; border-radius: 50px; font-size:10px; font-weight:900; padding:10px 18px; cursor:pointer;" onclick="togglePrivacy()">GHOST</button>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 25px;">
            <div id="templateBar">
                <button class="template-chip" onclick="stack('SETTING')">Setting</button>
                <button class="template-chip" onclick="stack('WITNESS')">Witness</button>
                <button class="template-chip" onclick="stack('INJURY')">Injury</button>
            </div>
            <div class="hardware-row">
                <div class="hw-item"><input type="file" accept="image/*" capture="environment" onchange="hw('PHOTO ATTACHED')"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div class="hw-item"><input type="file" accept="audio/*" capture="microphone" onchange="hw('AUDIO RECORDED')"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
                <div class="hw-item"><input type="file" onchange="hw('DOCUMENT LINKED')"><svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div>
            </div>
            <textarea id="statusBox" placeholder="Tell your story..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock-left"><button id="eyeBtn" onclick="toggleBirdsEye()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="action-dock-right"><button id="addBtn" onclick="submitEntry()">+</button><button id="syncBtn" onclick="clioHandshake()"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="white" stroke-width="4.5"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>SYNC</button></div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v38')) || [];
    let utilOpen = false;

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 55px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function togglePrivacy() { document.getElementById('mainApp').classList.toggle('privacy-active'); }
    function toggleBirdsEye() { document.getElementById('mainApp').classList.toggle('birds-eye-active'); }
    function setGreeting() { const h = new Date().getHours(); document.getElementById('greetingText').innerText = h < 12 ? "GOOD MORNING" : h < 18 ? "GOOD AFTERNOON" : "GOOD EVENING"; }
    function hw(l) { document.getElementById('statusBox').value += `\n[${l} @ ${new Date().toLocaleTimeString()}]\n`; }
    function stack(t) { const b = document.getElementById('statusBox'); b.value += (b.value.trim() === "" ? "" : "\n\n") + t + ": "; b.focus(); }

    function switchDomain(domain) {
        const colors = {'WORK':'#008080', 'FAM':'#e11d48', 'INJURY':'#f59e0b', 'PROPERTY':'#1e293b'};
        document.documentElement.style.setProperty('--active-brand', colors[domain]);
        document.getElementById('brandTitle').innerText = (domain === 'WORK' ? 'WorkTimeline™' : domain === 'FAM' ? 'FamTimeline™' : domain === 'INJURY' ? 'InjuryTimeline™' : 'PropTimeline™');
        document.querySelectorAll('.domain-tab').forEach(t => {
            t.style.color = t.dataset.id === domain ? 'var(--active-brand)' : '#94a3b8';
            t.style.background = t.dataset.id === domain ? 'white' : 'transparent';
        });
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        
        // FULL DATA STAMP: MONTH DATE YEAR | TIME AM/PM
        const now = new Date();
        const options = { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
        const fullStamp = `📍 LANGLEY, BC | ${now.toLocaleDateString('en-US', options)}`;

        vault.push({ id: Date.now(), grit: text, stamp: fullStamp });
        localStorage.setItem('platinum_v38', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        vault.slice().reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 170 + 40) + 'px';
            
            // HOLD TO DELETE LOGIC
            let timer;
            const start = () => timer = setTimeout(() => { if(confirm("Remove entry from legal journal?")) { vault = vault.filter(v => v.id !== item.id); localStorage.setItem('platinum_v38', JSON.stringify(vault)); refresh(); } }, 1000);
            const stop = () => clearTimeout(timer);
            node.onmousedown = start; node.onmouseup = stop; node.onmouseleave = stop;
            node.ontouchstart = start; node.ontouchend = stop;

            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:11px; font-weight:800; color:#94a3b8; margin-bottom:15px; text-transform: uppercase;">${item.stamp}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function clioHandshake() { alert("Vaulting data to Clio Canada (ca.api.clio.com)..."); }
    function exportData() { alert("Secured Backup Exported."); }
    function emailTimeline() { window.location.href = "mailto:?subject=Legal Intake Export"; }

    switchDomain('WORK'); refresh();
</script>
</body>
</html>
