<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite | Industrial Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #008080;
            --slate: #1e293b;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
            --border: #e2e8f0;
            --risk: #ef4444;
            --accent: #0ea5e9;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: var(--bg);
            margin: 0; padding: 0; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            color: var(--slate);
        }

        /* --- HEADER & DRAWER --- */
        #topDrawer {
            position: fixed; top: 0; left: 0; width: 100%;
            background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 32px 32px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10000;
            transform: translateY(calc(-100% + 60px));
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        #topDrawer.open { transform: translateY(0); }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 24px; height: 60px; box-sizing: border-box;
        }
        .brand { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; color: var(--teal); }

        /* --- INPUT AREA --- */
        .intake-content { padding: 24px 24px 80px; }
        #statusBox {
            width: 100%; height: 120px; padding: 20px;
            border-radius: 24px; border: 1px solid var(--border);
            background: #fff; font-size: 16px; font-family: inherit;
            resize: none; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .action-bar { display: flex; gap: 12px; margin-top: 16px; }
        .btn-main {
            flex-grow: 1; background: var(--teal); color: white;
            border: none; border-radius: 20px; font-weight: 800;
            font-size: 15px; cursor: pointer; height: 54px;
        }

        /* --- TIMELINE CARDS --- */
        #timeline {
            flex-grow: 1; overflow-y: auto;
            padding: 80px 20px 120px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .entry-card { perspective: 1200px; width: 100%; }
        .card-inner {
            position: relative; width: 100%; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        
        .face {
            backface-visibility: hidden; border-radius: 28px;
            padding: 24px; background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .front { border-left: 6px solid var(--teal); }
        .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: rotateY(180deg); background: var(--slate); color: #fff;
            border-left: 6px solid var(--accent); display: flex; flex-direction: column;
            justify-content: center; box-sizing: border-box;
        }

        .stamp { font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
        .edu-label { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 1px; margin-bottom: 8px; }

        /* --- FLOATING CONTROLS --- */
        #gearBtn {
            position: fixed; bottom: 30px; right: 30px;
            width: 64px; height: 64px; background: var(--slate);
            border-radius: 24px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: none; z-index: 999;
        }
        #gearBtn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.5; }

        .handle {
            height: 30px; width: 100%; position: absolute; bottom: 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .pill { width: 40px; height: 4px; background: #cbd5e0; border-radius: 10px; }

        #loader {
            position: fixed; inset: 0; background: var(--glass); backdrop-filter: blur(10px);
            z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top: 4px solid var(--teal); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="font-weight: 800; font-size: 12px; margin-top: 16px; color: var(--teal);">AI DIAGNOSTIC</p>
    </div>

    <div id="topDrawer">
        <div class="header">
            <div class="brand">WorkTimeline</div>
            <div style="width: 24px; height: 24px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
        </div>
        <div class="intake-content">
            <textarea id="statusBox" placeholder="Describe the workplace event..."></textarea>
            <div class="action-bar">
                <button class="btn-main" onclick="process()">Analyze Incident</button>
            </div>
        </div>
        <div class="handle" onclick="document.getElementById('topDrawer').classList.toggle('open')">
            <div class="pill"></div>
        </div>
    </div>

    <div id="timeline"></div>

    <button id="gearBtn" onclick="toggleDrawer()">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>

    <script>
        let db = JSON.parse(localStorage.getItem('WT_GLASS_DATA')) || [];
        let key = localStorage.getItem('WT_K');

        async function process() {
            let val = document.getElementById('statusBox').value.trim();
            if(!val) return;
            document.getElementById('loader').style.display = 'flex';

            let analysis = { term: "Record Entry", msg: "Incident logged for timeline.", case: "General context." };

            if(key) {
                try {
                    const r = await fetch('https://api.cohere.ai/v1/generate', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: 'command', 
                            prompt: `BC LAW EXPERT: Identify the LEGAL TERM for this incident and explain why. Ref BC case law. Return JSON ONLY: {"term":"...", "msg":"...", "case":"..."}. Incident: ${val}`,
                            temperature: 0.2 
                        })
                    });
                    const d = await r.json();
                    analysis = JSON.parse(d.generations[0].text.replace(/```json|```/g, "").trim());
                } catch(e) { console.error(e); }
            }

            db.push({ id: Date.now(), txt: val, time: new Date().toLocaleString(), ...analysis });
            localStorage.setItem('WT_GLASS_DATA', JSON.stringify(db));
            document.getElementById('statusBox').value = '';
            document.getElementById('loader').style.display = 'none';
            render();
        }

        function render() {
            let cont = document.getElementById('timeline');
            cont.innerHTML = "";
            [...db].reverse().forEach(item => {
                let card = document.createElement('div');
                card.className = 'entry-card';
                card.innerHTML = `
                    <div class="card-inner" onclick="this.classList.toggle('flipped')">
                        <div class="face front">
                            <div class="stamp">${item.time}</div>
                            <div style="font-weight:700; line-height:1.5;">${item.txt}</div>
                            <div style="font-size:10px; color:var(--teal); margin-top:16px; font-weight:800; display:flex; align-items:center; gap:5px;">
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                VIEW DIAGNOSTIC
                            </div>
                        </div>
                        <div class="face back">
                            <div class="edu-label">${item.term}</div>
                            <div style="font-size:13px; line-height:1.4; font-weight:600;">${item.msg}</div>
                            <div class="case-ref">Ref: ${item.case}</div>
                        </div>
                    </div>
                `;
                cont.appendChild(card);
            });
        }
        render();
        function toggleDrawer() { /* Implementation for settings drawer */ alert("Add API key via Console: localStorage.setItem('WT_K','pT9...')"); }
    </script>
</body>
</html>
