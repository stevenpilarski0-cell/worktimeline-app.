<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Ghost Fix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 48px; --round-inner: 28px; --round-pill: 999px;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100dvh; overflow: hidden; color: var(--gray-dark); }
        
        /* GHOST MODE CSS - FIXED */
        #ghostOverlay { 
            position: absolute; 
            top: 85px; /* Sits below header */
            left: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 9999; 
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px);
            pointer-events: none; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            background: rgba(255,255,255,0); 
        }
        body.ghost-active #ghostOverlay { 
            backdrop-filter: blur(35px) grayscale(1); 
            -webkit-backdrop-filter: blur(35px) grayscale(1);
            background: rgba(238, 241, 245, 0.7); 
            pointer-events: all; 
        }

        /* INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; transition: opacity 0.8s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 460px; }
