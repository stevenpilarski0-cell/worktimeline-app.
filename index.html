<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 36px; --round-inner: 22px; --round-pill: 999px;
            --mac-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 480px; }

        /* MAIN CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 96vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); border: 1px solid rgba(255,255,255,0.6); }
        
        /* GHOST MODE BLUR */
        #privacyBlur { position: absolute; top: 85px; left: 0; right: 0; bottom: 0; z-index: 98; background: rgba(255, 255, 255, 0); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.5s ease; }
        body.privacy-active #privacyBlur { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(238, 241, 245, 0.7); pointer-events: all; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--platinum); background: white; z-index: 100; }

        /* INPUT AREA */
        .input-area { padding: 15px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); display: flex; gap: 12px; align-items: flex-end; }
        #statusBox { flex-grow: 1; height: 80px; padding: 14px; border-radius: var(--round-inner); border: 1px solid var(--platinum); font-family: inherit; font-size: 14px; outline: none; resize: none; background: white; }
        
        /* THE ROUNDED + ADD BUTTON */
        .add-btn-round { width: 55px; height: 55px; background: var(--teal); border: none; border-radius: 18px; color: white; font-size: 32px; font-weight: 300; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 15px rgba(0, 128, 128, 0.2); flex-shrink: 0; }
        .add-btn-round:active { transform: scale(0.9); }

        /* TOOLBAR */
        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); }
        .media-btn { background: white; border: 1px solid var(--platinum); padding: 10px 2px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .media-btn svg { width: 18px; height: 18px; fill: var(--teal); margin-bottom: 4px; }
        .media-btn span { font-size: 8px; font-weight: 800; text-transform: uppercase; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px; background: white; }
        .entry { padding: 15px; border: 1px solid var(--platinum); border-radius: 20px; margin-bottom: 12px; border-left: 5px solid var(--teal); }
        
        /* THE PADLOCK SYNC BUTTON */
        .footer-action { padding: 15px 20px; background: var(--gray-light); border-top: 1px solid var(--platinum); display: flex; flex-direction: column; align-items: center; }
        .lock-sync-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .padlock-btn { width: 65px; height: 65px; background: var(--gray-dark); border-radius: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15); transition: 0.3s; }
        .padlock-btn svg { width: 28px; height: 28px; fill: white; }
        .lock-sync-unit:active .padlock-btn { background: var(--clio-blue); transform: scale(0.95); }
        .sync-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <label style="position:fixed; top:20px; right:20px; font-size:10px; color:#94a3b8; font-weight:700; display:flex; align-items:center; gap:8px;">
        SKIP <input type="checkbox" onchange="endSplash()">
    </label>
</div>

<div class="app-container">
    <div id="privacyBlur"></div>
    <header class="header">
        <div><h1 id="folderLabel" style="color: var(--teal); margin:0; font-size: 18px; font-weight: 800;">WorkTimeline™</h1></div>
        <div style="display:flex; gap:12px;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 800; margin-top: 3px;">NOTES</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" id="pSwitch" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 800; margin-top: 3px;">GHOST</div></div>
        </div>
    </header>

    <div class="media-toolbar">
        <div class="media-btn"><input type="file" accept="image/*" capture="camera" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="logE('📷 Photo Evidence')"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>Camera</span></div>
        <div class="media-btn"><input type="file" accept="audio/*" capture="microphone" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="logE('🎤 Audio Evidence')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg><span>Audio</span></div>
        <div class="media-btn" onclick="window.location.href='sms:?body=Timeline:'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>Text</span></div>
        <div class="media-btn"><input type="file" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="logE('📄 Doc Uploaded')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>Docs</span></div>
    </div>

    <div class="input-area">
        <textarea id="statusBox" placeholder="Describe the truth..."></textarea>
        <button class="add-btn-round" onclick="submitM()">+</button>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <div class="footer-action">
        <div class="lock-sync-unit" onclick="syncToClio()">
            <div class="padlock-btn">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
            </div>
            <span class="sync-label">Sync to Clio</span>
        </div>
    </div>
</div>

<script>
    const story = ["We see you.", "Trapped in the grey area.", "Organized intake wins cases.", "Justice is effortless now."];
    let activeV = "CHRON"; const timelineV = []; const notesV = [];
    let sIdx = 0; let sTimer;

    window.onload = () => runS();

    function runS() {
        const el = document.getElementById('storyText');
        const next = () => {
            if(sIdx < story.length) {
                el.style.opacity = 0;
                sTimer = setTimeout(() => { el.innerText = story[sIdx++]; el.style.opacity = 1; sTimer = setTimeout(next, 3000); }, 800);
            } else endSplash();
        };
        next();
    }
    function endSplash() { clearTimeout(sTimer); const s = document.getElementById('splashScreen'); if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 1000); } }

    function toggleVault(cb) {
        activeV = cb.checked ? "NOTES" : "CHRON";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refreshD();
    }
    function togglePrivacy() { document.body.classList.toggle('privacy-active', document.getElementById('pSwitch').checked); }
    
    function submitM() { const b = document.getElementById('statusBox'); if(!b.value.trim()) return; logE(b.value); b.value = ''; }
    
    function logE(txt) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const gps = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            const now = new Date();
            const time = now.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            const stamp = (now.getMonth()+1) + '/' + now.getDate() + ' @ ' + time;
            const entry = { txt, stamp, gps };
            if(activeV === "CHRON") timelineV.push(entry); else notesV.push(entry);
            refreshD();
        });
    }

    function refreshD() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeV === "CHRON" ? timelineV : notesV;
        [...data].reverse().forEach(i => {
            list.innerHTML += `<div class="entry" style="border-left-color:${activeV === 'NOTES' ? 'var(--clio-blue)' : 'var(--teal)'}"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:4px;">${i.stamp} | 📍 ${i.gps}</div><p style="margin:0; font-size:14px; font-weight:500;">${i.txt}</p></div>`;
        });
    }

    function syncToClio() { alert("Notification: Sealed & Syncing to Clio Dashboard."); window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write`; }
</script>
</body>
</html>
