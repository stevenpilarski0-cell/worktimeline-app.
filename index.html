<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 40px; --round-inner: 24px; --round-pill: 999px;
            --mac-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 12px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1s ease; }
        .story-text { font-size: 24px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 500px; }

        /* MAC CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 94vh; display: none; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); border: 1px solid rgba(255,255,255,0.8); opacity: 0; transition: opacity 1s ease; }

        /* PRIVACY BLUR BOX */
        #blurOverlay { position: absolute; top: 220px; left: 0; right: 0; bottom: 0; z-index: 98; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.5s ease; }
        body.privacy-active #blurOverlay { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(240, 242, 245, 0.5); pointer-events: all; }

        /* CONTROL PANEL */
        .control-panel { background: var(--gray-light); padding: 15px 20px; border-bottom: 1px solid var(--platinum); display: flex; flex-direction: column; gap: 12px; z-index: 101; }
        
        /* CHRON/NOTES TOGGLE */
        .mode-switch { background: #e2e8f0; padding: 4px; border-radius: var(--round-pill); display: flex; position: relative; cursor: pointer; }
        .mode-btn { flex: 1; text-align: center; padding: 8px; font-size: 10px; font-weight: 800; z-index: 2; transition: color 0.3s; color: #64748b; }
        .mode-btn.active { color: white; }
        .mode-slider { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--teal); border-radius: var(--round-pill); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }

        /* PRIVACY TOGGLE STYLE */
        .privacy-row { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* HEADER */
        .header { padding: 10px; background: white; text-align: center; flex-shrink: 0; }
        .briefcase-logo { position: relative; width: 48px; height: 32px; border: 3.5px solid var(--gray-dark); border-radius: 9px; margin: 0 auto; }
        .briefcase-handle { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 18px; height: 7px; border: 3.5px solid var(--gray-dark); border-bottom: none; border-radius: 4px 4px 0 0; }
        .teal-spine { position: absolute; top: 55%; left: -12px; right: -12px; height: 3.5px; background: var(--teal); border-radius: 2px; }

        /* MEDIA & INPUT */
        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px 20px; background: var(--gray-light); }
        .media-btn { background: var(--teal); border: none; height: 70px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 15px rgba(0, 128, 128, 0.15); }
        .media-btn svg { width: 22px; height: 22px; fill: white; margin-bottom: 4px; }
        .media-btn span { font-size: 8px; font-weight: 800; color: white; text-transform: uppercase; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px; background: white; position: relative; }
        .entry { position: relative; padding: 18px; background: white; border: 1px solid var(--platinum); border-radius: var(--round-inner); margin-bottom: 15px; border-left: 6px solid var(--teal); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .meta-data { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        
        .sync-btn { background: var(--gray-dark); color: white; border: none; padding: 18px; border-radius: var(--round-pill); width: 90%; align-self: center; font-weight: 800; font-size: 15px; margin: 15px 0; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="splashScreen"><h1 id="storyText" class="story-text"></h1></div>

<div class="app-container" id="mainApp">
    <div id="blurOverlay"></div>

    <div class="control-panel">
        <div class="mode-switch" onclick="toggleVault()">
            <div id="slider" class="mode-slider"></div>
            <div id="chronBtn" class="mode-btn active">CHRON</div>
            <div id="notesBtn" class="mode-btn">NOTES</div>
        </div>
        <div class="privacy-row">
            <span style="font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 1px;">PRIVACY (GHOST)</span>
            <label class="switch"><input type="checkbox" onchange="togglePrivacy(this)"><span class="slider"></span></label>
        </div>
    </div>

    <header class="header">
        <div class="briefcase-logo"><div class="briefcase-handle"></div><div class="teal-spine"></div></div>
        <h1 id="appLabel" style="color: var(--teal); margin: 8px 0 0; font-size: 20px; font-weight: 800;">WorkTimeline™</h1>
    </header>

    <div class="media-toolbar">
        <div class="media-btn"><input type="file" accept="image/*" capture="camera" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="addEntryWithGPS('Visual Evidence')"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>Camera</span></div>
        <div class="media-btn"><input type="file" accept="audio/*" capture="microphone" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="addEntryWithGPS('Audio Recorded')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg><span>Audio</span></div>
        <div class="media-btn"><input type="file" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="addEntryWithGPS('Doc Uploaded')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>Docs</span></div>
        <div class="media-btn" onclick="window.location.href='sms:?body=Timeline Update:'"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>Text</span></div>
    </div>

    <div style="padding: 0 20px 15px; background: var(--gray-light); border-bottom: 1px solid var(--platinum);">
        <textarea id="statusBox" placeholder="Tell your truth here..." style="width:100%; height:75px; border-radius:18px; border:1px solid var(--platinum); padding:15px; font-family:inherit; outline:none; resize:none;"></textarea>
        <button onclick="submitManual()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:var(--round-pill); width:100%; font-weight:800; margin-top:10px;">Secure Entry</button>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button class="sync-btn" onclick="syncToClio()">
        <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
        LOCK & SYNC TO CLIO
    </button>
</div>

<script>
    const story = ["We see you.", "You're not invisible.", "Trapped in the gray area.", "Tearing down the walls.", "The Handshake begins."];
    const timelineVault = []; const notesVault = [];
    let currentMode = "CHRON";

    window.onload = () => { runIntro(); };

    function runIntro() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => {
            if(i < story.length) { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(() => { el.style.opacity = 0; setTimeout(next, 1000); }, 3000); }
            else showApp();
        };
        next();
    }

    function showApp() {
        const splash = document.getElementById('splashScreen'); const app = document.getElementById('mainApp');
        splash.style.opacity = '0';
        setTimeout(() => { splash.remove(); app.style.display = 'flex'; setTimeout(() => { app.style.opacity = '1'; }, 50); }, 1000);
    }

    function togglePrivacy(cb) { document.body.classList.toggle('privacy-active', cb.checked); }

    function toggleVault() {
        const slider = document.getElementById('slider'); const label = document.getElementById('appLabel');
        if (currentMode === "CHRON") {
            currentMode = "NOTES"; slider.style.left = "calc(50% + 0px)"; slider.style.background = "var(--clio-blue)";
            document.getElementById('notesBtn').classList.add('active'); document.getElementById('chronBtn').classList.remove('active');
            label.innerText = "Isolated Notes"; label.style.color = "var(--clio-blue)";
        } else {
            currentMode = "CHRON"; slider.style.left = "4px"; slider.style.background = "var(--teal)";
            document.getElementById('chronBtn').classList.add('active'); document.getElementById('notesBtn').classList.remove('active');
            label.innerText = "WorkTimeline™"; label.style.color = "var(--teal)";
        }
        refreshDisplay();
    }

    function submitManual() { const b = document.getElementById('statusBox'); if(b.value.trim()){ addEntryWithGPS(b.value); b.value = ''; } }

    function addEntryWithGPS(text) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const now = new Date(); const stamp = (now.getMonth()+1)+'/'+now.getDate()+' @ '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
            const gps = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            const entry = { text, stamp, gps };
            if(currentMode === "CHRON") timelineVault.push(entry); else notesVault.push(entry);
            refreshDisplay();
        }, () => alert("GPS Permission Denied."));
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = currentMode === "CHRON" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            list.innerHTML += `<div class="entry" style="border-left-color: ${currentMode === 'CHRON' ? 'var(--teal)' : 'var(--clio-blue)'}"><div class="meta-data">${item.stamp} | 📍 ${item.gps}</div><p style="margin:0; font-size:14px; font-weight:600; white-space: pre-wrap;">${item.text}</p></div>`;
        });
    }

    function syncToClio() { alert("Timeline Sealed. Sending to Clio..."); }
</script>
</body>
</html>
