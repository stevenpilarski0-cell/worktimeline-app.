<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Clio Certified</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7); 
            --round-main: 32px; --round-inner: 20px; --round-pill: 999px;
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; padding: 12px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* INTRO STORY BOX */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1s ease; }
        .story-text { font-size: 22px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 480px; letter-spacing: -0.5px; }
        #skipBtn { position: absolute; bottom: 40px; background: rgba(0,0,0,0.05); border: 1px solid var(--platinum); padding: 12px 24px; border-radius: var(--round-pill); font-size: 12px; font-weight: 800; color: var(--gray-dark); cursor: pointer; backdrop-filter: blur(10px); }

        /* MAC-LIKE CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 94vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); border: 1px solid rgba(255,255,255,0.4); }
        #blurBox { position: absolute; top: 145px; left: 0; right: 0; bottom: 0; z-index: 98; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.5s ease; }
        body.ghost-active #blurBox { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(240, 242, 245, 0.7); pointer-events: all; }

        /* CERTIFIED BADGE */
        .certified-badge { background: var(--gray-light); padding: 8px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--clio-green); text-transform: uppercase; border-bottom: 1px solid var(--platinum); }
        .check-mark { width: 14px; height: 14px; background: var(--clio-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 9px; }

        /* BRANDING AREA */
        .header { padding: 20px; border-bottom: 1px solid var(--platinum); background: white; z-index: 100; text-align: center; }
        .logo-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 15px; }
        
        /* UPDATED BRIEFCASE LOGO */
        .briefcase { position: relative; width: 52px; height: 36px; border: 3px solid var(--gray-dark); border-radius: 8px; }
        .briefcase-handle { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); width: 20px; height: 8px; border: 3px solid var(--gray-dark); border-bottom: none; border-radius: 5px 5px 0 0; }
        .teal-spine { position: absolute; top: 55%; left: -18px; right: -18px; height: 3px; background: var(--teal); border-radius: 2px; }
        .teal-dots { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; }
        .dot { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; border: 1.5px solid white; }

        .input-area { padding: 15px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); }
        #statusBox { width: 100%; height: 90px; padding: 16px; border-radius: var(--round-inner); border: 1px solid var(--platinum); font-family: inherit; font-size: 15px; outline: none; resize: none; }
        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 18px; border-radius: var(--round-pill); width: 90%; align-self: center; font-weight: 800; font-size: 15px; margin: 15px 0; box-shadow: 0 10px 20px rgba(0, 118, 206, 0.2); }
        
        /* TOGGLES */
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: var(--round-pill); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <button id="skipBtn" onclick="endSplash()">Skip Intro</button>
</div>

<div class="app-container">
    <div class="certified-badge"><div class="check-mark">✓</div> Clio Developer Certified</div>
    <div id="blurBox"></div>
    
    <header class="header">
        <div class="logo-container">
            <div class="briefcase">
                <div class="briefcase-handle"></div>
                <div class="teal-spine"></div>
                <div class="teal-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <h1 style="color: var(--teal); margin:4px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -1px;">WorkTimeline™</h1>
            <div style="font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Taking in intakes, decided.</div>
        </div>
        
        <div style="display:flex; justify-content: space-between; align-items: center; padding: 0 10px;">
            <div style="display:flex; gap:15px;">
                <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 8px; font-weight: 800; margin-top: 4px;">CHRON</div></div>
                <div style="text-align: center;"><label class="switch"><input type="checkbox" id="gSwitch" onchange="toggleGhost()"><span class="slider"></span></label><div style="font-size: 8px; font-weight: 800; margin-top: 4px;">GHOST</div></div>
            </div>
            <div id="folderLabel" style="font-size: 14px; font-weight: 800; color: var(--teal);">WorkTimeline™</div>
        </div>
    </header>

    <div class="input-area">
        <textarea id="statusBox" placeholder="Tell your truth here..."></textarea>
        <button id="addBtn" onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:16px; border-radius: var(--round-pill); width:100%; font-weight:800; margin-top:12px; transition: 0.3s;">Secure Entry & Build Timeline</button>
    </div>

    <div id="timelineContainer" style="flex-grow:1; overflow-y:auto; padding:20px; position:relative;">
        <div id="displayList"></div>
    </div>

    <button class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
</div>

<script>
    const story = [
        "We see you. We hear you.",
        "You're not invisible.",
        "You're just stuck. Lost. Don't know what to do. Don't know where to go.",
        "Trapped in that gray area... trapped in what feels like a prison.",
        "Jack Newton calls you the 'Invisible 60%.'",
        "Law firms turn away 3 out of 5 people because messy data is too costly to fix.",
        "Messy files drain 40% of a lawyer's resources every single day.",
        "But clean, organized intake boosts your case success rate by 60%.",
        "We aren't here to build a wage bridge.",
        "We are here to tear down the prison walls.",
        "WorkTimeline™ brings lawyers and clients together through the power of truth.",
        "Let's bridge the gap."
    ];
    
    let splashTimer;
    window.onload = () => { runStory(); handleClioReturn(); };

    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const showLine = () => {
            if(i < story.length) {
                el.innerText = story[i++]; el.style.opacity = 1;
                splashTimer = setTimeout(() => { 
                    el.style.opacity = 0; 
                    splashTimer = setTimeout(showLine, 1000); 
                }, 3200); 
            } else endSplash();
        };
        showLine();
    }

    function endSplash() {
        clearTimeout(splashTimer);
        const s = document.getElementById('splashScreen');
        if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 1000); }
    }

    function toggleGhost() { document.body.classList.toggle('ghost-active', document.getElementById('gSwitch').checked); }
    
    function toggleVault(cb) {
        const activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        document.getElementById('addBtn').style.background = cb.checked ? "var(--clio-blue)" : "var(--teal)";
    }

    async function syncToClio() {
        const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');
        sessionStorage.setItem('clio_code_verifier', verifier);
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write%20notes_write&code_challenge=${challenge}&code_challenge_method=S256`;
    }

    async function handleClioReturn() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code'); const verifier = sessionStorage.getItem('clio_code_verifier');
        if (code && verifier) {
            const resp = await fetch(`https://ca.app.clio.com/oauth/token`, {
                method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ grant_type: "authorization_code", code, client_id: "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s", redirect_uri: "https://worktimeline-app.vercel.app/index.html", code_verifier: verifier })
            });
            const data = await resp.json();
            if (data.access_token) { localStorage.setItem('clio_access_token', data.access_token); window.history.replaceState({}, '', "/index.html"); alert("Connected to Clio."); }
        }
    }

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        const list = document.getElementById('displayList');
        const div = document.createElement('div');
        div.style.cssText = "background:white; border:1px solid #e2e8f0; padding:15px; border-radius:15px; margin-bottom:15px; border-left:5px solid var(--teal);";
        div.innerHTML = `<p style="margin:0; font-size:14px; font-weight:500;">${box.value}</p>`;
        list.prepend(div);
        box.value = '';
    }
</script>
</body>
</html>
