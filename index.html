<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --mac-glass: rgba(255, 255, 255, 0.75);
            --damage-red: #e53e3e;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-locked { filter: blur(35px); pointer-events: none; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; }
        
        /* HEADER */
        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: var(--mac-glass); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .mac-nav { display: flex; background: rgba(0,0,0,0.06); padding: 2px; border-radius: 14px; position: relative; width: 160px; border: 0.5px solid rgba(0,0,0,0.05); }
        .nav-item { flex: 1; font-size: 8px; font-weight: 900; padding: 7px 0; border: none; background: transparent; color: #718096; cursor: pointer; position: relative; z-index: 1; text-align: center; }
        .nav-slider { position: absolute; top: 2px; left: 2px; height: calc(100% - 4px); width: 52px; background: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0; }

        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: none; flex-direction: column; gap: 20px; }
        .view-section.active { display: flex; }

        /* MARKET CARD */
        .auction-card { background: #f8fafc; border: 1.5px solid var(--gray-border); border-radius: 24px; padding: 18px; box-shadow: var(--mac-shadow); border-left: 8px solid var(--silver-gray); }
        .win-rate { font-size: 24px; font-weight: 900; margin: 5px 0; transition: color 0.5s; }
        .damage-tag { font-size: 9px; font-weight: 900; color: var(--damage-red); background: #fff5f5; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 5px; }
        .disclaimer-box { font-size: 8.5px; color: #718096; line-height: 1.4; margin-top: 15px; text-align: left; background: #edf2f7; padding: 10px; border-radius: 12px; }

        /* JOURNAL STYLES */
        .stack-wrapper { position: relative; width: 100%; }
        .stamp-label { font-size: 9px; font-weight: 900; color: var(--silver-gray); margin-bottom: 6px; }
        .stack-inner { position: relative; width: 90%; min-height: 70px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 15px; border-radius: 22px; backface-visibility: hidden; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); }
        .bubble-front { background: #f1f1f1; border: 1px solid #e5e5e5; }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; height: 100%; overflow-y: auto; }
        
        .has-ai.pulse-on::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 22px; z-index: -1; animation: heavy-pulse 3s infinite; }
        @keyframes heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        #addBtn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; width: 70px; height: 70px; background: var(--teal); font-size: 30px; bottom: 30px; right: 20px; border: none; cursor: pointer; }
        select { border: 1px solid var(--gray-border); border-radius: 10px; padding: 5px; font-size: 10px; font-family: inherit; }
    </style>
</head>
<body>

<div id="overlaySystem">
    <div style="background: white; padding: 30px; border-radius: 28px; text-align: center; max-width: 300px;">
        <h2 style="font-weight: 900; margin: 0;">WORK-DEMO</h2>
        <p style="font-size: 12px; color: #4a5568;">Privacy-Compliant Marketplace & Scoring Engine.</p>
        <button onclick="unlockApp()" style="background:var(--teal); color:white; border:none; padding:15px; width:100%; border-radius:18px; font-weight:800; cursor:pointer;">START DEMO</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div style="font-weight: 900; font-size: 13px; color: var(--teal);">WorkTimeline™</div>
        <div class="mac-nav">
            <div class="nav-slider" id="navSlider"></div>
            <button class="nav-item" onclick="switchView('journal', 0, this)">JOURNAL</button>
            <button class="nav-item" onclick="switchView('market', 54, this)">LAWYER</button>
            <button class="nav-item" onclick="switchView('ghost', 108, this)">GHOST</button>
        </div>
    </header>

    <div id="journalView" class="view-section active">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 10px; font-weight: 900; color: var(--silver-gray);">Jurisdiction:</span>
            <select id="provinceSelect">
                <option value="BC">British Columbia (ESA/WorkSafe)</option>
                <option value="ON">Ontario (ESA/WSIB)</option>
                <option value="QC">Quebec (CNESST)</option>
            </select>
        </div>
        <textarea id="statusBox" style="width:100%; height:80px; border-radius:20px; border:1px solid var(--gray-border); padding:15px; font-family:inherit; box-sizing: border-box;" placeholder="Type incident details (e.g., 'fire', 'privacy', 'harass')..."></textarea>
        <div id="timelineContainer"></div>
    </div>

    <div id="marketView" class="view-section">
        <h3 style="font-weight: 900; margin: 0; font-size: 14px;">Anonymous Portfolios</h3>
        <div id="marketContainer"></div>
    </div>

    <button id="addBtn" onclick="submitEntry()">+</button>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];

    function unlockApp() {
        document.getElementById('overlaySystem').style.display = 'none';
        document.getElementById('mainApp').classList.remove('app-locked');
        refresh();
        renderMarket();
    }

    function switchView(view, offset, btn) {
        document.getElementById('navSlider').style.transform = `translateX(${offset}px)`;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        const targetView = (view === 'ghost') ? 'journalView' : `${view}View`;
        document.getElementById(targetView).classList.add('active');
        document.body.classList.toggle('ghost-active', view === 'ghost');
        document.getElementById('addBtn').style.display = (view === 'market') ? 'none' : 'flex';
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value;
        const prov = document.getElementById('provinceSelect').value;
        if(!text.trim()) return;

        // Legal Pattern Logic
        const patterns = [
            { key: "fire", type: "ESA", msg: "Unlawful Termination Risk" },
            { key: "hurt", type: "WorkSafe", msg: "OHS Non-Compliance" },
            { key: "pay", type: "ESA", msg: "Wage Theft/Overtime Breach" },
            { key: "harass", type: "Human Rights", msg: "Discriminatory Conduct" },
            { key: "privacy", type: "Privacy Act", msg: "Personal Info Breach/FOIPPA" },
            { key: "stole", type: "Criminal", msg: "Aggravated Conduct/Theft" }
        ];

        let analysis = "";
        let tags = [];
        patterns.forEach(p => {
            if(text.toLowerCase().includes(p.key)) {
                analysis = p.msg;
                tags.push(p.type);
            }
        });

        vault.push({ grit: text, analysis: analysis, tags: tags, province: prov, stamp: new Date().toLocaleString() });
        localStorage.setItem('wt_timeline', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        refresh();
        renderMarket();
    }

    function refresh() {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = vault.length === 0 ? '<p style="text-align:center; color:gray; font-size:12px;">Timeline Empty.</p>' : '';
        [...vault].reverse().forEach(item => {
            const hasAI = item.analysis !== "";
            container.innerHTML += `
                <div class="stack-wrapper">
                    <div class="stamp-label">📍 ${item.province} | ${item.stamp}</div>
                    <div class="stack-inner ${hasAI ? 'has-ai pulse-on' : ''}" onclick="if('${hasAI}'=='true') this.classList.toggle('flipped')">
                        <div class="bubble bubble-front"><p style="margin:0; font-size:12px;">${item.grit}</p></div>
                        <div class="bubble bubble-back"><p style="margin:0; font-size:10px; font-weight:900;">${item.analysis}</p></div>
                    </div>
                </div>`;
        });
    }

    function renderMarket() {
        const container = document.getElementById('marketContainer');
        if(vault.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:gray; font-size:11px;">No active evidence packages.</p>';
            return;
        }

        // WEIGHTED SCORING ALGORITHM
        const total = vault.length;
        const aiPoints = vault.filter(v => v.analysis !== "").length * 20;
        const complexity = total * 5;
        const provinceFactor = (vault[0].province === "QC") ? 0.8 : 1.0; 
        
        const rawWinRate = (aiPoints + complexity) * provinceFactor;
        const winPercent = Math.min(99, Math.max(5, rawWinRate));
        
        const tealFactor = winPercent / 100;
        const dynamicColor = `rgb(${149 - (149-0)*tealFactor}, ${165 - (165-128)*tealFactor}, ${166 - (166-128)*tealFactor})`;

        const damageFlags = [];
        if(vault.some(v => v.tags.includes("Criminal"))) damageFlags.push("PUNITIVE");
        if(vault.some(v => v.tags.includes("Human Rights"))) damageFlags.push("AGGRAVATED");

        container.innerHTML = `
            <div class="auction-card" style="border-left-color: ${dynamicColor}">
                <div class="win-rate" style="color: ${dynamicColor}">${winPercent}% Success Probability</div>
                <div style="font-size:10px; font-weight:900; color:var(--silver-gray);">ANONYMOUS PORTFOLIO | JURISDICTION: ${vault[0].province}</div>
                <div style="font-size:11px; margin-top:8px;"><strong>Pattern Analysis:</strong> ${[...new Set(vault.map(v => v.tags).flat())].join(", ") || "General Inquiry"}</div>
                <div style="margin-top:5px;">
                    ${damageFlags.map(d => `<span class="damage-tag">${d} DAMAGES LIKELY</span>`).join(" ")}
                </div>
                
                <div class="disclaimer-box">
                    <strong>DISCLAIMER:</strong> This analysis is based on automated pattern recognition and data evaluation. We do not provide legal advice. Our platform does not accept payments or commissions from client outcomes.
                </div>

                <button style="width:100%; margin-top:15px; padding:10px; border-radius:12px; background:var(--clio-blue); color:white; border:none; font-weight:900; cursor:pointer;">ACQUIRE CASE VIA CLIO</button>
            </div>`;
    }
</script>
</body>
</html>
