<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        :root { 
            --teal: #008080; 
            --silver-gray: #95a5a6; 
            --gray-bg: #e2e8f0; 
            --clio-green: #2ecc71; 
            --clio-blue: #0076CE;
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12); 
            --risk-red: #e53e3e;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        .app-locked { filter: blur(35px); pointer-events: none; }
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; }
        
        /* HEADER */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; position: relative; }
        .header-top { display: flex; justify-content: flex-start; align-items: center; }
        .brand-text { display: flex; flex-direction: column; align-items: flex-start; }
        .main-title { font-weight: 900; font-size: 17px; display: flex; align-items: center; letter-spacing: -0.5px; }
        .work-silver { color: var(--silver-gray); }
        .timeline-teal { color: var(--teal); }
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; margin-left: 8px; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* TIMELINE - STACK SYSTEM */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 150px; display: flex; flex-direction: column; gap: 25px; scrollbar-width: none; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stack-inner { position: relative; width: 85%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 15px; border-radius: 22px; font-family: 'Nunito Sans', sans-serif; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; }
        .bubble-front { background: #f1f1f1; border: 1px solid #e5e5e5; color: #1a202c; position: relative; z-index: 2; }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: 1px solid rgba(255,255,255,0.2); }
        
        /* THE PULSE (Conditional) */
        .stack-inner.has-ai.pulse-on::after { 
            content: ''; position: absolute; top: 6px; left: 8px; width: 100%; height: 100%; background: #4a5568; border-radius: 22px; z-index: 0; opacity: 0.7; animation: dark-heavy-pulse 3s infinite ease-in-out; 
        }
        @keyframes dark-heavy-pulse { 
            0% { box-shadow: 0 0 0 0 rgba(74, 85, 104, 0.7); background: #4a5568; } 
            50% { background: var(--teal); box-shadow: 0 0 0 15px rgba(0, 128, 128, 0.4); opacity: 0.9; }
            70% { box-shadow: 0 0 0 30px rgba(0, 128, 128, 0); background: var(--teal); } 
            100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); background: #4a5568; } 
        }

        /* OVERLAYS */
        #overlaySystem { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 28px; box-shadow: var(--mac-shadow); width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 12px; cursor: pointer; font-size: 13px; font-family: 'Nunito', sans-serif; }
        
        /* DRAWERS & UI */
        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1px solid var(--gray-border); z-index: 3500; transition: 0.5s transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; }
        .handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 35px; height: 4px; background: #cbd5e0; border-radius: 10px; }
        .draggable { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; border: none; box-shadow: var(--mac-shadow); touch-action: none; }
        #addBtn { width: 70px; height: 70px; background: var(--teal); font-size: 30px; top: 160px; right: 20px; }
        textarea { width: 100%; height: 85px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-family: 'Nunito Sans', sans-serif; font-weight: 600; font-size: 15px; outline: none; background: #fafafa; }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card" id="modalContent">
        <h2 style="color: #1a202c; font-weight: 900; margin: 0; font-size: 18px; letter-spacing: -0.5px;">INTAKE GUARD</h2>
        <div style="font-size: 13px; line-height: 1.5; color: #4a5568; margin: 15px 0; font-weight: 600;">Secure your records. We provide documentation support, but we do not offer legal advice.</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">SECURE MY JOURNAL</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div class="header-top">
            <div class="brand-text"><div class="main-title"><span class="work-silver">Work</span><span class="timeline-teal">Timeline</span>™ <div class="clio-pulse"></div></div></div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px;"><textarea id="statusBox" placeholder="Documenting the grit..."></textarea></div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>
    <button id="addBtn" class="draggable">+</button>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let pulseActive = localStorage.getItem('wt_pulse_active') !== 'false';
    let pulseExplained = localStorage.getItem('wt_pulse_explained') === 'true';
    let utilOpen = false; let activePending = null;

    function unlockApp() { document.getElementById('overlaySystem').style.display = 'none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }

    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0; el.onmousedown = dStart; el.ontouchstart = dStart;
        function dStart(e) { p3 = e.clientX || e.touches[0].clientX; p4 = e.clientY || e.touches[0].clientY; document.onmouseup = dEnd; document.ontouchend = dEnd; document.onmousemove = dMove; document.ontouchmove = dMove; }
        function dMove(e) { let cx = e.clientX || e.touches[0].clientX; let cy = e.clientY || e.touches[0].clientY; p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; }
        function dEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
    }
    makeDraggable(document.getElementById("addBtn"));

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        let isRisk = text.toLowerCase().includes("fire") || text.toLowerCase().includes("retaliation") || text.toLowerCase().includes("termination");
        activePending = { grit: text, analysis: isRisk ? "EA: High-severity pattern detected." : "", stamp: new Date().toLocaleString() };
        
        if(isRisk && !pulseExplained) {
            triggerPulseDiagnostic();
        } else if(isRisk) {
            triggerRiskWarning();
        } else { confirmSave(); }
        document.getElementById('statusBox').value = ''; if(utilOpen) toggleUtility();
    }

    function triggerPulseDiagnostic() {
        document.getElementById('modalContent').innerHTML = `
            <h2 style="color:var(--risk-red); font-weight:900; margin:0; font-size:18px;">PULSE DIAGNOSTIC</h2>
            <div style="font-size:12px; line-height:1.5; color:#4a5568; margin:15px 0; font-weight:600; text-align:left;">
                An <b>Employment Risk Pulse</b> has been detected. <br><br>
                <b>What is it?</b> This Gray-to-Teal heartbeat flags entries where your employment is at high risk. It is a visual legal marker to separate grit from crisis.<br><br>
                <b>Your Control:</b> You can keep this rhythmic heartbeat active to track risks, or shut it off for a flat visual experience.
            </div>
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="setPulsePreference(true)">KEEP PULSE ON</button>
            <button class="modal-btn" style="background:#f1f5f9; color:#718096;" onclick="setPulsePreference(false)">SHUT PULSE OFF</button>`;
        document.getElementById('overlaySystem').style.display = 'flex';
    }

    function triggerRiskWarning() {
        document.getElementById('modalContent').innerHTML = `
            <h2 style="color:var(--risk-red); font-weight:900; margin:0; font-size:18px;">EMPLOYMENT AT RISK!</h2>
            <div style="font-size:13px; line-height:1.5; color:#4a5568; margin:15px 0; font-weight:600;">High-severity markers detected. Documenting this pattern is critical.</div>
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="confirmSave()">OK, I UNDERSTAND</button>`;
        document.getElementById('overlaySystem').style.display = 'flex';
    }

    function setPulsePreference(pref) {
        pulseActive = pref; pulseExplained = true;
        localStorage.setItem('wt_pulse_active', pref);
        localStorage.setItem('wt_pulse_explained', 'true');
        confirmSave();
    }

    function confirmSave() {
        vault.push(activePending); localStorage.setItem('wt_timeline', JSON.stringify(vault));
        unlockApp(); refresh();
        setTimeout(() => { document.getElementById('modalContent').innerHTML = `<h2 style="font-weight:900; font-size:18px;">INTAKE GUARD</h2><div style="font-size:13px; font-weight:600; margin:15px 0;">Secure your records. We provide support, but no legal advice.</div><button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">SECURE MY JOURNAL</button>`; }, 500);
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const pulseClass = pulseActive ? 'pulse-on' : '';
        [...vault].reverse().forEach(item => {
            const hasAI = item.analysis !== "";
            list.innerHTML += `
                <div class="stack-wrapper">
                    <div class="stack-inner ${hasAI ? 'has-ai ' + pulseClass : ''}" onclick="this.classList.toggle('flipped')">
                        <div class="bubble bubble-front"><p style="font-weight:600; font-size:14px; margin:0;">${item.grit}</p></div>
                        ${hasAI ? `<div class="bubble bubble-back"><p style="font-weight:600; font-size:13px; margin:0;">${item.analysis}</p></div>` : ''}
                    </div>
                </div>`;
        });
    }

    let sX, sY; document.getElementById("addBtn").addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    document.getElementById("addBtn").addEventListener('touchend', e => { let dx = Math.abs(e.changedTouches[0].clientX - sX); let dy = Math.abs(e.changedTouches[0].clientY - sY); if(dx < 10 && dy < 10) submitEntry(); });
    refresh();
</script>
</body>
</html>
