<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Prototype</title>
    <!-- Tesseract OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --mac-glass: rgba(255, 255, 255, 0.75);
            --damage-red: #e53e3e;
            --clio-green: #2ecc71;
            --warning-amber: #d69e2e;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-locked { filter: blur(35px); pointer-events: none; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; transition: all 0.3s ease; }
        
        /* GHOST MODE & CLIO PORTAL */
        .ghost-active .privacy-sensitive { filter: blur(15px) grayscale(1); opacity: 0.2; pointer-events: none; }
        .clio-portal { background: #f4f7f9; display: none; height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 9999; flex-direction: column; }

        /* HEADER */
        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: var(--mac-glass); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .mac-nav { display: flex; background: rgba(0,0,0,0.06); padding: 2px; border-radius: 14px; position: relative; width: 160px; border: 0.5px solid rgba(0,0,0,0.05); }
        .nav-item { flex: 1; font-size: 8px; font-weight: 900; padding: 7px 0; border: none; background: transparent; color: #718096; cursor: pointer; position: relative; z-index: 1; text-align: center; }
        .nav-slider { position: absolute; top: 2px; left: 2px; height: calc(100% - 4px); width: 52px; background: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 0; }

        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: none; flex-direction: column; gap: 20px; }
        .view-section.active { display: flex; }

        /* UI COMPONENTS */
        .auction-card { background: #f8fafc; border: 1.5px solid var(--gray-border); border-radius: 24px; padding: 18px; box-shadow: var(--mac-shadow); border-left: 8px solid var(--silver-gray); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: 9px; font-weight: 900; color: white; margin-bottom: 5px; }

        /* JOURNAL STACK */
        .stack-wrapper { position: relative; width: 100%; }
        .stamp-label { font-size: 9px; font-weight: 900; color: var(--silver-gray); margin-bottom: 6px; }
        .bubble { padding: 15px; border-radius: 22px; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); background: #f1f1f1; border: 1px solid #e5e5e5; }
        
        #addBtn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; width: 70px; height: 70px; background: var(--teal); font-size: 30px; bottom: 30px; right: 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="overlaySystem">
    <div style="background: white; padding: 30px; border-radius: 28px; text-align: center; max-width: 300px;">
        <h2 style="font-weight: 900; margin: 0; font-size: 16px;">WORK-DEMO</h2>
        <p style="font-size: 12px; color: #4a5568;">Natural Language Date OCR & Conflict Detection.</p>
        <button onclick="unlockApp()" style="background:var(--teal); color:white; border:none; padding:15px; width:100%; border-radius:18px; font-weight:800; cursor:pointer;">START DEMO</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <!-- CLIO SIMULATION LAYER -->
    <div id="clioPortal" class="clio-portal">
        <header style="background:var(--clio-blue); color:white; padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:900;">Clio Grow | Lead Management</div>
            <button onclick="exitClio()" style="background:transparent; border:1px solid white; color:white; font-size:10px; border-radius:8px; padding:5px 10px;">Exit Portal</button>
        </header>
        <div style="padding:20px; overflow-y:auto;">
            <div id="clioDuoReport" style="background:#fff; border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid var(--gray-border);"></div>
            <div style="background:white; border-radius:20px; padding:20px; border:1px solid var(--gray-border);">
                <h3 style="margin-top:0; font-size:14px;">Evidence Vault</h3>
                <div id="clioEvidenceView"></div>
            </div>
        </div>
    </div>

    <header class="header">
        <div style="font-weight: 900; font-size: 13px; color: var(--teal);">WorkTimeline™</div>
        <div class="mac-nav">
            <div class="nav-slider" id="navSlider"></div>
            <button class="nav-item" onclick="switchView('journal', 0, this)">JOURNAL</button>
            <button class="nav-item" onclick="switchView('market', 54, this)">LAWYER</button>
            <button class="nav-item" onclick="switchView('ghost', 108, this)">GHOST</button>
        </div>
    </header>

    <div id="journalView" class="view-section active">
        <div style="display:flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px;">
            <select id="typeSelect" style="border-radius:10px; font-size:10px; padding:5px; flex: 1; border: 1px solid var(--gray-border);">
                <option value="CONTEMP">Live Note</option>
                <option value="CORROB">Upload Report (Written Date OCR)</option>
            </select>
            <button id="lockBtn" onclick="lockTimeline()" style="font-size:9px; font-weight:900; background:var(--silver-gray); color:white; border:none; padding:5px 10px; border-radius:8px; cursor:pointer;">LOCK TIMELINE</button>
        </div>
        
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="processImage(event)">
        <button onclick="document.getElementById('imageInput').click()" style="background:#edf2f7; border:1px dashed var(--silver-gray); padding:10px; border-radius:12px; font-size:10px; font-weight:800; cursor:pointer; width:100%;">📷 SCAN REPORT (WORDS OR NUMBERS)</button>
        <div id="ocrStatus" style="font-size:10px; color:var(--teal); font-weight:900; display:none; margin-top:5px; text-align:center;">READING...</div>

        <textarea id="statusBox" style="width:100%; height:80px; border-radius:20px; border:1px solid var(--gray-border); padding:15px; font-family:inherit; box-sizing: border-box; margin-top:10px;" placeholder="Add to your timeline..."></textarea>
        <div id="timelineContainer" class="privacy-sensitive"></div>
    </div>

    <div id="marketView" class="view-section">
        <h3 style="font-weight: 900; margin: 0; font-size: 14px;">Lawyer Dashboard | Integrity Market</h3>
        <div id="marketContainer"></div>
    </div>

    <button id="addBtn" onclick="submitEntry()">+</button>
</div>

<script>
    const TERM_MAP = {
        CONTEMP: { client: "Live Note", lawyer: "Contemporaneous Evidence" },
        CORROB: { client: "Verified Report", lawyer: "Corroborated Document" }
    };

    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let isLocked = localStorage.getItem('wt_locked') === 'true';
    let isTampered = localStorage.getItem('wt_tampered') === 'true';
    let detectedDate = null;

    function unlockApp() {
        document.getElementById('overlaySystem').style.display = 'none';
        document.getElementById('mainApp').classList.remove('app-locked');
        refresh();
        renderMarket();
    }

    // 1. OCR & WRITTEN MONTH DETECTION
    async function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusLabel = document.getElementById('ocrStatus');
        statusLabel.style.display = 'block';
        statusLabel.innerText = "SCANNING FOR WRITTEN DATES...";
        
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        
        // Regex includes Month Names: (January|February|...|Sept|...) 
        const writtenDateRegex = /((January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{1,2},?\s\d{4})|(\d{4}[-/]\d{2}[-/]\d{2})|(\d{1,2}[-/]\d{1,2}[-/]\d{4})/;
        const match = text.match(writtenDateRegex);

        if (match) {
            detectedDate = match[0];
            statusLabel.innerText = "✅ FOUND: " + detectedDate;
        } else {
            statusLabel.innerText = "❌ NO CLEAR DATE FOUND.";
        }
    }

    function lockTimeline() {
        if(vault.length === 0) return;
        isLocked = true;
        localStorage.setItem('wt_locked', 'true');
        document.getElementById('lockBtn').innerText = "SECURED";
        renderMarket(); 
    }

    function switchView(view, offset, btn) {
        document.getElementById('navSlider').style.transform = `translateX(${offset}px)`;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const app = document.getElementById('mainApp');
        const sections = document.querySelectorAll('.view-section');
        app.classList.remove('ghost-active');
        if (view === 'ghost') {
            app.classList.add('ghost-active');
            sections.forEach(s => s.classList.remove('active'));
            document.getElementById('journalView').classList.add('active');
        } else {
            sections.forEach(s => s.classList.remove('active'));
            document.getElementById(`${view}View`).classList.add('active');
        }
        document.getElementById('addBtn').style.display = (view === 'market') ? 'none' : 'flex';
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value;
        const type = document.getElementById('typeSelect').value;
        if(!text.trim()) return;

        let entryTampered = false;
        if(isLocked) {
            entryTampered = true;
            isTampered = true;
            localStorage.setItem('wt_tampered', 'true');
        }

        // WRITTEN DATE VALIDATION
        let hasDateConflict = false;
        if(detectedDate) {
            const reportTime = new Date(detectedDate).getTime();
            const uploadTime = new Date().getTime();
            // If the report date is in the future compared to right now
            if (reportTime > uploadTime) hasDateConflict = true;
        }

        vault.push({ 
            grit: text, 
            entryType: type,
            documentDate: detectedDate, 
            stamp: new Date().toLocaleString(), 
            tampered: entryTampered,
            dateConflict: hasDateConflict
        });

        localStorage.setItem('wt_timeline', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        detectedDate = null;
        document.getElementById('ocrStatus').style.display = 'none';
        refresh();
        renderMarket();
    }

    function refresh() {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = '';
        [...vault].reverse().forEach(item => {
            container.innerHTML += `
                <div class="stack-wrapper">
                    <div class="stamp-label" style="color:${item.tampered || item.dateConflict ? 'var(--damage-red)' : ''}">
                        Uploaded: ${item.stamp}
                    </div>
                    <div class="bubble">
                        <span style="font-size:9px; font-weight:900; color:var(--teal);">${TERM_MAP[item.entryType].client}</span>
                        ${item.documentDate ? `<div style="font-size:9px; color:${item.dateConflict ? 'var(--damage-red)' : 'var(--clio-blue)'}; font-weight:900;">📍 Report Date: ${item.documentDate}</div>` : ''}
                        <p style="margin:5px 0 0 0; font-size:12px;">${item.grit}</p>
                    </div>
                </div>`;
        });
    }

    function renderMarket() {
        const container = document.getElementById('marketContainer');
        if(!isLocked) {
            container.innerHTML = '<p style="text-align:center; color:gray; font-size:11px; margin-top:40px;">Lock required for Analysis.</p>';
            return;
        }
        const conflictCount = vault.filter(v => v.dateConflict).length;
        container.innerHTML = `
            <div class="auction-card" style="border-left-color: ${conflictCount > 0 ? 'var(--damage-red)' : 'var(--teal)'}">
                <span class="badge" style="background:${conflictCount > 0 ? 'var(--damage-red)' : 'var(--teal)'}">${conflictCount > 0 ? 'CONFLICT ALERT' : 'HIGH INTEGRITY'}</span>
                <div class="win-rate" style="color:${conflictCount > 0 ? 'var(--damage-red)' : 'var(--teal)'}">${conflictCount > 0 ? 'DATE DISCREPANCY' : '95% Narrative Trust'}</div>
                <button onclick="acquireLead()" style="width:100%; margin-top:15px; padding:12px; border-radius:14px; background:var(--clio-blue); color:white; border:none; font-weight:900; cursor:pointer;">ACQUIRE VIA CLIO</button>
            </div>`;
    }

    function acquireLead() {
        document.getElementById('clioPortal').style.display = 'flex';
        const ev = document.getElementById('clioEvidenceView');
        const report = document.getElementById('clioDuoReport');
        ev.innerHTML = '';
        
        const conflicts = vault.filter(v => v.dateConflict);
        report.innerHTML = `
            <strong style="color:var(--clio-blue); font-size:12px;">CLIO DUO™ STORY INTEGRITY REPORT</strong>
            <p style="font-size:11px; line-height:1.4;">
                ${conflicts.length > 0 ? 
                    `<strong>CRITICAL:</strong> Found reports dated after their upload time. Potential backdating detected.` : 
                    `<strong>VERIFIED:</strong> Written month OCR cross-references with upload timestamps successfully.`}
            </p>
        `;

        vault.forEach(item => {
            ev.innerHTML += `
                <div style="margin-top:15px; padding-bottom:10px; border-bottom:1px solid #eee;">
                    <span style="font-size:9px; font-weight:900; color:var(--clio-blue);">${TERM_MAP[item.entryType].lawyer}</span>
                    <div style="font-size:12px; margin-top:4px;">"${item.grit}"</div>
                    ${item.documentDate ? `<div style="font-size:9px; color:${item.dateConflict ? 'var(--damage-red)' : 'var(--clio-green)'}; font-weight:900;">Detected Date: ${item.documentDate}</div>` : ''}
                </div>`;
        });
    }

    function exitClio() { document.getElementById('clioPortal').style.display = 'none'; }
</script>
</body>
</html>
