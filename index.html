<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite | Titanium Gravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #008080;
            --silver: #cbd5e1;
            --slate: #1e293b;
            --risk: #ef4444;
            --teal-blue: #0ea5e9;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body { font-family: 'Nunito Sans', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* PULSE ENGINE SCALING */
        @keyframes pulse-moderate { 0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(14, 165, 233, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); } }
        @keyframes pulse-critical { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 0 35px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .stealth-active #timeline { filter: blur(20px) grayscale(1); pointer-events: none; }

        /* HEADER & DRAWER */
        #topDrawer { position: fixed; top: 0; left: 0; width: 100%; background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--silver); border-radius: 0 0 35px 35px; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; transform: translateY(calc(-100% + 65px)); }
        #topDrawer.open { transform: translateY(0); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 0 25px; height: 65px; }
        .brand { font-weight: 900; color: var(--teal); }

        /* MAC SWITCHES */
        .controls-row { display: flex; gap: 15px; }
        .sw-wrap { display: flex; flex-direction: column; align-items: center; }
        .sw { position: relative; width: 36px; height: 20px; }
        .sw input { opacity: 0; width: 0; height: 0; }
        .sld { position: absolute; inset: 0; background: #e2e8f0; transition: .3s; border-radius: 20px; cursor: pointer; }
        .sld:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .sld { background: var(--teal); }
        input:checked + .sld:before { transform: translateX(16px); }

        /* INTAKE */
        .intake-content { padding: 20px 25px 80px; }
        .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .chip { background: white; border: 1px solid var(--silver); padding: 8px 16px; border-radius: 100px; font-size: 11px; font-weight: 800; white-space: nowrap; }
        #statusBox { width: 100%; height: 100px; padding: 20px; border-radius: 30px; border: 1px solid var(--silver); background: #fff; font-size: 15px; outline: none; box-sizing: border-box; }

        /* MEDIA DOCK */
        .media-dock { display: flex; gap: 12px; margin-top: 15px; }
        .icon-btn { width: 50px; height: 50px; background: #fff; border: 1px solid var(--silver); border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .icon-btn svg { width: 22px; height: 22px; stroke: var(--slate); fill: none; stroke-width: 2; }
        .add-btn { flex-grow: 1; background: var(--teal); color: white; border-radius: 20px; border: none; font-weight: 900; }

        /* TIMELINE CARDS */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 90px 20px 120px; display: flex; flex-direction: column; gap: 25px; }
        .card-inner { perspective: 1000px; width: 100%; }
        .face { border-radius: 32px; padding: 25px; background: white; border: 1px solid var(--silver); transition: 0.6s; backface-visibility: hidden; position: relative; }
        
        /* PULSE CLASSES */
        .p-moderate { animation: pulse-moderate 2s infinite ease-in-out; border-left: 6px solid var(--teal-blue) !important; }
        .p-critical { animation: pulse-critical 0.8s infinite ease-in-out; border-left: 6px solid var(--risk) !important; }
        .front { border-left: 6px solid var(--teal); }
        .back { position: absolute; inset: 0; transform: rotateY(180deg); background: var(--slate); color: white; border-left: 6px solid var(--teal); }
        .card-inner.flipped .front { transform: rotateY(180deg); }
        .card-inner.flipped .back { transform: rotateY(0); }

        #gear { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--slate); border-radius: 24px; border: none; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
        .handle { height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pill { width: 45px; height: 5px; background: var(--silver); border-radius: 10px; }
    </style>
</head>
<body id="app">

    <div id="topDrawer">
        <div class="header">
            <div class="brand">WorkTimeline</div>
            <div class="controls-row">
                <div class="sw-wrap">
                    <label class="sw"><input type="checkbox" onchange="document.getElementById('app').classList.toggle('stealth-active')"><span class="sld"></span></label>
                    <span style="font-size:7px; font-weight:900; color:var(--silver); margin-top:4px;">STEALTH</span>
                </div>
            </div>
        </div>
        <div class="intake-content">
            <div class="chip-row">
                <div class="chip" onclick="tag('ACCIDENT')">ACCIDENT</div>
                <div class="chip" onclick="tag('WITNESS')">WITNESS</div>
                <div class="chip" onclick="tag('HAZARD')">HAZARD</div>
            </div>
            <textarea id="statusBox" placeholder="Log incident details..."></textarea>
            <div class="media-dock">
                <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v4M8 23h8"/></svg></div>
                <button class="add-btn" onclick="process()">RECORD</button>
            </div>
        </div>
        <div class="handle" onclick="document.getElementById('topDrawer').classList.toggle('open')"><div class="pill"></div></div>
    </div>

    <div id="timeline"></div>

    <button id="gear" onclick="alert('System Active')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>

    <script>
        let db = JSON.parse(localStorage.getItem('WT_PULSE')) || [];
        function tag(t) { document.getElementById('statusBox').value += `[${t}] `; }
        
        async function process() {
            let v = document.getElementById('statusBox').value.trim();
            if(!v) return;

            // Simple Logic for Gravity:
            let sev = 0;
            if(v.toLowerCase().includes("fired") || v.toLowerCase().includes("injury")) sev = 3;
            else if(v.toLowerCase().includes("witness") || v.toLowerCase().includes("hazard")) sev = 1;

            db.push({ t: v, d: new Date().toLocaleString(), s: sev });
            localStorage.setItem('WT_PULSE', JSON.stringify(db));
            document.getElementById('statusBox').value = "";
            render();
        }

        function render() {
            let c = document.getElementById('timeline'); c.innerHTML = "";
            [...db].reverse().forEach(i => {
                let pulseClass = i.s === 3 ? 'p-critical' : i.s === 1 ? 'p-moderate' : '';
                let d = document.createElement('div'); d.className = 'card-inner';
                d.onclick = () => d.classList.toggle('flipped');
                d.innerHTML = `<div class="face front ${pulseClass}"><small style="font-weight:900;color:var(--silver)">${i.d}</small><div style="font-weight:700;margin-top:10px;">${i.t}</div></div>
                               <div class="face back"><strong>LEGAL EDUCATION</strong><div style="font-size:12px;margin-top:10px;">Education content based on severity ${i.s} goes here.</div></div>`;
                c.appendChild(d);
            });
        }
        render();
    </script>
</body>
</html>
