<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin' Intake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; 
            --teal-dark: #004d4d; 
            --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; 
            --clio-green: #2ecc71; 
            --mac-bg: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.98);
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: #f8fafc; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            color: var(--gray-dark); 
            -webkit-font-smoothing: antialiased; 
        }

        /* --- HEADER --- */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 20px; 
            border-bottom: 1.5px solid var(--platinum); 
            background: white;
            z-index: 10000;
            position: relative;
        }

        .brand-group { display: flex; align-items: center; gap: 4px; }
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        .sub-title { font-weight: 900; color: var(--teal); font-size: 11px; letter-spacing: -1.1px; margin: 0; }

        /* --- NAVIGATION TAB (THE FRESH TAB) --- */
        #mgmtTab {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: var(--teal);
            color: white;
            padding: 10px 30px;
            border-radius: 20px 20px 0 0;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 99999;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            border: none;
        }

        /* --- MANAGEMENT DRAWER --- */
        #managementDrawer { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            max-width: 500px; 
            left: 50%; 
            transform: translateX(-50%) translateY(100%); 
            background: white; 
            border-top: 5px solid var(--teal); 
            z-index: 100001; 
            transition: 0.5s transform cubic-bezier(0.16, 1, 0.3, 1); 
            box-shadow: 0 -10px 50px rgba(0,0,0,0.3); 
            border-radius: 30px 30px 0 0;
            padding-bottom: 30px;
        }

        .drawer-open { transform: translateX(-50%) translateY(0) !important; }

        .modal-btn { 
            background: var(--teal); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 99px; 
            font-weight: 900; 
            cursor: pointer; 
            width: 100%; 
            font-size: 15px; 
            margin-top: 15px;
        }

        /* --- INTERFACE ELEMENTS --- */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 120px; background: #fafbfc; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--platinum); }
        
        .pulse-critical { border-left: 14px solid var(--teal-dark) !important; background: rgba(0, 77, 77, 0.05) !important; animation: heavy-pulse 1.5s infinite; }
        @keyframes heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0.6); } 70% { box-shadow: 0 0 0 20px rgba(0, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0); } }

        #utilityDrawer { background: var(--glass); border-bottom: 2px solid var(--platinum); transition: transform 0.5s ease; z-index: 8000; }
        .drag-handle-zone { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: #cbd5e1; border-radius: 10px; }
        
        .template-chip { background: white; border: 2px solid var(--teal); padding: 8px 15px; border-radius: 15px; font-size: 10px; font-weight: 900; color: var(--teal); cursor: pointer; }
        #statusBox { width: 100%; height: 120px; padding: 15px; border-radius: 20px; border: 2px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; }

        .draggable-btn { position: absolute; z-index: 9000; width: 75px; height: 75px; border-radius: 22px; color: white; font-weight: 900; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        #addBtn { background: var(--teal); right: 20px; top: 160px; font-size: 30px; }
    </style>
</head>
<body>

<header class="header">
    <div class="brand-group">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="13" r="1" fill="var(--teal)"/><circle cx="12" cy="13" r="1" fill="var(--teal)"/><circle cx="16" cy="13" r="1" fill="var(--teal)"/></svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <span class="sub-title">TAKIN'INTAKE</span>
        </div>
    </div>
    <div style="background:var(--clio-green); width:8px; height:8px; border-radius:50%;"></div>
</header>

<div style="display:flex; flex-direction:column; height:100dvh; position:relative;">
    
    <button id="addBtn" class="draggable-btn" onclick="submitEntry()">+</button>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <div style="display:flex; gap:10px; overflow-x:auto; padding-bottom:15px;">
                <div class="template-chip" onclick="applyTemplate('WCB')">WCB</div>
                <div class="template-chip" onclick="applyTemplate('WITNESS')">WITNESS</div>
                <div class="template-chip" onclick="applyTemplate('EXPORT')">EXPORT</div>
            </div>
            <textarea id="statusBox" placeholder="Start new journal..."></textarea>
        </div>
        <div class="drag-handle-zone" onclick="toggleDrawer()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="mgmtTab" onclick="toggleMgmt()">MANAGEMENT</button>

    <div id="managementDrawer">
        <div class="drag-handle-zone" onclick="toggleMgmt()"><div class="handle-pill" style="background:var(--teal);"></div></div>
        <div style="padding:20px 30px;">
            <h3 style="margin-top:0; color:var(--teal-dark);">Control Center</h3>
            <button class="modal-btn" onclick="confirmReset()" style="background:var(--dark-silver);">DELETE & START FRESH</button>
            <button class="modal-btn" onclick="alert('Evidence Exported')">SAVE & EXPORT CSV</button>
            <button class="modal-btn" style="background:var(--teal-dark);" onclick="toggleMgmt()">CLOSE</button>
        </div>
    </div>
</div>

<script>
    let isDrawerOpen = true;
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];

    window.onload = () => { refreshDisplay(); };

    function toggleDrawer() {
        const d = document.getElementById('utilityDrawer');
        const c = document.getElementById('drawerContent');
        d.style.transform = isDrawerOpen ? `translateY(-${c.offsetHeight}px)` : `translateY(0)`;
        isDrawerOpen = !isDrawerOpen;
    }

    function toggleMgmt() {
        document.getElementById('managementDrawer').classList.toggle('drawer-open');
    }

    function applyTemplate(type) {
        const t = { 'WCB': '--- WCB REPORT ---\n', 'WITNESS': '--- WITNESS STATEMENT ---\n', 'EXPORT': '--- EXPORT REQUEST ---' };
        document.getElementById('statusBox').value = t[type];
    }

    function submitEntry() {
        const b = document.getElementById('statusBox');
        if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const entry = {
                id: Date.now(),
                grit: b.value,
                stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`,
                pulse: /fired|dismiss|risk/i.test(b.value)
            };
            timelineVault.push(entry);
            localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
            b.value = '';
            refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList');
        list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry ' + (item.pulse ? 'pulse-critical' : '');
            div.innerHTML = `<div style="font-size:10px; font-weight:900; color:var(--teal); margin-bottom:5px;">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin:0;">${item.grit}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { if(confirm("Wipe journal?")) { localStorage.clear(); location.reload(); } }

    function makeMovable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.ontouchstart = (e) => {
            p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
            document.ontouchmove = (e) => {
                p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY;
                p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
            document.ontouchend = () => { document.ontouchmove = null; };
        };
    }
    makeMovable(document.getElementById('addBtn'));
</script>

</body>
</html>
