<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Live Realtime Sync</title>
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --mac-glass: rgba(255, 255, 255, 0.75);
            --clio-green: #2ecc71;
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); overflow: hidden; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background: var(--clio-green); box-shadow: 0 0 8px var(--clio-green); }

        .header { padding: 14px 15px; border-bottom: 1px solid var(--gray-border); background: var(--mac-glass); backdrop-filter: blur(20px); z-index: 4000; display: flex; justify-content: space-between; align-items: center; }
        .view-section { flex-grow: 1; overflow-y: auto; padding: 20px 15px 150px; display: flex; flex-direction: column; gap: 20px; }
        
        .bubble { padding: 15px; border-radius: 22px; width: 100%; box-sizing: border-box; box-shadow: var(--mac-shadow); background: #f1f1f1; border: 1px solid #e5e5e5; position: relative; }
        .sync-tag { font-size: 8px; font-weight: 900; color: var(--silver-gray); margin-bottom: 5px; display: block; }
        
        #addBtn { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; width: 70px; height: 70px; background: var(--teal); font-size: 30px; bottom: 30px; right: 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container" id="mainApp">
    <header class="header">
        <div style="display:flex; align-items:center;">
            <span id="connDot" class="status-dot status-online"></span>
            <div style="font-weight: 900; font-size: 13px; color: var(--teal);">WorkTimeline™</div>
        </div>
        <div id="syncLabel" style="font-size: 9px; font-weight: 900; color: var(--silver-gray);">REALTIME ACTIVE</div>
    </header>

    <div class="view-section">
        <textarea id="statusBox" style="width:100%; height:80px; border-radius:20px; border:1px solid var(--gray-border); padding:15px; font-family:inherit;" placeholder="Add to your live timeline..."></textarea>
        <div id="timelineContainer"></div>
    </div>

    <button id="addBtn" onclick="submitEntry()">+</button>
</div>

<script>
    // 1. PROJECT CONFIG FROM 1000026130.jpg
    const SUPABASE_URL = 'https://sghmgiaaqcuymqnfbleh.supabase.co';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let pendingQueue = JSON.parse(localStorage.getItem('wt_pending')) || [];

    // 2. REALTIME SUBSCRIPTION HANDSHAKE
    function initRealtime() {
        _supabase
            .channel('schema-db-changes')
            .on('postgres_changes', 
                { event: 'INSERT', schema: 'public', table: 'timelines' }, 
                (payload) => {
                    console.log('New entry detected via Realtime');
                    fetchTimeline(); // Instant refresh
                }
            )
            .subscribe();
            
        // Check for cached data to sync since status is now Healthy
        if (pendingQueue.length > 0) syncPendingData();
    }

    async function syncPendingData() {
        document.getElementById('syncLabel').innerText = "SYNCING CACHE...";
        for (let entry of pendingQueue) {
            await _supabase.from('timelines').insert([entry]);
        }
        pendingQueue = [];
        localStorage.setItem('wt_pending', JSON.stringify([]));
        document.getElementById('syncLabel').innerText = "REALTIME ACTIVE";
        fetchTimeline();
    }

    async function submitEntry() {
        const text = document.getElementById('statusBox').value;
        if (!text.trim()) return;

        const entry = {
            content: text,
            legal_domain: 'EMPLOYMENT',
            created_at: new Date().toISOString()
        };

        const { error } = await _supabase.from('timelines').insert([entry]);
        
        if (error) {
            pendingQueue.push(entry);
            localStorage.setItem('wt_pending', JSON.stringify(pendingQueue));
            renderTimeline([]); 
        } else {
            document.getElementById('statusBox').value = '';
            // No need to manually call fetchTimeline here, Realtime will catch it!
        }
    }

    async function fetchTimeline() {
        const { data } = await _supabase.from('timelines')
            .select('*').order('created_at', { ascending: false });
        renderTimeline(data || []);
    }

    function renderTimeline(dbData) {
        const container = document.getElementById('timelineContainer');
        const combined = [...pendingQueue.map(p => ({...p, pending: true})), ...dbData];
        
        container.innerHTML = combined.map(item => `
            <div style="margin-top:20px;">
                <div class="bubble">
                    <span class="sync-tag">${item.pending ? 'LOCAL CACHE' : 'CLOUD VERIFIED'}</span>
                    <div style="font-size:9px; font-weight:900; color:var(--silver-gray); margin-bottom:5px;">
                        ${new Date(item.created_at).toLocaleString()}
                    </div>
                    <p style="margin:0; font-size:12px;">${item.content}</p>
                </div>
            </div>
        `).join('');
    }

    // Initialize
    initRealtime();
    fetchTimeline();
</script>
</body>
</html>
