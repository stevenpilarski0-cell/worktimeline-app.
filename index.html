<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 48px; --round-inner: 24px; --round-pill: 999px;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100dvh; overflow: hidden; color: var(--gray-dark); overscroll-behavior-y: none; }
        
        /* INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; transition: opacity 0.8s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 460px; }
        #skipBtn { position: absolute; bottom: calc(50px + env(safe-area-inset-bottom)); padding: 14px 28px; background: white; color: var(--clio-blue); border: 2px solid var(--clio-blue); border-radius: var(--round-pill); font-size: 14px; font-weight: 800; cursor: pointer; z-index: 100001; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: calc(100dvh - 20px); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; border-bottom: 1px solid var(--platinum); flex-shrink: 0; background: white; z-index: 101; }

        /* THE EXPANDABLE INPUT AREA */
        .input-area { 
            padding: 0 24px 20px 24px; 
            background: var(--gray-light); 
            border-bottom: 1px solid var(--platinum); 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 500px;
            overflow: hidden;
        }
        
        /* COLLAPSED STATE STYLES */
        .app-container.collapsed .input-area { max-height: 65px; padding-bottom: 0; }
        .app-container.collapsed #statusBox, 
        .app-container.collapsed #addBtn,
        .app-container.collapsed .template-chips { display: none; }
        
        /* TOOLBAR ICON ROW (Only visible when collapsed) */
        .mini-toolbar { 
            display: none; 
            justify-content: space-around; 
            padding: 10px 0; 
            width: 100%;
        }
        .app-container.collapsed .mini-toolbar { display: flex; }

        /* THE TOGGLE ARROW */
        .collapse-trigger { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            padding: 8px 0; 
            cursor: pointer;
        }
        .collapse-trigger svg { 
            width: 24px; height: 24px; stroke: #94a3b8; transition: transform 0.3s; 
        }
        .app-container.collapsed .collapse-trigger svg { transform: rotate(180deg); }

        .template-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
        .chip { background: white; color: var(--teal); font-size: 12px; font-weight: 700; padding: 10px 18px; border-radius: var(--round-pill); white-space: nowrap; border: 1.5px solid var(--platinum); }

        #statusBox { width: 100%; height: 90px; padding: 16px; border-radius: var(--round-inner); border: 1.5px solid var(--platinum); font-family: inherit; font-size: 15px; outline: none; background: white; resize: none; margin-bottom: 12px; }
        
        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
        .media-btn { background: white; border: 1.5px solid var(--platinum); padding: 12px 4px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .media-btn svg { width: 22px; height: 22px; stroke: var(--teal); fill: none; stroke-width: 2.2; margin-bottom: 6px; }
        .media-btn span { font-size: 9px; font-weight: 700; text-transform: uppercase; }

        /* MINI VERSION OF BUTTONS */
        .mini-btn { background: white; border: 1px solid var(--platinum); padding: 8px; border-radius: 12px; }
        .mini-btn svg { width: 20px; height: 20px; stroke: var(--teal); fill: none; stroke-width: 2.2; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; position: relative; background: #fff; scroll-behavior: smooth; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 4px; background: var(--platinum); border-radius: 4px; }
        
        .entry { position: relative; margin-left: 50px; background: white; border: 1.5px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; border-left: 5px solid var(--teal); box-shadow: 0 6px 16px rgba(0,0,0,0.04); }
        .timestamp-full { font-size: 10px; font-weight: 800; color: var(--teal); display: block; margin-bottom: 8px; text-transform: uppercase; }
        
        #addBtn { background: var(--teal); color:white; border:none; padding:16px; border-radius: var(--round-pill); width:100%; font-weight:700; font-size: 15px; cursor:pointer; }
        
        .footer-bar { padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); background: white; border-top: 1px solid var(--platinum); flex-shrink: 0; }
        #syncBtn { background: white; color: var(--clio-blue); border: 2.5px solid var(--clio-blue); padding: 18px; border-radius: var(--round-inner); width: 100%; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        #syncBtn svg { width: 28px; height: 28px; stroke: var(--clio-blue); fill: none; stroke-width: 2.5; }

        .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: var(--round-pill); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <button id="skipBtn" onclick="skipIntro()">Skip Intro ➔</button>
</div>

<div class="app-container" id="mainApp">
    <header class="header">
        <div><h1 id="folderLabel" style="color: var(--teal); margin:0; font-size: 19px; font-weight: 800;">WorkTimeline™</h1><div style="font-size: 11px; font-weight: 600; color: var(--clio-blue);">Intake Engine...</div></div>
        <div style="display:flex; gap:16px; align-items: center;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 9px; font-weight: 700;">CHRON</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" id="gSwitch" onchange="toggleGhost()"><span class="slider"></span></label><div style="font-size: 9px; font-weight: 700;">GHOST</div></div>
        </div>
    </header>

    <div style="display: flex; flex-direction: column; height: 100%; overflow: hidden;">
        <div class="input-area" id="inputContainer">
            <div class="collapse-trigger" onclick="toggleCollapse()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </div>

            <div class="template-chips">
                <span class="chip" onclick="useTemplate('LOCATION:\n(GPS Auto-Captured)')">Location</span>
                <span class="chip" onclick="useTemplate('STATEMENT:\n- Narrative:')">Statement</span>
                <span class="chip" onclick="useTemplate('SETTING:\n- Environment:')">Setting</span>
                <span class="chip" onclick="useTemplate('EVIDENCE:\n- Source:')">Evidence</span>
            </div>

            <textarea id="statusBox" placeholder="Tell your truth..."></textarea>
            
            <div class="media-toolbar" id="fullToolbar">
                <button class="media-btn" onclick="addEntry('Photo evidence added.')"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>Camera</span></button>
                <button class="media-btn" onclick="addEntry('Audio recording captured.')"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg><span>Audio</span></button>
                <button class="media-btn" onclick="addEntry('Text log verified.')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Text</span></button>
                <button class="media-btn" onclick="addEntry('Document attached.')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Docs</span></button>
            </div>

            <div class="mini-toolbar">
                <div class="mini-btn"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
                <div class="mini-btn"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
                <div class="mini-btn"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div style="color: var(--teal); font-weight: 800; font-size: 12px; align-self: center;">TIMELINE VIEW</div>
            </div>
            
            <button id="addBtn" onclick="submitEntry()">Submit to Timeline</button>
        </div>

        <div id="timelineContainer">
            <div class="timeline-spine"></div>
            <div id="displayList"></div>
        </div>
    </div>

    <div class="footer-bar">
        <button id="syncBtn" onclick="lockAndSummarize()">
            <svg id="syncIcon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="4" ry="4"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span id="syncBtnText">Lock & Submit to Clio</span>
        </button>
    </div>
</div>

<script>
    const story = [
        "We see you. We hear you.", "We know you're there. You're not invisible.",
        "Trapped in the grey area.", "We're here to get you out.",
        "One step at a time.", "Where you belong with Clio.",
        "The invisible 60%.", "Justice should be effortless.", "If telling the truth takes no effort."
    ];
    
    let activeVault = "TIMELINE"; const timelineVault = []; const notesVault = [];
    let isSkipped = false;

    window.onload = () => { runStory(); };
    function skipIntro() { isSkipped = true; endSplash(); }
    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => {
            if(isSkipped || i >= story.length) { endSplash(); return; }
            el.style.opacity = 0;
            setTimeout(() => { if(isSkipped) return; el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2500); }, 800);
        };
        next();
    }
    function endSplash() { const s = document.getElementById('splashScreen'); if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 800); } }

    function toggleCollapse() {
        document.getElementById('mainApp').classList.toggle('collapsed');
    }

    function useTemplate(txt) { 
        if(document.getElementById('mainApp').classList.contains('collapsed')) toggleCollapse();
        document.getElementById('statusBox').value = txt; 
        document.getElementById('statusBox').focus(); 
    }

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('addBtn').style.background = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refreshVaultDisplay();
    }

    async function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        addEntry(box.value);
        box.value = '';
    }

    function addEntry(txt) {
        const now = new Date();
        const stamp = `${now.toLocaleTimeString()} | GPS: 49.1044° N, 122.5827° W`;
        const entry = { text: txt, stamp: stamp };
        if(activeVault === "TIMELINE") timelineVault.push(entry); else notesVault.push(entry);
        refreshVaultDisplay();
    }

    function refreshVaultDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = (activeVault === "TIMELINE") ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div'); div.className = 'entry';
            div.style.borderLeftColor = (activeVault === "NOTES") ? "var(--clio-blue)" : "var(--teal)";
            div.innerHTML = `<span class="timestamp-full">${item.stamp}</span><p style="font-size:14px; line-height: 1.5;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    function lockAndSummarize() {
        const syncBtn = document.getElementById('syncBtn');
        syncBtn.style.background = "var(--clio-blue)"; syncBtn.style.color = "white";
        document.getElementById('syncBtnText').innerText = "Analyzing & Summarizing...";
        setTimeout(() => {
            syncToClio();
        }, 2000);
    }

    async function syncToClio() {
        const clientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
        const redirectUri = "https://worktimeline-app.vercel.app/index.html";
        const clioBase = "https://ca.app.clio.com"; 

        const generateRandomString = (l) => {
            let t = ''; const p = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < l; i++) t += p.charAt(Math.floor(Math.random() * p.length));
            return t;
        };

        const pkceChallenge = async (v) => {
            const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
            return btoa(String.fromCharCode.apply(null, new Uint8Array(h))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        };

        const verifier = generateRandomString(128);
        const challenge = await pkceChallenge(verifier);
        sessionStorage.setItem('clio_code_verifier', verifier);
        window.location.href = `${clioBase}/oauth/authorize?response_type=code&client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=leads_write%20contacts_write&code_challenge=${challenge}&code_challenge_method=S256`;
    }
</script>
</body>
</html>
