<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Metallic Edition v25</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --amber: #f59e0b;
            --slate: #1e293b;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --gray-border: #cbd5e0; 
            /* DEPTH SHADOWS */
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            /* METALLIC EFFECT (Light Refraction) */
            --metal-shine: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.2) 100%);
            --radius-xl: 35px;
            --radius-lg: 25px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #f1f5f9; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--gray-border); border-right: 1px solid var(--gray-border); box-sizing: border-box; overflow: hidden; transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); }

        /* BIRD'S EYE VIEW */
        .birds-eye-active { transform: scale(0.6) translateY(-50px); border-radius: 45px; box-shadow: 0 50px 100px rgba(0,0,0,0.3); }

        /* SIDEBAR / MENU (METALLIC PANEL) */
        #sideBar { position: absolute; left: -280px; top: 0; width: 280px; height: 100%; background: #f1f5f9; z-index: 10000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); border-right: 1px solid var(--gray-border); box-shadow: 20px 0 50px rgba(0,0,0,0.1); padding: 35px 20px; box-sizing: border-box; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 15px; margin-bottom: 12px; border-radius: 18px; background: #f8fafc; font-weight: 800; font-size: 11px; color: var(--teal); display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid #e2e8f0; text-transform: uppercase; }
        
        /* Apply shine to menu items on hover */
        .sidebar-item:hover { background: var(--metal-shine); border-color: var(--teal); color: var(--teal); }

        /* NAV TAB (METALLIC FINISH) */
        .domain-nav { display: flex; background: linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%); border-bottom: 1px solid var(--gray-border); padding: 10px; gap: 8px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 12px 0; border-radius: 15px; font-size: 9px; font-weight: 900; color: #64748b; background: transparent; cursor: pointer; text-transform: uppercase; transition: 0.3s; position: relative; }
        
        .domain-tab.active { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .domain-tab.active::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); border-radius: 15px; opacity: 0.6; }

        /* HEADER */
        .header { padding: 15px 20px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 18px; color: var(--active-brand); display: flex; align-items: center; letter-spacing: -1px; }

        /* GHOST/MODE SWITCHERS (GLOSSY FINISH) */
        .control-btn { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 50px; font-size: 8px; font-weight: 900; padding: 8px 12px; cursor: pointer; color: #475569; position: relative; overflow: hidden; }
        .control-btn:hover { background: white; border-color: #cbd5e0; }
        .control-btn:active::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); }

        /* UTILITY DRAWER */
        #utilityDrawer { position: absolute; top: 125px; width: 100%; background: white; border-bottom: 2px solid var(--gray-border); z-index: 3500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 45px)); border-radius: 0 0 var(--radius-xl) var(--radius-xl); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .handle { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 40px; height: 5px; background: #cbd5e0; border-radius: 10px; }

        /* TEMPLATE CHIPS (HIGH-GLOSS METALLIC) */
        #templateBar { display: flex; gap: 10px; overflow-x: auto; padding: 5px 20px 20px; scrollbar-width: none; }
        .template-chip { border: 2px solid var(--gray-border); padding: 10px 18px; border-radius: 50px; font-size: 10px; font-weight: 900; color: #4a5568; background: #fff; white-space: nowrap; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        
        .template-chip::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--metal-shine); opacity: 0; transition: 0.2s; }
        .template-chip:hover::before { opacity: 1; }
        .template-chip:active { transform: scale(0.95); border-color: var(--active-brand); }

        /* TRACK (METALLIC RAIL) & NODES (GLOSSY CAPS) */
        #linearTrack { position: absolute; left: 24px; top: 180px; bottom: 120px; width: 6px; background: rgba(0, 128, 128, 0.1); border-radius: 20px; z-index: 1; }
        
        .track-node { position: absolute; left: -10px; width: 24px; height: 24px; background: #fff; border: 3.5px solid var(--active-brand); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; overflow: hidden; position: relative; }
        
        /* Gloss finish on nodes */
        .track-node::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.7; }

        /* FIXED ACTION DOCKS */
        .action-dock-right { position: absolute; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 20px; z-index: 6000; }
        .action-dock-left { position: absolute; bottom: 35px; left: 25px; z-index: 6000; }
        
        /* Add gradient depth to stationary buttons */
        #addBtn { width: 75px; height: 75px; background: linear-gradient(135deg, var(--active-brand) 0%, #004d4d 100%); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); color: white; font-size: 35px; font-weight: 900; cursor: pointer; position: relative; overflow: hidden; }
        #addBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.4; }

        #syncBtn { width: 85px; height: 85px; background: linear-gradient(135deg, var(--clio-blue) 0%, #004c8c 100%); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 9px; cursor: pointer; position: relative; overflow: hidden; }
        #syncBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.3; }

        #eyeBtn { width: 65px; height: 65px; background: #fff; border: 2px solid var(--gray-border); border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        #eyeBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.6; }

        /* BUBBLES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 40px 20px 220px 65px; display: flex; flex-direction: column; gap: 40px; scrollbar-width: none; position: relative; z-index: 5; }
        .bubble { padding: 25px; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); background: white; border: 1px solid #efefef; font-weight: 600; font-size: 15px; line-height: 1.4; }
        
        textarea { width: 100%; height: 110px; border: 2.5px solid var(--gray-border); border-radius: var(--radius-lg); padding: 18px; font-size: 16px; outline: none; background: #fafafa; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>

<div id="sideBar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h2 style="font-weight: 900; color: var(--teal); font-size: 18px; margin: 0;">MENU</h2>
        <div onclick="toggleSidebar()" style="cursor: pointer; opacity: 0.5;"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="sidebar-item" onclick="exportData()">💾 SAVE & EXPORT</div>
    <div class="sidebar-item" onclick="alert('Reviewing BC Case Law Studies')">⚖️ CASE LAW STUDY</div>
    <div class="sidebar-item" onclick="resetTimeline()" style="color: var(--rose); margin-top: 40px;">🗑️ RESET PLATFORM</div>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(30px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:30px;">
    <div class="modal-card" style="background:white; padding:50px 40px; border-radius:var(--radius-xl); text-align:center; box-shadow:var(--mac-shadow); max-width:360px; border: 1px solid var(--gray-border);">
        <h2 id="greetingText" style="font-weight:900; font-size: 24px; color: var(--teal);">HELLO</h2>
        <p style="font-weight:800; font-size: 11px; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase;">Detecting Langley, BC...</p>
        <p style="font-weight:600; color:#64748b; line-height:1.6; margin-bottom: 30px;">Your secured chronological truth engine. <br><b>No legal advice offered.</b></p>
        <button onclick="unlockApp()" style="border:none; padding:22px; border-radius:var(--radius-lg); width:100%; background:var(--teal); color:white; font-weight:900; text-transform:uppercase; cursor:pointer;">Secure My Journal</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab" data-id="WORK" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" data-id="FAM" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" data-id="INJURY" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" data-id="PROPERTY" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer; padding: 5px;">
                <svg width="26" height="18" fill="none" stroke="var(--teal)" stroke-width="3"><line x1="0" y1="2" x2="26" y2="2"/><line x1="0" y1="9" x2="26" y2="9"/><line x1="0" y1="16" x2="26" y2="16"/></svg>
            </div>
            <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            <div style="display:flex; gap:6px;">
                <button class="control-btn" onclick="toggleMode()">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 25px;">
            <div id="templateBar"></div>
            <textarea id="statusBox" placeholder="Capturing chronological truth..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock-left">
        <button id="eyeBtn" onclick="toggleBirdsEye()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <div class="action-dock-right">
        <button id="addBtn" onclick="submitEntry()">+</button>
        <button id="syncBtn" onclick="clioHandshake()">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" stroke-width="3.5"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>
            SYNC
        </button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v25')) || [];
    let currentDomain = 'WORK';
    let currentMode = 'TIMELINE';
    let utilOpen = false;
    let sessionIds = [];

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: { 'LOC': 'LOC:\n', 'EVENT': 'EVENT:\n', 'WIT': 'WIT:\n' } },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: { 'VENUE': 'VENUE:\n', 'TRANS': 'TRANS:\n' } },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: { 'SETTING': 'SETTING:\n', 'CLAIM': 'CLAIM:\n', 'HARM': 'HARM:\n' } },
        'PROPERTY': { color: '#1e293b', name: 'PropTimeline™', templates: { 'ADDR': 'ADDR:\n', 'FIX': 'FIX:\n' } }
    };

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 45px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMode() { refresh(); }
    function toggleBirdsEye() { document.getElementById('mainApp').classList.toggle('birds-eye-active'); }
    
    function setGreeting() {
        const hour = new Date().getHours();
        document.getElementById('greetingText').innerText = hour < 12 ? "GOOD MORNING" : hour < 18 ? "GOOD AFTERNOON" : "GOOD EVENING";
    }

    function switchDomain(domain) {
        currentDomain = domain;
        const config = domainConfig[domain];
        document.documentElement.style.setProperty('--active-brand', config.color);
        document.getElementById('brandTitle').innerHTML = `${config.name} <div class="clio-pulse"></div>`;
        document.querySelectorAll('.domain-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.id === domain);
            t.style.color = t.dataset.id === domain ? config.color : '#64748b';
        });
        const bar = document.getElementById('templateBar'); bar.innerHTML = '';
        Object.keys(config.templates).forEach(k => {
            const b = document.createElement('button'); b.className = 'template-chip'; b.innerText = k;
            b.onclick = () => { document.getElementById('statusBox').value += config.templates[k]; document.getElementById('statusBox').focus(); };
            bar.appendChild(b);
        });
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const id = Date.now();
        const stamp = `📍 LANGLEY, BC | ${new Date().toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
        vault.push({ id, grit: text, domain: currentDomain, stamp });
        sessionIds.push(id);
        localStorage.setItem('platinum_v25', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain);
        filtered.reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 145 + 25) + 'px';
            if(sessionIds.includes(item.id)) {
                node.innerHTML = '✕'; node.style.borderColor = 'var(--rose)'; node.style.color = 'var(--rose)';
                node.onclick = () => { if(confirm("Remove?")) { vault = vault.filter(v => v.id !== item.id); refresh(); } };
            } else { node.innerHTML = '✓'; }
            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:12px;">${item.stamp}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function resetTimeline() { if(confirm("Reset Platform?")) { localStorage.clear(); location.reload(); } }
    function clioHandshake() { if(currentDomain === 'WORK') alert("201 Created: Syncing to Clio Canada Sandbox."); }
    function exportData() { alert("Exporting local database."); }

    setGreeting();
    switchDomain('WORK');
</script>
</body>
</html>
