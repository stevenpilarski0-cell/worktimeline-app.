<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master v11.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; --clio-green: #2ecc71;
            --clio-blue: #0076CE; --notes-gold: #f1c40f; --slate: #64748b; --mac-bg: #f1f5f9;
            --risk-red: #e53e3e; --gold: #f59e0b; --gray-border: #cbd5e0; --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        body { font-family: 'Nunito', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        .app-locked { filter: blur(35px); pointer-events: none; }
        .ghost-active #timelineContainer { filter: blur(20px) grayscale(1); opacity: 0.3; pointer-events: none; }
        .notes-mode { background: #fffdf2 !important; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1.5px solid var(--gray-border); background: white; z-index: 10000; position: relative;}
        .logo-group { display: flex; align-items: center; gap: 6px; }
        .title-text { font-weight: 900; color: var(--teal); font-size: 18px; line-height: 1; }
        .sub-text { font-weight: 900; color: var(--teal); font-size: 9px; letter-spacing: -0.5px; }
        .clio-dot { width: 8px; height: 8px; background: var(--clio-green); border-radius: 50%; box-shadow: 0 0 8px var(--clio-green); display: inline-block; margin-left: 4px; }
        
        .toggles { display: flex; gap: 10px; align-items: center; text-align: center; }
        .switch { position: relative; width: 30px; height: 16px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--gray-border); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider.teal { background-color: var(--teal); }
        input:checked + .slider.gold { background-color: var(--notes-gold); }
        input:checked + .slider:before { transform: translateX(14px); }
        .toggle-label { font-size: 7px; font-weight: 900; margin-top: 2px; color: var(--slate); }

        .intake-section { padding: 15px; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 5000; position: relative; }
        .template-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .template-scroll::-webkit-scrollbar { display: none; }
        .template-chip { background: var(--mac-bg); border: 1px solid var(--gray-border); padding: 8px 14px; border-radius: 50px; font-size: 10px; font-weight: 900; color: var(--slate); white-space: nowrap; cursor: pointer; }
        #statusBox { width: 100%; height: 90px; padding: 15px; border-radius: 20px; border: 1.5px solid var(--gray-border); outline: none; font-family: 'Nunito Sans', sans-serif; font-weight: 600; font-size: 14px; resize: none; box-sizing: border-box; background: #fafafa; }

        .mac-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
        .mac-media-bar { display: flex; gap: 10px; background: var(--mac-bg); padding: 8px; border-radius: 20px; flex-grow: 1; justify-content: space-around;}
        .media-icon { background: white; width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 20px; cursor: pointer; }
        
        #addBtn { width: 60px; height: 60px; border-radius: 18px; background: var(--teal); color: white; font-weight: 900; font-size: 30px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 140px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stamp-label { font-size: 9px; font-weight: 900; color: var(--silver-gray); margin-bottom: 6px; letter-spacing: 0.5px; }
        .stack-inner { position: relative; width: 90%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 15px; border-radius: 22px; font-family: 'Nunito Sans', sans-serif; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; }
        .bubble-front { background: white; border: 1.5px solid var(--gray-border); border-left: 8px solid var(--teal); color: #1a202c; position: relative; z-index: 2; }
        .bubble-front.note-item { border-left-color: var(--notes-gold); }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: 1px solid rgba(255,255,255,0.2); overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        
        .stack-inner.has-ai-pulse-on::after { content: ''; position: absolute; top: 6px; left: 8px; width: 100%; height: 100%; background: var(--slate); border-radius: 22px; z-index: 0; opacity: 0.7; animation: dark-heavy-pulse 3s infinite ease-in-out; }
        @keyframes dark-heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(100, 116, 139, 0.7); background: var(--slate); } 50% { background: var(--teal); box-shadow: 0 0 0 15px rgba(0, 128, 128, 0.4); opacity: 0.9; } 70% { box-shadow: 0 0 0 30px rgba(0, 128, 128, 0); background: var(--teal); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); background: var(--slate); } }

        #mgmtDrawer { position: fixed; bottom: -280px; left: 0; width: 100%; background: white; border-top: 5px solid var(--teal); z-index: 999999; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 -15px 50px rgba(0,0,0,0.2); padding-bottom: 40px; }
        #mgmtDrawer.active { bottom: 0 !important; }
        .pull-handle { width: 100%; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: -60px; cursor: pointer; }
        .handle-pill { width: 60px; height: 7px; background: var(--teal); border-radius: 10px; margin-bottom: 5px; }
        .handle-text { font-size: 10px; font-weight: 900; color: var(--teal); letter-spacing: 2px; }

        .drawer-btn { border: none; padding: 18px; border-radius: 20px; font-weight: 900; width: 85%; font-size: 14px; margin: 0 auto 12px; display: block; cursor: pointer; color: white; }
        .btn-teal { background: var(--teal); }
        .btn-gray { background: var(--slate); }

        .overlay-system { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 28px; box-shadow: var(--mac-shadow); width: 100%; max-width: 340px; text-align: left; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 10px; cursor: pointer; font-size: 13px; text-align: center; }
        
        .ai-thinking { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--gray-bg); border-top: 4px solid var(--teal); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ai-tag { display: inline-block; background: #fffbeb; color: var(--gold); border: 1px solid var(--gold); padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase;}
    </style>
</head>
<body id="appBody">

<div id="overlaySystem" class="overlay-system">
    <div class="modal-card" style="text-align: center;">
        <h2 style="color: var(--teal); font-weight: 900; margin: 0; font-size: 20px;">INTAKE GUARD</h2>
        <div style="font-size: 13px; line-height: 1.5; color: var(--slate); margin: 15px 0; font-weight: 600;">Secure your records.</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" id="initialUnlock">SECURE MY JOURNAL</button>
    </div>
</div>

<div id="aiThinkingOverlay" class="overlay-system" style="display:none; z-index:100001; background: rgba(255,255,255,0.9);">
    <div class="ai-thinking">
        <div class="spinner"></div>
        <div style="font-weight: 900; color: var(--teal); font-size: 14px; letter-spacing: 1px;">AI REVIEWING BC CASE LAW...</div>
    </div>
</div>

<div id="aiOpinionOverlay" class="overlay-system" style="display:none; z-index:100002;">
    <div class="modal-card">
        <h2 style="color: var(--teal); font-weight: 900; margin: 0 0 5px; font-size: 18px;">AI Legal Review</h2>
        <div id="aiTagDisplay" class="ai-tag"></div>
        <div id="aiMessage" style="font-size: 14px; line-height: 1.5; color: var(--slate); margin-bottom: 20px; font-weight: 600;"></div>
        
        <div style="font-size: 11px; font-weight: 800; color: #a0aec0; margin-bottom: 8px; text-align: center;">DO YOU AGREE WITH THIS ASSESSMENT?</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="confirmAI(true)">YES, ATTACH OPINION & LOG</button>
        <button class="modal-btn" style="background:var(--gray-bg); color:var(--slate);" onclick="confirmAI(false)">NO, JUST LOG THE TEXT</button>
    </div>
</div>

<header class="header">
    <div class="logo-group">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
            <path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="13.5" x2="18" y2="13.5" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="2 2"/>
            <circle cx="8" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="12" cy="13.5" r="1.5" fill="var(--teal)"/><circle cx="16" cy="13.5" r="1.5" fill="var(--teal)"/>
        </svg>
        <div>
            <div class="title-text">WorkTimeline™</div>
            <div class="sub-text">TAKIN'INTAKE <div class="clio-dot"></div></div>
        </div>
    </div>
    <div class="toggles">
        <div><label class="switch"><input type="checkbox" onchange="document.getElementById('appBody').classList.toggle('ghost-active')"><span class="slider teal"></span></label><div class="toggle-label">GHOST</div></div>
        <div><label class="switch"><input type="checkbox" id="notesToggle" onchange="toggleVault()"><span class="slider gold"></span></label><div class="toggle-label">NOTES</div></div>
    </div>
</header>

<div class="intake-section">
    <div class="template-scroll">
        <div class="template-chip" onclick="applyTemplate('WCB')">WorkSafeBC</div>
        <div class="template-chip" onclick="applyTemplate('FIRSTAID')">First Aid</div>
        <div class="template-chip" onclick="applyTemplate('INJURY')">Injury Report</div>
        <div class="template-chip" onclick="applyTemplate('SETTING')">Setting</div>
        <div class="template-chip" onclick="applyTemplate('WITNESS')">Witness</div>
    </div>

    <textarea id="statusBox" placeholder="Start your fresh intake record..."></textarea>
    
    <div class="mac-controls">
        <div class="mac-media-bar">
            <div class="media-icon">📷</div>
            <div class="media-icon">🎤</div>
            <div class="media-icon">📄</div>
        </div>
        <button id="addBtn" onclick="runAIEngine()">+</button>
    </div>
</div>

<div id="timelineContainer"><div id="displayList"></div></div>

<div id="mgmtDrawer">
    <div class="pull-handle" onclick="document.getElementById('mgmtDrawer').classList.toggle('active')">
        <div class="handle-pill"></div>
        <div class="handle-text">MANAGEMENT</div>
    </div>
    <div style="padding-top:30px;">
        <button class="drawer-btn btn-teal" onclick="alert('Saved!')">SAVE TIMELINE</button>
        <button class="drawer-btn btn-gray" onclick="confirmReset()">START FRESH</button>
    </div>
</div>

<script>
    const timelineVault = JSON.parse(localStorage.getItem('wt_bc_timeline_v2')) || [];
    const notesVault = JSON.parse(localStorage.getItem('wt_bc_notes_v2')) || [];
    let pendingEntry = null;
    let activeVault = "TIMELINE";

    window.onload = () => { refreshDisplay(); };

    document.getElementById('initialUnlock').onclick = function() {
        document.getElementById('overlaySystem').style.display = 'none';
        document.getElementById('appBody').classList.remove('app-locked');
    };

    function applyTemplate(type) {
        const t = { 'WCB': '--- WorkSafeBC REPORT ---\n', 'FIRSTAID': '--- FIRST AID RENDERED ---\n', 'INJURY': '--- INJURY REPORT ---\n', 'SETTING': '--- INCIDENT SETTING ---\n', 'WITNESS': '--- WITNESS STATEMENT ---\n' };
        document.getElementById('statusBox').value = t[type];
    }

    function toggleVault() {
        const isNotes = document.getElementById('notesToggle').checked;
        activeVault = isNotes ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('notes-mode', isNotes);
        document.getElementById('addBtn').style.background = isNotes ? 'var(--notes-gold)' : 'var(--teal)';
        refreshDisplay();
    }

    function analyzeBCAvenue(text) {
        const lowerText = text.toLowerCase();
        if (lowerText.includes("unsafe") || lowerText.includes("refused") || lowerText.includes("hazard")) {
            return { flagged: true, tag: "WorkSafeBC OHS Reg 3.12", opinion: "Workers have the right to refuse unsafe work. Discipline for this may constitute a discriminatory action." };
        }
        if (lowerText.includes("hours cut") || lowerText.includes("reduced pay") || lowerText.includes("demoted")) {
            return { flagged: true, tag: "Constructive Dismissal", opinion: "Significant reduction in hours or pay can be legally considered 'Constructive Dismissal' under BC Common Law." };
        }
        if (lowerText.includes("fired") || lowerText.includes("let go") || lowerText.includes("terminated")) {
            return { flagged: true, tag: "Wrongful Dismissal Risk", opinion: "Termination without cause in BC requires proper notice or severance pay. If 'cause' was alleged, burden of proof is on employer." };
        }
        return { flagged: false };
    }

    function getLocation(callback) {
        if (!navigator.geolocation) {
            callback("Location Unavailable");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => callback(`${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`),
            err => callback("Location Unavailable (Permission Denied)")
        );
    }

    function runAIEngine() {
        const b = document.getElementById('statusBox'); 
        const text = b.value.trim();
        if(!text) return;

        getLocation((gpsString) => {
            if (activeVault === "NOTES") {
                notesVault.push({ id: Date.now(), content: text, stamp: new Date().toLocaleString(), gps: gpsString, pulse: false });
                localStorage.setItem('wt_bc_notes_v2', JSON.stringify(notesVault));
                b.value = ''; refreshDisplay();
                return;
            }

            document.getElementById('appBody').classList.add('app-locked');
            document.getElementById('aiThinkingOverlay').style.display = 'flex';

            setTimeout(() => {
                const analysis = analyzeBCAvenue(text);
                pendingEntry = {
                    id: Date.now(), content: text, stamp: new Date().toLocaleString(), gps: gpsString,
                    pulse: analysis.flagged, aiTag: analysis.flagged ? analysis.tag : null, aiOpinion: analysis.flagged ? analysis.opinion : null
                };

                document.getElementById('aiThinkingOverlay').style.display = 'none';

                if (analysis.flagged) {
                    document.getElementById('aiTagDisplay').innerText = analysis.tag;
                    document.getElementById('aiMessage').innerText = analysis.opinion;
                    document.getElementById('aiOpinionOverlay').style.display = 'flex';
                } else {
                    confirmAI(true);
                }
            }, 1200);
        });
    }

    function confirmAI(userAgrees) {
        if (pendingEntry) {
            if (!userAgrees) { pendingEntry.pulse = false; pendingEntry.aiTag = null; pendingEntry.aiOpinion = null; }
            timelineVault.push(pendingEntry);
            localStorage.setItem('wt_bc_timeline_v2', JSON.stringify(timelineVault));
        }
        document.getElementById('statusBox').value = '';
        document.getElementById('aiOpinionOverlay').style.display = 'none';
        document.getElementById('appBody').classList.remove('app-locked');
        pendingEntry = null; refreshDisplay();
    }

    function refreshDisplay() {
        const container = document.getElementById('timelineContainer'); container.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        
        [...data].reverse().forEach(item => {
            const wrapper = document.createElement('div'); wrapper.className = 'stack-wrapper';
            const pulseClass = item.pulse ? 'has-ai-pulse-on' : '';
            const noteClass = activeVault === "NOTES" ? 'note-item' : '';
            
            let backContent = `<div style="font-size:11px; font-weight:800; color:#e2e8f0; margin-bottom:10px;">YOUR ENTRY:</div><div style="font-size:14px; margin-bottom:15px;">${item.content}</div>`;
            if (item.aiTag) {
                backContent += `<hr style="border-color:rgba(255,255,255,0.2); margin:10px 0;"><div style="font-size:10px; font-weight:900; color:var(--gold);">AI DIAGNOSTIC TAG:</div><div style="font-size:12px; font-weight:700;">${item.aiTag}</div>`;
            }

            wrapper.innerHTML = `
                <div class="stamp-label">📍 ${item.gps} | ${item.stamp}</div>
                <div class="stack-inner ${pulseClass}" onclick="this.classList.toggle('flipped')">
                    <div class="bubble bubble-front ${noteClass}">
                        <div style="font-weight:700; font-size:14px;">${item.content.substring(0, 45)}${item.content.length > 45 ? '...' : ''}</div>
                        ${activeVault === "TIMELINE" ? `<div style="font-size:9px; color:var(--slate); margin-top:8px; font-weight:800;">TAP TO VIEW FULL ARTIFACT & AI DATA</div>` : ''}
                    </div>
                    <div class="bubble bubble-back">${backContent}</div>
                </div>
            `;
            container.appendChild(wrapper);
        });
    }

    function confirmReset() { if(confirm("Wipe everything and Start Fresh?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
