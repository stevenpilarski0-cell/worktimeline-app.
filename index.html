<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WorkTimeline Elite</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f1f5f9; }
        .h { color: #008080; font-weight: 900; font-size: 24px; margin-bottom: 20px; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }
        .add-btn { background: #008080; color: white; }
        .card { background: white; margin-top: 15px; padding: 15px; border-radius: 10px; border-left: 5px solid #008080; }
        #gear { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 30px; background: #333; color: white; font-size: 24px; border: none; }
        #drawer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 4px solid #008080; padding: 20px; box-sizing: border-box; transform: translateY(100%); transition: 0.3s; z-index: 1000; }
        #drawer.open { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="h">WorkTimeline Elite</div>
    <div class="box">
        <textarea id="msg" placeholder="What happened today?"></textarea>
        <button class="add-btn" onclick="add()">+ ADD TO TIMELINE</button>
    </div>
    <div id="list"></div>
    <button id="gear" onclick="t()">⚙️</button>
    <div id="drawer">
        <input type="password" id="k" placeholder="Paste pT9 key" style="width:100%; padding:15px; margin-bottom:10px; border: 1px solid #ccc; border-radius: 8px;">
        <button style="background: #008080; color: white;" onclick="s()">SAVE KEY</button>
        <button style="background: #475569; color: white; margin-top: 10px;" onclick="t()">CLOSE</button>
    </div>
    <script>
        let db = JSON.parse(localStorage.getItem('WT_V15')) || [];
        function t() { document.getElementById('drawer').classList.toggle('open'); }
        function s() { localStorage.setItem('WT_KEY', document.getElementById('k').value); alert('Key Saved'); t(); }
        function add() {
            let val = document.getElementById('msg').value;
            if(!val) return;
            db.push({t: val, d: new Date().toLocaleString()});
            localStorage.setItem('WT_V15', JSON.stringify(db));
            document.getElementById('msg').value = '';
            render();
        }
        function render() {
            let h = '';
            [...db].reverse().forEach(i => {
                h += '<div class="card"><small>'+i.d+'</small><br><strong>'+i.t+'</strong></div>';
            });
            document.getElementById('list').innerHTML = h;
        }
        render();
    </script>
</body>
</html>
