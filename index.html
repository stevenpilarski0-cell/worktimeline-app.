<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Invisible Group Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --slate-silver: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            --glass: rgba(0, 128, 128, 0.06); --platinum: #d8e2ea; --gray-dark: #2c3e50; --teal-soft: #e0f2f1;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #000; margin: 0; padding: 0; height: 100vh; overflow: hidden; color: white; }
        
        /* CINEMATIC INTRO STYLES */
        #splashScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle, #2c3e50 0%, #000 100%); 
            z-index: 100000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 40px; 
            box-sizing: border-box; transition: opacity 1.5s ease; 
        }
        .story-text { font-size: 26px; font-weight: 800; color: #fff; line-height: 1.6; opacity: 0; transition: opacity 1s; max-width: 340px; text-shadow: 0 0 20px rgba(0,128,128,0.5); }
        .skip-btn { position: absolute; bottom: 60px; background: rgba(255,255,255,0.1); border: 1px solid var(--teal); padding: 12px 30px; border-radius: 50px; font-weight: 900; font-size: 12px; cursor: pointer; color: var(--teal); letter-spacing: 1px; }

        /* PROTOTYPE CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 50px; height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); opacity: 0; transition: opacity 1s; margin-top: 2.5vh; color: var(--gray-dark); }
        body.app-active .app-container { opacity: 1; }
        body.app-active { background: #eef1f5; }

        /* HEADER & BUBBLY UI */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; }
        .tagline { font-size: 11px; font-weight: 800; color: var(--clio-blue); font-style: italic; }
        #statusBox { width: 100%; height: 85px; padding: 15px; border-radius: 30px; border: 2px solid var(--platinum); box-sizing: border-box; font-family: inherit; font-size: 16px; outline: none; background: #fbfdff; margin-bottom: 12px; }
        .media-btn { flex: 1; background: var(--platinum); border: none; padding: 15px 5px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .media-btn svg { width: 26px; height: 26px; fill: var(--teal); margin-bottom: 5px; }
        
        /* TIMELINE & QUOTE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; position: relative; background: #fdfdfd; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 8px; background: #cccccc; border-radius: 15px; }
        .timeline-progress { position: absolute; left: 0; top: 0; width: 100%; height: 0%; background: linear-gradient(to bottom, var(--teal), var(--clio-blue)); border-radius: 15px; transition: height 0.6s ease; }
        #legacyQuote { position: relative; margin-left: 55px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(0, 128, 128, 0.15); border-left: 6px solid var(--teal); padding: 20px; border-radius: 30px; margin-bottom: 25px; z-index: 2; color: var(--gray-dark); }
        
        .entry { position: relative; margin-left: 55px; background: white; border: 1.5px solid var(--platinum); padding: 18px; border-radius: 30px; margin-bottom: 25px; z-index: 2; border-left: 6px solid var(--teal); box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .entry::before { content: ''; position: absolute; left: -29px; top: 22px; width: 16px; height: 16px; background: var(--teal); border: 4px solid white; border-radius: 50%; z-index: 3; }
        .ai-badge { font-size: 8px; font-weight: 900; color: #334155; background: var(--slate-silver); padding: 4px 12px; border-radius: 12px; margin-bottom: 8px; display: inline-block; text-transform: uppercase; }
        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 20px; border-radius: 30px; width: 90%; align-self: center; font-weight: 900; cursor: pointer; margin: 15px 0; flex-shrink: 0; }

        /* TOGGLES */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
        body.ghost-mode .app-container { filter: blur(25px); pointer-events: none; }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text">Welcome.</h1>
    <button class="skip-btn" onclick="endSplash()">SKIP DEMO INTRO ➔</button>
</div>

<div class="app-container">
    <header class="header">
        <div>
            <h1 style="color: var(--teal); margin:0; font-size: 18px; font-weight: 900;">WorkTimeline™</h1>
            <span class="tagline">Taking an Intake...</span>
        </div>
        <div style="display:flex; gap:10px; align-items: center;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleChron()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">CHRON</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">GHOST</div></div>
        </div>
    </header>

    <div id="mainContent" style="display: flex; flex-direction: column; height: 100%;">
        <div style="padding:15px; border-bottom: 2px solid var(--platinum);">
            <textarea id="statusBox" placeholder="Log your truth..."></textarea>
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <button class="media-btn" onclick="addEntry('📷 Evidence captured.')"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>CAMERA</span></button>
                <button class="media-btn" onclick="addEntry('🎤 Statement saved.')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg><span>AUDIO</span></button>
                <button class="media-btn" onclick="addEntry('📄 Document verified.')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg><span>DOCS</span></button>
            </div>
            <button onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:20px; width:100%; font-weight:900;">Add to Timeline</button>
        </div>
        <div id="timelineContainer">
            <div class="timeline-spine"><div id="progressFill" class="timeline-progress"></div></div>
            <div id="timelineList"><div id="legacyQuote"><span style="font-size: 8px; font-weight: 900; color: var(--teal); text-transform: uppercase;">Legacy of Justice</span><p id="quoteText" style="margin: 10px 0; font-size: 14px; font-weight: 700; font-style: italic;"></p><span id="quoteAuthor" style="font-size: 11px; font-weight: 900;"></span></div></div>
        </div>
        <button class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
    </div>
</div>

<script>
    const story = [
        "The system is built on two prisons.",
        "One made of iron bars.",
        "The other made of grey bureaucracy.",
        "The 'Invisible Group' is trapped in the grey.",
        "Told they don't matter. Told to wait.",
        "But your truth is the Great Wall.",
        "And we are the Jackal.",
        "Welcome to the Teal Sky.",
        "WorkTimeline™: Document your freedom."
    ];
    
    const quotes = [{q:'"Injustice anywhere is a threat to justice everywhere."',a:"MLK Jr."}, {q:'"The law is a shield for the weak."',a:"Alexander Hamilton"}];
    let entryCount = 0;

    window.onload = () => {
        const rand = quotes[Math.floor(Math.random()*quotes.length)];
        document.getElementById('quoteText').innerText = rand.q;
        document.getElementById('quoteAuthor').innerText = "— " + rand.a;
        runStory();
    };

    function runStory() {
        const el = document.getElementById('storyText');
        let i = 0;
        const next = () => {
            if(i < story.length) {
                el.style.opacity = 0;
                setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2800); }, 600);
            } else endSplash();
        };
        next();
    }

    function endSplash() {
        document.getElementById('splashScreen').style.opacity = '0';
        document.body.classList.add('app-active');
        setTimeout(() => document.getElementById('splashScreen').remove(), 1500);
    }

    function togglePrivacy() { document.body.classList.toggle('ghost-mode'); }
    function toggleChron() { document.body.classList.toggle('chron-view'); }
    function submitEntry() { const t = document.getElementById('statusBox'); if(t.value.trim()) { addEntry(t.value); t.value = ''; } }

    function addEntry(text) {
        if(entryCount === 0) { const q = document.getElementById('legacyQuote'); if(q) q.remove(); }
        entryCount++;
        const now = new Date();
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<div class="ai-badge">TIMELINE</div><span style="font-size: 9px; font-weight: 900; color: var(--teal); display: block; margin-bottom: 5px;">${now.toLocaleDateString()}</span><p style="margin:0; font-size:14px; font-weight:600;">${text}</p>`;
        document.getElementById('timelineList').prepend(div);
        document.getElementById('progressFill').style.height = Math.min(entryCount * 15, 100) + '%';
    }

    function syncToClio() {
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write`;
    }
</script>
</body>
</html>
