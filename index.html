<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Apple Code Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --slate-silver: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            --glass: rgba(0, 128, 128, 0.08); --platinum: #d8e2ea; --gray-dark: #2c3e50; --teal-soft: #e0f2f1;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); }
        
        /* YOUR EXACT NARRATIVE */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 0.8s ease; }
        .story-text { font-size: 24px; font-weight: 800; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 340px; }
        .skip-btn { position: absolute; bottom: 80px; background: rgba(0,0,0,0.05); border: 1.5px solid var(--gray-dark); padding: 12px 24px; border-radius: 50px; font-weight: 900; font-size: 13px; cursor: pointer; color: var(--gray-dark); }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 50px; height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        
        /* GHOST MODE LAYER */
        #blurBox { position: absolute; top: 85px; left: 0; right: 0; bottom: 0; z-index: 98; background: rgba(255,255,255,0.1); backdrop-filter: blur(0px); pointer-events: none; transition: backdrop-filter 0.3s ease; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; z-index: 100; background: white; }

        .input-area { padding: 15px; background: #fff; border-bottom: 2px solid var(--platinum); flex-shrink: 0; }
        #statusBox { width: 100%; height: 85px; padding: 15px; border-radius: 30px; border: 2px solid var(--platinum); box-sizing: border-box; font-family: inherit; margin-bottom: 12px; font-size: 16px; outline: none; background: #fbfdff; }

        /* SOLID ICONS */
        .media-toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
        .media-btn { flex: 1; background: var(--platinum); border: none; padding: 12px 5px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .media-btn svg { width: 22px; height: 22px; fill: var(--teal); margin-bottom: 4px; }
        .media-btn span { font-size: 8px; font-weight: 900; color: var(--gray-dark); }
        .hidden-input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; top: 0; left: 0; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; position: relative; background: #fdfdfd; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 8px; background: #cccccc; border-radius: 15px; z-index: 1; }

        #legacyQuote { position: relative; margin-left: 55px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(0, 128, 128, 0.15); border-left: 6px solid var(--teal); padding: 20px; border-radius: 30px; margin-bottom: 25px; z-index: 2; transition: opacity 0.5s; }

        .entry { position: relative; margin-left: 55px; background: white; border: 1.5px solid var(--platinum); padding: 18px; border-radius: 30px; margin-bottom: 25px; z-index: 2; border-left: 6px solid var(--teal); }
        .timestamp-full { font-size: 9px; font-weight: 900; color: var(--teal); display: block; margin-bottom: 5px; text-transform: uppercase; }

        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 20px; border-radius: 30px; width: 90%; align-self: center; font-weight: 900; cursor: pointer; margin: 15px 0; flex-shrink: 0; }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text">Welcome.</h1>
    <button class="skip-btn" onclick="endSplash()">SKIP INTRO ➔</button>
</div>

<div class="app-container">
    <div id="blurBox"></div>

    <header class="header">
        <div>
            <h1 id="folderLabel" style="color: var(--teal); margin:0; font-size: 18px; font-weight: 900;">WorkTimeline™</h1>
            <div id="subLabel" style="font-size: 11px; font-weight: 800; color: var(--clio-blue); font-style: italic;">Taking an Intake...</div>
        </div>
        <div style="display:flex; gap:10px; align-items: center;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">CHRON</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" id="gSwitch" onchange="toggleGhost()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">GHOST</div></div>
        </div>
    </header>

    <div style="display: flex; flex-direction: column; height: 100%;">
        <div class="input-area">
            <textarea id="statusBox" placeholder="Start your intake entry..."></textarea>
            <div class="media-toolbar">
                <button class="media-btn">
                    <input type="file" accept="image/*" capture="camera" class="hidden-input" onchange="addEntry('📷 Evidence photo captured.')">
                    <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg>
                    <span>CAMERA</span>
                </button>
                <button class="media-btn">
                    <input type="file" accept="audio/*" capture="microphone" class="hidden-input" onchange="addEntry('🎤 Audio secured.')">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    <span>AUDIO</span>
                </button>
                <button class="media-btn" onclick="window.location.href='sms:?body=WorkTimeline Update:'">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    <span>TEXT</span>
                </button>
                <button class="media-btn">
                    <input type="file" class="hidden-input" onchange="addEntry('📄 Document verified.')">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
                    <span>DOCS</span>
                </button>
            </div>
            <button id="addBtn" onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:20px; width:100%; font-weight:900; cursor:pointer;">Add Entry & Secure</button>
        </div>

        <div id="timelineContainer">
            <div class="timeline-spine"></div>
            <div id="displayList">
                <div id="legacyQuote">
                    <span style="font-size: 10px; font-weight: 900; color: var(--teal); text-transform: uppercase;">Intake Analytics</span>
                    <p style="margin: 5px 0; font-weight: 800; font-size: 15px;">Entries: 0 | Capacity: High</p>
                    <p style="font-style: italic; font-weight: 700; font-size: 13px;">"The first duty of society is justice." — Alexander Hamilton</p>
                </div>
            </div>
        </div>

        <button class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
    </div>
</div>

<script>
    const story = [
        "The system is built on two prisons.",
        "One made of grey.",
        "The other made of grey.",
        "The 'Invisible Group' is trapped in the grey.",
        "But Jack Newton saw a different path.",
        "And the sky is Teal.",
        "WorkTimeline™: Secure your freedom."
    ];
    
    let activeVault = "TIMELINE";
    const timelineVault = [];
    const notesVault = [];

    window.onload = () => { runStory(); };

    function runStory() {
        const el = document.getElementById('storyText');
        let i = 0;
        const next = () => {
            if(i < story.length) {
                el.style.opacity = 0;
                setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2800); }, 600);
            } else endSplash();
        };
        next();
    }

    function endSplash() {
        const s = document.getElementById('splashScreen');
        if(s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 1000); }
    }

    function toggleGhost() {
        const box = document.getElementById('blurBox');
        const sw = document.getElementById('gSwitch');
        if(sw.checked) {
            box.style.backdropFilter = "blur(50px) grayscale(1)";
            box.style.pointerEvents = "all";
        } else {
            box.style.backdropFilter = "blur(0px) grayscale(0)";
            box.style.pointerEvents = "none";
        }
    }

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('mode-notes', cb.checked);
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('subLabel').innerText = cb.checked ? "Attorney Work Product" : "Taking an Intake...";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        document.getElementById('addBtn').style.background = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refreshVaultDisplay();
    }

    function submitEntry() {
        const box = document.getElementById('statusBox');
        if(!box.value.trim()) return;
        saveEntry(box.value);
        box.value = '';
        const q = document.getElementById('legacyQuote');
        if(q) { q.style.opacity = '0'; setTimeout(() => q.remove(), 500); }
    }

    function saveEntry(text) {
        const now = new Date();
        // AM/PM PRECISION FIX
        const stamp = now.toLocaleDateString() + ' @ ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        const entry = { text: text, stamp: stamp };
        if(activeVault === "TIMELINE") timelineVault.push(entry);
        else notesVault.push(entry);
        refreshVaultDisplay();
    }

    function addEntry(text) { saveEntry(text); }

    function refreshVaultDisplay() {
        const list = document.getElementById('displayList');
        const quote = document.getElementById('legacyQuote');
        list.innerHTML = '';
        if(quote && timelineVault.length === 0 && notesVault.length === 0) list.appendChild(quote);
        
        const data = (activeVault === "TIMELINE") ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = 'entry';
            div.style.borderLeftColor = (activeVault === "NOTES") ? "var(--clio-blue)" : "var(--teal)";
            div.innerHTML = `<span class="timestamp-full" style="color:${(activeVault === "NOTES") ? 'var(--clio-blue)' : 'var(--teal)'}">${item.stamp}</span><p style="margin:0; font-size:14px; font-weight:600;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    function syncToClio() {
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write`;
    }
</script>
</body>
</html>
