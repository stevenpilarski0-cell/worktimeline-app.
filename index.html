<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline™ | Premium Functionality</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: "SF Pro Display", "Inter", system-ui, sans-serif; background: linear-gradient(180deg, #E5E4E2 0%, #008080 100%); min-height: 100vh; display: flex; justify-content: center; margin: 0; }
        .app-window { width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.95); border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); margin: 40px 20px; padding: 20px; overflow: hidden; }
        .header { display: flex; justify-content: space-around; padding: 15px; border-bottom: 1px solid #eee; }
        .icon-btn { border: none; background: none; cursor: pointer; text-align: center; font-size: 10px; font-weight: 700; color: #008080; }
        .icon-btn span { display: block; font-size: 20px; margin-bottom: 5px; }
        .switch-btn { width: 100%; padding: 12px; border-radius: 18px; border: none; background: #2D3E50; color: white; font-weight: 700; margin: 20px 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="header">
        <button class="icon-btn" onclick="handleAction('camera')"><span>📷</span>CAMERA</button>
        <button class="icon-btn" onclick="handleAction('notes')"><span>🗒️</span>NOTES</button>
        <button class="icon-btn" onclick="handleAction('stealth')"><span>👻</span>STEALTH</button>
        <button class="icon-btn" onclick="handleAction('audio')"><span>🎙️</span>AUDIO</button>
    </div>

    <button class="switch-btn" onclick="toggleContext()">SWITCH MARKETPLACE VIEW</button>

    <div id="contentArea" style="padding: 20px;">
        <!-- Evidence or Triage cards will load here -->
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://sghmgiaaqcuymqnfbleh.supabase.co', 'Sb_publishable_VL3kSjtNHGvLcmZYi1YXnA_Xlo8zpXy');

    // Functional Action Handler
    async function handleAction(action) {
        switch(action) {
            case 'camera':
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                alert("Camera active. Ready to capture evidence.");
                break;
            case 'audio':
                const audio = await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("Microphone active. Recording...");
                break;
            case 'stealth':
                alert("Stealth mode enabled. Screen activity hidden.");
                break;
            case 'notes':
                alert("Opening secure notepad...");
                break;
        }
    }

    // Marketplace Context Switch
    let isFirmView = false;
    function toggleContext() {
        isFirmView = !isFirmView;
        const area = document.getElementById('contentArea');
        area.innerHTML = isFirmView ? "<h3>Firm Marketplace</h3><p>Triage Case Leads Loading...</p>" : "<h3>My Timeline</h3><p>Evidence Feed Loading...</p>";
        alert(isFirmView ? "Switched to Firm View" : "Switched to Client View");
    }
</script>
</body>
</html>
