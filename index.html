<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Prototype</title>
    <style>
        /* 1. CORE STYLE RESET & FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; 
            --silver-gray: #95a5a6; 
            --gray-bg: #e2e8f0; 
            --clio-green: #2ecc71; 
            --clio-blue: #0076CE; 
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12); 
            --risk-red: #e53e3e; 
            --heavy-teal: #006666;
        }
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background: var(--gray-bg); 
            margin: 0; 
            padding: 0; 
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            -webkit-tap-highlight-color: transparent; 
            position: fixed;
        }

        /* 2. APP STATES & LAYERING */
        .app-locked { filter: blur(35px); pointer-events: none; }
        .ghost-active #timelineContainer, 
        .ghost-active #utilityDrawer, 
        .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.15; pointer-events: none; }

        .app-container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            border: 1.5px solid var(--gray-border); 
            box-sizing: border-box; 
            overflow: hidden; 
        }
        
        /* 3. HEADER & BRANDING PACKAGE */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; position: relative; padding-top: max(12px, env(safe-area-inset-top)); }
        .header-top { display: flex; justify-content: flex-start; align-items: center; gap: 4px; }
        
        .briefcase-container { position: relative; width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .briefcase-icon { 
            width: 28px; height: 20px; border: 2.2px solid var(--heavy-teal); border-radius: 5px; 
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .briefcase-icon::before { 
            content: ''; position: absolute; top: -8px; width: 100px; height: 6px; 
            border: 2.2px solid var(--heavy-teal); border-bottom: none; border-radius: 3.5px 3.5px 0 0; 
            background: white; z-index: 2;
            width: 10px;
        }
        
        .icon-timeline { 
            width: 155%; height: 1.5px; background: var(--heavy-teal); position: absolute; top: 50%; 
            display: flex; justify-content: space-around; padding: 0 4px; box-sizing: border-box; z-index: 3;
            left: -27.5%;
        }
        .icon-dot { width: 3px; height: 3px; background: white; border: 1.2px solid var(--heavy-teal); border-radius: 50%; margin-top: -1.2px; }

        .brand-block { display: flex; flex-direction: column; }
        .main-title { font-weight: 900; font-size: 16px; display: flex; align-items: center; letter-spacing: -0.5px; line-height: 1; }
        .work-silver { color: var(--silver-gray); } .timeline-teal { color: var(--teal); }
        .clio-pulse { width: 6px; height: 6px; background-color: var(--clio-green); border-radius: 50%; margin-left: 6px; animation: clio-throb 2s infinite; }
        .intake-sub { font-size: 8px; font-weight: 900; color: var(--teal); letter-spacing: -0.3px; margin-top: 2px; text-transform: uppercase; word-spacing: -1.5px; }

        /* 4. STATUTORY PULSE ANIMATION */
        @keyframes statutory-pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.7); } 50% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(229, 62, 62, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 62, 62, 0); } }
        .risk-badge { display: none; background: var(--risk-red); color: white; font-size: 8px; font-weight: 900; padding: 4px 8px; border-radius: 20px; margin-left: auto; text-transform: uppercase; }
        .active-pulse { display: block; animation: statutory-pulse 1s ease-out 1; }

        /* 5. 3D TOGGLE SWITCH */
        .switch-container { display: flex; align-items: center; gap: 10px; margin-top: 15px; padding: 12px; background: #fdf2f2; border-radius: 18px; display: none; border: 1px solid #fee2e2; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 6. DRAWERS & NAVIGATION */
        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 3500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; }
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 2.5px solid var(--gray-border); z-index: 4500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(100% - 45px)); border-radius: 30px 30px 0 0; padding-bottom: env(safe-area-inset-bottom); }
        .handle { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 40px; height: 6px; background: #cbd5e0; border-radius: 10px; }

        /* 7. TIMELINE CARDS & WRAPPER */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 180px; display: flex; flex-direction: column; gap: 25px; -webkit-overflow-scrolling: touch; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stack-inner { position: relative; width: 88%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 18px; border-radius: 24px; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; border: 1px solid #e5e5e5; }
        .bubble-front { background: #f1f1f1; }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; height: 100%; padding: 15px; font-size: 11px; overflow-y: auto; }

        /* 8. MODALS & CONTROLS */
        #overlaySystem { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 30px; box-shadow: var(--mac-shadow); width: 100%; max-width: 290px; text-align: center; border: 1.5px solid var(--gray-border); }
        .modal-btn { border: none; padding: 14px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 10px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        
        #addBtn { position:absolute; bottom:100px; right:20px; width:70px; height:70px; border-radius:35px; background:var(--teal); color:white; border:none; font-size:30px; box-shadow:var(--mac-shadow); z-index:5000; }
        textarea { width: 100%; height: 100px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-size: 16px; outline: none; background: #fafafa; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card">
        <h2 style="font-weight: 900; margin: 0; font-size: 16px;">INTAKE GUARD</h2>
        <p style="font-size: 12px; font-weight: 600; text-align: left;"><b>FRIENDLY REMINDER:</b> We are not legal advice. We support journaling your day at work, but we are not legal advice and will not give legal advice.</p>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">SECURE MY JOURNAL</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div class="header-top">
            <div class="briefcase-container"><div class="briefcase-icon"><div class="icon-timeline"><div class="icon-dot"></div><div class="icon-dot"></div><div class="icon-dot"></div></div></div></div>
            <div style="display:flex; flex-direction:column; margin-left:8px;">
                <div class="main-title"><span style="color:var(--silver-gray)">Work</span><span style="color:var(--teal)">Timeline</span>™ <div class="clio-pulse"></div></div>
                <div class="intake-sub">TAKIN' INTAKE</div>
            </div>
            <div id="riskBadge" class="risk-badge">Statutory Alert</div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px;">
            <textarea id="statusBox" placeholder="Describe the pattern..." oninput="statutoryAnalyze()"></textarea>
            <div id="aiToggleRow" class="switch-container">
                <div style="flex:1;">
                    <div style="font-size:10px; font-weight:900; color:var(--risk-red);">POTENTIAL ESA/WCB VIOLATION</div>
                    <div style="font-size:8px; font-weight:600; color:#7f8c8d;">Cross-Ref Canadian Case Law?</div>
                </div>
                <label class="switch"><input type="checkbox" id="aiSwitch"><span class="slider"></span></label>
            </div>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>
    <button id="addBtn">+</button>

    <div id="mgmtDrawer">
        <div class="handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 25px 50px;">
            <button class="modal-btn" style="background:var(--teal); color:white;">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#cbd5e0; color:#4a5568;" onclick="confirm('Wipe Timeline?') && (localStorage.clear() || location.reload())">START NEW TIMELINE</button>
        </div>
    </div>
</div>

<script>
    /* 9. THE ENGINE SCRIPTS */
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let utilOpen = false; 
    let mgmtOpen = false;

    function unlockApp() { document.getElementById('overlaySystem').style.display = 'none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 45px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }

    function statutoryAnalyze() {
        const text = document.getElementById('statusBox').value.toLowerCase();
        const badge = document.getElementById('riskBadge');
        const toggle = document.getElementById('aiToggleRow');
        
        // LEGAL CROSS-REF LOGIC (Pattern over Word-Match)
        const isStatutoryPattern = 
            (text.length > 20 && (text.includes("refuse") || text.includes("unsafe") || text.includes("danger"))) || 
            (text.includes("fired") && (text.includes("safety") || text.includes("complaint") || text.includes("meeting"))) ||
            (text.includes("overtime") && (text.includes("pay") || text.includes("hours"))) ||
            (text.includes("write-up") && text.includes("report"));

        if (isStatutoryPattern) {
            if (!badge.classList.contains('active-pulse')) {
                badge.classList.add('active-pulse');
                toggle.style.display = 'flex';
                setTimeout(() => badge.classList.remove('active-pulse'), 1000);
            }
        } else { toggle.style.display = 'none'; }
    }

    document.getElementById('addBtn').onclick = function() {
        const text = document.getElementById('statusBox').value; 
        if(!text.trim()) return;
        const useAI = document.getElementById('aiSwitch').checked;
        let analysis = useAI ? "<b>STATUTORY CROSS-REF:</b> Pattern indicates potential breach of BC ESA (Sec. 83) & WorkSafeBC regulations. Cross-referencing 13-year veteran protection precedents." : "";
        
        vault.push({ text, analysis, stamp: new Date().toLocaleString() });
        localStorage.setItem('wt_timeline', JSON.stringify(vault));
        refresh();
        
        document.getElementById('statusBox').value = '';
        document.getElementById('aiSwitch').checked = false;
        document.getElementById('aiToggleRow').style.display = 'none';
        if(utilOpen) toggleUtility();
    };

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        [...vault].reverse().forEach(item => {
            const hasAI = item.analysis !== "";
            list.innerHTML += `
                <div class="stack-wrapper">
                    <div style="font-size:9px; font-weight:900; color:var(--silver-gray); margin-bottom:5px;">📍 LANGLEY | ${item.stamp}</div>
                    <div class="stack-inner" onclick="this.classList.toggle('flipped')">
                        <div class="bubble bubble-front">
                            <p style="font-weight:600; font-size:15px; margin:0;">${item.text}</p>
                        </div>
                        ${hasAI ? `<div class="bubble bubble-back">${item.analysis}</div>` : ''}
                    </div>
                </div>`;
        });
    }
    refresh();
</script>
</body>
</html>
