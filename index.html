<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ - Founder Edition</title>
    <style>
        :root {
            --clio-green: #2ecc71;
            --bg-dark: #121212;
            --text-main: #e0e0e0;
            --accent: #3498db;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            overflow: hidden;
        }

        /* 1. CLIO STATUS LIGHT (Floating Layer) */
        .clio-status-corner {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 9999;
            pointer-events: none;
        }

        .green-pulse-light {
            width: 14px;
            height: 14px;
            background: var(--clio-green);
            border-radius: 50%;
            display: none; /* Shows only after handshake */
            box-shadow: 0 0 0 rgba(46, 204, 113, 0.4);
            animation: pulse-throb 1.8s infinite;
        }

        @keyframes pulse-throb {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* 2. SPLASH SCREEN (Imprisoned Data Intro) */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        .splash-text { font-size: 1.2rem; margin-bottom: 20px; color: #aaa; }
        .splash-title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        
        .skip-btn {
            background: none; border: 1px solid #555; color: white;
            padding: 10px 30px; border-radius: 20px; cursor: pointer;
        }

        /* 3. MAIN APP LAYOUT */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 500px; /* Mobile focused */
            margin: 0 auto;
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        .header p { margin: 5px 0 0; font-size: 0.85rem; color: #888; }

        /* GANTT / TIMELINE SECTION */
        .timeline-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #1a1a1a;
        }

        .gantt-row {
            display: flex;
            align-items: center;
            height: 40px;
            margin-bottom: 10px;
            background: #222;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .gantt-label {
            width: 80px;
            font-size: 0.7rem;
            padding-left: 10px;
            color: #666;
            z-index: 2;
        }

        .gantt-bar {
            height: 60%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* LEDGER / DATA ENTRY */
        .ledger-area {
            height: 35%;
            background: #000;
            border-top: 2px solid #333;
            padding: 15px;
        }

        .input-group {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        input, textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="clio-status-corner">
        <div id="clioPulseLight" class="green-pulse-light"></div>
    </div>

    <div id="splashScreen">
        <div class="splash-text">Capturing the "Imprisoned 60%"</div>
        <div class="splash-title">WorkTimeline™</div>
        <button class="skip-btn" onclick="endSplash()">Enter Firm</button>
    </div>

    <div class="app-container">
        <header class="header">
            <h1>WorkTimeline</h1>
            <p>One-Man Firm Edition • Canada Instance</p>
        </header>

        <section class="timeline-area" id="timeline">
            <div class="gantt-row"><div class="gantt-label">Intake</div><div class="gantt-bar" style="width: 85%;"></div></div>
            <div class="gantt-row"><div class="gantt-label">Evidence</div><div class="gantt-bar" style="width: 45%; background: var(--clio-green);"></div></div>
            <div class="gantt-row"><div class="gantt-label">Review</div><div class="gantt-bar" style="width: 20%;"></div></div>
        </section>

        <section class="ledger-area">
            <div class="input-group">
                <input type="text" placeholder="Subject / Lead Name">
            </div>
            <div class="input-group">
                <textarea rows="3" placeholder="Capture work details here..."></textarea>
            </div>
        </section>
    </div>

    <script>
        // 1. HANDSHAKE DETECTION & AUTO-UNFREEZE
        (function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('code')) {
                // Verified Handshake Found
                const light = document.getElementById('clioPulseLight');
                if (light) light.style.display = 'block';

                // Force kill splash screen immediately
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.style.display = 'none';
                    splash.remove();
                }
                console.log("Clio Handshake Verified. App Unfrozen.");
            }
        })();

        // 2. SPLASH SCREEN EXIT
        function endSplash() {
            const splash = document.getElementById('splashScreen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.remove();
                }, 800);
            }
        }

        // 3. PROTOTYPE DATA PERSISTENCE (Supabase Placeholder)
        console.log("WorkTimeline 75% Build - Ready for API Testing.");
    </script>
</body>
</html>
