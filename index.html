<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Media Slide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 48px; --round-inner: 28px; --round-pill: 999px;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100dvh; overflow: hidden; color: var(--gray-dark); }
        
        /* GHOST MODE */
        #ghostOverlay { position: absolute; top: 85px; left: 0; right: 0; bottom: 0; z-index: 9999; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.4s ease; background: rgba(255,255,255,0); }
        body.ghost-active #ghostOverlay { backdrop-filter: blur(35px) grayscale(1); -webkit-backdrop-filter: blur(35px) grayscale(1); background: rgba(238, 241, 245, 0.8); pointer-events: all; }

        /* INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; transition: opacity 0.6s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 460px; }
        #skipBtn { position: absolute; bottom: 60px; padding: 14px 28px; background: white; color: var(--clio-blue); border: 2px solid var(--clio-blue); border-radius: var(--round-pill); font-size: 14px; font-weight: 800; cursor: pointer; z-index: 100001; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: calc(100dvh - 20px); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--platinum); flex-shrink: 0; background: white; z-index: 110; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .wt-icon { width: 32px; height: 32px; }
        .wt-icon svg { width: 100%; height: 100%; fill: none; stroke: var(--teal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .input-area { padding: 15px 24px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); flex-shrink: 0; display: flex; flex-direction: column; z-index: 105; }
        
        .template-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .chip { background: white; color: var(--teal); font-size: 11px; font-weight: 700; padding: 8px 16px; border-radius: var(--round-pill); white-space: nowrap; border: 1.5px solid var(--platinum); }
        
        #statusBox { width: 100%; height: 80px; padding: 16px; border-radius: var(--round-inner); border: 1.5px solid var(--platinum); font-family: inherit; font-size: 15px; background: white; resize: none; margin-bottom: 12px; }

        /* THE MEDIA SLIDE SECTION */
        .media-drawer {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* The Grey Handle Bar */
        .media-handle-bar {
            width: 100%;
            height: 32px;
            background: #e2e8f0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .media-handle-bar svg { width: 20px; height: 20px; stroke: #64748b; transition: transform 0.3s; }
        
        /* Collapsed State for Media Section */
        .media-drawer.collapsed { height: 32px; margin-bottom: 5px; }
        .media-drawer.collapsed .media-toolbar { opacity: 0; pointer-events: none; transform: translateY(-20px); }
        .media-drawer.collapsed .media-handle-bar svg { transform: rotate(180deg); }

        .media-toolbar { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-bottom: 12px; 
            transition: all 0.3s ease;
        }
        .media-btn { background: white; border: 1.5px solid var(--platinum); padding: 10px 4px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .media-btn svg { width: 22px; height: 22px; stroke: var(--teal); fill: none; stroke-width: 2.2; }
        .media-btn span { font-size: 8px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
