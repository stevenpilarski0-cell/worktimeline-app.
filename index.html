<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; 
            --clio-green: #2ecc71; --round-inner: 24px; --glass: rgba(255, 255, 255, 0.95);
            --teal-alpha: rgba(0, 128, 128, 0.2);
        }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(22px); opacity: 0.4; pointer-events: none; }

        /* LEGAL MODAL */
        #legalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.9); backdrop-filter: blur(8px); z-index: 200000; display: flex; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .modal-card { background: white; padding: 35px; border-radius: 32px; text-align: center; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .modal-btn { background: var(--teal); color: white; border: none; padding: 18px; border-radius: 99px; font-weight: 900; cursor: pointer; margin-top: 25px; width: 100%; font-size: 16px; }

        /* CENTERED SKIP BUTTON */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); margin-bottom: 40px; opacity: 0; transition: 0.8s; }
        #skipBtn { padding: 16px 40px; border: 3px solid var(--teal); border-radius: 99px; background: white; color: var(--teal); font-weight: 900; font-size: 15px; cursor: pointer; transition: 0.3s; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 2px solid var(--platinum); z-index: 3000; background: white; }
        .switch-group { display: flex; gap: 15px; align-items: center; }
        .switch { position: relative; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* DRAWER & TOOLS */
        #utilityDrawer { width: 100%; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 2px solid var(--platinum); z-index: 2500; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .drawer-content { padding: 15px 20px; }
        .template-bar { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
        .template-chip { background: white; border: 2.5px solid var(--teal); padding: 8px 14px; border-radius: 15px; font-size: 10px; font-weight: 900; color: var(--teal); white-space: nowrap; }
        #statusBox { width: 100%; height: 85px; padding: 14px; border-radius: 18px; border: 2.5px solid var(--platinum); resize: none; font-family: inherit; font-weight: 700; background: #f8fafc; box-sizing: border-box; outline: none; }

        .media-toolbar { display: flex; gap: 8px; margin-top: 12px; }
        .media-btn { flex: 1; position: relative; background: white; border: 2.5px solid var(--platinum); padding: 12px 5px; border-radius: 16px; text-align: center; font-size: 9px; font-weight: 900; }
        .media-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

        /* TIMELINE & ENTRIES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 45px 15px 25px; position: relative; background: #fdfdfd; }
        .entry { position: relative; margin-left: 35px; background: white; border: 2.5px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 25px; border-left: 10px solid var(--platinum); transition: 0.3s; width: calc(100% - 45px); box-sizing: border-box; }
        .entry.teal-standard { background: var(--teal-alpha); border-color: var(--teal); border-left-color: var(--teal); }
        
        .pattern-alert { background: var(--teal); color: white; padding: 15px; border-radius: 18px; font-size: 12px; font-weight: 800; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,128,128,0.2); }
        .clip-btn { background: white; color: var(--teal); border: none; padding: 5px 10px; border-radius: 8px; font-weight: 900; font-size: 10px; margin-top: 8px; cursor: pointer; }

        #addBtn { position: absolute; z-index: 5000; right: 20px; top: 160px; width: 65px; height: 65px; border-radius: 20px; background: var(--teal); color: white; font-size: 40px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        #syncBtn { position: absolute; z-index: 5000; right: 20px; top: 240px; width: 65px; height: 65px; border-radius: 20px; background: var(--clio-blue); border: none; color: white; }

        .pulse-dot { width: 10px; height: 10px; background: var(--clio-green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { transform: scale(0.9); } }
    </style>
</head>
<body id="appBody">

<div id="legalOverlay">
    <div class="modal-card">
        <h2 style="color:var(--teal); font-weight:900;">Evidence Protection</h2>
        <p>WorkTimeline™ creates Contemporaneous Records. Your GPS and Time are anchored to the "Grit" (Original Note). This is not legal advice.</p>
        <button class="modal-btn" onclick="dismissLegal()">I UNDERSTAND</button>
    </div>
</div>

<div id="splashScreen">
    <h1 id="storyText" class="story-text">Welcome.</h1>
    <button id="skipBtn" onclick="endSplash()">Skip Intro</button>
</div>

<div class="app-container">
    <header class="header">
        <div style="font-weight:900; color:var(--teal); font-size:18px;">WorkTimeline™</div>
        <div class="switch-group">
            <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">GHOST</div></div>
            <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">NOTES</div></div>
        </div>
    </header>

    <button id="addBtn" onclick="submitEntry()">+</button>
    <button id="syncBtn" onclick="openSync()">CLIO</button>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <div class="template-bar">
                <div class="template-chip" onclick="useTemplate('WITNESS: ')">WITNESS</div>
                <div class="template-chip" onclick="useTemplate('INCIDENT: ')">INCIDENT</div>
                <div class="template-chip" onclick="useTemplate('EVIDENCE: ')">EVIDENCE</div>
            </div>
            <textarea id="statusBox" placeholder="Start your record..."></textarea>
            <div class="media-toolbar">
                <div class="media-btn"><span>CAM</span><input type="file" accept="image/*" capture="camera" onchange="addMedia('📷 PHOTO')"></div>
                <div class="media-btn"><span>AUDIO</span><input type="file" accept="audio/*" capture="microphone" onchange="addMedia('🎤 AUDIO')"></div>
                <div class="media-btn"><span>DOCS</span><input type="file" onchange="addMedia('📄 DOC')"></div>
            </div>
        </div>
        <div style="height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="toggleDrawer()"><div style="width:40px; height:5px; background:var(--platinum); border-radius:10px;"></div></div>
    </div>

    <div id="timelineContainer">
        <div style="position:absolute; right:20px; top:10px; display:flex; align-items:center; gap:5px;">
            <div class="pulse-dot"></div><span style="font-size:8px; font-weight:900; color:var(--clio-green);">CLIO READY</span>
        </div>
        <div id="displayList"></div>
    </div>
</div>

<script>
    const story = ["Document the Truth.", "GPS Verified.", "Fresh Records.", "Effortless Justice."];
    let isDrawerOpen = true;
    let activeVault = "TIMELINE";
    const timelineVault = [];
    const notesVault = [];

    function dismissLegal() { document.getElementById('legalOverlay').style.opacity='0'; setTimeout(() => { document.getElementById('legalOverlay').remove(); runStory(); }, 500); }
    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => { if(i < story.length) { el.style.opacity = 0; setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2200); }, 600); } else endSplash(); };
        next();
    }
    function endSplash() { const s = document.getElementById('splashScreen'); if(s) { s.style.opacity='0'; setTimeout(() => s.remove(), 800); } }

    function toggleDrawer() {
        const d = document.getElementById('utilityDrawer'); const c = document.getElementById('drawerContent');
        if(isDrawerOpen) { d.style.transform = `translateY(-${c.offsetHeight}px)`; isDrawerOpen = false; }
        else { d.style.transform = `translateY(0)`; isDrawerOpen = true; }
    }

    function toggleGhost(cb) { document.getElementById('appBody').classList.toggle('ghost-active', cb.checked); }
    function toggleVault(cb) { activeVault = cb.checked ? "NOTES" : "TIMELINE"; refreshDisplay(); }
    function useTemplate(t) { const b = document.getElementById('statusBox'); b.value = t; b.focus(); }

    function submitEntry() { const b = document.getElementById('statusBox'); if(!b.value.trim()) return; saveEntry(b.value); b.value = ''; }
    function addMedia(m) { saveEntry(m); }

    async function saveEntry(text) {
        navigator.geolocation.getCurrentPosition(async pos => {
            const entry = {
                id: Date.now(), grit: text, teal: "Analysing...", 
                stamp: new Date().toLocaleString(), gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`,
                isStacked: false, currentView: 'grit', pattern: null
            };
            if(activeVault === "TIMELINE") timelineVault.push(entry); else notesVault.push(entry);
            refreshDisplay();
            
            // SIMULATED AI HANDSHAKE
            setTimeout(() => {
                entry.teal = "Documented workplace incident involving behavioral markers and safety breach.";
                if(text.toLowerCase().includes("fred")) entry.pattern = "Repeated interaction detected with subject: FRED";
                refreshDisplay();
            }, 1500);
        });
    }

    function acceptTeal(id) { 
        const e = timelineVault.find(x => x.id === id) || notesVault.find(x => x.id === id);
        e.isStacked = true; e.currentView = 'teal'; refreshDisplay(); 
    }
    
    function toggleView(id, view) {
        const e = timelineVault.find(x => x.id === id) || notesVault.find(x => x.id === id);
        e.currentView = view; refreshDisplay();
    }

    function clipPattern(msg) {
        saveEntry("AI DETECTED PATTERN: " + msg);
        alert("Pattern clipped to vault.");
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `entry ${item.currentView === 'teal' ? 'teal-standard' : ''}`;
            
            let displayContent = item.currentView === 'teal' ? item.teal : item.grit;
            let footer = "";

            if (!item.isStacked) {
                footer = `<div style="margin-top:12px; padding:10px; background:#f1f5f9; border-radius:12px;">
                    <p style="font-size:10px; font-weight:900; color:var(--teal); margin:0 0 5px;">PROPOSED TEAL STANDARD:</p>
                    <p style="font-size:12px; font-weight:700; margin:0 0 10px;">${item.teal}</p>
                    <button onclick="acceptTeal(${item.id})" style="width:100%; padding:8px; background:var(--teal); color:white; border:none; border-radius:8px; font-size:10px; font-weight:900;">ACCEPT & LOCK SUMMARY</button>
                </div>`;
            } else {
                footer = `<div style="display:flex; gap:8px; margin-top:12px;">
                    <button onclick="toggleView(${item.id}, 'grit')" style="flex:1; padding:8px; font-size:9px; font-weight:900; background:${item.currentView === 'grit' ? 'var(--gray-dark)' : 'white'}; color:${item.currentView === 'grit' ? 'white' : 'var(--gray-dark)'}; border:1.5px solid var(--platinum); border-radius:10px;">WHITE</button>
                    <button onclick="toggleView(${item.id}, 'teal')" style="flex:1; padding:8px; font-size:9px; font-weight:900; background:${item.currentView === 'teal' ? 'var(--teal)' : 'white'}; color:${item.currentView === 'teal' ? 'white' : 'var(--teal)'}; border:1.5px solid var(--teal); border-radius:10px;">TEAL</button>
                </div>`;
            }

            let patternHtml = item.pattern ? `<div class="pattern-alert">${item.pattern}<br><button class="clip-btn" onclick="clipPattern('${item.pattern}')">CLIP TO NOTES</button></div>` : "";

            div.innerHTML = `<span style="font-size:9px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span>
                <p style="margin:10px 0 0; font-size:15px; font-weight:800; line-height:1.4;">${displayContent}</p>
                ${patternHtml}${footer}`;
            list.appendChild(div);
        });
    }

    function openSync() { window.location.href = `https://ca.app.clio.com/oauth/authorize?client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&response_type=code&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_read%20leads_write%20contacts_write`; }
</script>
</body>
</html>
