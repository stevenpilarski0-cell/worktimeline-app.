<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Mobile Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; --clio-green: #2ecc71; 
            --clio-blue: #0076CE; --gray-border: #cbd5e0; --mac-shadow: 0 10px 30px rgba(0,0,0,0.12); 
            --risk-red: #e53e3e; --heavy-teal: #006666;
        }
        
        body { 
            font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; 
            height: 100dvh; width: 100vw; overflow: hidden; display: flex; justify-content: center; 
            -webkit-tap-highlight-color: transparent; position: fixed;
        }

        .app-locked { filter: blur(35px); pointer-events: none; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer, .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.15; pointer-events: none; }

        .app-container { 
            width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; 
            flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); 
            box-sizing: border-box; overflow: hidden;
        }
        
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; position: relative; padding-top: max(12px, env(safe-area-inset-top)); }
        .header-top { display: flex; justify-content: flex-start; align-items: center; gap: 4px; }
        
        .briefcase-container { position: relative; width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .briefcase-icon { width: 28px; height: 20px; border: 2.2px solid var(--heavy-teal); border-radius: 5px; position: relative; display: flex; align-items: center; justify-content: center; }
        .briefcase-icon::before { content: ''; position: absolute; top: -8px; width: 10px; height: 6px; border: 2.2px solid var(--heavy-teal); border-bottom: none; border-radius: 3.5px 3.5px 0 0; background: white; z-index: 2; }
        .icon-timeline { width: 155%; height: 1.5px; background: var(--heavy-teal); position: absolute; top: 50%; display: flex; justify-content: space-around; padding: 0 4px; box-sizing: border-box; z-index: 3; left: -27.5%; }
        .icon-dot { width: 3px; height: 3px; background: white; border: 1.2px solid var(--heavy-teal); border-radius: 50%; margin-top: -1.2px; }

        .brand-block { display: flex; flex-direction: column; }
        .main-title { font-weight: 900; font-size: 16px; display: flex; align-items: center; letter-spacing: -0.5px; line-height: 1; }
        .work-silver { color: var(--silver-gray); } .timeline-teal { color: var(--teal); }
        .clio-pulse { width: 6px; height: 6px; background-color: var(--clio-green); border-radius: 50%; margin-left: 6px; animation: clio-throb 2s infinite; }
        .intake-sub { font-size: 8px; font-weight: 900; color: var(--teal); letter-spacing: -0.3px; margin-top: 2px; text-transform: uppercase; word-spacing: -1.5px; }

        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 3500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; }
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 2.5px solid var(--gray-border); z-index: 4500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(100% - 45px)); border-radius: 30px 30px 0 0; padding-bottom: env(safe-area-inset-bottom); }
        .handle { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: #cbd5e0; border-radius: 10px; }

        .media-icons-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .media-pill { background: #f1f5f9; border: 1.2px solid var(--gray-border); padding: 12px; border-radius: 18px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; color: #4a5568; gap: 6px; }
        .m-icon { width: 18px; height: 12px; background: #4a5568; position: relative; border-radius: 3px; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 180px; display: flex; flex-direction: column; gap: 25px; -webkit-overflow-scrolling: touch; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stamp-label { font-size: 9px; font-weight: 900; color: var(--silver-gray); margin-bottom: 6px; }
        .stack-inner { position: relative; width: 88%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 18px; border-radius: 24px; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; }
        .bubble-front { background: #f1f1f1; border: 1px solid #e5e5e5; }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; height: 100%; padding: 15px; font-size: 11px; overflow-y: auto; }

        .draggable { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 25px; border: none; box-shadow: var(--mac-shadow); touch-action: none; }
        #addBtn { width: 75px; height: 75px; background: var(--teal); font-size: 35px; top: 140px; right: 15px; }
        #syncBtn { width: 75px; height: 75px; background: var(--clio-blue); font-size: 9px; padding: 8px; top: 230px; right: 15px; text-align: center; }
        
        #overlaySystem { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        
        /* THE MODIFICATION: COMPACT WARNING WINDOW */
        .modal-card { 
            background: white; padding: 20px; border-radius: 25px; 
            box-shadow: var(--mac-shadow); width: 100%; 
            max-width: 280px; /* Reduced width */
            text-align: center; border: 1.5px solid var(--gray-border); 
        }
        
        .modal-btn { border: none; padding: 14px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 15px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        textarea { width: 100%; height: 100px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-size: 16px; outline: none; background: #fafafa; -webkit-appearance: none; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
        .template-chip { border: 1px solid var(--gray-border); padding: 10px 16px; border-radius: 50px; font-size: 9px; font-weight: 900; color: #4a5568; background: #f8fafc; cursor: pointer; }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card">
        <h2 style="font-weight: 900; margin: 0; font-size: 16px;">INTAKE GUARD</h2>
        <div style="font-size: 12px; line-height: 1.5; color: #4a5568; margin: 15px 0; font-weight: 600; text-align: left;">
            <b>FRIENDLY REMINDER:</b> We are not legal advice. We support journaling your day at work, but we are not legal advice and will not give legal advice.
        </div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="unlockApp()">SECURE MY JOURNAL</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div class="header-top">
            <div class="briefcase-container"><div class="briefcase-icon"><div class="icon-timeline"><div class="icon-dot"></div><div class="icon-dot"></div><div class="icon-dot"></div></div></div></div>
            <div class="brand-block">
                <div class="main-title"><span class="work-silver">Work</span><span class="timeline-teal">Timeline</span>™ <div class="clio-pulse"></div></div>
                <div class="intake-sub">TAKIN' INTAKE</div>
            </div>
            <div style="position:absolute; right:15px; display:flex; flex-direction:column; gap:6px;">
                <button onclick="document.getElementById('appBody').classList.toggle('ghost-active')" style="background:#f1f5f9; border:none; border-radius:20px; font-size:8px; font-weight:900; padding:6px 12px; color:var(--teal);">GHOST</button>
                <button onclick="refresh()" style="background:#f1f5f9; border:none; border-radius:20px; font-size:8px; font-weight:900; padding:6px 12px; color:var(--teal);">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px 15px 45px;">
            <div style="display:flex; gap:6px; justify-content:center; margin-bottom: 15px; flex-wrap: wrap;">
                <button onclick="useTemplate('INCIDENT')" class="template-chip">INCIDENT</button>
                <button onclick="useTemplate('INJURY')" class="template-chip">INJURY</button>
                <button onclick="useTemplate('WITNESS')" class="template-chip">WITNESS</button>
                <button onclick="useTemplate('SETTING')" class="template-chip">SETTING</button>
            </div>
            <div class="media-icons-row">
                <div class="media-pill"><div class="m-icon m-camera"></div>CAMERA</div>
                <div class="media-pill"><div class="m-icon m-audio"><span style="height:40%"></span><span style="height:100%"></span><span style="height:60%"></span></div>AUDIO</div>
                <div class="media-pill"><div class="m-icon m-files"></div>DOCS</div>
            </div>
            <textarea id="statusBox" placeholder="Documenting the grit..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>
    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable">SYNC TO CLIO</button>

    <div id="mgmtDrawer">
        <div class="handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 25px 50px;">
            <button class="modal-btn" style="background:var(--teal); color:white;">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#cbd5e0; color:#4a5568;" onclick="confirm('Wipe?') && (localStorage.clear() || location.reload())">START NEW TIMELINE</button>
        </div>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let utilOpen = false; let mgmtOpen = false;

    function unlockApp() { document.getElementById('overlaySystem').style.display = 'none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 45px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }

    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0; el.ontouchstart = dStart;
        function dStart(e) { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; document.ontouchend = dEnd; document.ontouchmove = dMove; }
        function dMove(e) { let cx = e.touches[0].clientX; let cy = e.touches[0].clientY; p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; }
        function dEnd() { document.ontouchend = null; document.ontouchmove = null; }
    }
    makeDraggable(document.getElementById("addBtn")); makeDraggable(document.getElementById("syncBtn"));

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        let analysis = ""; if (text.toLowerCase().includes("fire") || text.toLowerCase().includes("retaliation") || text.toLowerCase().includes("termination")) {
            analysis = `<b>LEGAL DIAGNOSTIC:</b> Retaliatory Discharge marker detected. temporal proximity nexus confirmed.`;
        }
        vault.push({ grit: text, analysis: analysis, stamp: new Date().toLocaleString() }); 
        localStorage.setItem('wt_timeline', JSON.stringify(vault)); refresh();
        document.getElementById('statusBox').value = ''; if(utilOpen) toggleUtility();
    }
    document.getElementById('addBtn').onclick = submitEntry;

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        [...vault].reverse().forEach(item => {
            const hasAI = item.analysis !== "";
            list.innerHTML += `<div class="stack-wrapper"><div class="stamp-label">📍 LANGLEY | ${item.stamp}</div><div class="stack-inner" onclick="this.classList.toggle('flipped')"><div class="bubble bubble-front"><p style="font-weight:600; font-size:15px; margin:0;">${item.grit}</p></div>${hasAI ? `<div class="bubble bubble-back">${item.analysis}</div>` : ''}</div></div>`;
        });
    }
    function useTemplate(t) { const ts = { 'INCIDENT': 'ACTION:\nVIOLATION:', 'WITNESS': 'NAME:\nCONTACT:', 'INJURY': 'OFA RECORD:\nINJURY:', 'SETTING': 'LOCATION:\nCONTEXT:' }; document.getElementById('statusBox').value = ts[t]; }
    refresh();
</script>
</body>
</html>
