<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Takin' Intake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; 
            --teal-dark: #004d4d; 
            --platinum: #e2e8f0; 
            --gray-dark: #2c3e50; 
            --clio-blue: #0076CE; 
            --clio-green: #2ecc71; 
            --danger: #e74c3c; 
            --notes-gold: #f1c40f;
            --glass: rgba(255, 255, 255, 0.98);
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: #f8fafc; 
            margin: 0; padding: 0; 
            height: 100dvh; 
            display: flex; flex-direction: column;
            overflow: hidden; 
            transition: background 0.3s ease;
        }

        .notes-mode { background: #fffdf2 !important; }

        /* --- HEADER & VAULT SWITCH --- */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; border-bottom: 1.5px solid var(--platinum); 
            background: white; z-index: 1000; 
        }
        .brand-group { display: flex; align-items: center; gap: 4px; }
        .logo-text-wrapper { display: flex; flex-direction: column; line-height: 0.85; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 20px; letter-spacing: -0.5px; }
        .sub-title { font-weight: 900; color: var(--teal); font-size: 11px; letter-spacing: -1.1px; margin: 0; }

        .vault-toggle-ui { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--teal); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--notes-gold); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- UI ELEMENTS --- */
        #statusBox { width: 100%; height: 100px; padding: 15px; border-radius: 20px; border: 2px solid var(--platinum); outline: none; font-family: inherit; font-weight: 700; resize: none; box-sizing: border-box; }
        
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px 20px 100px; }
        .entry { background: white; border-radius: 24px; padding: 20px; border: 1.5px solid var(--platinum); margin-bottom: 20px; border-left: 8px solid var(--teal); transition: 0.3s; position: relative;}
        .note-item { border-left-color: var(--notes-gold) !important; }

        /* SEVERITY PULSE */
        .pulse-critical { border-left: 14px solid var(--teal-dark) !important; animation: heavy-pulse 1.5s infinite; }
        @keyframes heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 77, 77, 0); } }

        /* DOCK & BUTTONS */
        .bottom-dock { background: white; border-top: 2px solid var(--platinum); padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; z-index: 10000; }
        .dock-btn { border: none; border-radius: 16px; padding: 12px 5px; font-weight: 900; font-size: 10px; color: white; cursor: pointer; text-transform: uppercase; }
        
        #addBtn { position: absolute; z-index: 9000; width: 75px; height: 75px; border-radius: 22px; background: var(--teal); color: white; font-weight: 900; font-size: 35px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.2); right: 20px; top: 140px; }
        .notes-btn { background: var(--notes-gold) !important; }

        #consentOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 500000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-card { background: white; padding: 30px; border-radius: 32px; max-width: 400px; width: 100%; }
    </style>
</head>
<body id="appBody">

<div id="consentOverlay">
    <div class="modal-card">
        <h2 style="color:var(--teal);">AI Diagnostic</h2>
        <p id="consentText" style="font-weight:700; line-height:1.4;"></p>
        <button class="dock-btn" style="background:var(--teal); width:100%; margin-top:10px; padding:15px;" onclick="finalizeEntry(true)">YES, ADD TO TIMELINE</button>
        <button class="dock-btn" style="background:var(--gray-dark); width:100%; margin-top:10px; padding:15px;" onclick="finalizeEntry(false)">NO, DISCARD</button>
    </div>
</div>

<header class="header">
    <div class="brand-group">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M4 7H20C21.1046 7 22 7.89543 22 9V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V9C2 7.89543 2.89543 7 4 7Z" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="logo-text-wrapper">
            <span class="main-title">WorkTimeline™</span>
            <div style="display:flex; align-items:center;">
                <span class="sub-title">TAKIN'INTAKE</span>
                <div style="background:var(--clio-green); width:6px; height:6px; border-radius:50%; margin-left:5px;"></div>
            </div>
        </div>
    </div>
    <div class="vault-toggle-ui">
        <label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label>
        <span id="vTag" style="font-size:7px; font-weight:900; color:var(--teal);">TIMELINE</span>
    </div>
</header>

<div style="padding:15px; background:white; border-bottom:1.5px solid var(--platinum);"><textarea id="statusBox" placeholder="Start your fresh record..."></textarea></div>

<button id="addBtn" onclick="submitEntry()">+</button>

<div id="timelineContainer"><div id="displayList"></div></div>

<footer class="bottom-dock">
    <button class="dock-btn" style="background:var(--danger);" onclick="confirmReset()">WIPE ALL</button>
    <button class="dock-btn" style="background:var(--teal);" onclick="alert('Exporting Artifact...')">EXPORT CSV</button>
    <button class="dock-btn" style="background:var(--clio-blue);" onclick="alert('Syncing to Clio Grow...')">LOCK & SYNC</button>
</footer>

<script>
    let activeVault = "TIMELINE";
    let pendingEntry = null;
    const timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    const notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];

    window.onload = () => { refreshDisplay(); };

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('notes-mode', cb.checked);
        document.getElementById('addBtn').classList.toggle('notes-btn', cb.checked);
        document.getElementById('vTag').innerText = activeVault;
        document.getElementById('vTag').style.color = cb.checked ? 'var(--notes-gold)' : 'var(--teal)';
        refreshDisplay();
    }

    function submitEntry() {
        const b = document.getElementById('statusBox'); if(!b.value.trim()) return;
        navigator.geolocation.getCurrentPosition(pos => {
            const isCritical = /fired|risk|dismiss|terminated|quit/i.test(b.value);
            pendingEntry = {
                id: Date.now(), grit: b.value, stamp: new Date().toLocaleString(),
                gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`,
                isCritical: isCritical
            };

            if (isCritical && activeVault === "TIMELINE") {
                document.getElementById('consentText').innerText = "AI flagged this as 'Employment at Risk'. Do you want to include this statutory diagnostic on your timeline?";
                document.getElementById('consentOverlay').style.display = 'flex';
            } else { finalizeEntry(true); }
        });
    }

    function finalizeEntry(choice) {
        if (choice && pendingEntry) {
            if (activeVault === "TIMELINE") {
                timelineVault.push(pendingEntry); localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
            } else {
                notesVault.push(pendingEntry); localStorage.setItem('wt_notes', JSON.stringify(notesVault));
            }
        }
        document.getElementById('statusBox').value = '';
        document.getElementById('consentOverlay').style.display = 'none';
        pendingEntry = null; refreshDisplay();
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `entry ${activeVault === 'NOTES' ? 'note-item' : ''} ${item.isCritical ? 'pulse-critical' : ''}`;
            div.innerHTML = `<div style="font-size:9px; font-weight:900; color:var(--dark-silver);">📍 ${item.gps} | ${item.stamp}</div><p style="font-size:14px; font-weight:700; margin:5px 0 0; white-space:pre-wrap;">${item.grit}</p>`;
            list.appendChild(div);
        });
    }

    function confirmReset() { if(confirm("Wipe active vault?")) { if(activeVault === "TIMELINE") { timelineVault.length = 0; localStorage.removeItem('wt_timeline'); } else { notesVault.length = 0; localStorage.removeItem('wt_notes'); } location.reload(); } }

    function makeMovable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.ontouchstart = (e) => {
            p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
            document.ontouchmove = (e) => {
                p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY;
                p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
            document.ontouchend = () => { document.ontouchmove = null; };
        };
    }
    makeMovable(document.getElementById('addBtn'));
</script>
</body>
</html>
