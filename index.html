
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite | v14.5 Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;700&display=swap');
        :root { --teal: #008080; --slate: #475569; --gray-bg: #f1f5f9; --mac-border: #cbd5e0; --white: #ffffff; --clio-blue: #0076CE; --risk-red: #e53e3e; }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* ELITE UI ELEMENTS */
        #topDrawer { position: fixed; top: 0; width: 100%; background: var(--white); border-bottom: 5px solid var(--teal); border-radius: 0 0 35px 35px; transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 10000; transform: translateY(calc(-100% + 60px)); box-shadow: 0 5px 25px rgba(0,0,0,0.08); }
        #topDrawer.open { transform: translateY(0); }
        .top-handle { height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; bottom: 0; width: 100%; background: var(--white); border-radius: 0 0 35px 35px; }
        .top-pill { width: 55px; height: 6px; background: var(--mac-border); border-radius: 10px; position: absolute; bottom: 10px; }

        #statusBox { width: 100%; height: 120px; padding: 15px; border-radius: 20px; border: 2px solid var(--mac-border); outline: none; font-size: 16px; background: #fafafa; box-sizing: border-box; resize: none; }
        
        /* HARDWARE DOCK */
        .media-dock { display: flex; gap: 12px; background: #e2e8f0; padding: 8px; border-radius: 18px; flex-grow: 1; margin-right: 15px; justify-content: space-around; }
        .icon-btn { background: var(--white); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--slate); border: none; cursor: pointer; }

        /* TIMELINE - ZERO JUMP CARDS */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 80px 20px 140px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
        .entry-card { background: var(--white); padding: 20px; border-radius: 22px; border-left: 8px solid var(--teal); border: 2px solid var(--mac-border); border-left: 8px solid var(--teal); box-shadow: 0 8px 20px rgba(0,0,0,0.05); position: relative; }
        .stamp { font-size: 10px; font-weight: 800; color: var(--slate); opacity: 0.5; margin-bottom: 8px; }

        /* LEGAL OVERLAY SHEET (SLIDE UP) */
        #legalSheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--teal); color: white; border-radius: 35px 35px 0 0; padding: 30px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 20000; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
        #legalSheet.active { transform: translateY(0); }

        /* PULSE */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); z-index: 100000; display: none; align-items: center; justify-content: center; }
        .modal { background: var(--white); padding: 30px; border-radius: 35px; width: 90%; max-width: 360px; text-align: center; border: 4px solid var(--teal); }
        .btn { padding: 18px; border-radius: 15px; border: none; font-weight: 900; width: 100%; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body id="app">

<input type="file" id="cameraIn" accept="image/*" capture="environment" style="display:none;" onchange="mediaLog('Photo')">
<input type="file" id="micIn" accept="audio/*" capture="microphone" style="display:none;" onchange="mediaLog('Voice Note')">
<input type="file" id="docIn" style="display:none;" onchange="mediaLog('Document')">

<div id="topDrawer">
    <div style="padding: 20px;">
        <div style="font-weight:900; color:var(--teal); font-size:20px; margin-bottom:15px;">WorkTimeline™</div>
        <textarea id="statusBox" placeholder="Enter log..."></textarea>
        <div style="display:flex; align-items:center; margin-top:15px;">
            <div class="media-dock">
                <button class="icon-btn" onclick="document.getElementById('cameraIn').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9z"/></svg></button>
                <button class="icon-btn" onclick="document.getElementById('micIn').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></button>
                <button class="icon-btn" onclick="document.getElementById('docIn').click()"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg></button>
            </div>
            <button onclick="analyzeIntel()" style="width:60px; height:60px; border-radius:15px; background:var(--teal); color:white; font-size:32px; font-weight:900; border:none;">+</button>
        </div>
    </div>
    <div class="top-handle" onclick="document.getElementById('topDrawer').classList.toggle('open')"><div class="top-pill"></div></div>
</div>

<div id="timeline"></div>

<div id="legalSheet">
    <h2 id="sheetTitle" style="margin:0;">CASE LAW</h2>
    <p id="sheetBody" style="margin: 20px 0; line-height:1.5;"></p>
    <button class="btn" style="background:white; color:var(--teal);" onclick="document.getElementById('legalSheet').classList.remove('active')">CLOSE RESEARCH</button>
</div>

<div id="aiModal" class="overlay">
    <div class="modal">
        <h2 id="aiTitle" style="color:var(--teal); margin:0;">PRECEDENT MATCH</h2>
        <p id="aiBody" style="margin: 15px 0;"></p>
        <button class="btn" style="background:var(--teal); color:white;" onclick="confirmAI(true)">INCLUDE CASE LAW & LOG</button>
        <button class="btn" style="background:var(--slate); color:white;" onclick="confirmAI(false)">LOG RAW TEXT ONLY</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('WT_ELITE_145')) || [];
    let pending = null;

    const precedents = {
        RETALIATION: { title: "Re: Section 3.12 OHS Action", body: "BC Precedent: Protects workers from harassment following a First Aid or Safety filing." },
        CONSTRUCTIVE: { title: "Potter v. New Brunswick", body: "Supreme Court: Removing access or tools constitutes fundamental breach of contract." }
    };

    function analyzeIntel() {
        const val = document.getElementById('statusBox').value.trim();
        if(!val) return;
        const t = val.toLowerCase();
        let pattern = null;
        const hasHistory = db.some(e => e.txt.toLowerCase().includes("first aid") || e.txt.toLowerCase().includes("report"));

        if (hasHistory && (t.includes("harass") || t.includes("yell"))) pattern = precedents.RETALIATION;
        else if (t.includes("access") && t.includes("locked")) pattern = precedents.CONSTRUCTIVE;

        if(pattern) {
            pending = { val, pattern };
            document.getElementById('aiTitle').innerText = "PATTERN DETECTED";
            document.getElementById('aiBody').innerText = pattern.title;
            document.getElementById('aiModal').style.display='flex';
        } else {
            save(val, null);
        }
    }

    function confirmAI(useAI) {
        save(pending.val, useAI ? pending.pattern : null);
        document.getElementById('aiModal').style.display = 'none';
    }

    function save(txt, ai) {
        db.push({ id: Date.now(), txt, ai, time: new Date().toLocaleString() });
        localStorage.setItem('WT_ELITE_145', JSON.stringify(db));
        document.getElementById('statusBox').value = ''; render();
    }

    function showLaw(id) {
        const entry = db.find(e => e.id === id);
        if(!entry || !entry.ai) return;
        document.getElementById('sheetTitle').innerText = entry.ai.title;
        document.getElementById('sheetBody').innerText = entry.ai.body;
        document.getElementById('legalSheet').classList.add('active');
    }

    function mediaLog(type) {
        db.push({ id: Date.now(), txt: `[ATTACHED ${type.toUpperCase()}] Artifact saved.`, time: new Date().toLocaleString() });
        localStorage.setItem('WT_ELITE_145', JSON.stringify(db)); render();
    }

    function render() {
        const container = document.getElementById('timeline'); container.innerHTML = '';
        [...db].reverse().forEach(item => {
            const card = document.createElement('div'); card.className = 'entry-card';
            card.onclick = () => { if(item.ai) showLaw(item.id); };
            card.innerHTML = `<div class="stamp">${item.time}</div><div style="font-weight:700;">${item.txt}</div>
                ${item.ai ? '<div style="position:absolute; bottom:15px; right:15px;">🪙</div>' : ''}`;
            container.appendChild(card);
        });
    }
    window.onload = render;
</script>
</body>
</html>
