<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Draggable Pro Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #d8e2ea; --gray-dark: #2c3e50; 
            --round-inner: 24px;
        }
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* GHOST MODE */
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { 
            filter: blur(15px); opacity: 0.6; pointer-events: none; 
        }

        /* CINEMATIC INTRO */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: #eef1f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1.2s ease; }
        .story-text { font-size: 24px; font-weight: 900; color: var(--gray-dark); line-height: 1.4; opacity: 0; transition: opacity 0.8s; max-width: 420px; }
        #skipBtn { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); padding: 14px 28px; border: 3px solid var(--teal); border-radius: 99px; background: white; color: var(--teal); font-weight: 900; font-size: 13px; cursor: pointer; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.12); }

        /* HEADER & BRANDING */
        .header { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 25px 12px; border-bottom: 2px solid var(--platinum); flex-shrink: 0; z-index: 1000; background: white; }
        .briefcase-logo { position: relative; width: 38px; height: 26px; border: 3.5px solid var(--gray-dark); border-radius: 8px; }
        .briefcase-handle { position: absolute; top: -8.5px; left: 50%; transform: translateX(-50%); width: 14px; height: 5px; border: 3.5px solid var(--gray-dark); border-bottom: none; border-radius: 4px 4px 0 0; }
        .teal-spine { position: absolute; top: 50%; left: -8px; right: -8px; height: 3.5px; background: var(--teal); border-radius: 2px; transform: translateY(-50%); }
        .teal-dots { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 3px; }
        .dot { width: 4px; height: 4px; background: var(--teal); border-radius: 50%; border: 1px solid white; }
        
        .switch-group { display: flex; gap: 12px; align-items: center; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* DRAGGABLE FLOATING ACTIONS (The Squares) */
        #floatingActions { 
            position: absolute; 
            right: 20px; 
            top: 130px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 2000; 
            touch-action: none; /* Required for dragging */
            cursor: grab;
        }
        #floatingActions:active { cursor: grabbing; }

        .add-sq { width: 65px; height: 65px; background: var(--teal); border: none; border-radius: 20px; color: white; font-size: 40px; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 128, 128, 0.3); }
        .sync-sq { width: 65px; height: 65px; background: var(--clio-blue); border: none; border-radius: 20px; color: white; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 118, 206, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* DRAWER & TEMPLATES */
        #utilityDrawer { width: 100%; background: white; border-bottom: 2px solid var(--platinum); z-index: 500; transition: transform 0.4s ease; position: relative; }
        .drawer-content { padding: 15px 20px; }
        .drag-handle-zone { width: 100%; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-top: 1px solid #f0f0f0; }
        .handle-pill { width: 40px; height: 6px; background: var(--platinum); border-radius: 10px; }

        .template-bar { display: flex; gap: 8px; width: 80%; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px; }
        .template-chip { background: var(--glass); border: 1.5px solid var(--teal); padding: 6px 12px; border-radius: 12px; font-size: 9px; font-weight: 900; color: var(--teal); white-space: nowrap; cursor: pointer; }

        .firm-dropdown { width: 80%; padding: 12px; border-radius: 15px; border: 2px solid var(--platinum); margin-bottom: 10px; font-weight: 800; }
        #statusBox { width: 80%; height: 75px; padding: 12px; border-radius: 15px; border: 2px solid var(--platinum); resize: none; font-family: inherit; font-weight: 600; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px 20px; position: relative; background: #fdfdfd; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 6px; background: var(--platinum); z-index: 1; }
        .entry { position: relative; margin-left: 55px; background: white; border: 2px solid var(--platinum); padding: 18px; border-radius: var(--round-inner); margin-bottom: 20px; z-index: 2; border-left: 6px solid var(--teal); }
        .vault-label { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; margin-bottom: 15px; display: block; text-align: center; }
    </style>
</head>
<body id="appBody">

<div id="splashScreen"><h1 id="storyText" class="story-text">Welcome.</h1><button id="skipBtn" onclick="endSplash()">Skip Intro</button></div>

<div class="app-container">
    <header class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="briefcase-logo"><div class="briefcase-handle"></div><div class="teal-spine"></div><div class="teal-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
            <h1 style="color:var(--teal); margin:0; font-size:18px; font-weight:900;">WorkTimeline™</h1>
        </div>
        <div class="switch-group">
            <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleGhost(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">GHOST</div></div>
            <div style="text-align:center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size:7px; font-weight:900;">CHRON</div></div>
        </div>
    </header>

    <div id="floatingActions">
        <button class="add-sq" onclick="submitEntry()">+</button>
        <button class="sync-sq" onclick="openSync()">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="white" stroke-width="2.5" fill="none"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="white" stroke-width="2.5" fill="none"/></svg>
            <span style="font-size:8px; font-weight:900; margin-top:2px;">CLIO</span>
        </button>
    </div>

    <div id="utilityDrawer">
        <div class="drawer-content" id="drawerContent">
            <select id="firmSelect" class="firm-dropdown">
                <option value="" disabled selected>Select Law Firm...</option>
                <option>Newton & Co. Law</option>
                <option>Pilarski Legal Group</option>
            </select>
            
            <div class="template-bar">
                <div class="template-chip" onclick="useTemplate('WITNESS: ')">WITNESS</div>
                <div class="template-chip" onclick="useTemplate('LOCATION: ')">LOCATION</div>
                <div class="template-chip" onclick="useTemplate('EVIDENCE: ')">EVIDENCE</div>
                <div class="template-chip" onclick="useTemplate('INTEREST: ')">INTEREST</div>
            </div>

            <textarea id="statusBox" placeholder="Describe the event..."></textarea>
        </div>
        <div class="drag-handle-zone" id="dragZone">
            <div class="handle-pill"></div>
        </div>
    </div>

    <div id="timelineContainer">
        <span id="currentVaultLabel" class="vault-label">WorkTimeline™ Main Vault</span>
        <div class="timeline-spine"></div>
        <div id="displayList"></div>
    </div>
</div>

<script>
    const story = ["The Invisible 60%...", "Trapped in the Grey...", "WorkTimeline guides you.", "Justice should feel effortless."];
    let isDrawerOpen = true;
    let activeVault = "TIMELINE";
    const timelineVault = [];
    const isolatedVault = [];

    // DRAG LOGIC FOR ACTION SQUARES
    const actionBox = document.getElementById('floatingActions');
    let offsetTop = 0, offsetLeft = 0;

    actionBox.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        offsetLeft = touch.clientX - actionBox.offsetLeft;
        offsetTop = touch.clientY - actionBox.offsetTop;
    }, {passive: true});

    actionBox.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        actionBox.style.left = (touch.clientX - offsetLeft) + 'px';
        actionBox.style.top = (touch.clientY - offsetTop) + 'px';
        actionBox.style.right = 'auto'; // Break the fixed right alignment
    }, {passive: true});

    function toggleGhost(cb) {
        if(cb.checked) document.getElementById('appBody').classList.add('ghost-active');
        else document.getElementById('appBody').classList.remove('ghost-active');
    }

    function toggleVault(cb) {
        activeVault = cb.checked ? "ISOLATED" : "TIMELINE";
        document.getElementById('currentVaultLabel').innerText = cb.checked ? "Isolated Notes Vault" : "WorkTimeline™ Main Vault";
        refreshDisplay();
    }

    function useTemplate(prefix) {
        const box = document.getElementById('statusBox');
        box.value = prefix;
        box.focus();
    }

    document.getElementById('dragZone').onclick = () => {
        const drawer = document.getElementById('utilityDrawer');
        const content = document.getElementById('drawerContent');
        if(isDrawerOpen) {
            drawer.style.transform = `translateY(-${content.offsetHeight}px)`;
            isDrawerOpen = false;
        } else {
            drawer.style.transform = `translateY(0)`;
            isDrawerOpen = true;
        }
    };

    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => {
            if(i < story.length) { el.style.opacity = 0; setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2500); }, 800); }
            else endSplash();
        };
        next();
    }
    window.onload = runStory;
    function endSplash() { document.getElementById('splashScreen').style.opacity = '0'; setTimeout(() => document.getElementById('splashScreen').remove(), 1000); }

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        saveEntry(box.value);
        box.value = '';
    }

    function saveEntry(text) {
        navigator.geolocation.getCurrentPosition(pos => {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
            const stamp = now.toLocaleDateString() + ' @ ' + now.toLocaleTimeString([], timeOptions);
            const entry = { text: text, stamp: stamp, gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}` };
            if(activeVault === "TIMELINE") timelineVault.push(entry);
            else isolatedVault.push(entry);
            refreshDisplay();
        });
    }

    function refreshDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = (activeVault === "TIMELINE") ? timelineVault : isolatedVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div'); div.className = 'entry';
            div.innerHTML = `<span style="font-size:9px; color:var(--teal); font-weight:900;">📍 ${item.gps} | ${item.stamp}</span><p style="margin:5px 0 0; font-weight:700;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    function openSync() { 
        if(!document.getElementById('firmSelect').value) return alert("Select firm.");
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_read%20leads_write%20contacts_write`; 
    }
</script>
</body>
</html>
