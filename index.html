<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | v63</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        :root {
            --active-teal: #008080;
            --rose: #e11d48;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Nunito', sans-serif; background-color: #94a3b8; 
            overflow: hidden; touch-action: manipulation;
        }

        /* THE MAIN APP CONTAINER */
        .app-container { 
            width: 375px; height: 812px; background: white; 
            margin: auto; position: relative; display: flex; 
            flex-direction: column; overflow: hidden;
            border-radius: 40px; border: 8px solid #000;
        }

        /* THE MODAL - HIGHEST PRIORITY IN THE UNIVERSE */
        #intakeModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(226, 232, 240, 0.98); backdrop-filter: blur(20px);
            z-index: 999999 !important; display: flex; align-items: center; 
            justify-content: center; cursor: pointer;
        }

        .modal-box {
            background: white; padding: 40px; border-radius: 30px;
            width: 80%; max-width: 300px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            pointer-events: auto;
        }

        .btn-big {
            background: #008080; color: white; border: none;
            padding: 15px 30px; border-radius: 15px; font-weight: 900;
            font-size: 18px; width: 100%; margin-top: 20px; cursor: pointer;
        }

        /* HEADER & UI */
        .header { padding: 60px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 20px; color: #008080; }
        
        .input-area { padding: 20px; }
        .hw-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .hw-btn { background: #f1f5f9; padding: 15px; border-radius: 12px; flex: 1; text-align: center; font-weight: 900; font-size: 12px; border: 1px solid #ddd; }
        
        textarea { width: 100%; height: 80px; border-radius: 15px; border: 1px solid #ddd; padding: 10px; font-family: inherit; font-weight: 700; box-sizing: border-box; }

        .timeline { flex: 1; overflow-y: auto; padding: 20px; background: #f8fafc; }
        .bubble { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #eee; font-weight: 700; }
        
        .footer { height: 80px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #eee; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div style="font-size: 24px;">☰</div>
            <div class="main-title">WorkTimeline™</div>
            <div style="width: 24px;"></div>
        </div>

        <div class="input-area">
            <div class="hw-row">
                <div class="hw-btn">PHOTO <input type="file" accept="image/*" style="position:absolute; opacity:0; width:60px;" onchange="vault(this)"></div>
                <div class="hw-btn">AUDIO</div>
            </div>
            <textarea id="msg" placeholder="Document the truth..."></textarea>
            <button class="btn-big" onclick="addMsg()" style="margin-top:10px;">Save Entry</button>
        </div>

        <div class="timeline" id="list"></div>

        <div class="footer">
            <div onclick="alert('Pattern Rec Active')">AI VAULT</div>
            <div style="color:teal; font-weight:900;" onclick="alert('Clio Sync Active')">CLIO SYNC</div>
        </div>
    </div>

    <div id="intakeModal" onclick="forceClose()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 style="color:#008080;">WorkTimeline™</h2>
            <p style="font-weight:700;">
                Welcome. If this is an emergency, call 911.<br><br>
                <span style="color:red;">We do not give legal advice.</span><br>
                However, we <b>do</b> stop gaslighting.
            </p>
            <button class="btn-big" onclick="forceClose()">I UNDERSTAND</button>
            <p style="font-size: 10px; margin-top: 10px; color: gray;">(Tap anywhere to enter)</p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://btscu9wmphyellztza9slqfynbaqudwja.supabase.co'; 
        const supabaseKey = 'Sb_publishable_VL3kSjtNHGvLcmZYi1YXnA_Xlo8zpXy';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let data = JSON.parse(localStorage.getItem('wt_63')) || [];

        function render() {
            const container = document.getElementById('list');
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bubble';
                div.innerHTML = `<small style="color:gray">${item.time}</small><br>${item.text}`;
                container.appendChild(div);
            });
        }

        function addMsg() {
            const txt = document.getElementById('msg').value;
            if(!txt) return;
            data.push({ text: txt, time: new Date().toLocaleString() });
            document.getElementById('msg').value = '';
            localStorage.setItem('wt_63', JSON.stringify(data));
            render();
        }

        function forceClose() {
            console.log("Attempting to close...");
            const m = document.getElementById('intakeModal');
            m.style.setProperty('display', 'none', 'important');
            m.remove(); // Literally delete it from the page
        }

        async function vault(input) {
            const file = input.files[0];
            if(!file) return;
            alert("Vaulting to Canada...");
            const { data: up, error } = await supabase.storage.from('evidence').upload(`${Date.now()}_doc`, file);
            if(error) alert("Error: " + error.message);
            else alert("Securely Stored.");
        }

        render();
    </script>
</body>
</html>
