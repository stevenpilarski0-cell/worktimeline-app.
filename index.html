<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; 
            --clio-blue: #0076CE; 
            --platinum: #e2e8f0; 
            --gray-dark: #1e293b; 
            --gray-light: #f8fafc;
            --round-main: 50px; 
            --round-inner: 28px; 
            --round-pill: 999px;
        }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            outline: none; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: #eef1f5; 
            margin: 0; 
            padding: 10px; 
            height: 100vh; 
            overflow: hidden; 
            color: var(--gray-dark); 
        }
        
        /* CINEMATIC INTRO - FULL SCRIPT VERSION */
        #splashScreen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #eef1f5; 
            z-index: 100000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px; 
            opacity: 1; 
            transition: opacity 1s ease; 
        }

        .story-text { 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--gray-dark); 
            line-height: 1.5; 
            opacity: 0; 
            transition: opacity 0.8s; 
            max-width: 460px; 
            letter-spacing: -0.5px; 
        }

        #skipBtn { 
            position: absolute; 
            bottom: 60px; 
            padding: 14px 28px; 
            background: white; 
            color: var(--clio-blue); 
            border: 2px solid var(--clio-blue); 
            border-radius: var(--round-pill); 
            font-size: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            z-index: 100001; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        /* MAIN CONTAINER */
        .app-container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            border-radius: var(--round-main); 
            height: 95vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
        }
        
        /* GHOST BLUR */
        #blurBox { 
            position: absolute; 
            top: 85px; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 98; 
            background: rgba(255,255,255,0.01); 
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px); 
            pointer-events: none; 
            transition: 0.5s ease; 
        }

        body.ghost-active #blurBox { 
            backdrop-filter: blur(40px) grayscale(1); 
            -webkit-backdrop-filter: blur(40px) grayscale(1); 
            pointer-events: all; 
            background: rgba(238, 241, 245, 0.7); 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 24px; 
            border-bottom: 1px solid var(--platinum); 
            flex-shrink: 0; 
            z-index: 100; 
            background: white; 
        }

        /* PULSING GREEN STATUS LIGHT */
        .status-dot { 
            width: 10px; 
            height: 10px; 
            background: #2ecc71; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 6px; 
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); 
            animation: pulse-green 2s infinite; 
        }

        @keyframes pulse-green { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } 
        }

        /* INPUT AREA */
        .input-area { 
            padding: 20px; 
            background: var(--gray-light); 
            border-bottom: 1px solid var(--platinum); 
            flex-shrink: 0; 
        }

        .template-chips { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 15px; 
            scrollbar-width: none; 
        }

        .template-chips::-webkit-scrollbar { display: none; }

        .chip { 
            background: white; 
            color: var(--teal); 
            font-size: 11px; 
            font-weight: 800; 
            padding: 12px 18px; 
            border-radius: var(--round-pill); 
            border: 1.5px solid var(--platinum); 
            cursor: pointer; 
            white-space: nowrap; 
        }

        #statusBox { 
            width: 100%; 
            height: 95px; 
            padding: 18px; 
            border-radius: var(--round-inner); 
            border: 1.5px solid var(--platinum); 
            font-family: inherit; 
            font-size: 15px; 
            outline: none; 
            background: white; 
            resize: none; 
            margin-bottom: 15px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); 
        }
        
        .media-toolbar { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-bottom: 15px; 
        }

        .media-btn { 
            background: white; 
            border: 1.5px solid var(--platinum); 
            padding: 15px 2px; 
            border-radius: var(--round-inner); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
        }

        .media-btn svg { 
            width: 24px; 
            height: 24px; 
            fill: var(--teal); 
            margin-bottom: 6px; 
        }

        .media-btn span { 
            font-size: 9px; 
            font-weight: 800; 
            color: var(--gray-dark); 
            text-transform: uppercase; 
        }

        /* TIMELINE AREA */
        #timelineContainer { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 25px; 
            position: relative; 
            background: #fff; 
        }

        .timeline-spine { 
            position: absolute; 
            left: 35px; 
            top: 0; 
            bottom: 0; 
            width: 5px; 
            background: var(--platinum); 
            border-radius: 10px; 
            z-index: 1; 
        }
        
        #legacyQuote { 
            position: relative; 
            margin-left: 50px; 
            background: rgba(0, 128, 128, 0.05); 
            border: 1.5px solid var(--platinum); 
            border-left: 6px solid var(--clio-blue); 
            padding: 25px; 
            border-radius: var(--round-inner); 
            margin-bottom: 25px; 
            z-index: 2; 
            transition: opacity 0.5s; 
        }

        .entry { 
            position: relative; 
            margin-left: 50px; 
            background: white; 
            border: 1.5px solid var(--platinum); 
            padding: 22px; 
            border-radius: var(--round-inner); 
            margin-bottom: 25px; 
            z-index: 2; 
            border-left: 6px solid var(--teal); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.04); 
        }

        .timestamp-full { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--teal); 
            display: block; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
        }
        
        #addBtn { 
            background: var(--teal); 
            color:white; 
            border:none; 
            padding:18px; 
            border-radius: var(--round-pill); 
            width:100%; 
            font-weight:800; 
            font-size: 15px; 
            cursor:pointer; 
            box-shadow: 0 4px 14px rgba(0, 128, 128, 0.25); 
        }
        
        /* FOOTER / LOCK BUTTON */
        .footer-bar { 
            padding: 20px 24px; 
            background: white; 
            border-top: 1px solid var(--platinum); 
            display: flex; 
            justify-content: center; 
            flex-shrink: 0; 
        }

        #syncBtn { 
            background: white; 
            color: var(--clio-blue); 
            border: 3px solid var(--clio-blue); 
            padding: 20px; 
            border-radius: var(--round-inner); 
            width: 100%; 
            font-weight: 800; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 4px 14px rgba(0, 118, 206, 0.2); 
        }

        #syncBtn:active { 
            transform: scale(0.96); 
            background: var(--clio-blue); 
            color: white; 
        }

        #syncBtn svg { 
            width: 32px; 
            height: 32px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2.5; 
        }

        /* TOGGLE STYLES */
        .switch { 
            position: relative; 
            display: inline-block; 
            width: 40px; 
            height: 22px; 
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background-color: #cbd5e1; 
            transition: .4s; 
            border-radius: 20px; 
        }

        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 16px; 
            width: 16px; 
            left: 3px; 
            bottom: 3px; 
            background-color: white; 
            transition: .4s; 
            border-radius: 50%; 
        }

        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <button id="skipBtn" onclick="endSplash()">Skip Intro ➔</button>
</div>

                <span class="chip" onclick="useTemplate('EVIDENCE LOG:\n- Type:')">Evidence</span>
            </div>
