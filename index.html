<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite | Auditor Pattern</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #008080;
            --silver: #cbd5e1;
            --slate: #1e293b;
            --risk: #ef4444;
            --teal-blue: #0ea5e9;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { font-family: 'Nunito Sans', sans-serif; background: #f8fafc; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* PULSE ENGINE */
        @keyframes pulse-mod { 0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(14, 165, 233, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); } }
        @keyframes pulse-crit { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 0 35px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* HEADER */
        header { background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--silver); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 0 0 35px 35px; }
        .brand { font-weight: 900; color: var(--teal); font-size: 18px; }

        /* INTAKE */
        .intake { padding: 20px 25px; background: white; margin-top: 70px; border-radius: 35px; margin: 80px 20px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; border-radius: 25px; border: 1.5px solid var(--silver); padding: 15px; font-family: inherit; font-size: 15px; outline: none; box-sizing: border-box; }
        .add-btn { width: 100%; background: var(--teal); color: white; border: none; padding: 15px; border-radius: 20px; font-weight: 900; margin-top: 10px; cursor: pointer; }

        /* TIMELINE */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 10px 20px 120px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; border-radius: 32px; padding: 25px; border: 1px solid var(--silver); border-left: 8px solid var(--teal); transition: 0.3s; position: relative; }
        .p-moderate { animation: pulse-mod 2s infinite; border-left-color: var(--teal-blue); }
        .p-critical { animation: pulse-crit 0.8s infinite; border-left-color: var(--risk); }
        
        /* AI AUDITOR BOX */
        .auditor-box { background: #f0fdfa; border-radius: 20px; padding: 15px; margin-top: 15px; font-size: 13px; display: none; }
        .case-btn { background: var(--slate); color: white; padding: 8px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; border: none; cursor: pointer; margin-top: 10px; }
        .case-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--teal); color: var(--slate); }

        #gear { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--slate); border-radius: 24px; border: none; z-index: 999; display: flex; align-items: center; justify-content: center; }
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loader">
        <div style="width:40px; height:40px; border:4px solid var(--silver); border-top-color:var(--teal); border-radius:50%; animation: spin 1s linear infinite;"></div>
        <p style="font-weight:900; margin-top:15px; color:var(--teal);">PATTERN RECOGNITION ACTIVE...</p>
    </div>

    <header><div class="brand">WorkTimeline Elite</div></header>

    <div class="intake">
        <textarea id="msg" placeholder="Describe incident pattern..."></textarea>
        <button class="add-btn" onclick="process()">ANALYZE & RECORD</button>
    </div>

    <div id="timeline"></div>

    <button id="gear" onclick="let k=prompt('Paste pT9 Key:'); if(k) localStorage.setItem('WT_K', k);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1-1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>

    <script>
        let db = JSON.parse(localStorage.getItem('WT_AUDIT')) || [];
        let key = localStorage.getItem('WT_K');

        async function process() {
            let val = document.getElementById('msg').value.trim();
            if(!val) return;
            document.getElementById('loader').style.display = 'flex';

            let analysis = { sev: 0, msg: "Logged to timeline.", caseName: "", caseStudy: "" };

            if(key) {
                try {
                    const r = await fetch('https://api.cohere.ai/v1/generate', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: 'command', 
                            prompt: `BC LEGAL AUDITOR: Analyze this incident for BCHRT, WorkSafeBC, and ESA violations. Identify pattern recognition for workplace harassment or safety failures. 
                            If a specific Canadian Case Study exists (e.g. Moore v. British Columbia), include it. 
                            RETURN JSON: {"sev":0,1,3, "msg":"Legal summary", "caseName":"Name of Case", "caseStudy":"Brief of Case Study"} 
                            Incident: ${val}`,
                            temperature: 0.1 
                        })
                    });
                    const d = await r.json();
                    analysis = JSON.parse(d.generations[0].text.replace(/```json|```/g, "").trim());
                } catch(e) { console.error(e); }
            }

            db.push({ id: Date.now(), txt: val, time: new Date().toLocaleString(), ...analysis });
            localStorage.setItem('WT_AUDIT', JSON.stringify(db));
            document.getElementById('msg').value = '';
            document.getElementById('loader').style.display = 'none';
            render();
        }

        function render() {
            let cont = document.getElementById('timeline'); cont.innerHTML = "";
            [...db].reverse().forEach(i => {
                let card = document.createElement('div');
                card.className = `card ${i.sev === 3 ? 'p-critical' : i.sev === 1 ? 'p-moderate' : ''}`;
                card.innerHTML = `
                    <small style="color:var(--silver); font-weight:900;">${i.time}</small>
                    <div style="font-weight:700; margin-top:10px; color:var(--slate);">${i.txt}</div>
                    <div class="auditor-box" id="audit-${i.id}" style="display:block;">
                        <strong>AUDIT:</strong> ${i.msg}
                        ${i.caseName ? `<br><button class="case-btn" onclick="document.getElementById('study-${i.id}').style.display='block'">READ CASE: ${i.caseName}</button>` : ''}
                        <div class="case-details" id="study-${i.id}">
                            <strong>CASE STUDY:</strong> ${i.caseStudy}
                        </div>
                    </div>
                `;
                cont.appendChild(card);
            });
        }
        render();
    </script>
    <style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
