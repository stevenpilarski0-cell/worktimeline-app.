<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Canada Launch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap');
        
        :root { 
            --teal: #008080; 
            --clio-blue: #0076CE; 
            --platinum: #d8e2ea; 
            --gray-dark: #2c3e50; 
            --round-inner: 24px;
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: #eef1f5; 
            margin: 0; 
            padding: 0; 
            height: 100dvh; 
            overflow: hidden; 
            color: var(--gray-dark); 
        }
        
        /* CINEMATIC INTRO */
        #splashScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; 
            background: #eef1f5; z-index: 100000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 40px; box-sizing: border-box; 
            transition: opacity 1.2s ease; 
        }

        .story-text { 
            font-size: 24px; font-weight: 900; color: var(--gray-dark); 
            line-height: 1.4; opacity: 0; transition: opacity 0.8s; 
            max-width: 420px; letter-spacing: -0.5px; 
        }

        #skipBtn { 
            position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); 
            padding: 14px 28px; border: 3px solid var(--teal); border-radius: 99px; 
            background: white; color: var(--teal); font-weight: 900; 
            font-size: 13px; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }

        .app-container { 
            width: 100%; max-width: 500px; margin: 0 auto; background: white; 
            height: 100dvh; display: flex; flex-direction: column; 
            overflow: hidden; position: relative; box-sizing: border-box; 
        }

        /* HEADER */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: calc(10px + env(safe-area-inset-top)) 25px 12px; 
            border-bottom: 2px solid var(--platinum); background: white; 
        }

        .briefcase-logo { 
            position: relative; width: 38px; height: 26px; 
            border: 3.5px solid var(--gray-dark); border-radius: 8px; 
        }

        .briefcase-handle { 
            position: absolute; top: -8.5px; left: 50%; transform: translateX(-50%); 
            width: 14px; height: 5px; border: 3.5px solid var(--gray-dark); 
            border-bottom: none; border-radius: 4px 4px 0 0; 
        }

        .teal-spine { 
            position: absolute; top: 50%; left: -8px; right: -8px; 
            height: 3.5px; background: var(--teal); border-radius: 2px; 
            transform: translateY(-50%); 
        }

        /* UTILITY DRAWER */
        #utilityDrawer { 
            width: 100%; background: white; border-bottom: 2px solid var(--platinum); 
            z-index: 500; transition: transform 0.3s ease; 
        }

        .drawer-content { padding: 15px 20px; }

        .firm-dropdown { 
            width: 100%; padding: 14px 20px; border-radius: var(--round-inner); 
            border: 2.5px solid var(--platinum); font-family: inherit; 
            font-size: 15px; font-weight: 800; background-color: #f8fafc; 
            margin-bottom: 12px; 
        }

        #statusBox { 
            width: 100%; height: 100px; padding: 15px; border-radius: var(--round-inner); 
            border: 2.5px solid var(--platinum); font-family: inherit; 
            font-size: 16px; background: #f8fafc; resize: none; margin-bottom: 12px; 
        }

        /* ACTIONS */
        .floating-actions { 
            position: absolute; right: 20px; top: 120px; 
            display: flex; flex-direction: column; gap: 15px; z-index: 800; 
        }

        .add-sq { 
            width: 65px; height: 65px; background: var(--teal); border: none; 
            border-radius: 20px; color: white; font-size: 40px; cursor: pointer; 
        }

        .sync-sq { 
            width: 65px; height: 65px; background: var(--clio-blue); border: none; 
            border-radius: 20px; color: white; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px 20px; background: #fdfdfd; position: relative; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 6px; background: var(--platinum); }
        .entry { 
            position: relative; margin-left: 55px; background: white; 
            border: 2px solid var(--platinum); padding: 20px; 
            border-radius: var(--round-inner); margin-bottom: 25px; 
            border-left: 6px solid var(--teal); 
        }

        /* MODAL */
        #summaryModal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; 
            background: rgba(0,0,0,0.6); z-index: 100000; display: none; 
            align-items: center; justify-content: center; backdrop-filter: blur(8px); 
        }

        .modal-card { background: white; border-radius: 30px; padding: 30px; width: 85%; text-align: center; }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text">Welcome.</h1>
    <button id="skipBtn" onclick="endSplash()">Skip Intro</button>
</div>

<div id="summaryModal">
    <div class="modal-card">
        <h2>Lock & Sync</h2>
        <p id="modalSummary" style="font-weight:700; color:#64748b; margin-bottom:20px;"></p>
        <button onclick="executeClioSync()" style="background:var(--clio-blue); color:white; border:none; padding:18px; width:100%; border-radius:20px; font-weight:900;">Confirm & Connect</button>
        <button onclick="closeModal()" style="background:transparent; border:none; margin-top:15px; color:#94a3b8; font-weight:800;">Cancel</button>
    </div>
</div>

<div class="app-container">
    <header class="header">
        <div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:2px;">
                <div class="briefcase-logo"><div class="briefcase-handle"></div><div class="teal-spine"></div></div>
                <div style="font-size:13px; font-weight:800; color:var(--teal); font-style:italic;">Take-in-Take</div>
            </div>
            <h1 style="color:var(--teal); margin:0; font-size:22px; font-weight:900;">WorkTimeline™</h1>
        </div>
    </header>

    <div class="floating-actions" id="floatingActions">
        <button class="add-sq" onclick="submitEntry()">+</button>
        <button class="sync-sq" onclick="openSyncSummary()">
            <span style="font-size:10px; font-weight:900;">CLIO</span>
        </button>
    </div>

    <div id="utilityDrawer">
        <div class="drawer-content">
            <select id="firmSelect" class="firm-dropdown">
                <option value="" disabled selected>Select Law Firm...</option>
                <option>Newton & Co. Law</option>
                <option>Pilarski Legal Group</option>
            </select>
            <textarea id="statusBox" placeholder="Start your intake entry..."></textarea>
        </div>
    </div>

    <div id="timelineContainer">
        <div class="timeline-spine"></div>
        <div id="displayList">
            <div class="entry">
                <p style="font-weight:700;">No entries yet. Start documenting your evidence above.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const story = ["The Invisible 60%...", "Trapped in a Grey Area...", "Moving toward the Blue Sky.", "Justice should feel effortless."];
    
    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        const next = () => {
            if(i < story.length) { 
                el.style.opacity = 0; 
                setTimeout(() => { 
                    el.innerText = story[i++]; 
                    el.style.opacity = 1; 
                    setTimeout(next, 2500); 
                }, 800); 
            } else { endSplash(); }
        };
        next();
    }
    window.onload = runStory;

    function endSplash() { 
        const ss = document.getElementById('splashScreen');
        if(ss) { ss.style.opacity = '0'; setTimeout(() => ss.remove(), 1000); }
    }

    // THE EVIDENCE LOCKER (Whereabouts + Dual Timestamps)
    const timelineVault = [];
    function submitEntry() {
        const box = document.getElementById('statusBox'); 
        if(!box.value.trim()) return;

        navigator.geolocation.getCurrentPosition(pos => {
            const entry = { 
                text: box.value, 
                recordedAt: new Date().toLocaleString(), 
                gps: `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}` 
            };
            timelineVault.push(entry);
            refreshTimeline();
            box.value = '';
        }, (err) => {
            alert("Please allow GPS to record your whereabouts for evidence.");
        });
    }

    function refreshTimeline() {
        const list = document.getElementById('displayList'); 
        list.innerHTML = '';
        [...timelineVault].reverse().forEach(item => {
            const div = document.createElement('div'); 
            div.className = 'entry';
            div.innerHTML = `<span style="font-size:10px; color:var(--teal); font-weight:900;">📍 ${item.gps} | 🕒 ${item.recordedAt}</span><p style="margin:5px 0 0; font-weight:700;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    // THE HANDSHAKE (Clio Manage CA Redirect)
    function openSyncSummary() { 
        const firm = document.getElementById('firmSelect').value;
        if(!firm) return alert("Select a firm to bridge your data.");
        document.getElementById('modalSummary').innerText = `Syncing your timeline to ${firm}`;
        document.getElementById('summaryModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('summaryModal').style.display = 'none'; }

    function executeClioSync() { 
        const clientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
        // CRITICAL: Ensure this matches the Redirect URI in your ca.app.clio.com portal EXACTLY
        const redirectUri = encodeURIComponent("https://worktimeline-app.vercel.app/index.html");
        const scopes = encodeURIComponent("leads_read leads_write contacts_write");
        
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=${clientId}&redirect_uri=${redirectUri}&scope=${scopes}`; 
    }
</script>
</body>
</html>
