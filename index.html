<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --round-main: 36px; --round-inner: 20px; --round-pill: 999px;
            --silver-handle: #cbd5e1;
        }
        body { font-family: 'Inter', sans-serif; background: #eef1f5; margin: 0; padding: 10px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* GHOST MODE BLUR */
        #privacyBlur { position: absolute; top: 75px; left: 0; right: 0; bottom: 0; z-index: 98; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: 0.4s ease; }
        body.privacy-active #privacyBlur { backdrop-filter: blur(45px) grayscale(1); -webkit-backdrop-filter: blur(45px) grayscale(1); background: rgba(238, 241, 245, 0.7); pointer-events: all; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 96vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.7); }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--platinum); z-index: 1000; background: white; flex-shrink: 0; }
        .top-icons { display: flex; align-items: center; gap: 12px; }
        
        /* UTILITY DRAWER (MINIMIZABLE) */
        #utilityDrawer { background: var(--gray-light); border-bottom: 1px solid var(--platinum); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; max-height: 300px; flex-shrink: 0; }
        #utilityDrawer.minimized { max-height: 0px; border-bottom: none; }

        .media-bar { display: flex; justify-content: space-around; padding: 15px 30px; }
        .m-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; position: relative; }
        .m-icon svg { width: 22px; height: 22px; fill: var(--teal); }
        .m-icon span { font-size: 8px; font-weight: 800; text-transform: uppercase; color: #64748b; }

        .input-area { padding: 0 20px 20px; display: flex; gap: 10px; align-items: center; }
        #statusBox { flex-grow: 1; height: 60px; padding: 12px; border-radius: 18px; border: 1px solid var(--platinum); font-family: inherit; font-size: 14px; outline: none; resize: none; background: white; }
        
        /* HANDLE BAR */
        .drawer-handle-zone { background: var(--gray-light); height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-bottom: 1px solid var(--platinum); flex-shrink: 0; }
        .handle-pill { width: 40px; height: 5px; background: var(--silver-handle); border-radius: 10px; }

        /* FLOATING ADD BUTTON WHEN MINIMIZED */
        #miniAdd { position: absolute; right: 20px; top: 100px; width: 48px; height: 48px; background: var(--teal); border: none; border-radius: 16px; color: white; font-size: 28px; font-weight: 300; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 15px rgba(0, 128, 128, 0.25); z-index: 1100; transition: all 0.3s; }
        .minimized + #miniAdd { display: flex; }

        /* ADD SIGN (EXPANDED) */
        .add-sq { width: 48px; height: 48px; background: var(--teal); border: none; border-radius: 16px; color: white; font-size: 28px; font-weight: 300; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 20px; background: white; }
        .entry { padding: 16px; border: 1px solid var(--platinum); border-radius: 22px; margin-bottom: 12px; border-left: 5px solid var(--teal); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }

        /* FOOTER CLIO */
        .footer-action { padding: 15px; border-top: 1px solid var(--platinum); display: flex; flex-direction: column; align-items: center; background: white; flex-shrink: 0; }
        .padlock-sq { width: 55px; height: 55px; background: var(--clio-blue); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
        .padlock-sq svg { width: 24px; height: 24px; fill: white; }

        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="privacyBlur"></div>
    
    <header class="header">
        <h1 id="folderLabel" style="color: var(--teal); margin:0; font-size: 17px; font-weight: 800;">WorkTimeline™</h1>
        <div class="top-icons">
            <div style="background:var(--gray-light); border-radius:10px; padding:6px;" onclick="window.location.href='sms:?body=Update:'"><svg width="18" height="18" fill="var(--teal)" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleV(this)"><span class="slider"></span></label></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" id="gSwitch" onchange="toggleG()"><span class="slider"></span></label></div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div class="media-bar">
            <div class="m-icon"><input type="file" accept="image/*" capture="camera" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="log('📷 Photo')"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>Camera</span></div>
            <div class="m-icon"><input type="file" accept="audio/*" capture="microphone" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="log('🎤 Audio')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg><span>Audio</span></div>
            <div class="m-icon"><input type="file" style="position:absolute;width:100%;height:100%;opacity:0;" onchange="log('📄 Doc')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>Docs</span></div>
        </div>
        <div class="input-area">
            <textarea id="statusBox" placeholder="Start your truth..."></textarea>
            <button class="add-sq" onclick="submitText()">+</button>
        </div>
    </div>

    <div class="drawer-handle-zone" onclick="toggleDrawer()">
        <div class="handle-pill"></div>
    </div>

    <button id="miniAdd" onclick="toggleDrawer()">+</button>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <div class="footer-action">
        <div class="clio-unit" onclick="syncToClio()" style="display:flex; flex-direction:column; align-items:center; cursor:pointer;">
            <div class="padlock-sq">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/></svg>
            </div>
            <span style="font-size:10px; font-weight:900; color:var(--clio-blue); letter-spacing:1px;">CLIO</span>
        </div>
    </div>
</div>

<script>
    let activeV = "CHRON"; const timelineV = []; const notesV = [];
    
    function toggleDrawer() {
        const drawer = document.getElementById('utilityDrawer');
        const miniAdd = document.getElementById('miniAdd');
        drawer.classList.toggle('minimized');
        miniAdd.style.display = drawer.classList.contains('minimized') ? 'flex' : 'none';
    }

    function toggleG() { document.body.classList.toggle('privacy-active', document.getElementById('gSwitch').checked); }
    function toggleV(cb) {
        activeV = cb.checked ? "NOTES" : "CHRON";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refresh();
    }

    function submitText() { const b = document.getElementById('statusBox'); if(b.value.trim()){ log(b.value); b.value = ''; } }
    
    function log(txt) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const gps = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            const time = new Date().toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            const stamp = (new Date().getMonth()+1) + '/' + new Date().getDate() + ' @ ' + time;
            const entry = { txt, stamp, gps };
            if(activeV === "CHRON") timelineV.push(entry); else notesV.push(entry);
            refresh();
        });
    }

    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = (activeV === "CHRON") ? timelineV : notesV;
        [...data].reverse().forEach(i => {
            list.innerHTML += `<div class="entry" style="border-left-color:${activeV === 'CHRON' ? 'var(--teal)' : 'var(--clio-blue)'}"><div style="font-size:9px; font-weight:800; color:#94a3b8; margin-bottom:4px;">${i.stamp} | 📍 ${i.gps}</div><p style="margin:0; font-size:14px; font-weight:500;">${i.txt}</p></div>`;
        });
    }
    
    function syncToClio() { alert("Sealed & Syncing to Clio."); window.location.href = "https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s&redirect_uri=https://worktimeline-app.vercel.app/index.html&scope=leads_write%20contacts_write"; }
</script>
</body>
</html>
