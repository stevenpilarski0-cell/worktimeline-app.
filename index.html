<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master Dual-Drawer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        /* GHOST BLUR LOGIC */
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer, .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.1; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 2px solid var(--teal); box-sizing: border-box; text-align: center; overflow: hidden; }
        
        /* MIRRORED INDUSTRIAL HEADER */
        .header { padding: 10px 15px; border-bottom: 2px solid var(--teal); background: white; z-index: 4000; position: relative; }
        .header-top { display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; }
        .brand-sub { font-size: 8px; font-weight: 900; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; }
        .main-title { font-weight: 900; color: var(--teal); font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* CLIO GREEN PULSE */
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* HEADER CONTROLS (GHOST/NOTES) */
        .header-controls { position: absolute; right: 0; display: flex; flex-direction: column; gap: 4px; }
        .control-btn { background: var(--teal); color: white; border: none; border-radius: 5px; font-size: 7px; font-weight: 900; padding: 3px 6px; cursor: pointer; }

        /* UPPER PULL-DOWN DRAWER (TOOLKIT) */
        #utilityDrawer { position: absolute; top: 58px; width: 100%; background: white; border-bottom: 3px solid var(--teal); z-index: 3500; transition: 0.4s transform ease; transform: translateY(calc(-100% + 40px)); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .upper-handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; bottom: 0; }
        .handle-pill { width: 40px; height: 5px; background: var(--teal); border-radius: 10px; opacity: 0.2; }

        /* DRAGGABLE ACTION SQUARES */
        .draggable { position: absolute; z-index: 5000; cursor: move; touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; color: white; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border: none; }
        #addBtn { width: 75px; height: 75px; background: var(--teal); font-size: 36px; top: 150px; right: 15px; }
        #syncBtn { width: 75px; height: 75px; background: var(--clio-blue); font-size: 8px; padding: 4px; top: 240px; right: 15px; }

        /* DRAWER CONTENT */
        .drawer-content { padding: 15px 15px 50px; }
        .tab-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; overflow-x: auto; }
        .template-chip { border: 2px solid var(--teal); padding: 6px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; color: var(--teal); background: white; cursor: pointer; }
        .media-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .media-btn { background: #f1f5f9; border: 1.5px solid #cbd5e1; padding: 8px; border-radius: 8px; font-size: 9px; flex: 1; font-weight: 900; color: #475569; }

        /* TIMELINE CONTAINER */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 50px 15px 150px; }
        .entry { background: white; border: 2px solid var(--teal); border-left-width: 8px; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: left; }
        .tier-serious { animation: pulse-ser 2s infinite; border-left-color: var(--teal-dark); background: var(--blue-trans); }
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }

        /* LOWER PULL-UP DRAWER (MANAGEMENT) */
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 3px solid var(--teal); z-index: 4500; transition: 0.4s transform ease; transform: translateY(calc(100% - 40px)); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .lower-handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* MODAL SYSTEM */
        #disclaimerOverlay, #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.98); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: white; padding: 25px; border-radius: 24px; border-bottom: 5px solid var(--teal); width: 100%; max-width: 350px; }
        .modal-btn { border: none; padding: 14px; border-radius: 40px; width: 100%; font-weight: 900; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body id="appBody">

<div id="disclaimerOverlay"><div class="modal-card"><h2>INTAKE GUARD</h2><p style="font-weight:700;">Work Journal: Documenting the truth. Not legal advice.</p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="this.parentElement.parentElement.remove()">I UNDERSTAND</button></div></div>

<div id="warningOverlay" style="display:none;"><div class="modal-card"><h2>EA ANALYSIS</h2><p id="warningMsg" style="font-weight:700;"></p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="applyStack(true)">STACK ON TOP</button><button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="applyStack(false)">STACK UNDER</button></div></div>

<div class="app-container">
    <header class="header">
        <div class="header-top">
            <svg width="34" height="26" viewBox="0 0 40 30" fill="none"><path d="M3 12C3 10.3431 4.34315 9 6 9H13.5C13.5 7 15.5 3 20 3C24.5 3 26.5 7 26.5 9H34C35.6569 9 37 10.3431 37 12V25C37 26.6569 35.6569 28 34 28H6C4.34315 28 3 26.6569 3 25V12Z" stroke="#008080" stroke-width="3" stroke-linejoin="round"/><line x1="0" y1="18.5" x2="40" y2="18.5" stroke="#008080" stroke-width="3"/><circle cx="9" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="20" cy="18.5" r="3" fill="#008080" stroke="white"/><circle cx="31" cy="18.5" r="3" fill="#008080" stroke="white"/></svg>
            <div class="brand-text">
                <div class="brand-sub">Takin'Intake</div>
                <div class="main-title">WorkTimeline™ <div class="clio-pulse"></div></div>
            </div>
            <div class="header-controls">
                <button class="control-btn" onclick="document.getElementById('appBody').classList.toggle('ghost-active')">GHOST</button>
                <button class="control-btn" id="vaultBtn" onclick="toggleVault()">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div class="drawer-content">
            <div class="tab-row">
                <div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div>
                <div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div>
                <div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div>
                <div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div>
            </div>
            <div class="media-row">
                <label class="media-btn">CAMERA <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="alert('Evidence Photographed')"></label>
                <label class="media-btn">AUDIO <input type="file" accept="audio/*" capture="microphone" style="display:none;" onchange="alert('Evidence Recorded')"></label>
                <label class="media-btn">DOCUMENT <input type="file" style="display:none;" onchange="alert('File Secured')"></label>
            </div>
            <textarea id="statusBox" style="width:100%; height:75px; border:2.5px solid var(--teal); border-radius:12px; padding:10px; font-weight:700; outline:none; font-size:14px;" placeholder="Journal the truth..."></textarea>
        </div>
        <div class="upper-handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <button id="addBtn" class="draggable">+</button>
    <button id="syncBtn" class="draggable">LOCK & SYNC TO CLIO</button>

    <div id="mgmtDrawer">
        <div class="lower-handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 20px 30px;">
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="alert('Exporting Industrial Evidence Report...')">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="confirm('Wipe record and start fresh?') && (localStorage.clear() || location.reload())">DELETE & START FRESH</button>
        </div>
    </div>
</div>

<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    let activeVault = "TIMELINE"; let pending = null;
    let utilOpen = false; let mgmtOpen = false;

    // EXPANDABLE DRAWER MECHANICS
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 40px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 40px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }
    
    // DRAGGABLE ENGINE
    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.onmousedown = dStart; el.ontouchstart = dStart;
        function dStart(e) {
            e = e || window.event;
            p3 = e.clientX || e.touches[0].clientX; p4 = e.clientY || e.touches[0].clientY;
            document.onmouseup = dEnd; document.ontouchend = dEnd;
            document.onmousemove = dMove; document.ontouchmove = dMove;
        }
        function dMove(e) {
            e = e || window.event;
            let cx = e.clientX || e.touches[0].clientX; let cy = e.clientY || e.touches[0].clientY;
            p1 = p3 - cx; p2 = p4 - cy; p3 = cx; p4 = cy;
            el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
        }
        function dEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
    }
    makeDraggable(document.getElementById("addBtn"));
    makeDraggable(document.getElementById("syncBtn"));

    // APPLICATION LOGIC
    function toggleVault() { activeVault = activeVault === "TIMELINE" ? "NOTES" : "TIMELINE"; document.getElementById('vaultBtn').innerText = activeVault === "TIMELINE" ? "NOTES" : "TIMELINE"; refresh(); }
    function useTemplate(t) { 
        const ts = { 'INCIDENT': 'ACTION:\nVIOLATION:', 'INJURY': 'OFA RECORD:\nINJURY:', 'LOCATION': 'SITE:\nHAZARDS:', 'WITNESS': 'NAME:\nCONTACT:' };
        document.getElementById('statusBox').value = ts[t];
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const low = text.toLowerCase();
        let analysis = (low.includes("fire") || low.includes("toxic") || low.includes("threat") || low.includes("quit") || low.includes("harass")) ? "EA PATTERN: Serious evidentiary marker detected." : "";
        pending = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: analysis ? 'serious' : 'minor', agree: false };
        if(analysis && activeVault === "TIMELINE") { document.getElementById('warningMsg').innerText = analysis; document.getElementById('warningOverlay').style.display = 'flex'; }
        else saveFinal();
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
    }

    function applyStack(agree) { pending.agree = agree; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    function saveFinal() { 
        if(activeVault === "TIMELINE") timelineVault.push(pending); else notesVault.push(pending);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault)); localStorage.setItem('wt_notes', JSON.stringify(notesVault));
        refresh(); 
    }

    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const card = `<div class="entry tier-${item.tier}"><b>📍 LANGLEY, BC | ${item.stamp}</b><p style="margin-top:10px; font-weight:800; line-height:1.4;">${item.grit}</p></div>`;
            const ea = item.analysis ? `<div class="entry" style="margin-bottom:-15px; border-left-color:#7f8c8d; font-size:12px;"><b>EA ANALYSIS:</b> ${item.analysis}</div>` : "";
            list.innerHTML += item.agree ? ea + card : card + ea;
        });
    }

    // Touch Tap Logic for Draggable Plus
    let sX, sY;
    document.getElementById("addBtn").addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    document.getElementById("addBtn").addEventListener('touchend', e => {
        let dX = Math.abs(e.changedTouches[0].clientX - sX); let dY = Math.abs(e.changedTouches[0].clientY - sY);
        if(dX < 10 && dY < 10) submitEntry();
    });

    refresh();
</script>
</body>
</html>
