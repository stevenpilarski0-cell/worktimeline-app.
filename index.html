<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #008080;
            --slate: #1e293b;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
            --border: #e2e8f0;
            --risk: #ef4444;
            --accent: #0ea5e9;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: var(--bg);
            margin: 0; padding: 0; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            color: var(--slate);
        }

        /* --- HEADER & TOP DRAWER --- */
        #topDrawer {
            position: fixed; top: 0; left: 0; width: 100%;
            background: var(--glass); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border);
            border-radius: 0 0 32px 32px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            transform: translateY(calc(-100% + 60px));
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        #topDrawer.open { transform: translateY(0); }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; height: 60px;
        }
        .brand { font-weight: 900; font-size: 18px; color: var(--teal); }

        .intake-content { padding: 24px 24px 80px; }
        #statusBox {
            width: 100%; height: 110px; padding: 20px;
            border-radius: 24px; border: 1px solid var(--border);
            background: #fff; font-size: 16px; font-family: inherit;
            resize: none; outline: none; box-sizing: border-box;
        }

        .btn-main {
            width: 100%; background: var(--teal); color: white;
            border: none; border-radius: 20px; font-weight: 800;
            font-size: 15px; cursor: pointer; height: 54px; margin-top: 15px;
        }

        /* --- TIMELINE --- */
        #timeline {
            flex-grow: 1; overflow-y: auto;
            padding: 80px 20px 120px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* --- FLIP CARDS --- */
        .entry-card { perspective: 1200px; width: 100%; min-height: 120px; }
        .card-inner {
            position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        
        .face {
            backface-visibility: hidden; border-radius: 28px;
            padding: 24px; background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .front { border-left: 6px solid var(--teal); }
        .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: rotateY(180deg); background: var(--slate); color: #fff;
            border-left: 6px solid var(--accent); box-sizing: border-box;
        }

        .stamp { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; }
        .diag-btn { font-size: 10px; font-weight: 900; color: var(--teal); margin-top: 15px; display: flex; align-items: center; gap: 6px; }

        /* --- SETTINGS DRAWER --- */
        #settingsDrawer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #fff; border-top: 1px solid var(--border);
            border-radius: 32px 32px 0 0; padding: 30px 24px;
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); box-sizing: border-box;
        }
        #settingsDrawer.open { transform: translateY(0); }
        .input-key { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 12px; box-sizing: border-box; }

        #gearBtn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; background: var(--slate);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            border: none; z-index: 999; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .handle { height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pill { width: 40px; height: 4px; background: #cbd5e0; border-radius: 10px; }

        #loader {
            position: fixed; inset: 0; background: var(--glass); backdrop-filter: blur(10px);
            z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #e2e8f0; border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="topDrawer">
        <div class="header"><div class="brand">WorkTimeline</div></div>
        <div class="intake-content">
            <textarea id="statusBox" placeholder="Describe the incident..."></textarea>
            <button class="btn-main" onclick="process()">Analyze Incident</button>
        </div>
        <div class="handle" onclick="document.getElementById('topDrawer').classList.toggle('open')"><div class="pill"></div></div>
    </div>

    <div id="timeline"></div>

    <button id="gearBtn" onclick="toggleSettings()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>

    <div id="settingsDrawer">
        <div style="font-weight: 900; margin-bottom: 20px;">SYSTEM SETTINGS</div>
        <input type="password" id="apiKeyIn" class="input-key" placeholder="Paste pT9 API Key">
        <button class="btn-main" onclick="saveKey()">SAVE KEY</button>
        <button class="btn-main" style="background:#eee; color:#333;" onclick="toggleSettings()">CLOSE</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('WT_GLASS_FINAL')) || [];
        let key = localStorage.getItem('WT_K');

        function toggleSettings() { document.getElementById('settingsDrawer').classList.toggle('open'); }
        function saveKey() { key = document.getElementById('apiKeyIn').value.trim(); localStorage.setItem('WT_K', key); alert("AI Armed."); toggleSettings(); }

        async function process() {
            let val = document.getElementById('statusBox').value.trim();
            if(!val) return;
            document.getElementById('loader').style.display = 'flex';
            let analysis = { term: "Entry Recorded", msg: "Standard logging for BC timeline consistency.", case: "ESA/WCB Compliance" };

            if(key) {
                try {
                    const r = await fetch('https://api.cohere.ai/v1/generate', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: 'command', 
                            prompt: `BC LAW EXPERT: Identify the LEGAL TERM for this incident and educate the client on why it applies. Ref BC case law. Return JSON ONLY: {"term":"...", "msg":"...", "case":"..."}. Incident: ${val}`,
                            temperature: 0.2 
                        })
                    });
                    const d = await r.json();
                    analysis = JSON.parse(d.generations[0].text.replace(/```json|```/g, "").trim());
                } catch(e) { console.error(e); }
            }

            db.push({ id: Date.now(), txt: val, time: new Date().toLocaleString(), ...analysis });
            localStorage.setItem('WT_GLASS_FINAL', JSON.stringify(db));
            document.getElementById('statusBox').value = '';
            document.getElementById('loader').style.display = 'none';
            render();
        }

        function render() {
            let cont = document.getElementById('timeline');
            cont.innerHTML = "";
            [...db].reverse().forEach(item => {
                let card = document.createElement('div');
                card.className = 'entry-card';
                card.innerHTML = `
                    <div class="card-inner" onclick="this.classList.toggle('flipped')">
                        <div class="face front">
                            <div class="stamp">${item.time}</div>
                            <div style="font-weight:700; line-height:1.5;">${item.txt}</div>
                            <div class="diag-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg> VIEW DIAGNOSTIC</div>
                        </div>
                        <div class="face back">
                            <div style="font-size:10px; font-weight:900; color:var(--accent); text-transform:uppercase; margin-bottom:8px;">${item.term}</div>
                            <div style="font-size:13px; line-height:1.4; font-weight:600;">${item.msg}</div>
                            <div style="font-size:11px; margin-top:10px; font-style:italic; color:#94a3b8;">Ref: ${item.case}</div>
                        </div>
                    </div>`;
                cont.appendChild(card);
            });
        }
        render();
    </script>
</body>
</html>
