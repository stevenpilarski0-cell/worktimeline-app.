<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline | AI Legal Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root {
            --teal: #008080; --silver-gray: #95a5a6; --gray-bg: #e2e8f0; --clio-green: #2ecc71;
            --clio-blue: #0070CE; --gray-border: #cbd5e0; --mac-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --risk-red: #e53e3e; --gold: #f59e0b;
        }

        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        
        .app-locked { filter: blur(35px); pointer-events: none; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer, .ghost-active #mgmtDrawer { filter: blur(25px); opacity: 0.15; pointer-events: none; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1.5px solid var(--gray-border); box-sizing: border-box; overflow: hidden; }

        /* HEADER */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; position: relative; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 17px; display: flex; align-items: center; letter-spacing: -0.5px; }
        .work-silver { color: var(--silver-gray); } .timeline-teal { color: var(--teal); }
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; margin-left: 8px; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* DRAWERS */
        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1.5px solid var(--gray-border); z-index: 3500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 40px)); border-radius: 0 0 30px 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: white; border-top: 1.5px solid var(--gray-border); z-index: 4500; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(100% - 40px)); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 35px; height: 4px; background: #cbd5e0; border-radius: 10px; }

        /* TIMELINE - STACK SYSTEM */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 150px; display: flex; flex-direction: column; gap: 25px; scrollbar-width: none; }
        .stack-wrapper { position: relative; width: 100%; perspective: 1000px; }
        .stamp-label { font-size: 9px; font-weight: 900; color: var(--silver-gray); margin-bottom: 6px; letter-spacing: 0.5px; }
        .stack-inner { position: relative; width: 85%; min-height: 80px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }
        .bubble { padding: 15px; border-radius: 22px; font-family: 'Nunito Sans', sans-serif; backface-visibility: hidden; box-shadow: var(--mac-shadow); width: 100%; box-sizing: border-box; }
        .bubble-front { background: #f1f1f1; border: 1px solid #e5e5e5; color: #1a202c; position: relative; z-index: 2; }
        .bubble-back { background: var(--teal); color: white; transform: rotateY(180deg); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: 1px solid rgba(255,255,255,0.2); overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        
        .stack-inner.has-ai-pulse-on::after { content: ''; position: absolute; top: 6px; left: 8px; width: 100%; height: 100%; background: #4a5568; border-radius: 22px; z-index: 0; opacity: 0.7; animation: dark-heavy-pulse 3s infinite ease-in-out; }
        @keyframes dark-heavy-pulse { 0% { box-shadow: 0 0 0 0 rgba(74, 85, 104, 0.7); background: #4a5568; } 50% { background: var(--teal); box-shadow: 0 0 0 15px rgba(0, 128, 128, 0.4); opacity: 0.9; } 70% { box-shadow: 0 0 0 30px rgba(0, 128, 128, 0); background: var(--teal); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); background: #4a5568; } }

        /* DRAGGABLES */
        .draggable { position: absolute; z-index: 5000; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 22px; border: none; box-shadow: var(--mac-shadow); touch-action: none; cursor: pointer; }
        #addBtn { width: 70px; height: 70px; background: var(--teal); font-size: 30px; top: 160px; right: 20px; }
        #syncBtn { width: 70px; height: 70px; background: var(--clio-blue); font-size: 8px; padding: 6px; top: 250px; right: 20px; text-align: center; }

        /* OVERLAYS & AI THINKING */
        .overlay-system { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 28px; box-shadow: var(--mac-shadow); width: 100%; max-width: 340px; text-align: left; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 10px; cursor: pointer; font-size: 13px; text-align: center; }
        textarea { width: 100%; height: 95px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-family: 'Nunito Sans', sans-serif; font-weight: 600; font-size: 15px; outline: none; background: #fafafa; box-sizing: border-box; resize: none; margin-bottom: 10px; }
        
        .ai-thinking { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--gray-bg); border-top: 4px solid var(--teal); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .ai-tag { display: inline-block; background: #fffbeb; color: var(--gold); border: 1px solid var(--gold); padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase;}
    </style>
</head>
<body id="appBody">

<div id="overlaySystem" class="overlay-system">
    <div class="modal-card" style="text-align: center;">
        <h2 style="color: #1a202c; font-weight: 900; margin: 0; font-size: 18px;">INTAKE GUARD</h2>
        <div style="font-size: 13px; line-height: 1.5; color: #4a5568; margin: 15px 0; font-weight: 600;">Secure your records. We provide support, but no legal advice.</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" id="initialUnlock">SECURE MY JOURNAL</button>
    </div>
</div>

<div id="aiThinkingOverlay" class="overlay-system" style="display:none; z-index:100001; background: rgba(255,255,255,0.9);">
    <div class="ai-thinking">
        <div class="spinner"></div>
        <div style="font-weight: 900; color: var(--teal); font-size: 14px; letter-spacing: 1px;">AI REVIEWING BC CASE LAW...</div>
    </div>
</div>

<div id="aiOpinionOverlay" class="overlay-system" style="display:none; z-index:100002;">
    <div class="modal-card">
        <h2 style="color: var(--teal); font-weight: 900; margin: 0 0 5px; font-size: 18px;">AI Legal Review</h2>
        <div id="aiTagDisplay" class="ai-tag"></div>
        <div id="aiMessage" style="font-size: 14px; line-height: 1.5; color: #4a5568; margin-bottom: 20px; font-weight: 600;"></div>
        
        <div style="font-size: 11px; font-weight: 800; color: #a0aec0; margin-bottom: 8px; text-align: center;">DO YOU AGREE WITH THIS ASSESSMENT?</div>
        <button class="modal-btn" style="background:var(--teal); color:white;" onclick="confirmAI(true)">YES, ATTACH OPINION & LOG</button>
        <button class="modal-btn" style="background:var(--gray-bg); color:#4a5568;" onclick="confirmAI(false)">NO, JUST LOG THE TEXT</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <header class="header">
        <div class="header-top">
            <div class="main-title"><span class="work-silver">Work</span><span class="timeline-teal">Timeline</span> <div class="clio-pulse"></div></div>
            <button onclick="document.getElementById('mainApp').classList.toggle('ghost-active')" style="background:#f1f5f9; border:none; border-radius:20px; font-size:7px; padding:6px 12px; color:var(--teal); font-weight:900; cursor:pointer;">GHOST</button>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 15px 20px 40px;">
            <div style="font-size: 10px; font-weight: 900; color: var(--silver-gray); margin-bottom: 8px;">RECORD EVIDENCE:</div>
            <textarea id="statusBox" placeholder="Describe the incident..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>

    <button id="addBtn" class="draggable" onclick="runAIEngine()">+</button>
    <button id="syncBtn" class="draggable" onclick="alert('Syncing context to Clio...')">SYNC TO CLIO</button>

    <div id="mgmtDrawer">
        <div class="handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding:15px 25px 35px;">
            <button class="modal-btn" style="background:var(--teal); color:white; text-align:center;" onclick="alert('Exporting Artifact...')">EXPORT LEGAL ARTIFACT</button>
        </div>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_bc_engine')) || [];
    let pendingEntry = null;
    let utilOpen = false; let mgmtOpen = false;

    window.onload = () => { refreshDisplay(); };

    document.getElementById('initialUnlock').onclick = function() {
        document.getElementById('overlaySystem').style.display = 'none';
        document.getElementById('mainApp').classList.remove('app-locked');
    };

    function toggleUtility() { utilOpen = !utilOpen; document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(0)' : 'translateY(calc(-100% + 40px))'; }
    function toggleMgmt() { mgmtOpen = !mgmtOpen; document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(0)' : 'translateY(calc(100% - 40px))'; }

    // --- THE BC LEGAL HEURISTIC ENGINE (SIMULATED AI) ---
    function analyzeBCAvenue(text) {
        const lowerText = text.toLowerCase();
        
        // Scenario 1: Unsafe Work Refusal
        if (lowerText.includes("unsafe") || lowerText.includes("refused") || lowerText.includes("dangerous") || lowerText.includes("hazard")) {
            return {
                flagged: true,
                tag: "WorkSafeBC OHS Reg 3.12",
                opinion: "Based on BC law, workers have the right to refuse unsafe work. If you were disciplined for this, it may constitute a discriminatory action under the Workers Compensation Act. Would you like to tag this as an OHS Refusal incident?"
            };
        }
        // Scenario 2: Constructive Dismissal
        if (lowerText.includes("hours cut") || lowerText.includes("reduced pay") || lowerText.includes("demoted") || lowerText.includes("toxic")) {
            return {
                flagged: true,
                tag: "Constructive Dismissal (BC ESA)",
                opinion: "A significant reduction in hours, pay, or a fundamental change in your duties can be legally considered 'Constructive Dismissal' under BC Common Law and the Employment Standards Act. Would you like to tag this entry as a Constructive Dismissal indicator?"
            };
        }
        // Scenario 3: Wrongful Dismissal / Termination
        if (lowerText.includes("fired") || lowerText.includes("let go") || lowerText.includes("terminated")) {
            return {
                flagged: true,
                tag: "Wrongful Dismissal Risk",
                opinion: "Termination without cause in BC requires proper notice or severance pay under the ESA. If 'cause' was alleged, the burden of proof is on the employer. Should we flag this as a critical termination event?"
            };
        }
        
        return { flagged: false };
    }

    function runAIEngine() {
        const b = document.getElementById('statusBox'); 
        const text = b.value.trim();
        if(!text) return;

        // 1. Lock the app and show the "AI Thinking" spinner
        document.getElementById('mainApp').classList.add('app-locked');
        document.getElementById('aiThinkingOverlay').style.display = 'flex';

        // 2. Simulate network delay (AI processing)
        setTimeout(() => {
            navigator.geolocation.getCurrentPosition(pos => {
                const analysis = analyzeBCAvenue(text);
                
                pendingEntry = {
                    id: Date.now(),
                    content: text,
                    stamp: new Date().toLocaleString(),
                    gps: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`,
                    pulse: analysis.flagged,
                    aiTag: analysis.flagged ? analysis.tag : null,
                    aiOpinion: analysis.flagged ? analysis.opinion : null
                };

                document.getElementById('aiThinkingOverlay').style.display = 'none';

                if (analysis.flagged) {
                    // 3. Present the AI Opinion to the User
                    document.getElementById('aiTagDisplay').innerText = analysis.tag;
                    document.getElementById('aiMessage').innerText = analysis.opinion;
                    document.getElementById('aiOpinionOverlay').style.display = 'flex';
                } else {
                    // No flags, just save
                    confirmAI(false);
                }
            });
        }, 1500); // 1.5 seconds of "Thinking"
    }

    function confirmAI(userAgrees) {
        if (pendingEntry) {
            // If user disagrees, strip the AI data off before saving
            if (!userAgrees) {
                pendingEntry.pulse = false;
                pendingEntry.aiTag = null;
                pendingEntry.aiOpinion = null;
            }
            vault.push(pendingEntry);
            localStorage.setItem('wt_bc_engine', JSON.stringify(vault));
        }
        
        document.getElementById('statusBox').value = '';
        document.getElementById('aiOpinionOverlay').style.display = 'none';
        document.getElementById('mainApp').classList.remove('app-locked');
        pendingEntry = null;
        refreshDisplay();
        if(utilOpen) toggleUtility();
    }

    function refreshDisplay() {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = '';
        [...vault].reverse().forEach(item => {
            const wrapper = document.createElement('div'); wrapper.className = 'stack-wrapper';
            const pulseClass = item.pulse ? 'has-ai-pulse-on' : '';
            
            // Build the back of the card (Showing AI data if attached)
            let backContent = `<div style="font-size:11px; font-weight:800; color:#e2e8f0; margin-bottom:10px;">YOUR ENTRY:</div><div style="font-size:14px; margin-bottom:15px;">${item.content}</div>`;
            
            if (item.aiTag) {
                backContent += `<hr style="border-color:rgba(255,255,255,0.2); margin:10px 0;">
                                <div style="font-size:10px; font-weight:900; color:var(--gold);">AI DIAGNOSTIC TAG:</div>
                                <div style="font-size:12px; font-weight:700;">${item.aiTag}</div>`;
            }

            wrapper.innerHTML = `
                <div class="stamp-label">📍 ${item.gps} | ${item.stamp}</div>
                <div class="stack-inner ${pulseClass}" onclick="this.classList.toggle('flipped')">
                    <div class="bubble bubble-front">
                        <div style="font-weight:700; color:#2d3748; font-size:14px;">${item.content.substring(0, 45)}...</div>
                        <div style="font-size:9px; color:#a0aec0; margin-top:8px; font-weight:800;">TAP TO VIEW FULL ARTIFACT & AI DATA</div>
                    </div>
                    <div class="bubble bubble-back">${backContent}</div>
                </div>
            `;
            container.appendChild(wrapper);
        });
    }

    // Draggable Buttons
    function makeMovable(el) {
        let p1=0, p2=0, p3=0, p4=0;
        el.ontouchstart = (e) => { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
            document.ontouchmove = (e) => { p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY; p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; el.style.right = "auto";
            };
            document.ontouchend = () => { document.ontouchmove = null; };
        };
    }
    makeMovable(document.getElementById('addBtn')); makeMovable(document.getElementById('syncBtn'));
</script>
</body>
</html>
