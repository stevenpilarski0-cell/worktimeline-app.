<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline Elite v12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:wght@400;700&display=swap');
        
        :root { 
            --teal: #008080; --slate: #475569; --gray-bg: #f1f5f9; --mac-border: #cbd5e0;
            --notes-gold: #f59e0b; --white: #ffffff; --mac-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* RESET & BASE */
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-locked { filter: blur(30px); pointer-events: none; }
        .notes-mode { background: #fffbeb !important; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--white); border-bottom: 2px solid var(--mac-border); z-index: 1000; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-text { font-weight: 900; color: var(--teal); font-size: 19px; letter-spacing: -0.5px; }
        
        .toggle-group { display: flex; gap: 12px; }
        .switch-box { text-align: center; }
        .switch { position: relative; width: 34px; height: 18px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e0; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider.gold { background-color: var(--notes-gold); }
        input:checked + .slider:before { transform: translateX(16px); }
        .label { font-size: 8px; font-weight: 900; color: var(--slate); margin-top: 2px; text-transform: uppercase; }

        /* INTAKE SECTION */
        .intake { background: var(--white); padding: 15px; border-bottom: 2px solid var(--mac-border); }
        .templates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .templates::-webkit-scrollbar { display: none; }
        .chip { background: #f8fafc; border: 1.5px solid var(--mac-border); padding: 7px 14px; border-radius: 100px; font-size: 11px; font-weight: 800; color: var(--slate); white-space: nowrap; }
        
        #statusBox { width: 100%; height: 85px; padding: 15px; border-radius: 18px; border: 2px solid var(--mac-border); outline: none; font-family: 'Nunito Sans', sans-serif; font-size: 15px; background: #fafafa; box-sizing: border-box; }

        /* MAC CONTROLS (NO EMOJIS - SVG ONLY) */
        .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
        .media-dock { display: flex; gap: 10px; background: #e2e8f0; padding: 6px; border-radius: 18px; flex-grow: 1; margin-right: 15px; justify-content: space-around; }
        .icon-btn { background: var(--white); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--slate); box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        
        #addBtn { width: 60px; height: 60px; border-radius: 15px; background: var(--teal); color: white; font-size: 32px; font-weight: 900; border: none; box-shadow: 0 5px 15px rgba(0,128,128,0.3); }

        /* TIMELINE */
        #timeline { flex-grow: 1; overflow-y: auto; padding: 15px 15px 100px; display: flex; flex-direction: column; gap: 18px; }
        .entry-card { perspective: 1000px; width: 100%; }
        .stamp { font-size: 10px; font-weight: 800; color: var(--slate); opacity: 0.6; margin-bottom: 5px; padding-left: 5px; }
        .card-inner { position: relative; width: 92%; min-height: 70px; transition: transform 0.5s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .face { padding: 15px; border-radius: 20px; backface-visibility: hidden; box-shadow: var(--mac-shadow); border: 2px solid var(--mac-border); }
        .front { background: var(--white); border-left: 8px solid var(--teal); }
        .back { background: var(--teal); color: var(--white); position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotateY(180deg); overflow-y: auto; }

        /* MANAGEMENT DRAWER */
        #drawer { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); 
            border-top: 4px solid var(--teal); border-radius: 30px 30px 0 0; 
            transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); 
            z-index: 5000; transform: translateY(calc(100% - 70px));
            padding-bottom: env(safe-area-inset-bottom);
        }
        #drawer.open { transform: translateY(0); }
        .handle { height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .pill { width: 50px; height: 5px; background: var(--teal); border-radius: 10px; margin-bottom: 6px; }
        .handle-txt { font-size: 11px; font-weight: 900; color: var(--teal); letter-spacing: 1.5px; }
        .drawer-content { padding: 0 20px 30px; text-align: center; }
        .btn { border: none; padding: 18px; border-radius: 15px; font-weight: 900; width: 100%; margin-bottom: 12px; color: white; }

        /* AI OVERLAYS */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal { background: var(--white); padding: 25px; border-radius: 25px; box-shadow: var(--mac-shadow); width: 100%; max-width: 350px; border: 1.5px solid var(--mac-border); }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body id="app">

<div id="aiLoad" class="overlay" style="flex-direction: column;">
    <div class="spinner"></div>
    <div style="font-weight:900; color:var(--teal)">ANALYZING BC CASE LAW...</div>
</div>

<div id="aiOpinion" class="overlay">
    <div class="modal">
        <div style="font-size:10px; font-weight:900; color:var(--notes-gold); margin-bottom:5px;">LEGAL DIAGNOSTIC</div>
        <div id="aiTitle" style="font-weight:900; font-size:18px; margin-bottom:10px; color:var(--teal);"></div>
        <div id="aiBody" style="font-size:14px; line-height:1.4; color:var(--slate); margin-bottom:20px;"></div>
        <button class="btn" style="background:var(--teal)" onclick="saveAI(true)">AGREE & LOG</button>
        <button class="btn" style="background:var(--slate)" onclick="saveAI(false)">LOG RAW TEXT ONLY</button>
    </div>
</div>

<header class="header">
    <div class="brand">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.5"><path d="M16 3H8L2 12L8 21H16L22 12L16 3Z"/></svg>
        <div class="brand-text">WorkTimeline Elite</div>
    </div>
    <div class="toggle-group">
        <div class="switch-box">
            <label class="switch"><input type="checkbox" onchange="document.getElementById('app').classList.toggle('app-locked')"><span class="slider"></span></label>
            <div class="label">GHOST</div>
        </div>
        <div class="switch-box">
            <label class="switch"><input type="checkbox" id="noteToggle" onchange="toggleNotes()"><span class="slider gold"></span></label>
            <div class="label">NOTES</div>
        </div>
    </div>
</header>

<div class="intake">
    <div class="templates">
        <div class="chip" onclick="tag('WCB')">WorkSafeBC</div>
        <div class="chip" onclick="tag('AID')">First Aid</div>
        <div class="chip" onclick="tag('INJ')">Injury</div>
        <div class="chip" onclick="tag('SET')">Setting</div>
    </div>
    <textarea id="statusBox" placeholder="Describe the incident..."></textarea>
    <div class="controls">
        <div class="media-dock">
            <div class="icon-btn"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
            <div class="icon-btn"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></div>
            <div class="icon-btn"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg></div>
        </div>
        <button id="addBtn" onclick="process()">+</button>
    </div>
</div>

<div id="timeline"></div>

<div id="drawer">
    <div class="handle" onclick="document.getElementById('drawer').classList.toggle('open')">
        <div class="pill"></div>
        <div class="handle-txt">MANAGEMENT</div>
    </div>
    <div class="drawer-content">
        <button class="btn" style="background:var(--teal)" onclick="alert('Exported!')">EXPORT LEGAL ARTIFACT</button>
        <button class="btn" style="background:var(--slate)" onclick="reset()">START FRESH</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('WT_ELITE_VAULT')) || [];
    let noteDb = JSON.parse(localStorage.getItem('WT_NOTE_VAULT')) || [];
    let current = null;
    let mode = "TIMELINE";

    window.onload = () => render();

    function tag(t) { document.getElementById('statusBox').value += `[${t}] `; }
    
    function toggleNotes() {
        mode = document.getElementById('noteToggle').checked ? "NOTES" : "TIMELINE";
        document.body.classList.toggle('notes-mode');
        document.getElementById('addBtn').style.background = mode === "NOTES" ? "var(--notes-gold)" : "var(--teal)";
        render();
    }

    function analyze(text) {
        let t = text.toLowerCase();
        if(t.includes("unsafe") || t.includes("refused")) return { title: "WorkSafeBC 3.12", msg: "Right to refuse unsafe work detected. Legal avenue: Workers Compensation Act." };
        if(t.includes("hours cut") || t.includes("fired")) return { title: "Dismissal Risk", msg: "Constructive or Wrongful Dismissal detected. Legal avenue: BC ESA / Common Law." };
        return null;
    }

    function process() {
        const box = document.getElementById('statusBox');
        const val = box.value.trim();
        if(!val) return;

        if(mode === "NOTES") {
            noteDb.push({ id: Date.now(), txt: val, time: new Date().toLocaleTimeString() });
            localStorage.setItem('WT_NOTE_VAULT', JSON.stringify(noteDb));
            box.value = ''; render(); return;
        }

        document.getElementById('aiLoad').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('aiLoad').style.display = 'none';
            let report = analyze(val);
            current = { id: Date.now(), txt: val, time: new Date().toLocaleTimeString(), report };
            if(report) {
                document.getElementById('aiTitle').innerText = report.title;
                document.getElementById('aiBody').innerText = report.msg;
                document.getElementById('aiOpinion').style.display = 'flex';
            } else { saveAI(false); }
        }, 1000);
    }

    function saveAI(agree) {
        if(!agree) current.report = null;
        db.push(current);
        localStorage.setItem('WT_ELITE_VAULT', JSON.stringify(db));
        document.getElementById('aiOpinion').style.display = 'none';
        document.getElementById('statusBox').value = '';
        render();
    }

    function render() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';
        const list = mode === "TIMELINE" ? db : noteDb;
        [...list].reverse().forEach(item => {
            const wrap = document.createElement('div');
            wrap.className = 'entry-card';
            wrap.innerHTML = `
                <div class="stamp">${item.time}</div>
                <div class="card-inner" onclick="this.classList.toggle('flipped')">
                    <div class="face front">
                        <div style="font-weight:700">${item.txt.substring(0,50)}...</div>
                    </div>
                    <div class="face back">
                        <div style="font-size:11px">${item.txt}</div>
                        ${item.report ? `<div style="margin-top:10px; border-top:1px solid white; padding-top:5px; font-weight:900;">${item.report.title}</div>` : ''}
                    </div>
                </div>`;
            container.appendChild(wrap);
        });
    }

    function reset() { if(confirm("Clear all data?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
