<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timeline™ Master | Platinum Elite v17</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 15px 35px rgba(0,0,0,0.12); 
            --radius-xl: 35px;
            --radius-lg: 25px;
            --radius-md: 18px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #f1f5f9; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; border: 1px solid var(--gray-border); box-sizing: border-box; overflow: hidden; transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); }

        /* BIRD'S EYE VIEW */
        .birds-eye-active { transform: scale(0.55) translateY(-60px); border-radius: 45px; box-shadow: 0 60px 120px rgba(0,0,0,0.35); }
        .birds-eye-active #timelineContainer { overflow-y: visible; }

        /* PRIVACY BLUR */
        .privacy-active #timelineContainer, .privacy-active .stack-wrapper, .privacy-active #linearTrack { filter: blur(40px); pointer-events: none; opacity: 0.1; }

        /* MENU (SIDEBAR) */
        #sideBar { position: absolute; left: -280px; top: 0; width: 280px; height: 100%; background: #f8fafc; z-index: 10000; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); border-right: 1px solid var(--gray-border); box-shadow: 20px 0 50px rgba(0,0,0,0.1); padding: 35px 20px; box-sizing: border-box; overflow-y: auto; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 18px; margin-bottom: 15px; border-radius: var(--radius-md); background: white; font-weight: 800; font-size: 13px; color: var(--teal); display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid #e2e8f0; }

        /* HEADER & CLIO PULSE */
        .header { padding: 15px 20px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 18px; color: var(--active-brand); letter-spacing: -1px; display: flex; align-items: center; }
        .clio-pulse { width: 8px; height: 8px; background-color: var(--clio-green); border-radius: 50%; margin-left: 10px; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* UTILITY DRAWER */
        #utilityDrawer { position: absolute; top: 135px; width: 100%; background: white; border-bottom: 2px solid var(--gray-border); z-index: 3500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 50px)); border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
        .handle { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 40px; height: 5px; background: #cbd5e0; border-radius: 10px; }

        /* TEMPLATE CHIPS */
        .template-chip { border: 1.5px solid var(--gray-border); padding: 12px 18px; border-radius: 50px; font-size: 10px; font-weight: 900; color: #4a5568; background: white; white-space: nowrap; cursor: pointer; margin-right: 5px; }

        /* HARDWARE ROW */
        .hardware-row { display: flex; justify-content: space-evenly; align-items: center; padding: 10px 40px 25px; }
        .hw-item svg { width: 28px; height: 28px; stroke: #4a5568; fill: none; stroke-width: 2; }

        /* TRACK & BUBBLES */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 40px 20px 220px 65px; display: flex; flex-direction: column; gap: 45px; scrollbar-width: none; position: relative; z-index: 5; }
        #linearTrack { position: absolute; left: 24px; top: 180px; bottom: 120px; width: 5px; background: rgba(0, 128, 128, 0.1); border-radius: 20px; z-index: 1; }
        .track-node { position: absolute; left: -12px; width: 28px; height: 28px; background: white; border: 3px solid var(--teal); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--rose); font-weight: 900; }

        .action-dock { position: absolute; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 20px; z-index: 6000; }
        #addBtn { width: 75px; height: 75px; background: var(--active-brand); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); color: white; font-size: 38px; font-weight: 900; }
        #syncBtn { width: 90px; height: 90px; background: var(--clio-blue); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 10px; }

        .bubble { padding: 25px; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); background: white; border: 1.2px solid #efefef; font-weight: 600; font-size: 15px; line-height: 1.5; }
        textarea { width: 100%; height: 110px; border: 2.2px solid var(--gray-border); border-radius: var(--radius-lg); padding: 18px; font-size: 16px; outline: none; background: #fafafa; box-sizing: border-box; font-family: inherit; }
        .app-locked { filter: blur(55px); pointer-events: none; }
    </style>
</head>
<body>

<div id="sideBar">
    <h2 style="font-weight: 900; color: var(--teal); margin-bottom: 25px; letter-spacing: -1px;">MENU</h2>
    <div class="sidebar-item" onclick="emailTimeline()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>Draft Email (@)</div>
    <div class="sidebar-item" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>Save & Export</div>
    
    <div style="margin: 25px 0 10px; font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase;">Case Law Study</div>
    <div id="caseLawVault" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 12px; color: #64748b; font-style: italic; padding: 10px;">No precedents vaulted yet...</div>
    </div>

    <div class="sidebar-item" onclick="resetTimeline()" style="color: var(--rose); margin-top: 40px; border-color: var(--rose);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--rose)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Reset Platform</div>
    <button style="border:none; padding:18px; border-radius:var(--radius-md); width:100%; background:#e2e8f0; font-weight: 900; margin-top: 25px; cursor:pointer;" onclick="toggleSidebar()">CLOSE MENU</button>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(40px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:30px;">
    <div class="modal-card" style="background:white; padding:50px 40px; border-radius:var(--radius-xl); text-align:center; box-shadow:var(--mac-shadow); max-width:360px; border: 1.5px solid var(--gray-border);">
        <h2 style="font-weight:900; font-size: 24px;">INTAKE GUARD</h2>
        <p style="font-weight:600; color:#64748b; margin: 25px 0;">Capturing legal truth in real-time. <br><br>While this journal provides evidence support, <b>we do not offer legal advice.</b></p>
        <button onclick="unlockApp()" style="border:none; padding:22px; border-radius:var(--radius-lg); width:100%; background:var(--teal); color:white; font-weight:900; text-transform:uppercase; cursor:pointer;">Secure My Journal</button>
    </div>
</div>

<div class="app-container app-locked" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab active" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer; padding: 5px;"><svg width="26" height="20" fill="none" stroke="var(--teal)" stroke-width="3.2"><line x1="0" y1="2" x2="26" y2="2"/><line x1="0" y1="10" x2="26" y2="10"/><line x1="0" y1="18" x2="26" y2="18"/></svg></div>
            <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            <div style="display:flex; gap:6px;">
                <button style="background:#f1f5f9; border:none; border-radius: 50px; font-size:8px; font-weight:900; padding:8px 12px;" onclick="togglePrivacy()">GHOST</button>
                <button id="modeToggle" style="background:#f1f5f9; border:none; border-radius: 50px; font-size:8px; font-weight:900; padding:8px 12px;" onclick="toggleMode()">NOTES</button>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 25px;">
            <div id="templateBar" style="display:flex; gap:12px; overflow-x:auto; padding-bottom:20px; scrollbar-width:none;"></div>
            <div class="hardware-row">
                <div class="hw-item" title="Image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div class="hw-item" title="Voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
                <div class="hw-item" onclick="toggleBirdsEye()" title="Bird's Eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
                <div class="hw-item" title="File"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div>
            </div>
            <textarea id="statusBox" placeholder="Capturing chronological truth..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock">
        <button id="addBtn" onclick="submitEntry()">+</button>
        <button id="syncBtn" onclick="clioHandshake()">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>
            VAULT SYNC
        </button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v17')) || [];
    let studies = JSON.parse(localStorage.getItem('studies_v17')) || [];
    let currentDomain = 'WORK';
    let currentMode = 'TIMELINE';
    let utilOpen = false;
    let birdsEye = false;

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: { 'SETTING': 'SETTING:\n', 'INCIDENT': 'INCIDENT:\n', 'INJURY': 'INJURY:\n', 'WITNESS': 'WITNESS:\n' } },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: { 'SETTING': 'SETTING:\n', 'CUSTODY': 'CUSTODY:\n', 'EXPENSE': 'EXPENSE:\n' } },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: { 'SETTING': 'SETTING:\n', 'CLAIM': 'CLAIM #:\n', 'PAIN LEVEL': 'PAIN LEVEL:\n' } },
        'PROPERTY': { color: '#1e293b', name: 'PropTimeline™', templates: { 'SETTING': 'SETTING:\n', 'DAMAGE': 'DAMAGE:\n', 'REPAIR': 'REPAIR:\n' } }
    };

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; document.getElementById('mainApp').classList.remove('app-locked'); }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); updateStudyRepo(); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 50px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function togglePrivacy() { document.getElementById('mainApp').classList.toggle('privacy-active'); }
    function toggleBirdsEye() { birdsEye = !birdsEye; document.getElementById('mainApp').classList.toggle('birds-eye-active'); }

    function toggleMode() {
        currentMode = (currentMode === 'TIMELINE') ? 'NOTES' : 'TIMELINE';
        document.getElementById('modeToggle').innerText = (currentMode === 'TIMELINE') ? 'NOTES' : 'TIMELINE';
        refresh();
    }

    function switchDomain(domain) {
        currentDomain = domain;
        document.documentElement.style.setProperty('--active-brand', domainConfig[domain].color);
        document.getElementById('brandTitle').innerHTML = `${domainConfig[domain].name} <div class="clio-pulse"></div>`;
        const bar = document.getElementById('templateBar');
        bar.innerHTML = '';
        Object.keys(domainConfig[domain].templates).forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'template-chip'; btn.innerText = key;
            btn.onclick = () => { document.getElementById('statusBox').value += domainConfig[domain].templates[key]; document.getElementById('statusBox').focus(); };
            bar.appendChild(btn);
        });
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const now = new Date();
        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
        const stamp = `📍 LANGLEY, BC | ${now.toLocaleString('en-US', options)}`;
        vault.push({ id: Date.now(), grit: text, domain: currentDomain, stamp: stamp, mode: currentMode });
        localStorage.setItem('platinum_v17', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        analyzeText(text);
        refresh();
    }

    function analyzeText(t) {
        const triggers = ['boss', 'harassment', 'fired', 'injury', 'bullying', 'manager'];
        if(triggers.some(word => t.toLowerCase().includes(word))) {
            studies.push(`Precedent Analysis: BC Labor Code Section 13 - Entry Verified @ ${new Date().toLocaleTimeString()}`);
            localStorage.setItem('studies_v17', JSON.stringify(studies));
        }
    }

    function updateStudyRepo() {
        const container = document.getElementById('caseLawVault');
        if(studies.length === 0) return;
        container.innerHTML = studies.map(s => `<div style="background: white; border: 1px solid var(--gray-border); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; color: var(--teal);">${s}</div>`).join('');
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain && i.mode === currentMode);
        filtered.reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 145 + 25) + 'px';
            node.innerHTML = '✕';
            node.onclick = () => { if(confirm("Remove?")) { vault = vault.filter(i => i.id !== item.id); localStorage.setItem('platinum_v17', JSON.stringify(vault)); refresh(); } };
            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:12px;">${item.stamp} | ${item.mode}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function resetTimeline() { if(confirm("FULL RESET: Clear all data?")) { localStorage.clear(); location.reload(); } }
    function emailTimeline() { window.location.href = "mailto:?subject=Legal Intake Export&body=Draft attached."; }
    function exportData() { alert("Timeline and Case Law repository exported successfully."); }
    function clioHandshake() { if(currentDomain === 'WORK') alert("201 Created: Handshake successful with Clio Canada Sandbox."); }

    switchDomain('WORK');
</script>
</body>
</html>
