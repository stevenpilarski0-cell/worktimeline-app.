<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Ultimate Master Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        :root { --teal: #008080; --teal-soft: #e0f2f1; --danger: #e74c3c; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 10px; transition: filter 0.3s ease; }
        
        /* PRIVACY & VIEW MODES */
        body.ghost-mode #mainContent { filter: blur(25px); pointer-events: none; }
        body.chron-view .entry { border-left: 2px solid #ccc; border-radius: 0; margin-bottom: 0; padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; }
        body.chron-view .media-toolbar, body.chron-view .template-row { display: none; }

        .app-container { max-width: 500px; margin: auto; background: white; border-radius: 35px; min-height: 95vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* SPLASH & SKIP */
        .splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--platinum); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; box-sizing: border-box; transition: opacity 0.8s ease; }
        .skip-btn { position: absolute; bottom: 40px; background: rgba(0,0,0,0.2); border: 1.5px solid var(--gray-dark); padding: 12px 24px; border-radius: 50px; font-weight: 900; font-size: 13px; cursor: pointer; color: var(--gray-dark); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2px solid var(--platinum); }
        
        /* TEMPLATES */
        .template-row { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .template-chip { background: var(--teal-soft); color: var(--teal); border: none; padding: 6px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; white-space: nowrap; cursor: pointer; }

        /* HARDWARE TOOLBAR (SOLID MAX STYLE) */
        .media-toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
        .media-btn { flex: 1; background: var(--platinum); border: none; padding: 12px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .media-btn svg { width: 24px; height: 24px; fill: var(--teal); margin-bottom: 4px; }
        .media-btn span { font-size: 9px; font-weight: 900; color: var(--gray-dark); }

        #statusBox { width: 100%; height: 100px; padding: 15px; border-radius: 15px; border: 2px solid var(--platinum); box-sizing: border-box; font-family: inherit; margin-bottom: 10px; font-size: 16px; outline: none; }
        .entry { background: white; border: 1.5px solid var(--platinum); padding: 15px; border-radius: 20px; margin-bottom: 10px; border-left: 5px solid var(--teal); position: relative; }
        .timestamp-full { font-size: 10px; font-weight: 900; color: var(--teal); background: var(--teal-soft); padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
        .sync-btn { background: var(--gray-dark); color: white; border: none; padding: 20px; border-radius: 25px; width: 100%; font-weight: 900; cursor: pointer; margin-top: auto; }

        /* SWITCHES */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="splashScreen" class="splash-screen">
        <h1 id="story-text" style="font-size: 20px; font-weight: 800; color: var(--gray-dark);">Preparing Your Bridge...</h1>
        <button class="skip-btn" onclick="skipIntro()">SKIP INTRO ➔</button>
    </div>

    <header class="header">
        <div><h1 style="color: var(--teal); margin:0; font-size: 16px; font-weight: 900;">WorkTimeline™</h1></div>
        <div style="display:flex; gap:12px;">
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleChron()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">CHRON</div></div>
            <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="togglePrivacy()"><span class="slider"></span></label><div style="font-size: 7px; font-weight: 900;">GHOST</div></div>
        </div>
    </header>

    <div id="mainContent" style="padding: 20px; flex-grow: 1; display: flex; flex-direction: column;">
        <div class="template-row">
            <button class="template-chip" onclick="addText('📍 [LOCATION]: ')">+ Location</button>
            <button class="template-chip" onclick="addText('👤 [WITNESS]: ')">+ Witness</button>
            <button class="template-chip" onclick="addText('⚠️ [HAZARD]: ')">+ Hazard</button>
            <button class="template-chip" onclick="addText('📅 [DEADLINE]: ')">+ Deadline</button>
        </div>

        <textarea id="statusBox" placeholder="Describe the event..."></textarea>

        <div class="media-toolbar">
            <button class="media-btn" onclick="document.getElementById('camInput').click()">
                <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15a5 5 0 100-10 5 5 0 000 10z"/></svg>
                <span>CAMERA</span>
            </button>
            <button class="media-btn" onclick="document.getElementById('micInput').click()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <span>AUDIO</span>
            </button>
            <button class="media-btn" onclick="document.getElementById('docInput').click()">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>
                <span>DOCS</span>
            </button>
        </div>

        <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="addEntry('📷 Photo secured.')">
        <input type="file" id="micInput" accept="audio/*" capture="microphone" style="display:none" onchange="addEntry('🎤 Audio recording secured.')">
        <input type="file" id="docInput" style="display:none" onchange="addEntry('📄 Document uploaded.')">

        <button onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:15px; border-radius:15px; font-weight:900;">Add to Secure Timeline</button>
        
        <div id="timeline" style="margin-top: 20px; overflow-y: auto; flex-grow: 1;"></div>
        
        <button id="lockBtn" class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
    </div>
</div>

<script>
    function addText(t) { const box = document.getElementById('statusBox'); box.value += t; box.focus(); }
    function skipIntro() { const s = document.getElementById('splashScreen'); s.style.opacity = 0; setTimeout(()=>s.style.display='none', 800); }
    function togglePrivacy() { document.body.classList.toggle('ghost-mode'); }
    function toggleChron() { document.body.classList.toggle('chron-view'); }

    function getSuperTimestamp() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        return now.toLocaleDateString('en-US', options);
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value.trim();
        if(text) { addEntry(text); document.getElementById('statusBox').value = ''; }
    }

    function addEntry(text) {
        const id = "WT-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `
            <div class="timestamp-full">🕒 ${getSuperTimestamp()}</div>
            <p style="margin:0; font-size:14px; font-weight:600;">${text}</p>
            <span style="font-size:8px; color:#aaa; display:block; margin-top:8px;">🔒 SEAL: ${id}</span>
        `;
        document.getElementById('timeline').prepend(div);
    }

    function syncToClio() {
        const clioClientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
        const redirectUri = "https://worktimeline-app.vercel.app/index.html";
        window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=${clioClientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=leads_write%20contacts_write`;
    }

    window.onload = () => {
        const txt = document.getElementById('story-text');
        const lines = ["Welcome.", "Justice is truth in action.", "Let's build your story."];
        let i = 0;
        const run = () => { if(i < lines.length) { txt.innerText = lines[i++]; setTimeout(run, 2000); } else skipIntro(); };
        run();
    };
</script>
</body>
</html>
