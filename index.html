<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline - Firm Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .wrapper {
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }
        h2 { font-size: 22px; font-weight: 600; margin: 0 0 5px; color: #1d1d1f; }
        .subtitle { font-size: 13px; color: #86868b; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 13px; font-weight: 600; color: #86868b; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fbfbfd;
            font-family: inherit;
        }
        textarea { height: 150px; resize: vertical; }
        select:focus, textarea:focus { outline: none; border-color: #008080; background-color: #ffffff; }
        .btn-sync { background-color: #008080; color: white; border: none; padding: 14px 28px; font-size: 15px; font-weight: 500; border-radius: 8px; cursor: pointer; width: 100%; transition: background-color 0.2s; }
        .btn-sync:hover { background-color: #006666; }
        .status-banner { margin-top: 1rem; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; display: none; }
        .success { background-color: #e6f2f2; color: #008080; border: 1px solid #008080; }
        .error { background-color: #ffebe9; color: #ff3b30; border: 1px solid #ff3b30; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Transmit to Firm Infrastructure</h2>
    <div class="subtitle">Pipeline: WorkTimeline ➔ Clio Grow Target Authorized Workspace</div>
    
    <div class="form-group">
        <label for="firmSelect">Select Authorized Target Firm</label>
        <select id="firmSelect">
            <option value="GROW-FIRM-9832" selected>My Active Clio Grow Firm (Primary)</option>
            <option value="SANDBOX-FIRM-1102">Development Sandbox Testing Account</option>
        </select>
    </div>

    <div class="form-group">
        <label for="logText">Contemporaneous Log Content</label>
        <textarea id="logText" placeholder="Enter chronological evidence logs...">[08:15 AM] Safety incident reported at prep station.
[08:30 AM] Area secured by safety committee.
[08:45 AM] Initial witness statements recorded.</textarea>
    </div>

    <button id="syncBtn" class="btn-sync">Sync directly to Chosen Firm Infrastructure</button>
    <div id="banner" class="status-banner"></div>
</div>

<script>
    document.getElementById('syncBtn').addEventListener('click', async () => {
        const firmSelect = document.getElementById('firmSelect');
        const firmId = firmSelect.value;
        const firmName = firmSelect.options[firmSelect.selectedIndex].text;
        const logText = document.getElementById('logText').value.trim();
        const banner = document.getElementById('banner');

        if (!logText) {
            showBanner('Please enter the log content before executing transmission.', 'error');
            return;
        }

        showBanner(`Packaging chronology timeline for ${firmName}...`, 'success');

        try {
            const response = await fetch('/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firmId: firmId,
                    firmName: firmName,
                    logText: logText,
                    timestamp: new Date().toISOString()
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showBanner(`Success! Locked securely inside ${firmName} infrastructure. (ID: ${firmId})`, 'success');
            } else {
                throw new Error(result.error || 'Clio connection refused application routing.');
            }
        } catch (err) {
            showBanner(`Sync Failed: ${err.message}`, 'error');
        }
    });

    function showBanner(message, type) {
        banner.textContent = message;
        banner.className = `status-banner ${type}`;
        banner.style.display = 'block';
    }
</script>

</body>
</html>
