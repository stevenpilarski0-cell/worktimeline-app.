<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Prototype 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        
        :root { 
            --teal: #008080; --teal-soft: #e0f2f1; --clio-blue: #0076CE;
            --platinum-bg: #d8e2ea; --platinum-mid: #eef1f5; --platinum-dark: #7a8b9e;
            --gray-dark: #2c3e50; 
        }

        body { font-family: 'Nunito', sans-serif; background-color: var(--platinum-mid); margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .app-container { 
            width: 100%; max-width: 500px; background: #ffffff; 
            border-radius: 35px; min-height: 95vh; display: flex; flex-direction: column; 
            position: relative; box-shadow: 0 15px 40px rgba(0, 128, 128, 0.08); 
            overflow: hidden; 
        }

        /* --- THE CINEMATIC LAYER (FIXED) --- */
        .splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--platinum-bg); z-index: 99999 !important;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-out; padding: 30px; box-sizing: border-box; text-align: center;
        }

        /* --- UI COMPONENTS --- */
        .header-container { display: flex; align-items: center; padding: 30px 20px; border-bottom: 3px solid var(--platinum-bg); }
        .lawyer-box { background: var(--teal-soft); padding: 15px; border-radius: 20px; margin-bottom: 15px; }
        .template-chip { background: #ffffff; border: 2px solid var(--teal-soft); color: var(--teal); padding: 8px 12px; border-radius: 50px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        
        #statusBox { width: 100%; height: 120px; border-radius: 20px; border: 2px solid var(--platinum-mid); background: var(--platinum-bg); padding: 15px; font-size: 16px; margin-bottom: 15px; resize: none; font-family: inherit; box-sizing: border-box; }
        
        .media-toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
        .media-btn { background: var(--platinum-bg); border-radius: 20px; flex: 1; padding: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; border: none; }
        .media-btn svg { width: 24px; height: 24px; fill: var(--teal); }
        .media-btn span { font-size: 9px; font-weight: 900; margin-top: 4px; color: var(--platinum-dark); }

        .submit-main { width: 100%; background: var(--teal); color: white; border: none; padding: 18px; border-radius: 25px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 128, 128, 0.2); }
        .entry { background: #ffffff; border: 2px solid var(--platinum-mid); padding: 15px; border-radius: 20px; margin-bottom: 12px; position: relative; }
        .timestamp-box { color: var(--teal); font-size: 10px; font-weight: 900; background: var(--teal-soft); padding: 4px 10px; border-radius: 8px; margin-bottom: 8px; display: inline-block; }
        
        .pattern-alert { background: #fff3e0; border: 2px solid #ff9800; border-radius: 15px; padding: 15px; margin-bottom: 15px; color: #e65100; font-size: 12px; font-weight: 800; display: none; }
        .lock-footer { background: var(--gray-dark); color: white; border: none; border-radius: 25px; padding: 20px; width: 100%; font-weight: 900; margin-top: auto; cursor: pointer; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(15px); background: rgba(255,255,255,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 25px; padding: 25px; text-align: center; border: 2px solid var(--platinum-mid); width: 80%; }
    </style>
</head>
<body>

<div id="appRoot" class="app-container">
    <div id="splashScreen" class="splash-screen">
        <div id="story-container">
            <h1 id="story-text" style="font-size: 22px; line-height: 1.4; color: var(--gray-dark);">Initialising...</h1>
        </div>
    </div>

    <header class="header-container">
        <div style="flex-grow: 1;">
            <h1 style="color: var(--teal); margin: 0; font-size: 22px; font-weight: 900;">WorkTimeline™</h1>
            <p style="margin:0; font-style: italic; color: var(--platinum-dark); font-size: 11px;">"Justice is truth in action."</p>
        </div>
        <button onclick="toggleDbPanel()" style="font-size: 8px; padding: 5px; background: none; border: 1px dashed var(--teal); border-radius: 5px;">DB CONFIG</button>
    </header>

    <div style="padding: 20px; flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto;">
        
        <div id="dbConfig" style="display:none; background:#f4f4f4; padding:10px; border-radius:10px; margin-bottom:10px; font-size:11px;">
            <input type="text" id="dbUrl" placeholder="Supabase URL" style="width:100%; margin-bottom:5px;">
            <input type="text" id="dbKey" placeholder="Anon Key" style="width:100%;">
            <button onclick="saveDbKeys()" style="margin-top:5px; width:100%;">Link Supabase</button>
        </div>

        <div class="lawyer-box">
            <select id="lawyerSelect" onchange="saveLawyer()" style="width: 100%; border:none; background:none; font-weight:800; font-family: inherit;">
                <option value="none">-- Select Professional --</option>
                <option value="Marcus Thorne, Esq.">Marcus Thorne, Esq.</option>
                <option value="Sarah Jenkins, JD">Sarah Jenkins, JD</option>
            </select>
        </div>

        <div id="patternAlert" class="pattern-alert">
            🔍 <strong>Clio Duo Pattern Detected:</strong> Risk keywords identifying. Generating Risk Assessment...
        </div>

        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <button class="template-chip" onclick="addTemplate('📍 [SITE]: ')">+ Site</button>
            <button class="template-chip" onclick="addTemplate('👤 [WITNESS]: ')">+ Witness</button>
            <button class="template-chip" onclick="addTemplate('📋 [INTAKE]: ')">+ Intake</button>
        </div>

        <textarea id="statusBox" placeholder="Describe event..."></textarea>
        
        <div class="media-toolbar">
            <div class="media-btn" onclick="logMedia('Photo')"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15a5 5 0 100-10 5 5 0 000 10z"/></svg><span>CAMERA</span></div>
            <div class="media-btn" onclick="logMedia('Audio')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg><span>AUDIO</span></div>
            <div class="media-btn" onclick="logMedia('Document')"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span>DOC</span></div>
        </div>

        <button class="submit-main" onclick="submitEntry()">Add to Timeline</button>
        <div id="timeline" style="margin-top:20px;"></div>
        <button class="lock-footer" onclick="showWarning()">Lock & Sync to Clio</button>
    </div>

    <div id="warningModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">⚠️ Finalize Timeline?</h3>
            <p style="font-size:13px; color:var(--platinum-dark);">Entries will be transmitted to Clio Grow Canada.</p>
            <button onclick="syncToClio()" style="width:100%; background:var(--teal); color:white; padding:15px; border-radius:15px; border:none; font-weight:800; cursor:pointer;">CONFIRM & SYNC</button>
            <button onclick="closeWarning()" style="margin-top:10px; background:none; border:none; color:var(--platinum-dark); cursor:pointer;">Cancel</button>
        </div>
    </div>
</div>

<script>
    let sb = null;
    let hazardCount = 0;

    const introTexts = [
        "Feel invisible?", "Trapped in a cycle of 'what ifs'?",
        "You are not alone. 60% of people never seek help because they fear complexity.",
        "The 'Justice Gap' is real: Millions choose silence over a system that feels built for someone else.",
        "Lawyers lose billions every year in wasted intake hours—time spent on cases that aren't the right fit.",
        "Intake fees aren't a barrier; they value the time experts give to your story.",
        "WorkTimeLine guides you...", "Enjoy the first step.", "Welcome to the sky."
    ];

    function showIntro() {
        const introDiv = document.getElementById('splashScreen');
        const textEl = document.getElementById('story-text');
        let current = 0;
        function next() {
            if (current < introTexts.length) {
                textEl.style.opacity = 0;
                setTimeout(() => {
                    textEl.innerHTML = introTexts[current];
                    textEl.style.opacity = 1;
                    let displayTime = (current >= 2 && current <= 5) ? 15000 : 4000;
                    current++;
                    setTimeout(next, displayTime);
                }, 800);
            } else {
                introDiv.style.opacity = 0;
                setTimeout(() => introDiv.style.display = 'none', 1000);
            }
        }
        next();
    }

    function initSupabase() {
        const u = localStorage.getItem('sb_url'), k = localStorage.getItem('sb_key');
        if (u && k) sb = supabase.createClient(u, k);
    }

    function saveDbKeys() {
        localStorage.setItem('sb_url', document.getElementById('dbUrl').value);
        localStorage.setItem('sb_key', document.getElementById('dbKey').value);
        alert('DB Linked. Reloading...');
        location.reload();
    }

    function addTemplate(t) { document.getElementById('statusBox').value += t; document.getElementById('statusBox').focus(); }

    async function submitEntry() {
        const txt = document.getElementById('statusBox').value.trim();
        if(!txt) return;
        if(txt.toLowerCase().includes('hazard')) {
            hazardCount++;
            if(hazardCount >= 2) document.getElementById('patternAlert').style.display = 'block';
        }
        if(sb) await sb.from('timeline_entries').insert([{ entry_text: txt, lawyer_name: localStorage.getItem('lawyer') }]);
        addEntryToUI(txt);
        document.getElementById('statusBox').value = '';
    }

    function addEntryToUI(txt, sys=false) {
        const div = document.createElement('div');
        div.className = 'entry';
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `<span class="timestamp-box">${time}</span><p style="margin:0; font-weight:600;">${txt}</p>`;
        if(sys) div.style.background = 'var(--platinum-bg)';
        document.getElementById('timeline').prepend(div);
    }

    function logMedia(type) { addEntryToUI(`🔒 ${type} encrypted and attached.`, true); }
    function saveLawyer() { localStorage.setItem('lawyer', document.getElementById('lawyerSelect').value); }
    function toggleDbPanel() { const p = document.getElementById('dbConfig'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
    function showWarning() { document.getElementById('warningModal').style.display = 'flex'; }
    function closeWarning() { document.getElementById('warningModal').style.display = 'none'; }
    function syncToClio() { window.location.href = `https://ca.app.clio.com/oauth/authorize?response_type=code&client_id=btscu9WmPHYellZtZA9slQfynBAQudwjaR7pEDdq&redirect_uri=${encodeURIComponent(window.location.href)}`; }

    window.onload = () => {
        showIntro();
        initSupabase();
        if(localStorage.getItem('sb_url')) document.getElementById('dbUrl').value = localStorage.getItem('sb_url');
    };
</script>
</body>
</html>
