<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Obsidian Gloss v26</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        
        :root { 
            --active-brand: #008080; 
            --teal: #008080; 
            --rose: #e11d48;
            --clio-blue: #0076CE;
            --clio-green: #2ecc71;
            --gray-border: #cbd5e0; 
            /* THE OBSIDIAN GLOSS TOOLKIT */
            --glass: rgba(255, 255, 255, 0.7);
            --obsidian: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --metal-shine: linear-gradient(160deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 45%, rgba(255,255,255,0.1) 100%);
            --mac-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --radius-xl: 40px;
            --radius-lg: 30px;
        }
        
        body { font-family: 'Nunito', sans-serif; background: #e2e8f0; margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: #ffffff; height: 100dvh; display: flex; flex-direction: column; position: relative; border-left: 1px solid rgba(255,255,255,0.3); box-sizing: border-box; overflow: hidden; transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1); }

        /* BIRD'S EYE VIEW */
        .birds-eye-active { transform: scale(0.5) translateY(-80px); border-radius: 50px; box-shadow: 0 100px 150px rgba(0,0,0,0.4); }

        /* MENU (SIDEBAR) */
        #sideBar { position: absolute; left: -300px; top: 0; width: 290px; height: 100%; background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(20px); z-index: 10000; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); border-right: 1px solid var(--gray-border); padding: 40px 25px; box-sizing: border-box; }
        #sideBar.open { left: 0; }
        .sidebar-item { padding: 18px; margin-bottom: 15px; border-radius: 20px; background: white; font-weight: 800; font-size: 11px; color: var(--teal); display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid #e2e8f0; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }

        /* DOMAIN NAV (THE "UPPER GLASS") */
        .domain-nav { display: flex; background: rgba(248, 250, 252, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gray-border); padding: 12px; gap: 10px; z-index: 5000; }
        .domain-tab { flex: 1; border: none; padding: 14px 0; border-radius: 20px; font-size: 10px; font-weight: 900; color: #64748b; background: transparent; cursor: pointer; text-transform: uppercase; transition: 0.3s; position: relative; }
        .domain-tab.active { background: white; color: var(--active-brand); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* HEADER */
        .header { padding: 20px 25px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-weight: 900; font-size: 20px; color: var(--active-brand); display: flex; align-items: center; letter-spacing: -1.2px; }
        .clio-pulse { width: 10px; height: 10px; background-color: var(--clio-green); border-radius: 50%; margin-left: 10px; animation: glow 2s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* UTILITY DRAWER (The "Upper Tab") */
        #utilityDrawer { position: absolute; top: 140px; width: 100%; background: white; border-bottom: 3px solid var(--gray-border); z-index: 3500; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1) transform; transform: translateY(calc(-100% + 50px)); border-radius: 0 0 var(--radius-xl) var(--radius-xl); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .handle { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: #cbd5e0; border-radius: 10px; }

        /* TEMPLATE CHIPS (CHROME GLOSS) */
        #templateBar { display: flex; gap: 12px; overflow-x: auto; padding: 10px 25px 25px; scrollbar-width: none; }
        .template-chip { border: 2px solid #e2e8f0; padding: 12px 22px; border-radius: 50px; font-size: 11px; font-weight: 900; color: #1e293b; background: white; white-space: nowrap; cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .template-chip::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.6; }

        /* TIMELINE TRACK */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 45px 25px 250px 75px; display: flex; flex-direction: column; gap: 45px; scrollbar-width: none; position: relative; z-index: 5; }
        #linearTrack { position: absolute; left: 28px; top: 180px; bottom: 120px; width: 6px; background: rgba(0, 128, 128, 0.1); border-radius: 20px; z-index: 1; }
        .track-node { position: absolute; left: -14px; width: 32px; height: 32px; background: #fff; border: 4px solid var(--active-brand); border-radius: 12px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; overflow: hidden; }
        .track-node::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); }

        /* ACTION DOCKS (OBSIDIAN GLASS) */
        .action-dock-right { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 6000; }
        .action-dock-left { position: absolute; bottom: 40px; left: 30px; z-index: 6000; }
        
        #addBtn { width: 80px; height: 80px; background: var(--obsidian); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); color: white; font-size: 40px; font-weight: 900; cursor: pointer; position: relative; overflow: hidden; }
        #addBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.3; }

        #syncBtn { width: 95px; height: 95px; background: linear-gradient(135deg, var(--clio-blue) 0%, #004c8c 100%); border: none; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 10px; cursor: pointer; position: relative; overflow: hidden; }
        #syncBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.2; }

        #eyeBtn { width: 70px; height: 70px; background: #fff; border: 2px solid var(--gray-border); border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        #eyeBtn::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: var(--metal-shine); opacity: 0.4; }

        /* BUBBLES */
        .bubble { padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--mac-shadow); background: white; border: 1px solid #f1f5f9; font-weight: 600; font-size: 16px; line-height: 1.5; color: #1e293b; }
        textarea { width: 100%; height: 120px; border: 3px solid #e2e8f0; border-radius: var(--radius-lg); padding: 20px; font-size: 18px; outline: none; background: #f8fafc; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        textarea:focus { border-color: var(--active-brand); background: #fff; }
    </style>
</head>
<body>

<div id="sideBar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="font-weight: 900; color: var(--teal); font-size: 20px; margin: 0; letter-spacing: -1px;">MENU</h2>
        <div onclick="toggleSidebar()" style="cursor: pointer; opacity: 0.4;"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="sidebar-item" onclick="exportData()">📁 SAVE & EXPORT</div>
    <div class="sidebar-item" onclick="alert('Case Law Analysis Engaged')">⚖️ CASE LAW STUDY</div>
    <div class="sidebar-item" onclick="resetTimeline()" style="color: var(--rose); margin-top: 50px;">🗑️ RESET PLATFORM</div>
</div>

<div id="overlaySystem" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255, 255, 255, 0.99); backdrop-filter:blur(40px); z-index:100000; display:flex; align-items:center; justify-content:center; padding:30px;">
    <div class="modal-card" style="background:white; padding:60px 45px; border-radius:50px; text-align:center; box-shadow: var(--mac-shadow); max-width:400px; border: 1px solid #e2e8f0;">
        <h2 id="greetingText" style="font-weight:900; font-size: 32px; color: var(--teal); letter-spacing: -2px; margin: 0;">HELLO</h2>
        <p style="font-weight:800; font-size: 12px; color: #94a3b8; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px;">Langley Township, BC</p>
        <p style="font-weight:600; color:#64748b; line-height:1.7; margin: 35px 0;">Capturing the chronological truth in real-time. <br><b>Zero legal advice. Pure evidence.</b></p>
        <button onclick="unlockApp()" style="border:none; padding:24px; border-radius:30px; width:100%; background:var(--obsidian); color:white; font-weight:900; text-transform:uppercase; cursor:pointer; font-size: 16px; letter-spacing: 2px;">Secure My Journal</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <nav class="domain-nav">
        <button class="domain-tab" data-id="WORK" onclick="switchDomain('WORK')">Work</button>
        <button class="domain-tab" data-id="FAM" onclick="switchDomain('FAM')">Family</button>
        <button class="domain-tab" data-id="INJURY" onclick="switchDomain('INJURY')">Injury</button>
        <button class="domain-tab" data-id="PROPERTY" onclick="switchDomain('PROPERTY')">Property</button>
    </nav>

    <header class="header">
        <div class="header-top">
            <div onclick="toggleSidebar()" style="cursor:pointer; padding: 5px;">
                <svg width="30" height="22" fill="none" stroke="var(--active-brand)" stroke-width="4"><line x1="0" y1="2" x2="30" y2="2"/><line x1="0" y1="11" x2="30" y2="11"/><line x1="0" y1="20" x2="30" y2="20"/></svg>
            </div>
            <div class="main-title" id="brandTitle">WorkTimeline™ <div class="clio-pulse"></div></div>
            <button id="modeToggle" style="background:#f1f5f9; border:none; border-radius: 50px; font-size:10px; font-weight:900; padding:12px 18px; cursor:pointer;" onclick="toggleMode()">NOTES</button>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 30px;">
            <div id="templateBar"></div>
            <textarea id="statusBox" placeholder="Capture the evidence..."></textarea>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="linearTrack"></div>
    <div id="timelineContainer"></div>

    <div class="action-dock-left">
        <button id="eyeBtn" onclick="toggleBirdsEye()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <div class="action-dock-right">
        <button id="addBtn" onclick="submitEntry()">+</button>
        <button id="syncBtn" onclick="clioHandshake()">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="white" stroke-width="4"><path d="M7 11V7a5 5 0 0 1 10 0v4" /><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/></svg>
            SYNC
        </button>
    </div>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('platinum_v26')) || [];
    let sessionIds = [];
    let currentDomain = 'WORK';
    let currentMode = 'TIMELINE';
    let utilOpen = false;

    const domainConfig = {
        'WORK': { color: '#008080', name: 'WorkTimeline™', templates: { 'LOCATION': 'LOC:\n', 'INCIDENT': 'EVENT:\n', 'WITNESS': 'WIT:\n' } },
        'FAM': { color: '#e11d48', name: 'FamTimeline™', templates: { 'VENUE': 'VENUE:\n', 'CUSTODY': 'TRANS:\n' } },
        'INJURY': { color: '#f59e0b', name: 'InjuryTimeline™', templates: { 'SETTING': 'SETTING:\n', 'CLAIM': 'CLAIM:\n', 'HARM': 'HARM:\n' } },
        'PROPERTY': { color: '#1e293b', name: 'PropTimeline™', templates: { 'ADDR': 'ADDR:\n', 'FIX': 'FIX:\n' } }
    };

    function unlockApp() { document.getElementById('overlaySystem').style.display='none'; }
    function toggleSidebar() { document.getElementById('sideBar').classList.toggle('open'); }
    function toggleUtility() { document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(calc(-100% + 50px))' : 'translateY(0)'; utilOpen = !utilOpen; }
    function toggleBirdsEye() { document.getElementById('mainApp').classList.toggle('birds-eye-active'); }
    
    function setGreeting() {
        const hour = new Date().getHours();
        const greet = hour < 12 ? "GOOD MORNING" : hour < 18 ? "GOOD AFTERNOON" : "GOOD EVENING";
        document.getElementById('greetingText').innerText = greet;
    }

    function toggleMode() {
        currentMode = currentMode === 'TIMELINE' ? 'NOTES' : 'TIMELINE';
        document.getElementById('modeToggle').innerText = currentMode === 'TIMELINE' ? 'NOTES' : 'TIMELINE';
        refresh();
    }

    function switchDomain(domain) {
        currentDomain = domain;
        const config = domainConfig[domain];
        document.documentElement.style.setProperty('--active-brand', config.color);
        document.getElementById('brandTitle').innerHTML = `${config.name} <div class="clio-pulse"></div>`;
        
        document.querySelectorAll('.domain-tab').forEach(t => {
            t.style.color = t.dataset.id === domain ? config.color : '#64748b';
            t.style.background = t.dataset.id === domain ? 'white' : 'transparent';
            t.style.boxShadow = t.dataset.id === domain ? '0 10px 20px rgba(0,0,0,0.05)' : 'none';
        });

        const bar = document.getElementById('templateBar'); bar.innerHTML = '';
        Object.keys(config.templates).forEach(k => {
            const b = document.createElement('button'); b.className = 'template-chip'; b.innerText = k;
            b.onclick = () => { document.getElementById('statusBox').value += config.templates[k]; document.getElementById('statusBox').focus(); };
            bar.appendChild(b);
        });
        refresh();
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const id = Date.now();
        const stamp = `📍 LANGLEY, BC | ${new Date().toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}`;
        vault.push({ id, grit: text, domain: currentDomain, stamp });
        sessionIds.push(id);
        localStorage.setItem('platinum_v26', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        if(utilOpen) toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer'); list.innerHTML = '';
        const track = document.getElementById('linearTrack'); track.innerHTML = '';
        const filtered = vault.filter(i => i.domain === currentDomain);
        filtered.reverse().forEach((item, index) => {
            const node = document.createElement('div');
            node.className = 'track-node'; node.style.top = (index * 160 + 30) + 'px';
            if(sessionIds.includes(item.id)) {
                node.innerHTML = '✕'; node.style.color = 'var(--rose)';
                node.onclick = () => { if(confirm("Remove?")) { vault = vault.filter(v => v.id !== item.id); refresh(); } };
            } else { node.innerHTML = '✓'; }
            track.appendChild(node);
            list.innerHTML += `<div class="stack-wrapper"><div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:12px;">${item.stamp}</div><div class="bubble">${item.grit.replace(/\n/g, '<br>')}</div></div>`;
        });
    }

    function resetTimeline() { if(confirm("Clear Platform?")) { localStorage.clear(); location.reload(); } }
    function clioHandshake() { if(currentDomain === 'WORK') alert("Syncing to Clio Canada..."); }
    function exportData() { alert("Database Exported."); }

    setGreeting();
    switchDomain('WORK');
</script>
</body>
</html>
