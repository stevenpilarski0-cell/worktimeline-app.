<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTimeline™ | Evidence Vault</title>
    <style>
        /* Modern Mac-Style Minimalist Aesthetic */
        body { 
            background-color: #0f1111; 
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: #1a1c1c; 
            padding: 30px; 
            border-radius: 18px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-left: 4px solid #008080; /* Teal Border */
        }
        h1 { color: #008080; margin-bottom: 5px; font-weight: 600; }
        p { color: #888; margin-bottom: 25px; font-size: 0.9rem; }
        
        textarea { 
            width: 100%; 
            height: 120px; 
            background: #252828; 
            color: white; 
            border: 1px solid #333; 
            border-radius: 12px; 
            padding: 15px; 
            font-size: 16px; 
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: #008080; }

        button { 
            width: 100%; 
            background: #008080; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: background 0.3s;
        }
        button:hover { background: #006666; }

        #output { 
            margin-top: 25px; 
            padding: 15px; 
            border-radius: 10px; 
            background: #121414; 
            color: #00d1d1; 
            font-size: 0.95rem; 
            line-height: 1.5;
            min-height: 50px;
            display: none; /* Hidden until processing */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WorkTimeline™</h1>
        <p>Grit-to-Legal Evidence Intake</p>

        <textarea id="gritInput" placeholder="Describe the incident (e.g., Matt took the maple bar donut...)"></textarea>

        <button onclick="processEvidence()">Professionalize & Verify</button>

        <div id="output"></div>
    </div>

    <script>
        async function processEvidence() {
            const gritText = document.getElementById('gritInput').value;
            const outputDiv = document.getElementById('output');
            
            if (!gritText) {
                alert("Please enter some grit first.");
                return;
            }

            // Show status while communicating with Vercel
            outputDiv.style.display = "block";
            outputDiv.innerText = "Consulting Secure AI Vault...";

            try {
                // Connecting to the Vercel Serverless Function
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: gritText })
                });

                const data = await response.json();
                
                // Display the summary returned by the Cohere engine
                outputDiv.innerText = data.summary || "Evidence verified and summarized.";
            } catch (error) {
                outputDiv.innerText = "Error: Connection to AI Vault failed. Verify your Vercel deployment is active.";
                console.error("AI Bridge Error:", error);
            }
        }
    </script>

</body>
</html>
