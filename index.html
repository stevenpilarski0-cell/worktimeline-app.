<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | The Truth Handshake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --glass: rgba(0, 128, 128, 0.05); 
            /* Mac-Style Ultra Rounding */
            --round-main: 50px; 
            --round-inner: 28px; 
            --round-pill: 999px;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #eef1f5; 
            margin: 0; 
            padding: 10px; 
            height: 100vh; 
            overflow: hidden; 
            color: var(--gray-dark); 
        }
        
        /* 45-SECOND DEEP DIVE INTRO */
        #splashScreen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #eef1f5; 
            z-index: 100000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px; 
            box-sizing: border-box; 
            transition: opacity 1.2s ease; 
        }
        
        .story-text { 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--gray-dark); 
            line-height: 1.5; 
            opacity: 0; 
            transition: opacity 0.8s; 
            max-width: 460px; 
            letter-spacing: -0.5px; 
        }

        #skipBtn {
            position: absolute;
            bottom: calc(60px + env(safe-area-inset-bottom));
            padding: 14px 28px;
            background: white;
            color: var(--clio-blue);
            border: 2px solid var(--clio-blue);
            border-radius: var(--round-pill);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 100001;
            transition: transform 0.2s, opacity 0.3s;
        }
        #skipBtn:active { transform: scale(0.95); }

        .app-container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            border-radius: var(--round-main); 
            height: 95vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
        }

        #blurBox { 
            position: absolute; 
            top: 85px; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 98; 
            background: rgba(255,255,255,0.01); 
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px); 
            pointer-events: none; 
            transition: backdrop-filter 0.5s ease, -webkit-backdrop-filter 0.5s ease; 
        }
        
        body.ghost-active #blurBox { 
            backdrop-filter: blur(40px) grayscale(1); 
            -webkit-backdrop-filter: blur(40px) grayscale(1); 
            pointer-events: all; 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 24px; 
            border-bottom: 1px solid var(--platinum); 
            flex-shrink: 0; 
            z-index: 100; 
            background: white; 
        }

        .input-area { 
            padding: 20px; 
            background: var(--gray-light); 
            border-bottom: 1px solid var(--platinum); 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
        }
        
        .template-chips { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 15px; 
            scrollbar-width: none; 
        }
        .template-chips::-webkit-scrollbar { display: none; }
        
        .chip { 
            background: white; 
            color: var(--teal); 
            font-size: 11px; 
            font-weight: 800; 
            padding: 12px 18px; 
            border-radius: var(--round-pill); 
            white-space: nowrap; 
            cursor: pointer; 
            border: 1.5px solid var(--platinum); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.2s;
        }
        .chip:active { transform: scale(0.96); background: var(--teal); color: white; }

        #statusBox { 
            width: 100%; 
            height: 95px; 
            padding: 18px; 
            border-radius: var(--round-inner); 
            border: 1.5px solid var(--platinum); 
            box-sizing: border-box; 
            font-family: inherit; 
            margin-bottom: 15px; 
            font-size: 15px; 
            outline: none; 
            background: white; 
            resize: none; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); 
        }
        
        .media-toolbar { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-bottom: 15px; 
        }
        
        .media-btn { 
            background: white; 
            border: 1.5px solid var(--platinum); 
            padding: 15px 2px; 
            border-radius: var(--round-inner); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            position: relative; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .media-btn svg { width: 24px; height: 24px; fill: var(--teal); margin-bottom: 6px; }
        .media-btn span { font-size: 9px; font-weight: 800; color: var(--gray-dark); text-transform: uppercase; }

        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; position: relative; background: #fff; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 5px; background: var(--platinum); border-radius: 10px; z-index: 1; }
        
        #legacyQuote { 
            position: relative; 
            margin-left: 55px; 
            background: var(--glass); 
            border: 1.5px solid var(--platinum); 
            border-left: 6px solid var(--clio-blue); 
            padding: 25px; 
            border-radius: var(--round-inner); 
            margin-bottom: 25px; 
            z-index: 2; 
        }

        .entry { 
            position: relative; 
            margin-left: 55px; 
            background: white; 
            border: 1.5px solid var(--platinum); 
            padding: 22px; 
            border-radius: var(--round-inner); 
            margin-bottom: 25px; 
            z-index: 2; 
            border-left: 6px solid var(--teal); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.04); 
        }
        
        .timestamp-full { font-size: 11px; font-weight: 800; color: var(--teal); display: block; margin-bottom: 8px; text-transform: uppercase; }
        
        #addBtn { 
            background: var(--teal); 
            color:white; 
            border:none; 
            padding:18px; 
            border-radius: var(--round-pill); 
            width:100%; 
            font-weight:800; 
            font-size: 15px; 
            cursor:pointer; 
            box-shadow: 0 6px 20px rgba(0, 128, 128, 0.2); 
        }
        
        .sync-btn { 
            background: var(--clio-blue); 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: var(--round-pill); 
            width: 90%; 
            align-self: center; 
            font-weight: 800; 
            font-size: 16px; 
            cursor: pointer; 
            margin: 20px 0; 
            flex-shrink: 0; 
            box-shadow: 0 6px 20px rgba(0, 118, 206, 0.2); 
        }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div id="splashScreen">
    <h1 id="storyText" class="story-text"></h1>
    <button id="skipBtn" onclick="endSplash()">Skip Intro ➔</button>
</div>

<div class="app-container" id="mainApp">

    <header class="header">

                <span class="chip" onclick="useTemplate('INCIDENT SETTING:\n- Weather:\n- Lighting:\n- Road/Site Conditions:')">Setting</span>
                <span class="chip" onclick="useTemplate('EVIDENCE LOG:\n- Item Type:\n- Source/Chain:\n- Storage Location:')">Evidence</span>
            </div>

            <textarea id="statusBox" placeholder="Tell your truth here..."></textarea>
