<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Nunito+Sans:wght@400;600;800&display=swap');
        :root { 
            --teal: #008080; 
            --silver-gray: #95a5a6; 
            --gray-bg: #e2e8f0; 
            --clio-green: #2ecc71; 
            --gray-border: #cbd5e0; 
            --mac-shadow: 0 10px 30px rgba(0,0,0,0.12); 
        }
        
        body { font-family: 'Nunito', sans-serif; background: var(--gray-bg); margin: 0; padding: 0; height: 100dvh; overflow: hidden; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .app-container { width: 100%; max-width: 500px; background: white; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* HEADER */
        .header { padding: 12px 15px; border-bottom: 1px solid var(--gray-border); background: white; z-index: 4000; }
        .header-top { display: flex; justify-content: flex-start; align-items: center; }
        .brand-text { display: flex; flex-direction: column; align-items: flex-start; }
        .main-title { font-weight: 900; font-size: 17px; display: flex; align-items: center; letter-spacing: -0.5px; }
        .work-silver { color: var(--silver-gray); }
        .timeline-teal { color: var(--teal); }
        .clio-pulse { width: 7px; height: 7px; background-color: var(--clio-green); border-radius: 50%; margin-left: 8px; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* TIMELINE CONTAINER */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 60px 15px 150px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; }

        /* STACK SYSTEM */
        .stack-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; perspective: 1000px; }
        .stack-inner { position: relative; width: 85%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .stack-inner.flipped { transform: rotateY(180deg); }

        /* SHARED BUBBLE STYLE */
        .bubble { 
            padding: 15px; 
            border-radius: 22px; 
            font-family: 'Nunito Sans', sans-serif; 
            backface-visibility: hidden;
            box-shadow: var(--mac-shadow);
        }

        /* FRONT CARD (YOUR GRIT) */
        .bubble-front { 
            background: #f1f1f1; 
            border: 1px solid #e5e5e5; 
            color: #1a202c; 
            position: relative;
            z-index: 2;
        }

        /* BACK CARD (AI ANALYSIS) */
        .bubble-back { 
            background: var(--teal); 
            color: white; 
            transform: rotateY(180deg); 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* VISUAL STACK OFFSET (When not flipped) */
        .stack-inner:not(.flipped)::after {
            content: '';
            position: absolute;
            top: 6px; left: 8px; width: 100%; height: 100%;
            background: var(--teal);
            border-radius: 22px;
            z-index: 0;
            opacity: 0.4;
        }

        .stamp-label { font-size: 9px; font-weight: 800; color: #a0aec0; margin-bottom: 6px; text-transform: uppercase; }
        .bubble p { font-weight: 600; font-size: 14px; line-height: 1.4; margin: 0; }

        /* DRAWERS & BUTTONS */
        .draggable { position: absolute; z-index: 5000; border-radius: 22px; border: none; box-shadow: var(--mac-shadow); color: white; font-weight: 800; }
        #addBtn { width: 70px; height: 70px; background: var(--teal); font-size: 30px; bottom: 80px; right: 20px; }
        #syncBtn { width: 60px; height: 60px; background: #0076CE; font-size: 8px; bottom: 160px; right: 20px; }

        #utilityDrawer { position: absolute; top: 60px; width: 100%; background: white; border-bottom: 1px solid var(--gray-border); z-index: 3500; transition: 0.5s transform; transform: translateY(-100%); }
        .handle { height: 40px; display: flex; align-items: center; justify-content: center; background: white; border-bottom: 1px solid var(--gray-border); }
        .handle-pill { width: 35px; height: 4px; background: #cbd5e0; border-radius: 10px; }

        #overlaySystem { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: white; padding: 25px; border-radius: 28px; box-shadow: var(--mac-shadow); width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--gray-border); }
        .modal-btn { border: none; padding: 16px; border-radius: 18px; width: 100%; font-weight: 800; margin-top: 12px; cursor: pointer; }
        textarea { width: 100%; height: 85px; border: 1.5px solid var(--gray-border); border-radius: 20px; padding: 15px; font-family: 'Nunito Sans', sans-serif; font-size: 15px; outline: none; background: #fafafa; box-sizing: border-box; }
    </style>
</head>
<body id="appBody">

<div id="overlaySystem">
    <div class="modal-card" id="modalContent"></div>
</div>

<div class="app-container" id="mainApp">
    <header class="header">
        <div class="header-top">
            <svg width="40" height="30" viewBox="0 0 44 34" fill="none" style="margin-right:5px;">
                <rect x="4" y="10" width="36" height="20" rx="4" stroke="var(--teal)" stroke-width="2.5"/>
                <path d="M16 10V6C16 4.89543 16.8954 4 18 4H26C27.1046 4 28 4.89543 28 6V10" stroke="var(--teal)" stroke-width="2.5"/>
                <line x1="0" y1="20" x2="44" y2="20" stroke="var(--teal)" stroke-width="2.5"/>
            </svg>
            <div class="brand-text">
                <div class="main-title"><span class="work-silver">Work</span><span class="timeline-teal">Timeline</span>™ <div class="clio-pulse"></div></div>
            </div>
        </div>
    </header>

    <div id="utilityDrawer">
        <div style="padding: 20px;">
            <textarea id="statusBox" placeholder="Documenting the grit..."></textarea>
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="submitEntry()">POST TO TIMELINE</button>
        </div>
        <div class="handle" onclick="toggleUtility()"><div class="handle-pill"></div></div>
    </div>

    <div id="timelineContainer"></div>

    <button id="addBtn" class="draggable" onclick="toggleUtility()">+</button>
    <button id="syncBtn" class="draggable">SYNC</button>
</div>

<script>
    let vault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let utilOpen = false;

    function toggleUtility() { 
        utilOpen = !utilOpen;
        document.getElementById('utilityDrawer').style.transform = utilOpen ? 'translateY(0)' : 'translateY(-100%)'; 
    }

    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        let analysis = text.toLowerCase().includes("fire") ? "EA: Retaliation marker detected. Statutory violation path identified." : "";
        let item = { grit: text, analysis, stamp: new Date().toLocaleString() };
        vault.push(item);
        localStorage.setItem('wt_timeline', JSON.stringify(vault));
        document.getElementById('statusBox').value = '';
        toggleUtility();
        refresh();
    }

    function refresh() {
        const list = document.getElementById('timelineContainer');
        list.innerHTML = '';
        [...vault].reverse().forEach((item, idx) => {
            const hasAI = item.analysis !== "";
            const stackClass = hasAI ? "stack-inner" : "stack-inner single-bubble";
            
            list.innerHTML += `
                <div class="stack-wrapper">
                    <div class="stamp-label">📍 LANGLEY | ${item.stamp}</div>
                    <div class="${stackClass}" onclick="this.classList.toggle('flipped')">
                        <div class="bubble bubble-front"><p>${item.grit}</p></div>
                        ${hasAI ? `<div class="bubble bubble-back"><p>${item.analysis}</p></div>` : ''}
                    </div>
                </div>`;
        });
    }

    refresh();
</script>
</body>
</html>
