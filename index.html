<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorkTimeline™ | Clio Certified</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #e2e8f0; --gray-dark: #1e293b; --gray-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7); 
            --round-main: 32px; 
            --round-inner: 20px; 
            --round-pill: 999px;
            --mac-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; padding: 12px; height: 100vh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        
        /* SPLASH SCREEN */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; box-sizing: border-box; transition: opacity 1.2s ease; }
        .story-text { font-size: 20px; font-weight: 700; color: var(--gray-dark); line-height: 1.5; opacity: 0; transition: opacity 0.8s; max-width: 460px; }

        /* MAC-LIKE CONTAINER */
        .app-container { max-width: 500px; margin: auto; background: white; border-radius: var(--round-main); height: 94vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--mac-shadow); border: 1px solid rgba(255,255,255,0.4); }
        
        /* GHOST MODE */
        #blurBox { position: absolute; top: 120px; left: 0; right: 0; bottom: 0; z-index: 98; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); pointer-events: none; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        body.ghost-active #blurBox { backdrop-filter: blur(40px) grayscale(1); -webkit-backdrop-filter: blur(40px) grayscale(1); background: rgba(240, 242, 245, 0.7); pointer-events: all; }

        /* CERTIFIED HEADER */
        .certified-badge { background: var(--gray-light); padding: 8px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--clio-green); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--platinum); }
        .check-mark { width: 14px; height: 14px; background: var(--clio-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 9px; }

        /* BRANDING AREA */
        .header { padding: 20px; border-bottom: 1px solid var(--platinum); background: white; z-index: 100; }
        .logo-box { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 15px; }
        .briefcase-icon { position: relative; width: 44px; height: 34px; border: 3px solid var(--teal); border-radius: 6px; }
        .briefcase-icon::after { content: ''; position: absolute; top: 50%; left: -10px; right: -10px; height: 3px; background: var(--clio-blue); border-radius: 2px; } /* The Timeline Spine */
        
        /* CONTROLS */
        .controls { display: flex; justify-content: space-between; align-items: center; }

        /* INPUT AREA */
        .input-area { padding: 15px 20px; background: var(--gray-light); border-bottom: 1px solid var(--platinum); flex-shrink: 0; }
        .template-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .chip { background: white; color: var(--teal); font-size: 11px; font-weight: 700; padding: 10px 18px; border-radius: var(--round-pill); border: 1px solid var(--platinum); transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.03); flex-shrink: 0; }
        .chip:active { transform: scale(0.95); background: var(--teal); color: white; }

        #statusBox { width: 100%; height: 90px; padding: 16px; border-radius: var(--round-inner); border: 1px solid var(--platinum); box-sizing: border-box; font-family: inherit; font-size: 15px; outline: none; background: white; resize: none; transition: all 0.3s ease; }
        #statusBox:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.1); }
        
        .media-toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
        .media-btn { background: white; border: 1px solid var(--platinum); padding: 12px 2px; border-radius: var(--round-inner); display: flex; flex-direction: column; align-items: center; transition: all 0.2s; }
        .media-btn:active { background: var(--platinum); transform: translateY(2px); }
        .media-btn svg { width: 20px; height: 20px; fill: var(--teal); margin-bottom: 4px; }
        .media-btn span { font-size: 8px; font-weight: 800; text-transform: uppercase; }

        /* TIMELINE */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 25px; background: white; position: relative; }
        .timeline-spine { position: absolute; left: 35px; top: 0; bottom: 0; width: 3px; background: var(--platinum); border-radius: 4px; }
        .entry { position: relative; margin-left: 50px; background: white; border: 1px solid var(--platinum); padding: 20px; border-radius: var(--round-inner); margin-bottom: 20px; border-left: 5px solid var(--teal); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        
        .sync-btn { background: var(--clio-blue); color: white; border: none; padding: 18px; border-radius: var(--round-pill); width: 90%; align-self: center; font-weight: 800; font-size: 15px; margin: 15px 0; box-shadow: 0 10px 20px rgba(0, 118, 206, 0.2); }

        /* TOGGLES */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: var(--round-pill); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--clio-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div id="splashScreen"><h1 id="storyText" class="story-text"></h1></div>

<div class="app-container">
    <div class="certified-badge">
        <div class="check-mark">✓</div> Clio Developer Certified
    </div>
    
    <div id="blurBox"></div>
    
    <header class="header">
        <div class="logo-box">
            <div class="briefcase-icon"></div>
            <h1 style="color: var(--teal); margin:0; font-size: 20px; font-weight: 800; letter-spacing: -1px;">WorkTimeline™</h1>
            <div style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Taking in intakes, decided.</div>
        </div>
        
        <div class="controls">
            <div style="display:flex; gap:15px;">
                <div style="text-align: center;"><label class="switch"><input type="checkbox" onchange="toggleVault(this)"><span class="slider"></span></label><div style="font-size: 8px; font-weight: 800; margin-top: 4px;">CHRON</div></div>
                <div style="text-align: center;"><label class="switch"><input type="checkbox" id="gSwitch" onchange="toggleGhost()"><span class="slider"></span></label><div style="font-size: 8px; font-weight: 800; margin-top: 4px;">GHOST</div></div>
            </div>
            <div id="folderLabel" style="font-size: 14px; font-weight: 800; color: var(--teal);">WorkTimeline™</div>
        </div>
    </header>

    <div class="input-area">
        <div class="template-chips">
            <span class="chip" onclick="useTemplate('WITNESS LOCATION:\n- Name:\n- GPS/Address:')">Location</span>
            <span class="chip" onclick="useTemplate('WITNESS STATEMENT:\n- Narrative:\n- Reliability:')">Statement</span>
            <span class="chip" onclick="useTemplate('EVIDENCE LOG:\n- Item Type:\n- Source:')">Evidence</span>
        </div>
        <textarea id="statusBox" placeholder="Start your truth here..."></textarea>
        <div class="media-toolbar">
            <button class="media-btn"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-4c-1.1 0-2 .9-2 2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-5c0-1.1-.9-2-2-2z"/></svg><span>Camera</span></button>
            <button class="media-btn"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg><span>Audio</span></button>
            <button class="media-btn"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span>Text</span></button>
            <button class="media-btn"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>Docs</span></button>
        </div>
        <button id="addBtn" onclick="submitEntry()" style="background: var(--teal); color:white; border:none; padding:16px; border-radius: var(--round-pill); width:100%; font-weight:800; cursor:pointer;">Secure Entry</button>
    </div>

    <div id="timelineContainer">
        <div class="timeline-spine"></div>
        <div id="displayList"></div>
    </div>

    <button class="sync-btn" onclick="syncToClio()">Finalize & Sync to Clio</button>
</div>

<script>
    const story = ["We see you.", "Justice should be effortless.", "Telling the truth takes effort.", "But not here.", "Welcome to WorkTimeline."];
    let activeVault = "TIMELINE"; const timelineVault = []; const notesVault = [];
    const clientId = "18C4aBAD8YThRDG04xn_-rs8XQTdc0ZJyhPefMZR-0s";
    const redirectUri = "https://worktimeline-app.vercel.app/index.html"; 
    const clioBase = "https://ca.app.clio.com";

    window.onload = () => { runStory(); handleClioReturn(); };

    function runStory() {
        const el = document.getElementById('storyText'); let i = 0;
        el.innerText = story[i++]; el.style.opacity = 1;
        const next = () => {
            if(i < story.length) {
                el.style.opacity = 0;
                setTimeout(() => { el.innerText = story[i++]; el.style.opacity = 1; setTimeout(next, 2200); }, 800);
            } else { document.getElementById('splashScreen').style.opacity = '0'; setTimeout(() => document.getElementById('splashScreen').remove(), 1200); }
        };
        setTimeout(next, 2200);
    }

    function toggleGhost() { document.body.classList.toggle('ghost-active', document.getElementById('gSwitch').checked); }

    function toggleVault(cb) {
        activeVault = cb.checked ? "NOTES" : "TIMELINE";
        document.getElementById('folderLabel').innerText = cb.checked ? "Isolated Notes" : "WorkTimeline™";
        document.getElementById('folderLabel').style.color = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        document.getElementById('addBtn').style.background = cb.checked ? "var(--clio-blue)" : "var(--teal)";
        refreshVaultDisplay();
    }

    function useTemplate(t) { document.getElementById('statusBox').value = t; document.getElementById('statusBox').focus(); }

    function submitEntry() {
        const box = document.getElementById('statusBox'); if(!box.value.trim()) return;
        const now = new Date(); const stamp = (now.getMonth()+1) + '/' + now.getDate() + ' @ ' + now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
        const entry = { text: box.value, stamp: stamp };
        if(activeVault === "TIMELINE") timelineVault.push(entry); else notesVault.push(entry);
        box.value = ''; refreshVaultDisplay();
    }

    function refreshVaultDisplay() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = (activeVault === "TIMELINE") ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const div = document.createElement('div'); div.className = 'entry';
            div.style.borderLeftColor = (activeVault === "NOTES") ? "var(--clio-blue)" : "var(--teal)";
            div.innerHTML = `<span style="font-size:10px; font-weight:800; color:#64748b;">${item.stamp}</span><p style="margin:5px 0 0; font-size:14px; font-weight:500;">${item.text}</p>`;
            list.appendChild(div);
        });
    }

    async function syncToClio() {
        const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');
        sessionStorage.setItem('clio_code_verifier', verifier);
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        window.location.href = `${clioBase}/oauth/authorize?response_type=code&client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=leads_write%20contacts_write%20notes_write&code_challenge=${challenge}&code_challenge_method=S256`;
    }

    async function handleClioReturn() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code'); const verifier = sessionStorage.getItem('clio_code_verifier');
        if (code && verifier) {
            const resp = await fetch(`${clioBase}/oauth/token`, {
                method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ grant_type: "authorization_code", code, client_id: clientId, redirect_uri: redirectUri, code_verifier: verifier })
            });
            const data = await resp.json();
            if (data.access_token) { localStorage.setItem('clio_access_token', data.access_token); window.history.replaceState({}, '', "/index.html"); alert("Connected to Clio."); }
        }
    }
</script>
</body>
</html>
