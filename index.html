<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Master</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        :root { --teal: #008080; --teal-dark: #004d4d; --blue-trans: rgba(0, 128, 128, 0.12); --clio-blue: #0076CE; --clio-green: #2ecc71; --platinum: #d8e2ea; --gray-dark: #2c3e50; }
        
        body { font-family: 'Nunito', sans-serif; background: #eef1f5; margin: 0; padding: 0; height: 100dvh; overflow: hidden; color: var(--gray-dark); -webkit-font-smoothing: antialiased; }
        .ghost-active #timelineContainer, .ghost-active #utilityDrawer { filter: blur(25px); opacity: 0.3; pointer-events: none; }

        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2.5px solid var(--teal); box-sizing: border-box; }
        
        /* HEADER SECTION */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2.5px solid var(--teal); background: white; z-index: 3000; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .main-title-row { display: flex; align-items: center; gap: 6px; }
        
        /* CLIO GREEN PULSE */
        .clio-pulse { width: 8px; height: 8px; background-color: var(--clio-green); border-radius: 50%; animation: clio-throb 2s infinite; }
        @keyframes clio-throb { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }

        /* UPPER HEADER SWITCHES */
        .switch-group { display: flex; gap: 10px; }
        .switch-container { text-align: center; display: flex; flex-direction: column; align-items: center; font-size: 7px; font-weight: 900; }
        .switch { position: relative; width: 30px; height: 16px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--platinum); transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* FLOATING ACTION BUTTONS */
        #addBtn { position: absolute; right: 20px; top: 180px; z-index: 5000; width: 85px; height: 85px; background: var(--teal); border-radius: 24px; color: white; border: none; font-size: 40px; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #syncBtn { position: absolute; right: 20px; top: 285px; z-index: 5000; width: 85px; height: 85px; background: var(--clio-blue); border-radius: 24px; color: white; border: none; font-size: 10px; font-weight: 900; padding: 5px; }

        /* MANAGEMENT DRAWER AT BOTTOM */
        #mgmtDrawer { position: fixed; bottom: 0; width: 100%; max-width: 495px; background: white; border-top: 3.5px solid var(--teal); z-index: 6000; transition: 0.4s transform ease; transform: translateY(calc(100% - 40px)); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .drag-handle { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .handle-pill { width: 45px; height: 6px; background: var(--teal); border-radius: 10px; opacity: 0.3; }

        /* OVERLAYS */
        #disclaimerOverlay, #warningOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: white; padding: 30px; border-radius: 28px; text-align: center; border-bottom: 6px solid var(--teal); width: 100%; }
        .modal-btn { border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: 900; margin-top: 10px; cursor: pointer; }

        /* UPPER TEMPLATE CHIPS */
        .template-chip { border: 2.5px solid var(--teal); padding: 6px 12px; border-radius: 12px; font-size: 9px; font-weight: 900; color: var(--teal); cursor: pointer; background: white; white-space: nowrap; }
        
        /* HARDWARE BUTTONS (SHRUNKEN, NO EMOJI) */
        .media-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .media-btn { background: #f1f5f9; border: 1.5px solid #cbd5e1; padding: 6px; border-radius: 8px; font-size: 10px; cursor: pointer; flex: 1; text-align: center; font-weight: 900; color: #475569; }

        /* TIMELINE DISPLAY */
        #timelineContainer { flex-grow: 1; overflow-y: auto; padding: 15px 15px 150px; }
        .entry { background: white; border: 2.5px solid var(--teal); border-left-width: 10px; padding: 18px; border-radius: 18px; margin-bottom: 25px; }
        .tier-serious { animation: pulse-ser 2s infinite; border-left-color: var(--teal-dark); background: var(--blue-trans); }
        @keyframes pulse-ser { 0% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 128, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 128, 128, 0); } }
    </style>
</head>
<body>

<div id="disclaimerOverlay"><div class="modal-card"><h2>INTAKE GUARD</h2><p><b>Work Journal:</b> Documenting the truth. Not legal advice.</p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="this.parentElement.parentElement.remove()">I UNDERSTAND</button></div></div>

<div id="warningOverlay" style="display:none;"><div class="modal-card"><h2>EA ANALYSIS</h2><p id="warningMsg"></p><button class="modal-btn" style="background:var(--teal); color:white;" onclick="applyStack(true)">STACK ON TOP</button><button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="applyStack(false)">STACK UNDER</button></div></div>

<div class="app-container">
    <header class="header">
        <div class="logo-area">
            <svg width="36" height="28" viewBox="0 0 40 30" fill="none"><path d="M3 12C3 10.3431 4.34315 9 6 9H13.5C13.5 7 15.5 3 20 3C24.5 3 26.5 7 26.5 9H34C35.6569 9 37 10.3431 37 12V25C37 26.6569 35.6569 28 34 28H6C4.34315 28 3 26.6569 3 25V12Z" stroke="#008080" stroke-width="2.8" stroke-linejoin="round"/><line x1="0" y1="18.5" x2="40" y2="18.5" stroke="#008080" stroke-width="2.8"/><circle cx="9" cy="18.5" r="3" fill="#008080" stroke="white" stroke-width="1"/><circle cx="20" cy="18.5" r="3" fill="#008080" stroke="white" stroke-width="1"/><circle cx="31" cy="18.5" r="3" fill="#008080" stroke="white" stroke-width="1"/></svg>
            <div class="brand-stack"><div class="intake-label">Takin'Intake</div><div class="main-title-row"><div class="main-title">WorkTimeline™</div><div class="clio-pulse"></div></div></div>
        </div>
        <div class="switch-group">
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="document.body.classList.toggle('ghost-active')"><span class="slider"></span></label>GHOST</div>
            <div class="switch-container"><label class="switch"><input type="checkbox" onchange="activeVault = this.checked ? 'NOTES' : 'TIMELINE'; refresh();"><span class="slider"></span></label>NOTES</div>
        </div>
    </header>

    <button id="addBtn" onclick="submitEntry()">+</button>
    <button id="syncBtn" onclick="alert('Secured & Synced.')">LOCK & SYNC</button>

    <div id="utilityDrawer" style="padding: 12px; border-bottom: 2px solid var(--teal);">
        <div style="display:flex; gap:6px; overflow-x: auto; padding-bottom: 12px;">
            <div class="template-chip" onclick="useTemplate('INCIDENT')">INCIDENT</div>
            <div class="template-chip" onclick="useTemplate('INJURY')">INJURY</div>
            <div class="template-chip" onclick="useTemplate('LOCATION')">LOCATION</div>
            <div class="template-chip" onclick="useTemplate('WITNESS')">WITNESS</div>
        </div>
        
        <div class="media-row">
            <label class="media-btn">CAMERA <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="alert('Photo Captured')"></label>
            <label class="media-btn">AUDIO <input type="file" accept="audio/*" capture="microphone" style="display:none;" onchange="alert('Audio Recorded')"></label>
            <label class="media-btn">DOCUMENT <input type="file" style="display:none;" onchange="alert('Document Attached')"></label>
        </div>

        <textarea id="statusBox" style="width:100%; height:85px; border:2.5px solid var(--teal); border-radius:15px; padding:12px; font-weight:700; outline:none; background:#f8fafc;" placeholder="Journal the truth..."></textarea>
    </div>

    <div id="timelineContainer"><div id="displayList"></div></div>

    <div id="mgmtDrawer">
        <div class="drag-handle" onclick="toggleMgmt()"><div class="handle-pill"></div></div>
        <div style="padding: 0 20px 30px;">
            <button class="modal-btn" style="background:var(--teal); color:white;" onclick="alert('Exporting to Clio/PDF...')">SAVE & EXPORT</button>
            <button class="modal-btn" style="background:#7f8c8d; color:white;" onclick="confirm('Wipe current record?') && (localStorage.clear() || location.reload())">DELETE & START FRESH</button>
        </div>
    </div>
</div>

<script>
    let timelineVault = JSON.parse(localStorage.getItem('wt_timeline')) || [];
    let notesVault = JSON.parse(localStorage.getItem('wt_notes')) || [];
    let activeVault = "TIMELINE"; let pending = null; let mgmtOpen = false;

    // DRAWER LOGIC
    function toggleMgmt() { document.getElementById('mgmtDrawer').style.transform = mgmtOpen ? 'translateY(calc(100% - 40px))' : 'translateY(0)'; mgmtOpen = !mgmtOpen; }
    
    // SUBMISSION & EA PATTERN LOGIC
    function submitEntry() {
        const text = document.getElementById('statusBox').value; if(!text.trim()) return;
        const low = text.toLowerCase();
        let analysis = "";
        if (low.includes("fire") || low.includes("toxic") || low.includes("quit") || low.includes("threat") || low.includes("harass")) {
            analysis = "HIGH PRIORITY: Evidence pattern cross-referenced with potential Constructive Dismissal markers.";
        }
        pending = { grit: text, analysis, stamp: new Date().toLocaleString(), tier: analysis ? 'serious' : 'minor', agree: false };
        if(analysis && activeVault === "TIMELINE") { document.getElementById('warningMsg').innerText = analysis; document.getElementById('warningOverlay').style.display = 'flex'; }
        else saveFinal();
        document.getElementById('statusBox').value = '';
    }

    function applyStack(agree) { pending.agree = agree; document.getElementById('warningOverlay').style.display = 'none'; saveFinal(); }
    
    function saveFinal() { 
        if(activeVault === "TIMELINE") timelineVault.push(pending); else notesVault.push(pending);
        localStorage.setItem('wt_timeline', JSON.stringify(timelineVault));
        localStorage.setItem('wt_notes', JSON.stringify(notesVault));
        refresh(); 
    }

    // UI REFRESH
    function refresh() {
        const list = document.getElementById('displayList'); list.innerHTML = '';
        const data = activeVault === "TIMELINE" ? timelineVault : notesVault;
        [...data].reverse().forEach(item => {
            const card = `<div class="entry tier-${item.tier}"><b>📍 LANGLEY, BC | ${item.stamp}</b><p style="margin-top:10px; font-weight:800; line-height:1.4;">${item.grit}</p></div>`;
            const ea = item.analysis ? `<div class="entry" style="margin-bottom:-15px; border-left-color:#7f8c8d; font-size:12px;"><b>EA ANALYSIS:</b> ${item.analysis}</div>` : "";
            list.innerHTML += item.agree ? ea + card : card + ea;
        });
    }

    // UPPER TAB TAPPING LOGIC
    function useTemplate(t) { 
        const ts = { 
            'INCIDENT': 'ACTION:\nVIOLATION:\nWITNESS:', 
            'INJURY': 'OFA 2 RECORD:\nINJURY NATURE:\nFIRST AID RENDERED:', 
            'LOCATION': 'SITE:\nHAZARDS:\nSAFETY CHECKS:', 
            'WITNESS': 'NAME:\nCONTACT:\nSTATEMENT:' 
        };
        document.getElementById('statusBox').value = ts[t];
    }
    
    refresh();
</script>
</body>
</html>
