<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkTimeline™ | Taking an Intake...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --teal: #008080; 
            --clio-blue: #0076CE; 
            --platinum: #e2e8f0; 
            --gray-dark: #1e293b; 
            --gray-light: #f8fafc;
            --round-main: 48px; 
            --round-inner: 28px; 
            --round-pill: 999px;
        }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            outline: none; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #eef1f5; 
            margin: 0; 
            padding: 10px; 
            height: 100dvh; 
            overflow: hidden; 
            color: var(--gray-dark); 
        }
        
        /* GHOST OVERLAY */
        #ghostOverlay { 
            position: absolute; 
            top: 85px; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            z-index: 9999; 
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px); 
            pointer-events: none; 
            transition: all 0.4s ease; 
            background: rgba(255,255,255,0); 
        }
        
        body.ghost-active #ghostOverlay { 
            backdrop-filter: blur(35px) grayscale(1); 
            -webkit-backdrop-filter: blur(35px) grayscale(1); 
            background: rgba(238, 241, 245, 0.7); 
            pointer-events: all; 
        }

        /* FULL CINEMATIC INTRO SCREEN */
        #splashScreen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #eef1f5; 
            z-index: 100000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px; 
            transition: opacity 0.8s ease; 
        }
        
        .story-text { 
            font-size: 20px; 
            font-weight: 700; 
            color: var(--gray-dark); 
            line-height: 1.5; 
            opacity: 0; 
            transition: opacity 0.8s ease-in-out; 
            max-width: 460px; 
        }
        
        /* VISIBLE SKIP BUTTON */
        #skipBtn { 
            position: absolute; 
            bottom: calc(50px + env(safe-area-inset-bottom)); 
            padding: 14px 28px; 
            background: white; 
            color: var(--clio-blue); 
            border: 2px solid var(--clio-blue); 
            border-radius: var(--round-pill); 
            font-size: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            z-index: 100001; 
            box-shadow: 0 4px 15px rgba(0, 118, 206, 0.15);
            transition: transform 0.2s;
        }
        
        #skipBtn:active {
            transform: scale(0.95);
        }

        /* MAIN APP CONTAINER */
        .app-container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            border-radius: var(--round-main); 
            height: calc(100dvh - 20px); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
        }
